<!DOCTYPE html>
<html lang="ja" class="ui-aurora">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>待機列の図 5案</title>
<!--
  ハブ「プロトコル待機列」（index.js renderHero の #heroSay）に文字以外の情報を足す案を見比べるデモ（2026-10-01）。
  経緯：2026-09-30k で「リング・14日の予定・科目の内訳帯」を入れたが「なんか違う」と言われたので、配置ごと変えた5案を並べる。
  ハブの本物のテーマCSS（../theme_css/*.{テーマ}.css）をそのまま読むので、カードの枠・色はハブと同じに見える。
  数字はすべて架空の固定値。本物の関数は呼ばない。何も保存しない（テーマの既定値だけ mec_ui_theme_v1 を読む）。テストの対象ではない。
-->
<link rel="stylesheet" href="../vars.css">
<link rel="stylesheet" id="cssUi" href="../theme_css/ui_theme.aurora.css">
<link rel="stylesheet" id="cssHub" href="../theme_css/index.aurora.css">
<script src="../mindmap_data/index.js"></script>
<style>
  body{min-height:100vh;}
  .harness{max-width:600px;margin:0 auto;padding:16px 16px 6px;color:var(--t1,#eee);font-size:13px;}
  .harness h1{font-size:15px;margin:0 0 4px;}
  .harness p.lead{font-size:12px;line-height:1.7;opacity:.75;margin:0 0 10px;}
  .plans{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px;margin-bottom:8px;}
  .plans button{padding:8px 9px;border-radius:10px;border:1px solid rgba(255,255,255,.2);background:rgba(0,0,0,.28);color:inherit;font:inherit;text-align:left;cursor:pointer;}
  .plans button b{display:block;font-size:12.5px;}
  .plans button small{display:block;font-size:10px;opacity:.7;margin-top:2px;line-height:1.35;}
  .plans button.on{background:rgba(255,255,255,.9);color:#111;}
  .row{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:8px;font-size:12px;}
  .row select{font:inherit;padding:4px 6px;border-radius:6px;}
  .desc{font-size:12px;line-height:1.75;padding:9px 11px;border-radius:10px;background:rgba(0,0,0,.3);border:1px solid rgba(255,255,255,.14);}
  .desc b{color:var(--or,#f97316);}
  .stage{max-width:660px;margin:10px auto 60px;padding:0 16px;}
  /* 本物の .hero は入場アニメを持つ。デモでは切り替えのたびに描き直すので止めておく */
  .hero *{animation-delay:0s !important;}
  /* ── 簡易ゲージ（テーマごとの本物のゲージは JS が要るので、デモでは円だけ）── */
  .dg{width:clamp(130px,34vw,170px);text-align:center;justify-self:end;align-self:start;}
  .dg svg{width:100%;height:auto;rotate:-90deg;display:block;}
  .dg .t{fill:none;stroke:rgba(var(--glass-rgb),.12);stroke-width:9;}
  .dg .f{fill:none;stroke:var(--or,#f97316);stroke-width:9;stroke-linecap:round;}
  .dg-in{position:relative;}
  .dg-mid{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:28px;font-weight:800;color:var(--t1,#fff);}
  .dg-mid em{font-size:13px;font-style:normal;color:var(--ts);}
  .dg-cap{font-size:11px;color:var(--ts);margin:4px 0 0;font-weight:700;}
  .dg-goal{font-size:12px;color:var(--ts);margin:0;}
  .dg-goal b{color:var(--t1,#fff);}
  .hero-body>.hero-say{grid-column:1/-1;max-width:none;margin-top:0;}
  @media (max-width:560px){ .dg{justify-self:center;} }

  /* 共通の小物 */
  .vx-hd{display:flex;justify-content:space-between;align-items:baseline;gap:6px;font-size:10px;color:var(--tm,#888);margin-bottom:4px;white-space:nowrap;}
  .vx-hd b{color:var(--t1,#fff);}
  .vx-sep{margin-top:9px;padding-top:9px;border-top:1px dashed rgba(var(--glass-rgb),.14);}
  .c-high{--c:#ef4444;} .c-mid{--c:#f59e0b;} .c-due{--c:#3b82f6;} .c-done{--c:#22c55e;}

  /* ── A 計器3連 ── */
  .va-meters{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;}
  .va-m{text-align:center;padding:6px 4px 4px;border-radius:6px;background:rgba(0,0,0,.2);border:1px solid rgba(var(--glass-rgb),.08);}
  .va-m svg{width:100%;max-width:96px;height:auto;display:block;margin:0 auto;}
  .va-m .t{fill:none;stroke:rgba(var(--glass-rgb),.12);stroke-width:8;stroke-linecap:round;}
  .va-m .f{fill:none;stroke:var(--c);stroke-width:8;stroke-linecap:round;}
  .va-m .needle{stroke:var(--t1,#fff);stroke-width:2;stroke-linecap:round;}
  .va-v{font-size:15px;font-weight:800;color:var(--t1,#fff);margin-top:-8px;font-feature-settings:"tnum";}
  .va-v small{font-size:10px;font-weight:400;color:var(--ts);}
  .va-l{font-size:10px;color:var(--tm,#888);}

  /* ── B 待機列ドット ── */
  .vb-q{display:flex;flex-wrap:wrap;gap:3px;align-items:center;}
  .vb-q i{width:8px;height:8px;border-radius:2px;background:var(--c);display:block;}
  .vb-q i.done{opacity:.35;}
  .vb-sess{display:flex;flex-wrap:wrap;gap:3px;padding:3px;border:1px solid var(--or,#f97316);border-radius:4px;
    box-shadow:0 0 8px color-mix(in srgb,var(--or,#f97316) 40%,transparent);position:relative;}
  .vb-sess::before{content:'今回の出題 50';position:absolute;top:-8px;left:6px;font-size:9px;line-height:1;padding:0 4px;
    background:rgba(10,10,20,.9);color:var(--or,#f97316);font-weight:700;border-radius:3px;}
  .vb-lg{display:flex;gap:10px;flex-wrap:wrap;margin-top:7px;font-size:10px;color:var(--ts);}
  .vb-lg span{display:inline-flex;align-items:center;gap:3px;}
  .vb-lg i{width:7px;height:7px;border-radius:2px;background:var(--c);display:inline-block;}
  .vb-lg b{color:var(--t1,#fff);}

  /* ── C 右柱パネル ── */
  .vc-body{display:grid;grid-template-columns:minmax(0,1fr) auto;grid-template-rows:auto 1fr;gap:var(--sp-4,14px) var(--sp-5,20px);}
  .vc-body>.hero-console{grid-row:1/3;}
  .vc-side{grid-column:2;display:flex;gap:10px;align-items:stretch;justify-content:center;padding:10px;border-radius:8px;
    background:rgba(0,0,0,.22);border:1px solid rgba(var(--glass-rgb),.12);}
  .vc-tank{position:relative;width:34px;border-radius:6px;overflow:hidden;display:flex;flex-direction:column;
    background:rgba(var(--glass-rgb),.08);border:1px solid rgba(var(--glass-rgb),.2);min-height:140px;}
  .vc-tank span{display:block;background:var(--c);}
  .vc-mark{position:absolute;left:-2px;right:-2px;border-top:2px solid var(--t1,#fff);}
  .vc-legend{display:flex;flex-direction:column;justify-content:space-between;font-size:10px;color:var(--ts);min-width:86px;}
  .vc-legend b{color:var(--t1,#fff);font-size:12px;}
  .vc-legend .k{display:flex;align-items:center;gap:4px;}
  .vc-legend .k i{width:7px;height:7px;border-radius:2px;background:var(--c);}
  .vc-ring{display:flex;align-items:center;gap:6px;margin-top:4px;}
  .vc-ring svg{width:38px;height:38px;rotate:-90deg;}
  .vc-ring .t{fill:none;stroke:rgba(var(--glass-rgb),.14);stroke-width:5;}
  .vc-ring .f{fill:none;stroke:var(--or,#f97316);stroke-width:5;stroke-linecap:round;}
  @media (max-width:560px){
    .vc-body{grid-template-columns:minmax(0,1fr);}
    .vc-body>.hero-console{grid-row:auto;}
    .vc-side{grid-column:1;}
  }

  /* ── D 往復タイムライン ── */
  .vd svg{width:100%;height:auto;display:block;overflow:visible;}
  .vd .lbl{font-size:8.5px;fill:var(--tm,#888);text-anchor:middle;}
  .vd .lbl.now{fill:var(--or,#f97316);font-weight:700;}
  .vd .val{font-size:8.5px;fill:var(--t1,#fff);text-anchor:middle;font-weight:700;}
  .vd-note{display:flex;gap:12px;flex-wrap:wrap;font-size:10.5px;color:var(--ts);margin-top:6px;}
  .vd-note b{color:var(--t1,#fff);}
  .vd-note i{display:inline-block;width:8px;height:8px;border-radius:2px;margin-right:3px;vertical-align:-1px;}

  /* ── E 現行の拡張 ── */
  .ve{display:grid;grid-template-columns:auto minmax(0,1.3fr) minmax(0,1fr);gap:14px;align-items:stretch;}
  .ve-ring{position:relative;width:92px;text-align:center;}
  .ve-ring svg{width:92px;height:92px;rotate:-90deg;display:block;}
  .ve-ring .t{fill:none;stroke:rgba(var(--glass-rgb),.12);stroke-width:8;}
  .ve-ring .f{fill:none;stroke:var(--or,#f97316);stroke-width:8;stroke-linecap:round;}
  .ve-ring .mid{position:absolute;top:0;left:0;width:92px;height:92px;display:flex;flex-direction:column;align-items:center;justify-content:center;}
  .ve-ring .mid b{font-size:20px;font-weight:800;color:var(--t1,#fff);line-height:1;}
  .ve-ring .mid small{font-size:10px;color:var(--ts);}
  .ve-ring .cap{font-size:10px;color:var(--tm,#888);}
  .ve-fc{display:flex;align-items:stretch;gap:3px;height:92px;}
  .ve-col{flex:1;min-width:0;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;}
  .ve-col .n{font-size:8.5px;color:var(--ts);font-feature-settings:"tnum";height:11px;}
  .ve-col .b{width:100%;border-radius:2px 2px 0 0;background:rgba(var(--glass-rgb),.3);display:flex;flex-direction:column;overflow:hidden;}
  .ve-col .b.now{background:var(--or,#f97316);}
  .ve-col .b .late{background:#ef4444;}
  .ve-col .d{font-size:8.5px;color:var(--tm,#888);height:12px;line-height:12px;white-space:nowrap;}
  .ve-col .d.now{color:var(--or,#f97316);font-weight:700;}
  .ve-sb{display:flex;flex-direction:column;gap:4px;}
  .ve-sr{display:grid;grid-template-columns:4.6em minmax(0,1fr) 2em;white-space:nowrap;gap:5px;align-items:center;font-size:10px;color:var(--ts);}
  .ve-sr .ve-bar{display:block;width:100%;height:7px;border-radius:2px;background:rgba(var(--glass-rgb),.08);overflow:hidden;}
  .ve-sr .ve-bar i{display:block;height:100%;}
  .ve-sr b{color:var(--t1,#fff);text-align:right;font-feature-settings:"tnum";}
  @media (max-width:560px){
    .ve{grid-template-columns:auto minmax(0,1fr);}
    .ve-sb{grid-column:1/-1;}
  }
</style>
</head>
<body>
<div class="harness">
  <h1>プロトコル待機列の図：5案</h1>
  <p class="lead">カードの枠と色はハブの本物のテーマCSSで描いています。数字はすべて架空です。上のボタンで案を切り替え、テーマも変えられます。</p>
  <div class="plans" id="plans"></div>
  <div class="row">テーマ <select id="theme"></select></div>
  <div class="desc" id="desc"></div>
</div>
<div class="stage"><section class="hero" id="hero"></section></div>

<script>
// ── 架空のデータ（1日の途中を想定）──────────────────────────────
const D = {
  done: 38, goal: 180, newToday: 12, newCap: 100,
  due: 142, session: 50,
  pills: { high: 30, mid: 20, today: 0 },            // 今回の出題50問の内訳（ハブのピルと同じ数え方）
  queue: { high: 30, mid: 48, today: 64 },           // 復習待ち142問ぜんぶの内訳（忘却リスク順に並ぶ）
  fc: [142, 64, 88, 41, 52, 132, 30, 77, 95, 60, 45, 18, 29, 70], late: 78,   // 今日〜13日後
  hist: [120, 95, 188, 60, 0, 150],                 // 過去6日の消化（今日は done）
  subj: [['hema',24],['endo',21],['obg',19],['circ',17],['resp',15],['neur',13],['dige',11],['kansen',9],['peds',7],['kakumon',6]],
};
const TODAY = new Date('2026-10-01T00:00:00+09:00');
const dayLbl = off => { const d = new Date(TODAY.getTime() + off * 86400000); return (d.getMonth() + 1) + '/' + d.getDate(); };
const dom = off => new Date(TODAY.getTime() + off * 86400000).getDate();
const SUBJ = {}; (window.MM_SUBJECTS || []).forEach(s => SUBJ[s.sid] = s);
const sName = sid => sid === 'kakumon' ? '国試過去問' : (SUBJ[sid] ? SUBJ[sid].label : sid);
const sColor = sid => SUBJ[sid] ? SUBJ[sid].color : '#8a8fa3';
const n = v => v.toLocaleString('ja-JP');

// ── ハブと同じ部品 ─────────────────────────────────────────────
function consoleHtml(inner) {
  return '<div class="hero-console">' +
    '<p class="hero-label"><span class="hero-live" aria-hidden="true"></span><span class="lb">今日解いた問題</span>' +
      '<span class="hero-label-acc"><span class="acc-ic">🎯</span>正解率</span>' +
      '<span class="hero-label-meta"><span class="hero-date">2026年10月1日(木)</span>' +
      '<span class="exam-countdown"><span class="cd-lbl">国試まで</span><b class="cd-num">129</b><span class="cd-unit">日</span></span></span></p>' +
    '<div class="hero-stat-row"><p class="hero-fig"><span class="hero-num">86</span><span class="hero-unit">問</span></p>' +
      '<p class="hero-fig hero-acc-fig" data-rate-tier="mid"><span class="hero-num">72</span><span class="hero-unit">%</span></p>' +
      '<p class="hero-xp"><span>+1,240</span><em>XP</em></p></div>' +
    '<div class="hero-lv"><div class="hero-lv-top"><span class="hero-lv-t">Lv.<b>17</b></span><span class="hero-lv-ti">研修医</span>' +
      '<span class="hero-lv-n">次のレベルまで <b>350</b> XP</span></div><span class="hero-lv-bar"><span style="width:62%"></span></span></div>' +
    (inner || '') + '</div>';
}
function gaugeHtml() {
  const C = 2 * Math.PI * 54;
  return '<div class="dg"><div class="dg-in"><svg viewBox="0 0 128 128"><circle class="t" cx="64" cy="64" r="54"/>' +
    '<circle class="f" cx="64" cy="64" r="54" stroke-dasharray="' + C + '" stroke-dashoffset="' + C * (1 - .86) + '"/></svg>' +
    '<span class="dg-mid">86<em>%</em></span></div><p class="dg-cap">今日の目標</p><p class="dg-goal"><b>86</b>/100問</p></div>';
}
function ctaHtml() {
  return '<div class="hero-cta"><a class="cta-main" data-fx="srs">♾️ 定着プロトコル</a>' +
    '<a class="cta-sub" data-fx="browse">📚 全科目から選ぶ →</a>' +
    '<a class="cta-sub cta-redo cylinder-loaded" data-fx="redo">🔁 今日の誤答 12問を再履修</a></div>';
}
function cardTop() {
  const p = D.pills;
  return '<span class="srs-deco" aria-hidden="true"></span>' +
    '<div class="srs-card-hdr"><div class="srs-card-title-grp"><span class="srs-card-ttl"><span class="srs-ttl-ic">♾️</span>プロトコル待機列</span>' +
      '<span class="srs-tag srs-tag-cross">科目横断</span><span class="srs-tag srs-tag-risk">忘却リスク順</span></div>' +
      '<div class="srs-card-counts"><div class="srs-card-today">本日消化 <b>' + D.done + '</b><span class="srs-goal">/ ' + D.goal + '</span>問</div>' +
      '<div class="srs-card-new">新規 <b>' + D.newToday + '</b><span class="srs-goal">/ ' + D.newCap + '</span>問</div></div></div>' +
    '<div class="srs-card-stat"><div class="srs-stat-cell"><span class="srs-stat-lbl">復習待ち</span><span class="srs-stat-val"><b>' + D.due + '</b><small>問</small></span></div>' +
      '<span class="srs-stat-sep">➔</span><div class="srs-stat-cell highlight"><span class="srs-stat-lbl">今回の出題</span><span class="srs-stat-val"><b>優先 ' + D.session + '</b><small>問</small></span></div>' +
      '<span class="srs-stat-divider"></span><div class="srs-stat-cell srs-risk-cell"><span class="srs-stat-lbl">忘却リスク内訳</span><div class="srs-risk-pills">' +
      '<span class="srs-risk-pill risk-high"><span class="srs-pi">🔥</span> 超危険 <b>' + p.high + '</b></span>' +
      '<span class="srs-risk-pill risk-mid"><span class="srs-pi">⚠️</span> 期限切れ <b>' + p.mid + '</b></span>' +
      '<span class="srs-risk-pill risk-due is-zero"><span class="srs-pi">📅</span> 本日 <b>' + p.today + '</b></span></div></div></div>' +
    '<div class="srs-risk-bar"><span class="rb-high" style="flex:' + p.high + '"></span><span class="rb-mid" style="flex:' + p.mid + '"></span><span class="rb-due" style="flex:' + p.today + '"></span></div>';
}
const card = body => '<div class="hero-say srs-card">' + cardTop() + (body || '') + '</div>';
const ring = (r, sw, ratio) => { const C = 2 * Math.PI * r, s = r + sw; return '<svg viewBox="0 0 ' + 2 * s + ' ' + 2 * s + '"><circle class="t" cx="' + s + '" cy="' + s + '" r="' + r + '"/><circle class="f" cx="' + s + '" cy="' + s + '" r="' + r + '" stroke-dasharray="' + C.toFixed(1) + '" stroke-dashoffset="' + (C * (1 - ratio)).toFixed(1) + '"/></svg>'; };

// ── 現行（2026-09-30k で反映中のもの）＝本物の CSS の .srs-viz をそのまま使う ──
function vizNow() {
  const top = Math.max(...D.fc);
  const bars = D.fc.map((v, i) => {
    const h = v / top * 100;
    const inner = i === 0
      ? '<span class="fb-bar is-today" style="height:' + h + '%"><span class="fb-late" style="height:' + (D.late / v * 100) + '%"></span></span>'
      : '<span class="fb-bar" style="height:' + h + '%"></span>';
    return '<div class="fb-col"><div class="fb-slot">' + inner + '</div><span class="fb-lbl' + (i === 0 ? ' is-today' : i === 1 ? ' is-next' : '') + '">' + (i === 0 ? '今日' : dom(i)) + '</span></div>';
  }).join('');
  const segs = D.subj.map(([s, v]) => '<span style="flex:' + v + ';background:' + sColor(s) + '"></span>').join('');
  const lg = D.subj.slice(0, 4).map(([s, v]) => '<span class="sb-lg"><i style="background:' + sColor(s) + '"></i>' + sName(s) + ' <b>' + v + '</b></span>').join('') + '<span class="sb-lg is-rest">ほか <b>' + D.subj.slice(4).reduce((a, x) => a + x[1], 0) + '</b></span>';
  const R = 2 * Math.PI * 26, ra = D.done / D.goal;
  return '<div class="srs-viz"><div class="srs-viz-ring"><svg viewBox="0 0 64 64"><circle class="vr-track" cx="32" cy="32" r="26"></circle><circle class="vr-fill" cx="32" cy="32" r="26" stroke-dasharray="' + R + '" stroke-dashoffset="' + R * (1 - ra) + '"></circle></svg>' +
    '<span class="vr-mid"><b>' + Math.round(ra * 100) + '</b><small>%</small></span><span class="srs-viz-cap">本日消化</span></div>' +
    '<div class="srs-viz-fc"><div class="srs-viz-hd"><span>今後14日の予定</span><span class="srs-viz-note">山 ' + dayLbl(5) + ' <b>132</b>問</span></div><div class="fb-chart">' + bars + '</div></div>' +
    '<div class="srs-viz-sb"><div class="srs-viz-hd"><span>復習待ちの科目内訳</span><span class="srs-viz-note">10科目</span></div><div class="sb-bar">' + segs + '</div><div class="sb-legend">' + lg + '</div></div></div>';
}

// ── A 計器3連 ──
function vizA() {
  const arc = (ratio, cls) => {
    const L = Math.PI * 40;
    const a = Math.PI * (1 - Math.min(1, ratio));
    const x = 50 + 34 * Math.cos(a), y = 50 - 34 * Math.sin(a);
    return '<svg viewBox="0 0 100 58" class="' + cls + '"><path class="t" d="M10 50 A40 40 0 0 1 90 50"/>' +
      '<path class="f" d="M10 50 A40 40 0 0 1 90 50" stroke-dasharray="' + L + '" stroke-dashoffset="' + L * (1 - Math.min(1, ratio)) + '"/>' +
      '<line class="needle" x1="50" y1="50" x2="' + x.toFixed(1) + '" y2="' + y.toFixed(1) + '"/></svg>';
  };
  return '<div class="vx-sep va-meters">' +
    '<div class="va-m c-mid" style="--c:var(--or,#f97316)">' + arc(D.done / D.goal) + '<div class="va-v">' + D.done + '<small> / ' + D.goal + '</small></div><div class="va-l">本日消化</div></div>' +
    '<div class="va-m c-high">' + arc(D.pills.high / D.session) + '<div class="va-v">' + Math.round(D.pills.high / D.session * 100) + '<small>%</small></div><div class="va-l">今回の超危険率</div></div>' +
    '<div class="va-m c-due">' + arc(D.newToday / D.newCap) + '<div class="va-v">' + D.newToday + '<small> / ' + D.newCap + '</small></div><div class="va-l">新規の枠</div></div>' +
    '</div>';
}

// ── B 待機列ドット ──
function vizB() {
  const q = [];
  for (let i = 0; i < D.queue.high; i++) q.push('c-high');
  for (let i = 0; i < D.queue.mid; i++) q.push('c-mid');
  for (let i = 0; i < D.queue.today; i++) q.push('c-due');
  const dot = c => '<i class="' + c + '"></i>';
  const done = Array.from({ length: D.done }, () => '<i class="c-done done"></i>').join('');
  return '<div class="vx-sep"><div class="vx-hd"><span>待機列（1マス＝1問・左から出題）</span><span>残り <b>' + D.due + '</b>問</span></div>' +
    '<div class="vb-q" style="margin-top:10px">' + done + '<span class="vb-sess">' + q.slice(0, D.session).map(dot).join('') + '</span>' + q.slice(D.session).map(dot).join('') + '</div>' +
    '<div class="vb-lg"><span class="c-done"><i style="opacity:.35"></i>本日済 <b>' + D.done + '</b></span><span class="c-high"><i></i>超危険 <b>' + D.queue.high + '</b></span>' +
    '<span class="c-mid"><i></i>期限切れ <b>' + D.queue.mid + '</b></span><span class="c-due"><i></i>本日期限 <b>' + D.queue.today + '</b></span></div></div>';
}

// ── C 右柱パネル（カードは元の左列のまま・ゲージの下に縦のタンク）──
function sideC() {
  const q = D.queue, tot = D.due;
  const mark = D.session / tot * 100;
  return '<div class="vc-side"><div class="vc-tank"><span class="c-high" style="flex:' + q.high + '"></span><span class="c-mid" style="flex:' + q.mid + '"></span><span class="c-due" style="flex:' + q.today + '"></span>' +
    '<span class="vc-mark" style="top:' + mark + '%"></span></div>' +
    '<div class="vc-legend"><div><div style="font-size:10px">復習待ち</div><b>' + tot + '</b>問</div>' +
    '<div class="k c-high"><i></i>超危険 <b>' + q.high + '</b></div><div class="k c-mid"><i></i>期限切れ <b>' + q.mid + '</b></div><div class="k c-due"><i></i>本日 <b>' + q.today + '</b></div>' +
    '<div style="font-size:9.5px">━ 今回ここまで（' + D.session + '問）</div>' +
    '<div class="vc-ring">' + ring(15, 4, D.done / D.goal) + '<span>本日消化<br><b>' + D.done + '</b>/' + D.goal + '</span></div></div></div>';
}

// ── D 往復タイムライン（過去7日の消化 ＋ 今後7日の予定）──
function vizD() {
  const past = D.hist.concat([D.done]);
  const fut = D.fc.slice(1, 8);
  const W = 520, H = 110, base = 92, cols = 14, cw = W / cols, bw = cw * .62;
  const top = Math.max(D.goal, ...past, ...fut, D.due) * 1.05;
  const y = v => base - v / top * (base - 12);
  let s = '<svg viewBox="0 0 ' + W + ' ' + H + '">';
  s += '<line x1="0" x2="' + W + '" y1="' + base + '" y2="' + base + '" stroke="rgba(255,255,255,.18)"/>';
  s += '<line x1="0" x2="' + W + '" y1="' + y(D.goal) + '" y2="' + y(D.goal) + '" stroke="rgba(255,255,255,.4)" stroke-dasharray="3 3"/>';
  s += '<text x="' + (W - 2) + '" y="' + (y(D.goal) - 3) + '" class="lbl" style="text-anchor:end">目標 ' + D.goal + '</text>';
  s += '<rect x="' + cw * 6.5 + '" y="4" width="' + cw + '" height="' + (base - 4) + '" fill="rgba(255,255,255,.05)" rx="3"/>';
  past.forEach((v, i) => {
    const x = cw * i + (cw - bw) / 2, now = i === 6;
    s += '<rect x="' + x + '" y="' + y(v) + '" width="' + bw + '" height="' + (base - y(v)) + '" rx="2" fill="#22c55e" opacity="' + (now ? 1 : .55) + '"/>';
    if (now) {  // 今日：残り（目標までの差）を点線の枠で積む
      s += '<rect x="' + x + '" y="' + y(D.goal) + '" width="' + bw + '" height="' + (y(v) - y(D.goal)) + '" rx="2" fill="none" stroke="var(--or,#f97316)" stroke-dasharray="3 2"/>';
      s += '<text x="' + (x + bw / 2) + '" y="' + (y(D.goal) - 3) + '" class="val" style="fill:var(--or,#f97316)">あと' + (D.goal - v) + '</text>';
    }
    s += '<text x="' + (x + bw / 2) + '" y="' + (base + 11) + '" class="lbl' + (now ? ' now' : '') + '">' + (now ? '今日' : dom(i - 6)) + '</text>';
  });
  fut.forEach((v, j) => {
    const i = j + 7, x = cw * i + (cw - bw) / 2;
    s += '<rect x="' + x + '" y="' + y(v) + '" width="' + bw + '" height="' + (base - y(v)) + '" rx="2" fill="rgba(255,255,255,.07)" stroke="rgba(255,255,255,.45)" stroke-dasharray="2 2"/>';
    s += '<text x="' + (x + bw / 2) + '" y="' + (base + 11) + '" class="lbl">' + dom(j + 1) + '</text>';
  });
  s += '<text x="' + cw * 3.5 + '" y="10" class="lbl">解いた</text><text x="' + cw * 10.5 + '" y="10" class="lbl">来る予定</text></svg>';
  const avg = Math.round(past.slice(0, 6).reduce((a, b) => a + b, 0) / 6);
  return '<div class="vx-sep vd"><div class="vx-hd"><span>過去7日の消化 ／ 今後7日の予定</span><span>直近の平均 <b>' + avg + '</b>問/日</span></div>' + s +
    '<div class="vd-note"><span><i style="background:#22c55e"></i>解いた数</span><span><i style="border:1px dashed rgba(255,255,255,.5)"></i>期限が来る数</span>' +
    '<span>平均ペースなら復習待ち <b>' + D.due + '</b>問は <b>' + Math.ceil(D.due / avg) + '日</b>で片付く</span></div></div>';
}

// ── E 現行の拡張（リングを大きく・棒に数字・科目は横棒の一覧）──
function vizE() {
  const top = Math.max(...D.fc);
  const peak = D.fc.slice(1).indexOf(Math.max(...D.fc.slice(1))) + 1;
  const cols = D.fc.map((v, i) => {
    const h = v / top * 70;
    const showN = i === 0 || i === peak;
    return '<div class="ve-col"><span class="n">' + (showN ? v : '') + '</span><span class="b' + (i === 0 ? ' now' : '') + '" style="height:' + h + 'px">' +
      (i === 0 ? '<span class="late" style="height:' + (D.late / v * 100) + '%"></span>' : '') + '</span><span class="d' + (i === 0 ? ' now' : '') + '">' + (i === 0 ? '今日' : (i % 2 ? '' : dom(i))) + '</span></div>';
  }).join('');
  const mx = D.subj[0][1];
  const rows = D.subj.slice(0, 5).map(([s, v]) => '<div class="ve-sr"><span>' + sName(s) + '</span><span class="ve-bar"><i style="width:' + v / mx * 100 + '%;background:' + sColor(s) + '"></i></span><b>' + v + '</b></div>').join('') +
    '<div class="ve-sr" style="opacity:.7"><span>ほか5科目</span><span></span><b>' + D.subj.slice(5).reduce((a, x) => a + x[1], 0) + '</b></div>';
  return '<div class="vx-sep ve"><div class="ve-ring">' + ring(40, 6, D.done / D.goal).replace('<svg ', '<svg ') +
    '<span class="mid"><b>' + D.done + '</b><small>/ ' + D.goal + '問</small></span><div class="cap">本日消化 ' + Math.round(D.done / D.goal * 100) + '%</div></div>' +
    '<div><div class="vx-hd"><span>今後14日の予定</span><span><i style="display:inline-block;width:7px;height:7px;background:#ef4444;border-radius:2px"></i> 期限切れ <b>' + D.late + '</b></span></div><div class="ve-fc">' + cols + '</div></div>' +
    '<div class="ve-sb"><div class="vx-hd"><span>科目別の復習待ち</span><span><b>10</b>科目</span></div>' + rows + '</div></div>';
}

// ── 案の一覧 ─────────────────────────────────────────────────
const PLANS = [
  { id: 'now', name: '現行', sub: 'いまハブに出ているもの', desc: '<b>2026-09-30k で反映中</b>の形。カードをゲージの下まで広げ、下段にリング・14日の予定・科目の帯を並べたもの。比較用。',
    build: () => '<div class="hero-body">' + consoleHtml() + gaugeHtml() + card(vizNow()) + '</div>' },
  { id: 'A', name: 'A 計器3連', sub: 'カードは元の左列・半円メーター3つ', desc: 'カードの位置は<b>元どおり左の列</b>（ゲージの横）。数字の段の下に<b>針つきの半円メーター3つ</b>（本日消化／今回の出題のうち超危険の割合／新規の枠）を置く。グラフではなく「計器」で見せる案。',
    build: () => '<div class="hero-body">' + consoleHtml(card(vizA())) + gaugeHtml() + '</div>' },
  { id: 'B', name: 'B 待機列ドット', sub: '1問＝1マスで列そのものを描く', desc: '<b>待機列そのもの</b>を1問＝1マスで左から並べる。色は忘却リスク（赤＝超危険・黄＝期限切れ・青＝本日期限）、先頭の<b>今回の出題50問を枠で囲む</b>。左端の薄い緑は今日もう済ませたぶん。解くほど列が短くなるのが見える。',
    build: () => '<div class="hero-body">' + consoleHtml() + gaugeHtml() + card(vizB()) + '</div>' },
  { id: 'C', name: 'C 右柱パネル', sub: 'ゲージの下＝今日の誤答の上に縦タンク', desc: 'カードは<b>元の左列のまま</b>で、空いていた<b>右のゲージの下（「今日の誤答」の上）</b>に縦のタンクを置く。復習待ちの量をリスク別に積み、白線が「今回の出題はここまで」。横に本日消化の小さなリング。',
    build: () => '<div class="hero-body vc-body">' + consoleHtml(card()) + gaugeHtml() + sideC() + '</div>' },
  { id: 'D', name: 'D 往復タイムライン', sub: '過去7日の消化＋今後7日の予定', desc: '今日を真ん中に、<b>左に過去7日で解いた数</b>（緑）、<b>右に今後7日に期限が来る数</b>（点線）を1本の時間軸で。今日の棒は目標までの残りを点線で積む。「このペースなら何日で片付くか」を1行添える。',
    build: () => '<div class="hero-body">' + consoleHtml() + gaugeHtml() + card(vizD()) + '</div>' },
  { id: 'E', name: 'E 現行の拡張', sub: '現行を大きく・数字を添える', desc: '<b>現行の3つを残して見やすく</b>した案。リングを大きくして中に「38 / 180問」、棒は今日と山の日に数字を出し、科目は帯ではなく<b>上位5科目の横棒</b>で名前と件数を並べる。',
    build: () => '<div class="hero-body">' + consoleHtml() + gaugeHtml() + card(vizE()) + '</div>' },
];

const THEMES = ['aurora', 'brass', 'cyber', 'liquid', 'kintsugi', 'celestial', 'abyss', 'frost'];
const hero = document.getElementById('hero');
let cur = 'now';
function show(id) {
  cur = id;
  const p = PLANS.find(x => x.id === id);
  hero.innerHTML = p.build() + ctaHtml();
  document.getElementById('desc').innerHTML = p.desc;
  document.querySelectorAll('#plans button').forEach(b => b.classList.toggle('on', b.dataset.id === id));
}
function setTheme(t) {
  THEMES.forEach(x => document.documentElement.classList.remove('ui-' + x));
  document.documentElement.classList.add('ui-' + t);
  document.getElementById('cssUi').href = '../theme_css/ui_theme.' + t + '.css';
  document.getElementById('cssHub').href = '../theme_css/index.' + t + '.css';
}
document.getElementById('plans').innerHTML = PLANS.map(p => '<button data-id="' + p.id + '"><b>' + p.name + '</b><small>' + p.sub + '</small></button>').join('');
document.getElementById('plans').addEventListener('click', e => { const b = e.target.closest('button'); if (b) show(b.dataset.id); });
const sel = document.getElementById('theme');
sel.innerHTML = THEMES.map(t => '<option>' + t + '</option>').join('');
let t0 = 'aurora'; try { const s = localStorage.getItem('mec_ui_theme_v1'); if (THEMES.includes(s)) t0 = s; } catch (e) {}
sel.value = t0; setTheme(t0);
sel.addEventListener('change', () => setTheme(sel.value));
show('now');
</script>
