<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>定着プロトコルの UIテーマ別意匠</title>
<!--
  SRS復習（2026-09-30 に「定着プロトコル」へ改名）の見せ方を、ward.js の「病棟回診」から作り直すデモ（第3版）。
  本物の関数は呼ばず、このページの中だけで再生する（何も保存しない）。
  第1版（暗い箱＋ネオン）・第2版（紙・スイス等のテーマ非依存の5案）はどちらも「微妙」と却下された。
  ユーザーの判断で「UIテーマに染める」方向に決定＝8テーマそれぞれの色と題材で作る。
  3枚（開始前・解答中の画面下のボード・結果）の中心に、テーマ固有の「1問＝1つ」の図を置く：
    aurora 光の帯の光点／brass 圧力計の鋲／cyber 六角の区画／liquid 塊のまわりの雫／
    kintsugi 器のひび（正解で金継ぎ）／celestial 科目ごとの星座／abyss 深さ＝遅れの信号（正解で浮上）／frost 雪の結晶の節
  材料は ward.js と同じ（状態3段＝severityOf、正解／誤答）。SRS の採点と出題順は変えない。
  ⚠️ 画面下のボードは表示だけ（pointer-events:none）／infinite のアニメなし／新しい localStorage キーなし。
  テストの対象ではない。
-->
<style>
  :root{
    --sans:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Hiragino Kaku Gothic ProN","Yu Gothic UI","Yu Gothic",Meiryo,sans-serif;
    --serif:"Hiragino Mincho ProN","Yu Mincho","YuMincho","Noto Serif JP",serif;
    --mono:'SFMono-Regular',Menlo,Consolas,"BIZ UDGothic",monospace;
    --ease-out:cubic-bezier(.16,1,.3,1);
  }
  *{box-sizing:border-box;}
  html,body{margin:0;overflow-x:clip;}
  body{min-height:100vh;padding:18px 16px 170px;font-family:var(--sans);color:#EDEFF7;background:#07080F;transition:background .4s;}
  .harness{max-width:880px;margin:0 auto;}
  .harness h1{font-size:15px;margin:0 0 4px;}
  .harness p{font-size:12.5px;line-height:1.7;opacity:.72;margin:0 0 14px;}
  .themes{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:10px;}
  .themes button,.stages button{padding:8px 13px;border-radius:99px;border:1px solid rgba(255,255,255,.22);background:rgba(255,255,255,.05);color:inherit;font:inherit;font-size:13px;cursor:pointer;white-space:nowrap;}
  .themes button.on,.stages button.on{background:#EDEFF7;color:#0A0B12;border-color:#EDEFF7;}
  .stages{display:flex;gap:6px;margin-bottom:16px;}
  .hint{font-size:12px;opacity:.7;line-height:1.7;margin:8px 0;}
  .mockq{border-radius:16px;padding:16px 18px;background:rgba(14,16,30,.78);border:1px solid rgba(255,255,255,.14);}
  .mockq .qn{display:inline-block;font-size:11px;font-weight:800;padding:2px 8px;border-radius:5px;margin-bottom:8px;border:1px solid rgba(255,255,255,.5);}
  .mockq .qt{font-size:14px;line-height:1.8;}
  .mockq .ch{font-size:13.5px;padding:9px 12px;border-radius:10px;margin-top:7px;background:rgba(255,255,255,.04);border:1px solid rgba(255,255,255,.12);}
  .sim{display:flex;flex-wrap:wrap;gap:6px;margin:10px 0;}
  .sim button{flex:1 1 110px;padding:10px;border-radius:10px;border:1px solid rgba(255,255,255,.22);background:rgba(255,255,255,.06);color:inherit;font:inherit;font-size:13px;font-weight:700;cursor:pointer;white-space:nowrap;}
  .sim .ok{border-color:#3DDC97}.sim .ng{border-color:#FF6B81}
  .sumwrap{border-radius:16px;padding:12px;background:rgba(10,12,22,.55);border:1px solid rgba(255,255,255,.12);}
  .sumwrap .fake{font-size:12px;opacity:.7;padding:8px 10px;border:1px dashed rgba(255,255,255,.25);border-radius:10px;margin-bottom:12px;line-height:1.6;}

  /* ══ 共通の骨組み（中身の色・質感はテーマごと） ══ */
  .ov{position:fixed;inset:0;z-index:9500;display:flex;align-items:center;justify-content:center;padding:14px;background:rgba(3,4,10,.62);animation:fadeIn .25s var(--ease-out) both;}
  .box{position:relative;width:min(560px,100%);max-height:100%;overflow-y:auto;overflow-x:hidden;padding:22px 20px 18px;animation:rise .45s var(--ease-out) both;}
  .eye{font-size:10px;font-weight:800;letter-spacing:.34em;}
  .ttl{margin:4px 0 0;font-size:24px;font-weight:900;letter-spacing:.04em;}
  .dt{font-size:12px;opacity:.7;margin-top:2px;}
  .head{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;}
  .count{text-align:right;line-height:1;white-space:nowrap;}
  .count b{font-size:52px;font-weight:800;letter-spacing:-.02em;font-variant-numeric:tabular-nums;}
  .count span{font-size:13px;margin-left:3px;opacity:.8;}
  .sig{margin:12px -6px 4px;}
  .sig svg{display:block;width:100%;height:auto;overflow:visible;}
  .sev{display:flex;flex-wrap:wrap;justify-content:center;gap:4px 16px;font-size:12px;margin-top:6px;}
  .sev i{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:6px;vertical-align:1px;}
  .sev b{font-variant-numeric:tabular-nums;margin-left:4px;}
  .subs{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px;margin-top:14px;}
  .subs div{padding:7px 10px;border-radius:10px;font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .subs b{float:right;font-variant-numeric:tabular-nums;}
  .how{font-size:12.5px;line-height:1.75;margin-top:12px;padding:9px 12px;border-radius:10px;}
  .btns{display:flex;gap:10px;margin-top:16px;}
  .back{padding:12px 16px;border-radius:12px;font:inherit;font-size:13px;cursor:pointer;background:none;white-space:nowrap;}
  .go{flex:1;padding:13px;border:0;border-radius:12px;font:inherit;font-size:15.5px;font-weight:900;letter-spacing:.12em;cursor:pointer;white-space:nowrap;}
  .go:focus-visible,.back:focus-visible{outline:2px solid currentColor;outline-offset:3px;}
  .hud{position:fixed;left:50%;bottom:calc(10px + env(safe-area-inset-bottom));translate:-50% 0;z-index:8000;width:min(600px,calc(100% - 20px));
    padding:9px 14px 11px;pointer-events:none;transition:opacity .3s var(--ease-out),translate .45s var(--ease-out);}
  .hud.hide{opacity:0;translate:-50% 130%;}
  .hud .row{display:flex;align-items:baseline;gap:10px;white-space:nowrap;}
  .hud .tag{font-size:10px;font-weight:900;letter-spacing:.24em;}
  .hud .cnt{margin-left:auto;font-size:12px;overflow:hidden;text-overflow:ellipsis;}
  .hud .cnt b{font-size:17px;font-variant-numeric:tabular-nums;}
  .hud .mks{display:flex;flex-wrap:wrap;gap:4px;margin-top:8px;}
  .mk{display:block;width:9px;height:9px;transition:background .35s,box-shadow .35s,opacity .35s,scale .35s;}
  .mk.now{scale:1.45;}
  .pop{position:fixed;z-index:8001;pointer-events:none;white-space:nowrap;translate:-50% 0;font-size:14px;font-weight:900;padding:4px 12px;border-radius:99px;animation:pop 1s var(--ease-out) forwards;}
  .res{position:relative;overflow:hidden;padding:20px 18px 18px;}
  .res .hl{font-size:22px;font-weight:900;margin:6px 0 0;line-height:1.4;}
  .res .hl .num{font-size:30px;}
  .stats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:6px;margin-top:12px;}
  .stats div{padding:8px 6px;border-radius:10px;text-align:center;min-width:0;}
  .stats b{display:block;font-size:20px;font-variant-numeric:tabular-nums;}
  .stats span{font-size:10.5px;opacity:.75;display:block;line-height:1.4;}
  .bars{margin-top:12px;}
  .bars .rw{display:grid;grid-template-columns:5em minmax(0,1fr) 3.2em;gap:10px;align-items:center;font-size:12px;padding:4px 0;}
  .bars .tr{height:7px;border-radius:99px;overflow:hidden;display:flex;}
  .bars .tr i{display:block;height:100%;border-radius:99px;}
  .bars .v{text-align:right;font-variant-numeric:tabular-nums;opacity:.85;}
  .num{font-variant-numeric:tabular-nums;}
  .n{transition:fill .35s,opacity .35s,stroke .35s;}
  @keyframes pop{0%{opacity:0;transform:translateY(6px)}20%{opacity:1;transform:translateY(0)}70%{opacity:1}100%{opacity:0;transform:translateY(-16px)}}
  @keyframes fadeIn{from{opacity:0}to{opacity:1}}
  @keyframes rise{from{opacity:0;translate:0 12px}to{opacity:1;translate:0 0}}
  @keyframes drawIn{from{stroke-dashoffset:1}to{stroke-dashoffset:0}}
  @media (prefers-reduced-motion:reduce){.ov,.box,.pop,.hud,.n{animation-duration:.01s!important;transition-duration:.01s!important;}}

  /* ══ Aurora（ガラスとオーロラの帯） ══ */
  body.t-aurora{background:radial-gradient(ellipse 95% 65% at 50% -18%,rgba(121,40,202,.55),transparent 68%),radial-gradient(circle at 15% 22%,rgba(0,229,255,.32),transparent 52%),radial-gradient(circle at 85% 32%,rgba(0,112,243,.38),transparent 56%),radial-gradient(ellipse at 50% 112%,rgba(255,0,128,.28),transparent 66%),linear-gradient(180deg,#050814,#03050c) fixed;}
  .t-aurora .box,.t-aurora.res,.t-aurora.hud{color:#F2F6FF;background:linear-gradient(160deg,rgba(18,24,52,.86),rgba(8,10,28,.9));border:1px solid rgba(160,220,255,.35);
    box-shadow:0 0 0 1px rgba(121,40,202,.25),0 24px 60px rgba(0,0,0,.55),inset 0 1px 0 rgba(255,255,255,.18);-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px);}
  .t-aurora .box{border-radius:22px;}
  .t-aurora .box::before,.t-aurora.res::before{content:'';position:absolute;inset:0 0 auto;height:3px;background:linear-gradient(90deg,#00E5FF,#7928CA,#FF0080);opacity:.9;}
  .t-aurora .eye{color:#7FE9FF;}
  .t-aurora .count b{background:linear-gradient(180deg,#FFFFFF,#9FE8FF);-webkit-background-clip:text;background-clip:text;color:transparent;}
  .t-aurora .subs div{background:rgba(255,255,255,.05);border:1px solid rgba(160,220,255,.16);}
  .t-aurora .how{background:rgba(0,229,255,.07);border:1px solid rgba(0,229,255,.22);}
  .t-aurora .back{color:#C9D6F5;border:1px solid rgba(255,255,255,.22);}
  .t-aurora .go{color:#fff;border-radius:99px;background:linear-gradient(90deg,#0070F3,#7928CA 55%,#FF0080);box-shadow:0 6px 24px rgba(121,40,202,.55),inset 0 1px 0 rgba(255,255,255,.35);}
  .t-aurora.hud{border-radius:16px;}
  .t-aurora .mk{border-radius:50%;background:rgba(255,255,255,.18);}
  .t-aurora .mk.crit{box-shadow:inset 0 0 0 1.5px #FF4FA3;}
  .t-aurora .mk.now{background:#7FE9FF;}
  .t-aurora .mk.ok{background:#fff;box-shadow:0 0 8px #00E5FF;}
  .t-aurora .mk.ng{background:#FF4FA3;opacity:.55;}
  .t-aurora.pop{color:#fff;background:rgba(10,14,34,.9);border:1px solid #7FE9FF;box-shadow:0 0 16px rgba(0,229,255,.5);}
  .t-aurora.pop.ng{border-color:#FF4FA3;box-shadow:0 0 16px rgba(255,0,128,.45);}
  .t-aurora.res{border-radius:18px;}
  .t-aurora .stats div{background:rgba(255,255,255,.05);border:1px solid rgba(160,220,255,.16);}
  .t-aurora .tr{background:rgba(255,255,255,.08);} .t-aurora .tr i{background:linear-gradient(90deg,#00E5FF,#7928CA);}
  .t-aurora .hl .num{color:#7FE9FF;}
  .t-aurora .n.stable{fill:rgba(255,255,255,.5);} .t-aurora .n.warn{fill:#7FE9FF;} .t-aurora .n.crit{fill:#FF4FA3;}
  .t-aurora .n.ok{fill:#fff;stroke:rgba(0,229,255,.55);stroke-width:5;} .t-aurora .n.ng{fill:#FF4FA3;opacity:.35;}

  /* ══ Brass（真鍮の計器盤） ══ */
  body.t-brass{background:radial-gradient(ellipse 90% 60% at 50% -10%,rgba(255,215,0,.3),transparent 60%),radial-gradient(circle at 10% 80%,rgba(140,109,31,.45),transparent 60%),radial-gradient(circle at 90% 70%,rgba(201,162,39,.3),transparent 55%),repeating-linear-gradient(0deg,rgba(224,194,94,.025) 0 1px,transparent 1px 4px),#0D0804;}
  .t-brass .box,.t-brass.res{color:#F6E7B8;background:radial-gradient(120% 80% at 50% 0%,#2A1C0C,#140C05 70%);border:2px solid #B08A2E;
    box-shadow:inset 0 0 0 4px #140C05,inset 0 0 0 5px rgba(224,194,94,.45),0 24px 60px rgba(0,0,0,.7);border-radius:14px;}
  .t-brass .box::after,.t-brass.res::after{content:'';position:absolute;inset:9px;pointer-events:none;border-radius:8px;
    background:radial-gradient(circle,#E8C874 0 2.2px,#6A4E08 2.6px,transparent 3.2px) 0 0/100% 100% no-repeat,
      radial-gradient(circle at 0 0,#E8C874 0 2.2px,#6A4E08 2.6px,transparent 3.2px) left top/8px 8px no-repeat,
      radial-gradient(circle at 100% 0,#E8C874 0 2.2px,#6A4E08 2.6px,transparent 3.2px) right top/8px 8px no-repeat,
      radial-gradient(circle at 0 100%,#E8C874 0 2.2px,#6A4E08 2.6px,transparent 3.2px) left bottom/8px 8px no-repeat,
      radial-gradient(circle at 100% 100%,#E8C874 0 2.2px,#6A4E08 2.6px,transparent 3.2px) right bottom/8px 8px no-repeat;}
  .t-brass .eye{color:#E0C25E;font-family:var(--serif);}
  .t-brass .ttl{font-family:var(--serif);color:#FFF3C4;text-shadow:0 1px 0 #000,0 0 14px rgba(224,194,94,.35);}
  .t-brass .count b{font-family:var(--serif);color:#FFF3C4;text-shadow:0 2px 0 #3A2808;}
  .t-brass .subs div{background:linear-gradient(180deg,rgba(224,194,94,.1),rgba(224,194,94,.03));border:1px solid rgba(224,194,94,.3);}
  .t-brass .how{background:rgba(224,194,94,.06);border:1px solid rgba(224,194,94,.25);}
  .t-brass .back{color:#E0C25E;border:1px solid rgba(224,194,94,.4);}
  .t-brass .go{color:#1A1004;font-family:var(--serif);background:linear-gradient(180deg,#FFF3C4,#D4AF37 45%,#8C6D1F);border:1px solid #FFF8DC;box-shadow:0 3px 0 #4A3606,0 8px 20px rgba(0,0,0,.6),inset 0 1px 0 #fff;text-shadow:0 1px 0 rgba(255,255,255,.6);}
  .t-brass.hud{color:#F6E7B8;background:linear-gradient(180deg,#24180A,#140C05);border:1.5px solid #B08A2E;border-radius:12px;box-shadow:inset 0 0 0 3px #140C05,inset 0 0 0 4px rgba(224,194,94,.35),0 12px 30px rgba(0,0,0,.6);}
  .t-brass .tag{color:#E0C25E;font-family:var(--serif);}
  .t-brass .mk{border-radius:50%;background:radial-gradient(circle at 35% 30%,#8C6D1F,#3A2808);box-shadow:inset 0 0 0 1px #6A4E08;}
  .t-brass .mk.crit{box-shadow:inset 0 0 0 1.5px #E0603A;}
  .t-brass .mk.now{background:radial-gradient(circle at 35% 30%,#FFF3C4,#B08A2E);}
  .t-brass .mk.ok{background:radial-gradient(circle at 35% 30%,#FFF8DC,#D4AF37 60%,#8C6D1F);box-shadow:0 0 6px rgba(255,215,0,.6);}
  .t-brass .mk.ng{background:radial-gradient(circle at 35% 30%,#E0603A,#6A1E0C);}
  .t-brass.pop{font-family:var(--serif);color:#1A1004;background:linear-gradient(180deg,#FFF3C4,#D4AF37);border:1px solid #FFF8DC;border-radius:6px;}
  .t-brass.pop.ng{color:#FFE3D6;background:linear-gradient(180deg,#B24A2A,#6A1E0C);border-color:#E0603A;}
  .t-brass .hl{font-family:var(--serif);color:#FFF3C4;} .t-brass .hl .num{color:#FFD76A;}
  .t-brass .stats div{background:rgba(224,194,94,.07);border:1px solid rgba(224,194,94,.28);}
  .t-brass .tr{background:rgba(224,194,94,.12);} .t-brass .tr i{background:linear-gradient(90deg,#8C6D1F,#FFF3C4);}
  .t-brass .n.stable{fill:#6A4E08;stroke:#B08A2E;stroke-width:1;} .t-brass .n.warn{fill:#D4AF37;stroke:#FFF3C4;stroke-width:.8;} .t-brass .n.crit{fill:#E0603A;stroke:#FFB08A;stroke-width:.8;}
  .t-brass .n.ok{fill:#FFF3C4;stroke:#FFD700;stroke-width:2;} .t-brass .n.ng{fill:#6A1E0C;stroke:#E0603A;stroke-width:1;}

  /* ══ Cyber（戦術 HUD） ══ */
  body.t-cyber{background:radial-gradient(circle at 50% 15%,rgba(0,229,255,.26),transparent 65%),radial-gradient(circle at 85% 85%,rgba(0,255,102,.18),transparent 60%),linear-gradient(180deg,#030812,#010307);font-family:var(--mono);}
  .t-cyber .box,.t-cyber.res,.t-cyber.hud{color:#CFFBFF;font-family:var(--mono);background:repeating-linear-gradient(0deg,rgba(0,229,255,.035) 0 1px,transparent 1px 3px),linear-gradient(180deg,#041320,#020A12);border:1px solid rgba(0,229,255,.55);border-radius:4px;
    box-shadow:0 0 24px rgba(0,229,255,.18),0 24px 60px rgba(0,0,0,.6);}
  .t-cyber .box::before,.t-cyber.res::before{content:'';position:absolute;inset:6px;pointer-events:none;
    background:linear-gradient(#00E5FF,#00E5FF) top left/14px 2px no-repeat,linear-gradient(#00E5FF,#00E5FF) top left/2px 14px no-repeat,
      linear-gradient(#00E5FF,#00E5FF) top right/14px 2px no-repeat,linear-gradient(#00E5FF,#00E5FF) top right/2px 14px no-repeat,
      linear-gradient(#00E5FF,#00E5FF) bottom left/14px 2px no-repeat,linear-gradient(#00E5FF,#00E5FF) bottom left/2px 14px no-repeat,
      linear-gradient(#00E5FF,#00E5FF) bottom right/14px 2px no-repeat,linear-gradient(#00E5FF,#00E5FF) bottom right/2px 14px no-repeat;}
  .t-cyber .eye{color:#00FF66;}
  .t-cyber .ttl{color:#E6FEFF;text-shadow:0 0 12px rgba(0,229,255,.7);letter-spacing:.08em;}
  .t-cyber .count b{color:#00E5FF;text-shadow:0 0 18px rgba(0,229,255,.8);}
  .t-cyber .subs div{border-radius:2px;background:rgba(0,229,255,.05);border:1px solid rgba(0,229,255,.25);}
  .t-cyber .how{border-radius:2px;background:rgba(0,255,102,.05);border:1px dashed rgba(0,255,102,.4);}
  .t-cyber .back{border-radius:2px;color:#7FE9FF;border:1px solid rgba(0,229,255,.4);}
  .t-cyber .go{border-radius:2px;color:#00140A;background:#00FF66;box-shadow:0 0 22px rgba(0,255,102,.55);letter-spacing:.2em;}
  .t-cyber .tag{color:#00FF66;}
  .t-cyber .mk{background:rgba(0,229,255,.15);clip-path:polygon(25% 0,75% 0,100% 50%,75% 100%,25% 100%,0 50%);width:10px;}
  .t-cyber .mk.crit{background:rgba(255,56,96,.55);}
  .t-cyber .mk.now{background:#00E5FF;}
  .t-cyber .mk.ok{background:#00FF66;}
  .t-cyber .mk.ng{background:#FF3860;}
  .t-cyber.pop{font-family:var(--mono);border-radius:2px;color:#00FF66;background:#020A12;border:1px solid #00FF66;box-shadow:0 0 14px rgba(0,255,102,.5);}
  .t-cyber.pop.ng{color:#FF3860;border-color:#FF3860;box-shadow:0 0 14px rgba(255,56,96,.5);}
  .t-cyber .hl .num{color:#00FF66;text-shadow:0 0 12px rgba(0,255,102,.7);}
  .t-cyber .stats div{border-radius:2px;background:rgba(0,229,255,.05);border:1px solid rgba(0,229,255,.25);}
  .t-cyber .tr{border-radius:0;background:rgba(0,229,255,.1);} .t-cyber .tr i{border-radius:0;background:#00FF66;}
  .t-cyber .n{stroke-width:1.2;} .t-cyber .n.stable{fill:rgba(0,229,255,.04);stroke:rgba(0,229,255,.45);} .t-cyber .n.warn{fill:rgba(0,229,255,.2);stroke:#00E5FF;}
  .t-cyber .n.crit{fill:rgba(255,56,96,.22);stroke:#FF3860;} .t-cyber .n.ok{fill:rgba(0,255,102,.75);stroke:#00FF66;} .t-cyber .n.ng{fill:rgba(255,56,96,.5);stroke:#FF3860;}

  /* ══ Liquid（塊と雫） ══ */
  body.t-liquid{background:radial-gradient(ellipse 70% 50% at 20% 10%,rgba(255,0,128,.5),transparent 65%),radial-gradient(ellipse 60% 60% at 85% 85%,rgba(121,40,202,.52),transparent 65%),radial-gradient(circle at 50% 50%,rgba(255,122,0,.3),transparent 70%),radial-gradient(circle at 80% 20%,rgba(0,223,216,.26),transparent 55%),#0A0312;}
  .t-liquid .box,.t-liquid.res{color:#FFEFF8;background:linear-gradient(150deg,rgba(40,10,52,.92),rgba(16,4,26,.94));border:1px solid rgba(255,120,200,.45);border-radius:30px 12px 30px 12px;
    box-shadow:0 0 0 1px rgba(121,40,202,.3),0 24px 60px rgba(0,0,0,.55),inset 0 1px 0 rgba(255,255,255,.2);}
  .t-liquid .eye{color:#FF7AC0;}

<body class="t-aurora">
<div class="harness">
  <h1>定着プロトコル — UIテーマ別の意匠（第3版）</h1>
  <p>今の UIテーマに合わせて見た目が変わります。どのテーマも中心に「1問＝1つ」の図があり、解くたびに図が変わります。テーマと画面を切り替えて見てください（② では「正解」「誤答」で画面下のボードが動きます）。</p>
  <div class="themes" id="themes"></div>
  <div class="stages" id="stages">
    <button data-s="brief">① 開始前</button><button data-s="run">② 解答中</button><button data-s="res">③ 結果</button>
  </div>
  <div id="stage"></div>
</div>

<script>
'use strict';
// ── 見本のデータ（決定論。本物の SRS は読まない） ─────────────────────
const SUBJ = [
  { id:'resp', name:'呼吸器' }, { id:'circ', name:'循環器' }, { id:'neur', name:'神経' },
  { id:'endo', name:'内分泌' }, { id:'dige', name:'消化器' }, { id:'hema', name:'血液' },
];
function hash(s){ let h=2166136261; for(let i=0;i<s.length;i++){ h^=s.charCodeAt(i); h=Math.imul(h,16777619);} return h>>>0; }
const ITEMS = (() => {
  const per = { resp:8, circ:7, neur:6, endo:4, dige:3, hema:2 };
  const out = [];
  SUBJ.forEach(s => { for (let i=0;i<per[s.id];i++){
    const uid = s.id+'_ch0'+(1+i%3)+'_q'+(11+i*7);
    const h = hash(uid);
    const sev = h%10<2 ? 'crit' : h%10<7 ? 'warn' : 'stable';
    const late = sev==='crit' ? 7+(h>>>4)%6 : sev==='warn' ? 1+(h>>>4)%6 : 0;
    out.push({ uid, sid:s.id, sev, late, h });
  }});
  return out.sort((a,b)=>b.late-a.late || a.h-b.h);   // 本物は _srsUrgency の降順
})();
const N = ITEMS.length;
const OUT = { ok:'定着', ng:'もう一度' };
function autoOk(it){ return (it.h>>>8)%100 < (it.sev==='crit'?55:it.sev==='warn'?72:88); }
function nextDays(it){ return it.sev==='crit'?3:it.sev==='warn'?6+(it.h%3):9+(it.h%6); }
const subj = id => SUBJ.find(s=>s.id===id);
const esc = s => String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const rnd = (it, salt) => (hash(it.uid+salt) % 1000) / 1000;
function counts(){ const c={crit:0,warn:0,stable:0}; ITEMS.forEach(i=>c[i.sev]++); return c; }
function groups(){ const m=new Map(); ITEMS.forEach(i=>{ if(!m.has(i.sid)) m.set(i.sid,[]); m.get(i.sid).push(i); }); return [...m.entries()].map(([sid,pts])=>({sid,pts})).sort((a,b)=>b.pts.length-a.pts.length); }
function dateStr(){ const d=new Date(Date.now()+9*3600000); return (d.getUTCMonth()+1)+'月'+d.getUTCDate()+'日（'+'日月火水木金土'[d.getUTCDay()]+'）'; }
const f1 = x => x.toFixed(1);
// 図の要素：data-u（どの問題か）と data-b（元の状態）を持たせ、ボード側の paint と同じ規則で塗る
const nd = (tag, it, st, attrs) => '<'+tag+' class="n '+st+'" data-u="'+esc(it.uid)+'" '+attrs+'/>';

// ── テーマごとの「1問＝1つ」の図（viewBox 320×180） ──────────────────
// st(it) … その問題の今の状態（crit/warn/stable/ok/ng）
const SIG = {
  aurora(st){ // 3本の光の帯に10個ずつ
    const col=['#00E5FF','#9D5CFF','#FF4FA3'], y=(r,x)=>50+r*40+13*Math.sin(x/46+r*1.3);
    let s='';
    for(let r=0;r<3;r++){ let d=''; for(let x=0;x<=320;x+=8) d+=(x?'L':'M')+x+' '+f1(y(r,x));
      s+='<path d="'+d+'" fill="none" stroke="'+col[r]+'" stroke-width="18" stroke-opacity=".1" stroke-linecap="round"/><path d="'+d+'" fill="none" stroke="'+col[r]+'" stroke-width="1.4" stroke-opacity=".75"/>'; }
    ITEMS.forEach((it,k)=>{ const r=k%3, x=22+Math.floor(k/3)*30.6; s+=nd('circle',it,st(it),'cx="'+f1(x)+'" cy="'+f1(y(r,x))+'" r="4"'); });
    return s; },
  brass(st, pct){ // 半円の圧力計。鋲＝問題、針＝定着率
    const cx=160, cy=168, R=134; let s='';
    s+='<path d="M'+(cx-R-12)+' '+cy+' A'+(R+12)+' '+(R+12)+' 0 0 1 '+(cx+R+12)+' '+cy+'" fill="none" stroke="#B08A2E" stroke-width="2"/>';
    s+='<path d="M'+(cx-R+16)+' '+cy+' A'+(R-16)+' '+(R-16)+' 0 0 1 '+(cx+R-16)+' '+cy+'" fill="none" stroke="rgba(224,194,94,.35)" stroke-width="1"/>';
    for(let i=0;i<=10;i++){ const a=Math.PI+i/10*Math.PI, r1=R-26, r2=R-(i%5?32:38);
      s+='<line x1="'+f1(cx+r1*Math.cos(a))+'" y1="'+f1(cy+r1*Math.sin(a))+'" x2="'+f1(cx+r2*Math.cos(a))+'" y2="'+f1(cy+r2*Math.sin(a))+'" stroke="#B08A2E" stroke-width="'+(i%5?1:1.8)+'"/>'; }
    s+='<text x="'+(cx-R+44)+'" y="'+(cy-4)+'" fill="#B08A2E" font-size="10" font-family="Georgia,serif">0</text><text x="'+(cx+R-58)+'" y="'+(cy-4)+'" fill="#B08A2E" font-size="10" font-family="Georgia,serif">100</text>';
    s+='<text x="'+cx+'" y="'+(cy-60)+'" text-anchor="middle" fill="#B08A2E" font-size="9" letter-spacing="3" font-family="Georgia,serif">定着率</text>';
    ITEMS.forEach((it,k)=>{ const a=Math.PI+(k+.5)/N*Math.PI; s+=nd('circle',it,st(it),'cx="'+f1(cx+R*Math.cos(a))+'" cy="'+f1(cy+R*Math.sin(a))+'" r="4.6"'); });
    const na=Math.PI+(pct||0)/100*Math.PI;
    s+='<line x1="'+cx+'" y1="'+cy+'" x2="'+f1(cx+(R-44)*Math.cos(na))+'" y2="'+f1(cy+(R-44)*Math.sin(na))+'" stroke="#FFF3C4" stroke-width="2.4" stroke-linecap="round" style="filter:drop-shadow(0 0 3px rgba(255,215,0,.6))"/>';
    s+='<circle cx="'+cx+'" cy="'+cy+'" r="9" fill="#D4AF37" stroke="#FFF8DC" stroke-width="1.5"/><circle cx="'+cx+'" cy="'+cy+'" r="3" fill="#4A3606"/>';
    return s; },
  cyber(st){ // 10×3 の六角の区画
    let s='<text x="4" y="12" fill="#00FF66" font-size="8" font-family="Menlo,monospace" letter-spacing="2">SECTOR MAP // '+N+'</text>';
    ITEMS.forEach((it,k)=>{ const c=k%10, r=Math.floor(k/10), x=24+c*30.4+(r%2?15:0), y=52+r*40, h=14; let p='';
      for(let i=0;i<6;i++){ const a=Math.PI/3*i; p+=f1(x+h*Math.cos(a))+','+f1(y+h*Math.sin(a))+' '; }
      s+=nd('polygon',it,st(it),'points="'+p.trim()+'"'); });
    s+='<text x="316" y="176" text-anchor="end" fill="rgba(0,229,255,.5)" font-size="8" font-family="Menlo,monospace">SCAN ORDER: LATEST FIRST</text>';
    return s; },
  liquid(st, pct, res){ // 塊のまわりに雫。正解した雫は塊の中へ
    const cx=160, cy=92, P=[];
    for(let i=0;i<10;i++){ const a=i/10*Math.PI*2, r=48+6*Math.sin(2*a+.8)+3*Math.cos(3*a+.3); P.push([cx+r*Math.cos(a), cy+r*Math.sin(a)*.92]); }
    let d='M'+f1(P[0][0])+' '+f1(P[0][1]);   // Catmull-Rom → 3次ベジェ（角のない塊）
    for(let i=0;i<10;i++){ const p0=P[(i+9)%10], p1=P[i], p2=P[(i+1)%10], p3=P[(i+2)%10];
      d+=' C'+f1(p1[0]+(p2[0]-p0[0])/6)+' '+f1(p1[1]+(p2[1]-p0[1])/6)+' '+f1(p2[0]-(p3[0]-p1[0])/6)+' '+f1(p2[1]-(p3[1]-p1[1])/6)+' '+f1(p2[0])+' '+f1(p2[1]); }
    let s='<defs><radialGradient id="lqG" cx="40%" cy="35%"><stop offset="0" stop-color="#FF7AC0"/><stop offset=".55" stop-color="#C21C8C"/><stop offset="1" stop-color="#5A1896"/></radialGradient></defs>';
    s+='<path d="'+d+'Z" fill="#FF007F" opacity=".16" transform="translate(160 92) scale(1.22) translate(-160 -92)"/><path d="'+d+'Z" fill="url(#lqG)" opacity=".95"/><ellipse cx="'+(cx-16)+'" cy="'+(cy-20)+'" rx="14" ry="7" fill="#fff" opacity=".28"/>';
    ITEMS.forEach((it,k)=>{ const a=k/N*Math.PI*2-Math.PI/2; const inside = res && res[it.uid]==='ok';
      const r = inside ? 8+rnd(it,'r')*30 : 1, ax = inside ? rnd(it,'a')*Math.PI*2 : a;
      const x = inside ? cx+r*Math.cos(ax) : cx+136*Math.cos(a), y = inside ? cy+r*Math.sin(ax)*.9 : cy+76*Math.sin(a);
      s+=nd('circle',it,st(it),'cx="'+f1(x)+'" cy="'+f1(y)+'" r="'+(inside?3.2:5)+'"'); });
    return s; },
  kintsugi(st){ // 器とひび。正解のひびは金で継がれる
    let s='<defs><linearGradient id="kgB" x1="0" x2="1"><stop offset="0" stop-color="#0B0A0D"/><stop offset=".45" stop-color="#26211A"/><stop offset="1" stop-color="#0B0A0D"/></linearGradient></defs>';
    const bowl='M34 56 C36 150 92 174 160 174 C228 174 284 150 286 56 Z';
    s+='<clipPath id="kgC"><path d="'+bowl+'"/></clipPath><path d="'+bowl+'" fill="url(#kgB)" stroke="rgba(245,208,97,.45)" stroke-width="1"/><g clip-path="url(#kgC)">';
    ITEMS.forEach((it,k)=>{ const y0=74+rnd(it,'y')*84, half=(y0<130?118:118-(y0-130)*1.5), x0=160+(rnd(it,'x')*2-1)*(half-18);
      let p='M'+f1(x0)+' '+f1(y0), x=x0, y=y0, dir=rnd(it,'d')*Math.PI*2;
      for(let i=0;i<3;i++){ dir+=(rnd(it,'t'+i)-.5)*1.6; const L=7+rnd(it,'l'+i)*9; x+=L*Math.cos(dir); y+=L*Math.sin(dir)*.8; p+=' L'+f1(x)+' '+f1(y); }
      s+=nd('path',it,st(it),'d="'+p+'"'); });
    return s+'</g><ellipse cx="160" cy="56" rx="126" ry="10" fill="#15130F" stroke="rgba(245,208,97,.55)" stroke-width="1"/>'; },
  celestial(st, pct, res){ // 科目ごとの星座。正解の星どうしを結ぶ
    const C=[[62,52],[162,40],[262,58],[82,132],[186,122],[274,142]];
    let lines='', stars='', labels='';
    groups().forEach((g,gi)=>{ const [cx,cy]=C[gi]; let prev=null;
      labels+='<text x="'+cx+'" y="'+(cy+(gi<3?-26:38))+'" text-anchor="middle" fill="rgba(230,224,255,.45)" font-size="8.5" letter-spacing="1">'+esc(subj(g.sid).name)+'</text>';
      g.pts.forEach(it=>{ const a=rnd(it,'a')*Math.PI*2, r=8+rnd(it,'r')*22, x=cx+r*Math.cos(a), y=cy+r*Math.sin(a)*.8;
        if(prev){ const on = res && res[prev.it.uid]==='ok' && res[it.uid]==='ok'; lines+='<line class="ln'+(on?' on':'')+'" x1="'+f1(prev.x)+'" y1="'+f1(prev.y)+'" x2="'+f1(x)+'" y2="'+f1(y)+'"/>'; }
        const big = res && res[it.uid]==='ok' ? 6.5 : 4.6;
        stars+=nd('path',it,st(it),'d="'+starPath(x,y,big)+'"'); prev={it,x,y}; }); });
    return lines+stars+labels; },
  abyss(st, pct, res){ // 深さ＝遅れの日数。正解した信号は水面へ浮上する
    let s='<path d="M0 26 Q40 21 80 26 T160 26 T240 26 T320 26" fill="none" stroke="#00FFA3" stroke-width="1.4" opacity=".8"/>';
    s+='<text x="4" y="18" fill="#00FFA3" font-size="8.5" letter-spacing="2">水面</text>';
    [[3,'3日'],[7,'7日'],[11,'11日']].forEach(([d,l])=>{ const y=36+d*11.5; s+='<line x1="0" x2="320" y1="'+y+'" y2="'+y+'" stroke="rgba(0,229,255,.18)" stroke-dasharray="3 5"/><text x="316" y="'+(y-3)+'" text-anchor="end" fill="rgba(0,229,255,.5)" font-size="8">'+l+'遅れ</text>'; });
    ITEMS.forEach((it,k)=>{ const x=14+k*(292/(N-1)); const up = res && res[it.uid]==='ok'; const y = up ? 26 : 36+Math.min(12,it.late)*11.5;
      if(it.sev==='crit' && !up) s+='<circle cx="'+f1(x)+'" cy="'+f1(y)+'" r="9" fill="none" stroke="#FF5C8A" stroke-opacity=".35"/>';
      s+=nd('circle',it,st(it),'cx="'+f1(x)+'" cy="'+f1(y)+'" r="4.2"'); });
    return s; },
  frost(st, pct, res){ // 6本の腕に5つずつの節。正解の節から枝が伸びる
    const cx=160, cy=90; let s='';
    for(let a=0;a<6;a++){ const t=a*Math.PI/3-Math.PI/2; s+='<line x1="'+cx+'" y1="'+cy+'" x2="'+f1(cx+84*Math.cos(t))+'" y2="'+f1(cy+84*Math.sin(t))+'" stroke="rgba(160,231,229,.35)" stroke-width="1.2"/>'; }
    s+='<polygon points="'+[0,1,2,3,4,5].map(i=>{const t=i*Math.PI/3; return f1(cx+9*Math.cos(t))+','+f1(cy+9*Math.sin(t));}).join(' ')+'" fill="rgba(160,231,229,.25)" stroke="#A0E7E5" stroke-width=".8"/>';
    ITEMS.forEach((it,k)=>{ const arm=k%6, pos=Math.floor(k/6), t=arm*Math.PI/3-Math.PI/2, d=20+pos*15.5, x=cx+d*Math.cos(t), y=cy+d*Math.sin(t);
      if(res && res[it.uid]==='ok'){ const L=6+pos*1.5; [-1,1].forEach(sg=>{ const bt=t+sg*Math.PI/3; s+='<line class="br" x1="'+f1(x)+'" y1="'+f1(y)+'" x2="'+f1(x+L*Math.cos(bt))+'" y2="'+f1(y+L*Math.sin(bt))+'"/>'; }); }
      const r=4.3; s+=nd('polygon',it,st(it),'points="'+f1(x)+','+f1(y-r)+' '+f1(x+r)+','+f1(y)+' '+f1(x)+','+f1(y+r)+' '+f1(x-r)+','+f1(y)+'"'); });
    return s; },
};
function starPath(x,y,r){ const q=r*.28; return 'M'+f1(x)+' '+f1(y-r)+' L'+f1(x+q)+' '+f1(y-q)+' L'+f1(x+r)+' '+f1(y)+' L'+f1(x+q)+' '+f1(y+q)+' L'+f1(x)+' '+f1(y+r)+' L'+f1(x-q)+' '+f1(y+q)+' L'+f1(x-r)+' '+f1(y)+' L'+f1(x-q)+' '+f1(y-q)+' Z'; }

// テーマごとの言葉（図に合わせた説明だけ。状態の呼び名は全テーマ共通）
const THEMES = {
  aurora:   { name:'Aurora',    sev:['#FF4FA3','#7FE9FF','rgba(255,255,255,.55)'], how:'光の帯の1つ1つが今日の問題です。遅れの大きい順に出題し、正解した光は白く輝きます。' },
  brass:    { name:'Brass',     sev:['#E0603A','#D4AF37','#6A4E08'], how:'目盛りの鋲の1つ1つが今日の問題です。正解するたびに鋲が磨かれ、最後に針が定着率を指します。' },
  cyber:    { name:'Cyber',     sev:['#FF3860','#00E5FF','rgba(0,229,255,.35)'], how:'区画の1つ1つが今日の問題です。遅れの大きい区画から走査し、正解した区画を確保します。' },
  liquid:   { name:'Liquid',    sev:['#FF7A00','#FF7AC0','#FFB3D9'], how:'まわりの雫の1つ1つが今日の問題です。正解した雫は真ん中の塊に溶け込みます。' },
  kintsugi: { name:'Kintsugi',  sev:['#C23436','#6E6350','#4A4234'], how:'器のひびの1本1本が今日の問題です。正解したひびは金で継がれ、器が少しずつ直っていきます。' },
  celestial:{ name:'Celestial', sev:['#FF7BAC','#FFD166','rgba(230,224,255,.6)'], how:'科目ごとの星座の星が今日の問題です。正解した星が灯り、灯った星どうしが線で結ばれます。' },
  abyss:    { name:'Abyss',     sev:['#FF5C8A','#00E5FF','rgba(0,229,255,.55)'], how:'深く沈んでいる信号ほど、予定より遅れています。正解した信号は水面へ浮上します。' },
  frost:    { name:'Frost',     sev:['#FF9FB2','#70D6FF','#A0E7E5'], how:'結晶の節の1つ1つが今日の問題です。正解した節から氷の枝が伸び、結晶が育ちます。' },
};

// ── 状態 ───────────────────────────────────────────────────────────
let theme='aurora', stage='brief', S;
function reset(){ S={ recs:[], i:0 }; }
reset();
const nowUid = () => S.i < N ? ITEMS[S.i].uid : null;
const outN = k => S.recs.filter(r=>r.o===k).length;
const T = () => THEMES[theme];
const $stage = () => document.getElementById('stage');

function report(){
  const recs = S.recs.length ? S.recs : ITEMS.map(it=>({ uid:it.uid, o:autoOk(it)?'ok':'ng' }));
  const res={}; recs.forEach(r=>res[r.uid]=r.o);
  const done=ITEMS.filter(i=>res[i.uid]);
  const byG=new Map(); done.forEach(i=>{ if(!byG.has(i.sid)) byG.set(i.sid,{ok:0,n:0}); const b=byG.get(i.sid); if(res[i.uid]==='ok') b.ok++; b.n++; });
  const crit=done.filter(i=>i.sev==='crit'), critOk=crit.filter(i=>res[i.uid]==='ok').length;
  const nx=done.filter(i=>res[i.uid]==='ok').map(nextDays).sort((a,b)=>a-b);
  const ok=done.filter(i=>res[i.uid]==='ok').length;
  return { res, n:done.length, ok, ng:done.length-ok, pct:Math.round(ok/Math.max(1,done.length)*100), grp:[...byG.entries()].sort((a,b)=>b[1].n-a[1].n), crit, critOk, med:nx.length?nx[Math.floor(nx.length/2)]:null };
}

// ── ① 開始前 ────────────────────────────────────────────────────────
function briefHtml(){
  const t=T(), c=counts();
  return '<div class="head"><div><div class="eye">RETENTION PROTOCOL</div><h3 class="ttl">定着プロトコル</h3><div class="dt">'+dateStr()+'</div></div>'+
      '<div class="count"><b>'+N+'</b><span>問</span></div></div>'+
    '<div class="sig"><svg viewBox="0 0 320 180">'+SIG[theme](it=>it.sev, 0, null)+'</svg></div>'+
    '<div class="sev"><span><i style="background:'+t.sev[0]+'"></i>大きく遅れ<b>'+c.crit+'</b></span><span><i style="background:'+t.sev[1]+'"></i>遅れ<b>'+c.warn+'</b></span><span><i style="background:'+t.sev[2]+'"></i>予定どおり<b>'+c.stable+'</b></span></div>'+
    '<div class="subs">'+groups().map(g=>'<div>'+esc(subj(g.sid).name)+'<b>'+g.pts.length+'</b></div>').join('')+'</div>'+
    '<div class="how">'+t.how+'</div>'+
    '<div class="btns"><button class="back">あとで</button><button class="go">開始</button></div>';
}
function showBrief(){
  clearLayers();
  const ov=document.createElement('div'); ov.className='ov t-'+theme; ov.setAttribute('role','dialog'); ov.setAttribute('aria-modal','true');
  ov.innerHTML='<div class="box">'+briefHtml()+'</div>'; document.body.appendChild(ov);
  ov.querySelector('.go').onclick=()=>{ ov.remove(); setStage('run'); };
  ov.querySelector('.back').onclick=()=>ov.remove();
  ov.addEventListener('click',e=>{ if(e.target===ov) ov.remove(); });
  $stage().innerHTML='<p class="hint">開始前の画面は全画面で重なります。背景か「あとで」で閉じ、「開始」で②へ進みます。</p>';
}

// ── ② 解答中の画面下のボード ─────────────────────────────────────────
function hudEl(){
  let h=document.getElementById('hud');
  if(!h){ h=document.createElement('div'); h.id='hud'; h.className='hud hide t-'+theme; h.setAttribute('role','status');
    h.innerHTML='<div class="row"><span class="tag">∞ 定着プロトコル</span><span class="cnt"></span></div><div class="mks">'+ITEMS.map(i=>'<i class="mk" data-b="mk '+i.sev+'" data-u="'+esc(i.uid)+'"></i>').join('')+'</div>';
    document.body.appendChild(h); requestAnimationFrame(()=>requestAnimationFrame(()=>h.classList.remove('hide'))); }
  return h;
}
function paint(){
  const h=hudEl(), res={}, now=nowUid(); S.recs.forEach(r=>res[r.uid]=r.o);
  h.querySelector('.cnt').innerHTML='<b>'+S.recs.length+'</b> / '+N+'　定着 '+outN('ok')+'　もう一度 '+outN('ng');
  h.querySelectorAll('[data-u]').forEach(el=>{ const [b,...rest]=el.dataset.b.split(' '), u=el.dataset.u; el.setAttribute('class', b+' '+(res[u]||rest.join(' '))+(!res[u]&&u===now?' now':'')); });
}
function pop(o){
  const r=hudEl().getBoundingClientRect(), el=document.createElement('div');
  el.className='pop t-'+theme+' '+o; el.textContent=OUT[o];
  el.style.left=(r.left+r.width/2)+'px'; el.style.top=(r.top-38)+'px';
  document.body.appendChild(el); setTimeout(()=>el.remove(),1100);
}
function answer(ok){ if(S.i>=N) return; const it=ITEMS[S.i++], o=ok?'ok':'ng'; S.recs.push({uid:it.uid,o}); pop(o); paint(); renderRun(); }
function renderRun(){
  const it=ITEMS[S.i];
  $stage().innerHTML=(it?'<div class="mockq"><span class="qn">Q.'+it.uid.split('_q')[1]+'</span>　<span style="font-size:12px;opacity:.7">'+esc(subj(it.sid).name)+'</span><div class="qt">（問題文の見本）62歳の男性。……最も考えられるのはどれか。</div>'+
      ['a','b','c','d','e'].map(k=>'<div class="ch">'+k+'　選択肢</div>').join('')+'</div>'
      :'<div class="mockq"><div class="qt">全'+N+'問を解き終えました。③ 結果へ。</div></div>')+
    '<div class="sim"><button class="ok">正解させる</button><button class="ng">誤答させる</button><button class="auto">残りを自動で</button><button class="rst">最初から</button></div>'+
    '<p class="hint">画面下がボードです（表示だけで押せません）。</p>';
  const st=$stage();
  st.querySelector('.ok').onclick=()=>answer(true);
  st.querySelector('.ng').onclick=()=>answer(false);
  st.querySelector('.auto').onclick=()=>{ const step=()=>{ if(S.i>=N||stage!=='run') return; answer(autoOk(ITEMS[S.i])); setTimeout(step,240); }; step(); };
  st.querySelector('.rst').onclick=()=>{ reset(); document.getElementById('hud')?.remove(); paint(); renderRun(); };
}
function showRun(){ clearLayers(); paint(); renderRun(); }

// ── ③ 結果 ─────────────────────────────────────────────────────────
function showRes(){
  clearLayers(); const R=report();
  const st = it => R.res[it.uid] || it.sev;
  $stage().innerHTML='<div class="sumwrap"><div class="fake">ここより上に今の結果画面（正答率・所要時間など）が並び、下のブロックが差し替わります。'+(S.recs.length?'':'②で解いていないので見本の正誤で埋めています。')+'</div>'+
    '<div class="res t-'+theme+'"><div class="eye">RETENTION PROTOCOL · 結果</div>'+
      '<div class="hl"><span class="num">'+R.n+'</span>問のうち <span class="num">'+R.ok+'</span>問が定着</div>'+
      '<div class="sig"><svg viewBox="0 0 320 180">'+SIG[theme](st, R.pct, R.res)+'</svg></div>'+
      '<div class="stats"><div><b>'+R.pct+'%</b><span>定着率</span></div><div><b>'+R.ng+'</b><span>明日もう一度</span></div><div><b>'+R.critOk+'/'+R.crit.length+'</b><span>大きく遅れ→定着</span></div><div><b>'+(R.med!=null?R.med+'日':'—')+'</b><span>次に会うまで</span></div></div>'+
      '<div class="bars">'+R.grp.map(([sid,b])=>'<div class="rw"><span>'+esc(subj(sid).name)+'</span><span class="tr"><i style="width:'+(b.ok/b.n*100).toFixed(1)+'%"></i></span><span class="v">'+b.ok+'/'+b.n+'</span></div>').join('')+'</div>'+
    '</div></div>';
}

function clearLayers(){ document.querySelectorAll('.ov,.hud,.pop').forEach(e=>e.remove()); }
function setStage(s){ stage=s; document.querySelectorAll('#stages button').forEach(b=>b.classList.toggle('on',b.dataset.s===s));
  if(s==='brief') showBrief(); else if(s==='run') showRun(); else showRes(); }
function setTheme(k){ theme=k; document.body.className='t-'+k; document.querySelectorAll('#themes button').forEach(b=>b.classList.toggle('on',b.dataset.k===k)); reset(); setStage(stage); }

document.getElementById('themes').innerHTML=Object.entries(THEMES).map(([k,t])=>'<button data-k="'+k+'">'+t.name+'</button>').join('');
document.querySelectorAll('#themes button').forEach(b=>b.onclick=()=>setTheme(b.dataset.k));
document.querySelectorAll('#stages button').forEach(b=>b.onclick=()=>setStage(b.dataset.s));
setTheme('aurora');
</script>
</body>
