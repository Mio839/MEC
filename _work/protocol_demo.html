<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>定着プロトコル ラグジュアリー</title>
<!--
  SRS復習（2026-09-30 に「定着プロトコル」へ改名）の見せ方を、ward.js の「病棟回診」から作り直すデモ（第6版）。
  本物の関数は呼ばず、このページの中だけで再生する（何も保存しない）。
  経緯：第1〜5版はどれも却下。雰囲気の見本帳（_work/protocol_mood.html）から「2 ラグジュアリー」が選ばれ、
    「ラグジュアリーにグラフや円ゲージを組み合わせて」と指示された。
  意匠：黒とシャンパンゴールド・細い明朝・金の細線。演出はゆっくり（1〜2秒）、ぼかしから焦点が合う・細線が伸びる・数字が数え上がる。
    ① 開始前：30本の目盛りの円ゲージ（1問＝1目盛り・遅れ具合で色分け）＋遅れの帯グラフ＋科目の縦棒グラフ
    ② 解答中：細い黒の帯。小さな円ゲージに進みの金の弧、1問ごとに目盛りが灯る
    ③ 結果：定着率の円ゲージ＋三つの数字＋科目の横棒＋「次に会う日」の14日間の棒グラフ
  色：金（#C8B68A）＝定着・遅れ、銅（#C98E72）＝大きく遅れ・もう一度、灰（#5E574B）＝予定どおり。
  ⚠️ 演出はどれも時間の決まった一回きり（infinite なし）。画面下の帯は表示だけ（pointer-events:none）。
  ⚠️ 非表示タブでは rAF が来ないので、カウントアップには setTimeout の落とし所を付けてある。
  材料は ward.js と同じ（状態3段＝severityOf、正解／誤答）。SRS の採点と出題順は変えない。テストの対象ではない。
-->
<style>
  :root{
    --serif:"Hiragino Mincho ProN","Yu Mincho","YuMincho","Noto Serif JP",serif;
    --grot:"Helvetica Neue",Helvetica,Arial,"Hiragino Sans","Yu Gothic",sans-serif;
    --sans:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Yu Gothic UI",sans-serif;
    --ease:cubic-bezier(.16,1,.3,1);
    --ink:#EDE6D6;--ink-2:#F4EEE1;--muted:#A99F8C;--dim:#6F675A;--gold:#C8B68A;--gold-hi:#E9D9AE;--copper:#C98E72;--stone:#4E483E;
    --hair:rgba(200,182,138,.18);--panel:#12100D;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;overflow-x:clip;}
  body{min-height:100vh;padding:18px 16px 170px;font-family:var(--sans);color:var(--ink);background:#08070A;}
  .harness{max-width:860px;margin:0 auto;}
  .harness h1{font-size:15px;margin:0 0 4px;font-weight:600;}
  .harness p{font-size:12.5px;line-height:1.7;color:var(--muted);margin:0 0 14px;}
  .stages{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:16px;}
  .stages button{padding:8px 14px;border-radius:99px;border:1px solid rgba(200,182,138,.35);background:none;color:var(--ink);font:inherit;font-size:13px;cursor:pointer;white-space:nowrap;}
  .stages button.on{background:var(--gold);color:#12100D;border-color:var(--gold);}
  .stages .replay{margin-left:auto;}
  .hint{font-size:12px;color:var(--muted);line-height:1.7;margin:8px 0;}
  .mockq{border-radius:16px;padding:16px 18px;background:rgba(255,255,255,.035);border:1px solid rgba(255,255,255,.1);}
  .mockq .qn{display:inline-block;font-size:11px;font-weight:800;padding:2px 8px;border-radius:5px;margin-bottom:8px;border:1px solid rgba(255,255,255,.4);}
  .mockq .qt{font-size:14px;line-height:1.8;}
  .mockq .ch{font-size:13.5px;padding:9px 12px;border-radius:10px;margin-top:7px;background:rgba(255,255,255,.03);border:1px solid rgba(255,255,255,.1);}
  .sim{display:flex;flex-wrap:wrap;gap:6px;margin:10px 0;}
  .sim button{flex:1 1 110px;padding:10px;border-radius:10px;border:1px solid rgba(255,255,255,.2);background:rgba(255,255,255,.05);color:inherit;font:inherit;font-size:13px;font-weight:700;cursor:pointer;white-space:nowrap;}
  .sumwrap{border-radius:16px;padding:12px;background:rgba(255,255,255,.03);border:1px solid rgba(255,255,255,.08);}
  .sumwrap .fake{font-size:12px;color:var(--muted);padding:8px 10px;border:1px dashed rgba(255,255,255,.2);border-radius:10px;margin-bottom:12px;line-height:1.6;}
  .num{font-variant-numeric:tabular-nums;}

  /* ══ パネル（開始前・結果で共通の地） ══ */
  .ov{position:fixed;inset:0;z-index:9500;display:flex;align-items:center;justify-content:center;padding:14px;background:rgba(4,3,2,.78);animation:fade .5s var(--ease) both;}
  .lux{position:relative;color:var(--ink);background:radial-gradient(120% 60% at 50% 0%,#211D17,#0E0C0A 62%,#0A0908);border:1px solid rgba(200,182,138,.28);
    box-shadow:0 30px 80px rgba(0,0,0,.7),inset 0 0 0 1px rgba(0,0,0,.6);}
  .lux::before{content:'';position:absolute;inset:8px;border:1px solid rgba(200,182,138,.1);pointer-events:none;}
  .box{width:min(460px,100%);max-height:100%;overflow-y:auto;overflow-x:hidden;scrollbar-width:thin;scrollbar-color:rgba(200,182,138,.35) transparent;padding:34px 26px 24px;border-radius:4px;animation:rise 1s var(--ease) both;}
  .box::-webkit-scrollbar{width:6px;} .box::-webkit-scrollbar-thumb{background:rgba(200,182,138,.3);border-radius:3px;}
  .eye{font-family:var(--grot);font-size:9.5px;letter-spacing:.5em;text-indent:.5em;color:var(--gold);text-align:center;}
  .date{font-family:var(--serif);font-size:11.5px;color:var(--muted);text-align:center;margin-top:8px;letter-spacing:.2em;}
  .gauge{position:relative;width:min(250px,76%);margin:18px auto 0;aspect-ratio:1;}
  .gauge svg{position:absolute;inset:0;width:100%;height:100%;overflow:visible;}
  .gauge .c{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;}
  .gauge .big{font-family:var(--serif);font-weight:200;font-size:clamp(64px,19vw,86px);line-height:1;color:var(--ink-2);letter-spacing:-.02em;}
  .gauge .big small{font-size:.24em;letter-spacing:0;margin-left:2px;color:var(--muted);}
  .gauge .cap{font-family:var(--serif);font-size:12px;letter-spacing:.42em;text-indent:.42em;margin-top:8px;color:var(--ink);}
  .tk{stroke-linecap:round;transition:stroke .5s,stroke-width .5s;}
  .tk.stable{stroke:var(--stone);stroke-width:1.2;} .tk.warn{stroke:var(--gold);stroke-width:1.3;} .tk.crit{stroke:var(--copper);stroke-width:2;}
  .tk.ok{stroke:var(--gold-hi);stroke-width:2.2;filter:drop-shadow(0 0 3px rgba(233,217,174,.7));} .tk.ng{stroke:var(--copper);stroke-width:1.4;opacity:.55;} .tk.now{stroke:#fff;stroke-width:2.4;}
  .orbit{fill:none;stroke:rgba(200,182,138,.22);stroke-width:.8;}
  .arc{fill:none;stroke:url(#gGold);stroke-width:2.4;stroke-linecap:round;}
  .hair{height:1px;background:linear-gradient(90deg,transparent,var(--gold),transparent);margin:22px 0 18px;transform-origin:center;}
  .sec{font-family:var(--grot);font-size:9px;letter-spacing:.36em;color:var(--muted);margin:0 0 10px;}
  /* 遅れの帯グラフ */
  .band{display:flex;gap:3px;height:3px;}
  .band i{display:block;height:100%;transform-origin:left;}
  .legend{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));margin-top:10px;}
  .legend div{padding:2px 0 0 10px;border-left:1px solid var(--hair);font-size:10.5px;color:var(--muted);letter-spacing:.06em;}
  .legend div:first-child{border-left:0;padding-left:0;}
  .legend b{display:block;font-family:var(--serif);font-weight:400;font-size:22px;color:var(--ink);letter-spacing:0;line-height:1.3;}
  .legend .c1 b{color:var(--copper);}
  /* 科目の縦棒（金の細線と点） */
  .cols{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));align-items:end;height:92px;border-bottom:1px solid var(--hair);}
  .col{position:relative;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;height:100%;}
  .col .v{font-family:var(--serif);font-size:13px;color:var(--ink);margin-bottom:4px;}
  .col .st{width:1px;background:linear-gradient(180deg,var(--gold-hi),rgba(200,182,138,.25));transform-origin:bottom;}
  .col .st::before{content:'';position:absolute;left:50%;width:5px;height:5px;margin:-2px 0 0 -2.5px;border-radius:50%;background:var(--gold-hi);box-shadow:0 0 8px rgba(233,217,174,.7);}
  .col .st{position:relative;}
  .names{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));margin-top:6px;}
  .names span{font-family:var(--serif);font-size:10.5px;color:var(--muted);text-align:center;white-space:nowrap;}
  .how{font-family:var(--serif);font-size:12.5px;line-height:2;color:var(--muted);text-align:center;margin:18px 0 0;}
  .how em{font-style:normal;color:var(--copper);}
  .go{position:relative;overflow:hidden;display:block;width:100%;margin-top:22px;padding:15px;background:none;border:1px solid var(--gold);color:var(--gold);font-family:var(--serif);font-size:15px;letter-spacing:.6em;text-indent:.6em;cursor:pointer;white-space:nowrap;transition:background .4s var(--ease),color .4s var(--ease);}
  .go:hover{background:var(--gold);color:#12100D;}
  .go::after{content:'';position:absolute;inset:0;background:linear-gradient(105deg,transparent 38%,rgba(233,217,174,.35) 50%,transparent 62%);translate:-120% 0;}
  .go.shine::after{animation:shine 1.6s var(--ease) forwards;}
  .go:focus-visible,.back:focus-visible{outline:1px solid var(--gold-hi);outline-offset:4px;}
  .back{display:block;margin:12px auto 0;background:none;border:0;padding:4px 8px;font-family:var(--serif);font-size:12px;letter-spacing:.3em;color:var(--dim);cursor:pointer;}

  /* ══ 画面下の帯 ══ */
  .hud{position:fixed;left:50%;bottom:calc(10px + env(safe-area-inset-bottom));translate:-50% 0;z-index:8000;width:min(560px,calc(100% - 20px));
    display:flex;align-items:center;gap:14px;padding:8px 18px 8px 10px;border-radius:2px;pointer-events:none;
    background:linear-gradient(180deg,#1A1713,#0D0B09);border:1px solid rgba(200,182,138,.3);box-shadow:0 14px 40px rgba(0,0,0,.6);
    transition:opacity .6s var(--ease),translate .8s var(--ease);}
  .hud.hide{opacity:0;translate:-50% 130%;}
  .hud .mg{width:52px;height:52px;flex-shrink:0;}
  .hud .mg svg{width:100%;height:100%;overflow:visible;}
  .hud .mid{flex:1;min-width:0;}
  .hud .t{font-family:var(--grot);font-size:8.5px;letter-spacing:.42em;color:var(--gold);}
  .hud .k{font-family:var(--serif);font-size:24px;font-weight:300;line-height:1.2;white-space:nowrap;}
  .hud .k small{font-size:12px;color:var(--muted);margin-left:4px;}
  .hud .r{text-align:right;font-family:var(--serif);font-size:11.5px;color:var(--muted);line-height:1.7;white-space:nowrap;}
  .hud .r b{font-weight:400;font-size:15px;color:var(--gold-hi);margin-left:6px;display:inline-block;}
  .hud .r .x b{color:var(--copper);}
  .hud .line{position:absolute;left:0;bottom:0;height:1px;background:var(--gold);transition:width 1s var(--ease);}
  .whisper{position:fixed;z-index:8001;pointer-events:none;translate:-50% 0;font-family:var(--serif);font-size:15px;letter-spacing:.5em;text-indent:.5em;white-space:nowrap;
    text-shadow:0 0 18px rgba(0,0,0,.9);animation:whisper 1.6s var(--ease) forwards;}
  .whisper.ok{color:var(--gold-hi);} .whisper.ng{color:var(--copper);}
  .spark{position:fixed;z-index:8001;left:0;top:0;width:4px;height:4px;margin:-2px 0 0 -2px;border-radius:50%;background:var(--gold-hi);box-shadow:0 0 6px var(--gold-hi);pointer-events:none;}

  /* ══ 結果 ══ */
  .res{padding:32px 22px 24px;border-radius:4px;overflow:hidden;}
  .res .gauge{width:min(240px,74%);}
  .res .big{font-size:clamp(58px,17vw,78px);}
  .res .hl{font-family:var(--serif);font-size:17px;text-align:center;margin-top:18px;letter-spacing:.12em;line-height:1.8;}
  .res .hl b{font-weight:400;font-size:24px;color:var(--gold-hi);margin:0 2px;}
  .trio{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));margin-top:4px;}
  .trio div{text-align:center;padding:0 4px;}
  .trio div + div{border-left:1px solid var(--hair);}
  .trio b{display:block;font-family:var(--serif);font-weight:300;font-size:28px;color:var(--ink-2);}
  .trio b small{font-size:13px;color:var(--muted);}
  .trio span{font-size:10.5px;color:var(--muted);letter-spacing:.08em;display:block;line-height:1.5;}
  .rows .rw{display:grid;grid-template-columns:4.6em minmax(0,1fr) 3em;gap:12px;align-items:center;padding:6px 0;font-family:var(--serif);font-size:12px;border-bottom:1px solid rgba(200,182,138,.08);}
  .rows .tr{position:relative;height:1px;background:rgba(200,182,138,.18);}
  .rows .tr i{position:absolute;left:0;top:-1px;height:3px;background:linear-gradient(90deg,rgba(200,182,138,.5),var(--gold-hi));width:0;transition:width 1.4s var(--ease);}
  .rows .tr i::after{content:'';position:absolute;right:-3px;top:-2px;width:7px;height:7px;border-radius:50%;background:var(--gold-hi);box-shadow:0 0 8px rgba(233,217,174,.8);}
  .rows .v{text-align:right;color:var(--muted);}
  .cal{display:grid;grid-template-columns:repeat(14,minmax(0,1fr));align-items:end;gap:3px;height:70px;border-bottom:1px solid var(--hair);}
  .cal .d{display:flex;flex-direction:column;justify-content:flex-end;align-items:center;height:100%;}
  .cal .d i{display:block;width:100%;max-width:10px;background:linear-gradient(180deg,var(--gold-hi),rgba(200,182,138,.3));transform-origin:bottom;}
  .cal .d i.ng{background:var(--copper);}
  .cal .d em{font-style:normal;font-family:var(--serif);font-size:10px;color:var(--ink);margin-bottom:3px;}
  .calx{display:grid;grid-template-columns:repeat(14,minmax(0,1fr));gap:3px;margin-top:5px;}
  .calx span{font-size:9px;color:var(--dim);text-align:center;font-variant-numeric:tabular-nums;}
  .calx span.w{color:var(--muted);}
  .calleg{display:flex;justify-content:center;gap:18px;font-size:10.5px;color:var(--muted);margin-top:10px;}
  .calleg i{display:inline-block;width:8px;height:8px;margin-right:6px;vertical-align:0;}

  /* ══ 動き ══ */
  @keyframes fade{from{opacity:0}to{opacity:1}}
  @keyframes rise{from{opacity:0;translate:0 16px}to{opacity:1;translate:0 0}}
  @keyframes shine{from{translate:-120% 0}to{translate:120% 0}}
  @keyframes whisper{0%{opacity:0;transform:translateY(8px);letter-spacing:.9em}25%{opacity:1;transform:translateY(0);letter-spacing:.5em}75%{opacity:1}100%{opacity:0;transform:translateY(-10px)}}
  .rv{opacity:0;}
  .rv.on{animation:rv 1.2s var(--ease) both;}
  @keyframes rv{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
  .blurin{animation:blurin 1.8s var(--ease) both;}
  @keyframes blurin{from{opacity:0;filter:blur(14px);transform:scale(1.08)}to{opacity:1;filter:none;transform:none}}
  .spread{animation:spread 2s var(--ease) both;}
  @keyframes spread{from{opacity:0;letter-spacing:1.3em}}
  .draw{animation:draw 1.6s var(--ease) both;}
  @keyframes draw{from{transform:scaleX(0)}}
  @media (prefers-reduced-motion:reduce){*{animation-duration:.01s!important;transition-duration:.01s!important;}}
</style>
</head>
<body>
<div class="harness">
  <h1>定着プロトコル — ラグジュアリー × 円ゲージとグラフ（第6版）</h1>
  <p>黒とシャンパンゴールドに、30本の目盛りの円ゲージ・遅れの帯グラフ・科目の棒グラフ・次に会う日の棒グラフを組み合わせました。① 開始前・② 解答中・③ 結果を切り替えて見てください。「↻ もう一度再生」で演出を頭から見られます。</p>
  <div class="stages" id="stages">
    <button data-s="brief">① 開始前</button><button data-s="run">② 解答中</button><button data-s="res">③ 結果</button><button class="replay" id="replay">↻ もう一度再生</button>
  </div>
  <div id="stage"></div>
</div>

<script>
'use strict';
// ── 見本のデータ（決定論。本物の SRS は読まない） ─────────────────────
const SUBJ = [
  { id:'resp', name:'呼吸器' }, { id:'circ', name:'循環器' }, { id:'neur', name:'神経' },
  { id:'endo', name:'内分泌' }, { id:'dige', name:'消化器' }, { id:'hema', name:'血液' },
];
function hash(s){ let h=2166136261; for(let i=0;i<s.length;i++){ h^=s.charCodeAt(i); h=Math.imul(h,16777619);} return h>>>0; }
const ITEMS = (() => {
  const per = { resp:8, circ:7, neur:6, endo:4, dige:3, hema:2 };
  const out = [];
  SUBJ.forEach(s => { for (let i=0;i<per[s.id];i++){
    const uid = s.id+'_ch0'+(1+i%3)+'_q'+(11+i*7);
    const h = hash(uid);
    const sev = h%10<2 ? 'crit' : h%10<7 ? 'warn' : 'stable';
    const late = sev==='crit' ? 7+(h>>>4)%6 : sev==='warn' ? 1+(h>>>4)%6 : 0;
    out.push({ uid, sid:s.id, sev, late, h });
  }});
  return out.sort((a,b)=>b.late-a.late || a.h-b.h);   // 本物は _srsUrgency の降順
})();
const N = ITEMS.length;
function autoOk(it){ return (it.h>>>8)%100 < (it.sev==='crit'?55:it.sev==='warn'?72:88); }
function nextDays(it){ return it.sev==='crit'?3:it.sev==='warn'?6+(it.h%3):9+(it.h%6); }
const subj = id => SUBJ.find(s=>s.id===id);
const esc = s => String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
function counts(){ const c={crit:0,warn:0,stable:0}; ITEMS.forEach(i=>c[i.sev]++); return c; }
function groups(){ const m=new Map(); ITEMS.forEach(i=>{ if(!m.has(i.sid)) m.set(i.sid,[]); m.get(i.sid).push(i); }); return [...m.entries()].map(([sid,pts])=>({sid,pts})).sort((a,b)=>b.pts.length-a.pts.length); }
const JD = () => new Date(Date.now()+9*3600000);
const KANJI_M = ['一','二','三','四','五','六','七','八','九','十','十一','十二'];
function dateStr(){ const d=JD(); return (d.getUTCMonth()+1)+'月'+d.getUTCDate()+'日　'+'日月火水木金土'[d.getUTCDay()]+'曜日'; }
const f1 = x => x.toFixed(1);
const $ = (s,r) => (r||document).querySelector(s);
const $$ = (s,r) => [...(r||document).querySelectorAll(s)];

// ── 演出の道具（時間の決まった一回きり） ────────────────────────────
let TIMERS = [];
const later = (fn, ms) => { const t=setTimeout(fn, ms); TIMERS.push(t); return t; };
function clearTimers(){ TIMERS.forEach(clearTimeout); TIMERS=[]; }
function anim(el, kf, opt){ try { return el.animate(kf, Object.assign({ fill:'both', easing:'cubic-bezier(.16,1,.3,1)' }, opt)); } catch(e){ return null; } }
function countUp(el, to, dur, fmt){
  if(!el) return; fmt=fmt||(v=>String(v)); const t0=performance.now(); let done=false;
  const fin=()=>{ if(done) return; done=true; el.textContent=fmt(to); };
  const step=now=>{ if(done) return; const p=Math.min(1,(now-t0)/dur); el.textContent=fmt(Math.round(to*(1-Math.pow(1-p,4)))); if(p<1) requestAnimationFrame(step); else fin(); };
  requestAnimationFrame(step); later(fin, dur+400);
}
// .rv を順に浮かび上がらせる
function reveal(root, start, gap){ $$('.rv',root).forEach((e,i)=>later(()=>e.classList.add('on'), start+i*gap)); }

// ── 円ゲージ（1問＝1目盛り） ──────────────────────────────────────
// st(it) … 目盛りの状態／arcPct … 金の弧（0〜100・null なら描かない）
function gaugeSvg(st, arcPct, size){
  const c=size/2, R1=size*.43, R2=size*.49, R2c=size*.51, Ro=size*.395;
  let s='<defs><linearGradient id="gGold" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#8E7A4E"/><stop offset=".5" stop-color="#E9D9AE"/><stop offset="1" stop-color="#C8B68A"/></linearGradient></defs>';
  s+='<circle class="orbit" cx="'+c+'" cy="'+c+'" r="'+f1(Ro)+'" pathLength="1"/>';
  if(arcPct!=null) s+='<circle class="arc" cx="'+c+'" cy="'+c+'" r="'+f1(Ro)+'" pathLength="100" stroke-dasharray="'+arcPct+' 100" transform="rotate(-90 '+c+' '+c+')"/>';
  ITEMS.forEach((it,k)=>{ const a=-Math.PI/2+(k+.5)/N*Math.PI*2, r2=it.sev==='crit'?R2c:R2;
    s+='<line class="tk '+st(it)+'" data-b="'+it.sev+'" data-u="'+esc(it.uid)+'" x1="'+f1(c+R1*Math.cos(a))+'" y1="'+f1(c+R1*Math.sin(a))+'" x2="'+f1(c+r2*Math.cos(a))+'" y2="'+f1(c+r2*Math.sin(a))+'"/>'; });
  return '<svg viewBox="0 0 '+size+' '+size+'">'+s+'</svg>';
}
// 目盛りを12時から時計回りに1本ずつ灯し、細い円を一周描く
function lightTicks(root, start, per){
  $$('.tk',root).forEach((t,k)=>{ t.style.opacity='0'; later(()=>{ t.style.opacity=''; anim(t,[{opacity:0},{opacity:1}],{duration:500}); }, start+k*per); });
  const o=$('.orbit',root); if(o){ o.style.strokeDasharray='1'; o.style.strokeDashoffset='1'; anim(o,[{strokeDashoffset:1},{strokeDashoffset:0}],{duration:N*per+400,delay:start,easing:'cubic-bezier(.45,0,.2,1)'}); }
}

// ── 状態 ───────────────────────────────────────────────────────────
let stage='brief', S;
function reset(){ S={ recs:[], i:0 }; }
reset();
const nowUid = () => S.i < N ? ITEMS[S.i].uid : null;
const outN = k => S.recs.filter(r=>r.o===k).length;
const $stage = () => document.getElementById('stage');

function report(){
  const recs = S.recs.length ? S.recs : ITEMS.map(it=>({ uid:it.uid, o:autoOk(it)?'ok':'ng' }));
  const res={}; recs.forEach(r=>res[r.uid]=r.o);
  const done=ITEMS.filter(i=>res[i.uid]);
  const byG=new Map(); done.forEach(i=>{ if(!byG.has(i.sid)) byG.set(i.sid,{ok:0,n:0}); const b=byG.get(i.sid); if(res[i.uid]==='ok') b.ok++; b.n++; });
  const crit=done.filter(i=>i.sev==='crit'), critOk=crit.filter(i=>res[i.uid]==='ok').length;
  const nx=done.filter(i=>res[i.uid]==='ok').map(nextDays).sort((a,b)=>a-b);
  const cal={}; done.forEach(i=>{ const d=res[i.uid]==='ok'?nextDays(i):1; (cal[d]=cal[d]||{ok:0,ng:0})[res[i.uid]]++; });
  const ok=done.filter(i=>res[i.uid]==='ok').length;
  return { res, n:done.length, ok, ng:done.length-ok, pct:Math.round(ok/Math.max(1,done.length)*100), grp:[...byG.entries()].sort((a,b)=>b[1].n-a[1].n), crit, critOk, med:nx.length?nx[Math.floor(nx.length/2)]:null, cal };
}

// ── ① 開始前 ────────────────────────────────────────────────────────
function showBrief(){
  clearLayers();
  const c=counts(), g=groups(), mx=Math.max(...g.map(x=>x.pts.length));
  const ov=document.createElement('div'); ov.className='ov'; ov.setAttribute('role','dialog'); ov.setAttribute('aria-modal','true');
  ov.innerHTML='<div class="box lux">'+
    '<div class="eye spread">DAILY RETENTION</div>'+
    '<div class="date rv">'+dateStr()+'</div>'+
    '<div class="gauge">'+gaugeSvg(it=>it.sev, null, 250)+'<div class="c"><div class="big blurin" style="animation-delay:.3s"><span class="num" id="bN">0</span><small>問</small></div><div class="cap rv">定着プロトコル</div></div></div>'+
    '<div class="hair draw" style="animation-delay:1.1s"></div>'+
    '<div class="rv"><div class="sec">遅れの内訳</div>'+
      '<div class="band"><i style="flex:'+c.crit+';background:var(--copper)"></i><i style="flex:'+c.warn+';background:var(--gold)"></i><i style="flex:'+c.stable+';background:var(--stone)"></i></div>'+
      '<div class="legend"><div class="c1"><b class="num">'+c.crit+'</b>大きく遅れ</div><div><b class="num">'+c.warn+'</b>遅れ</div><div><b class="num">'+c.stable+'</b>予定どおり</div></div></div>'+
    '<div class="rv" style="margin-top:22px"><div class="sec">科目</div>'+
      '<div class="cols">'+g.map(x=>'<div class="col"><span class="v num">'+x.pts.length+'</span><span class="st" style="height:'+Math.round(x.pts.length/mx*62)+'px"></span></div>').join('')+'</div>'+
      '<div class="names">'+g.map(x=>'<span>'+esc(subj(x.sid).name)+'</span>').join('')+'</div></div>'+
    '<p class="how rv">目盛りの一本一本が、今日の問題です。<br><em>銅色</em>は、約束の日を大きく過ぎた記憶。<br>遅れの大きい順にお出しします。</p>'+
    '<button class="go rv">はじめる</button><button class="back rv">あとで</button></div>';
  document.body.appendChild(ov);
  const box=$('.box',ov);
  $('.go',ov).onclick=()=>{ ov.remove(); setStage('run'); };
  $('.back',ov).onclick=()=>{ clearTimers(); ov.remove(); };
  ov.addEventListener('click',e=>{ if(e.target===ov){ clearTimers(); ov.remove(); } });
  // 演出：目盛りが一周灯る → 数字が数え上がる → 帯グラフ・棒グラフ → ボタンに光が走る
  lightTicks(box, 350, 38);
  countUp($('#bN',box), N, 1500);
  reveal(box, 500, 170);
  later(()=>{ $$('.band i',box).forEach((i,k)=>anim(i,[{transform:'scaleX(0)'},{transform:'scaleX(1)'}],{duration:1200,delay:k*120})); }, 1250);
  later(()=>{ $$('.col .st',box).forEach((s,k)=>anim(s,[{transform:'scaleY(0)'},{transform:'scaleY(1)'}],{duration:1100,delay:k*90})); $$('.col .v',box).forEach((v,k)=>anim(v,[{opacity:0},{opacity:1}],{duration:700,delay:500+k*90})); }, 1500);
  later(()=>$('.go',box).classList.add('shine'), 2700);
  $stage().innerHTML='<p class="hint">開始前の画面は全画面で重なります。背景か「あとで」で閉じ、「はじめる」で②へ進みます。</p>';
}

// ── ② 解答中の画面下の帯 ────────────────────────────────────────────
function hudEl(){
  let h=document.getElementById('hud');
  if(!h){ h=document.createElement('div'); h.id='hud'; h.className='hud hide'; h.setAttribute('role','status');
    h.innerHTML='<div class="mg">'+gaugeSvg(it=>it.sev, 0, 52)+'</div>'+
      '<div class="mid"><div class="t">RETENTION</div><div class="k"><span class="num kk">0</span><small>/ '+N+'</small></div></div>'+
      '<div class="r"><div>定着<b class="num ko">0</b></div><div class="x">もう一度<b class="num kx">0</b></div></div><div class="line"></div>';
    document.body.appendChild(h); requestAnimationFrame(()=>requestAnimationFrame(()=>h.classList.remove('hide'))); }
  return h;
}
function paint(){
  const h=hudEl(), res={}, now=nowUid(); S.recs.forEach(r=>res[r.uid]=r.o);
  $$('.tk',h).forEach(t=>{ const u=t.dataset.u; t.setAttribute('class','tk '+(res[u]||t.dataset.b)+(!res[u]&&u===now?' now':'')); });
  const arc=$('.arc',h); if(arc) arc.setAttribute('stroke-dasharray', f1(S.recs.length/N*100)+' 100');
  $('.kk',h).textContent=S.recs.length; $('.ko',h).textContent=outN('ok'); $('.kx',h).textContent=outN('ng');
  $('.line',h).style.width=(S.recs.length/N*100)+'%';
}
function answer(ok){
  if(S.i>=N) return; const it=ITEMS[S.i++], o=ok?'ok':'ng', h=hudEl();
  S.recs.push({uid:it.uid,o}); paint();
  const t=$('[data-u="'+it.uid+'"]',h), r=t.getBoundingClientRect(), x=r.left+r.width/2, y=r.top+r.height/2;
  // 静かな演出：目盛りが灯り、金の粒がこぼれ、言葉が一つ浮かぶ（誤答は銅色で沈む）
  if(o==='ok'){ for(let i=0;i<8;i++){ const s=document.createElement('i'); s.className='spark'; document.body.appendChild(s); const a=Math.random()*Math.PI*2, d=14+Math.random()*22;
      anim(s,[{transform:'translate('+x+'px,'+y+'px)',opacity:1},{transform:'translate('+(x+Math.cos(a)*d)+'px,'+(y+Math.sin(a)*d-10)+'px) scale(.3)',opacity:0}],{duration:900+Math.random()*500}); later(()=>s.remove(),1500); }
    anim($('.ko',h),[{transform:'scale(1.4)',color:'#fff'},{transform:'scale(1)'}],{duration:700}); }
  else { anim(h,[{boxShadow:'0 0 0 1px rgba(201,142,114,.9),0 14px 40px rgba(0,0,0,.6)'},{boxShadow:'0 0 0 1px rgba(201,142,114,0),0 14px 40px rgba(0,0,0,.6)'}],{duration:1100,fill:'none'}); anim($('.kx',h),[{transform:'scale(1.3)'},{transform:'scale(1)'}],{duration:600}); }
  const hr=h.getBoundingClientRect(), w=document.createElement('div'); w.className='whisper '+o; w.textContent=o==='ok'?'定着':'もう一度';
  w.style.left=(hr.left+hr.width/2)+'px'; w.style.top=(hr.top-40)+'px'; document.body.appendChild(w); later(()=>w.remove(),1700);
  renderRun();
}
function renderRun(){
  const it=ITEMS[S.i];
  $stage().innerHTML=(it?'<div class="mockq"><span class="qn">Q.'+it.uid.split('_q')[1]+'</span>　<span style="font-size:12px;opacity:.7">'+esc(subj(it.sid).name)+'</span><div class="qt">（問題文の見本）62歳の男性。……最も考えられるのはどれか。</div>'+
      ['a','b','c','d','e'].map(k=>'<div class="ch">'+k+'　選択肢</div>').join('')+'</div>'
      :'<div class="mockq"><div class="qt">全'+N+'問を解き終えました。③ 結果へ。</div></div>')+
    '<div class="sim"><button class="ok">正解させる</button><button class="ng">誤答させる</button><button class="auto">残りを自動で</button><button class="rst">最初から</button></div>'+
    '<p class="hint">画面下の帯は表示だけで押せません。</p>';
  const st=$stage();
  $('.ok',st).onclick=()=>answer(true);
  $('.ng',st).onclick=()=>answer(false);
  $('.auto',st).onclick=()=>{ const step=()=>{ if(S.i>=N||stage!=='run') return; answer(autoOk(ITEMS[S.i])); later(step,520); }; step(); };
  $('.rst',st).onclick=()=>{ reset(); document.getElementById('hud')?.remove(); paint(); renderRun(); };
}
function showRun(){ clearLayers(); paint(); renderRun(); }

// ── ③ 結果 ─────────────────────────────────────────────────────────
function showRes(){
  clearLayers(); const R=report();
  const t=JD(); let cal='', calx='', mx=1;
  for(let d=1;d<=14;d++){ const c=R.cal[d]; if(c) mx=Math.max(mx,c.ok+c.ng); }
  for(let d=1;d<=14;d++){ const c=R.cal[d]||{ok:0,ng:0}, x=new Date(t.getTime()+d*86400000), wk=x.getUTCDay()===0||x.getUTCDay()===6;
    cal+='<div class="d">'+((c.ok+c.ng)?'<em class="num">'+(c.ok+c.ng)+'</em>':'')+(c.ng?'<i class="ng" style="height:'+Math.round(c.ng/mx*48)+'px"></i>':'')+(c.ok?'<i style="height:'+Math.round(c.ok/mx*48)+'px"></i>':'')+'</div>';
    calx+='<span class="'+(wk?'w':'')+'">'+(d===1?'明日':x.getUTCDate())+'</span>'; }
  $stage().innerHTML='<div class="sumwrap"><div class="fake">ここより上に今の結果画面（正答率・所要時間など）が並び、下のブロックが差し替わります。'+(S.recs.length?'':'②で解いていないので見本の正誤で埋めています。')+'</div>'+
    '<div class="res lux">'+
      '<div class="eye spread">RETENTION REPORT</div><div class="date rv">'+dateStr()+'</div>'+
      '<div class="gauge">'+gaugeSvg(it=>R.res[it.uid]||'stable', 0, 240)+'<div class="c"><div class="big blurin" style="animation-delay:.3s"><span class="num" id="rP">0</span><small>%</small></div><div class="cap rv">定着率</div></div></div>'+
      '<div class="hl rv"><b class="num">'+R.n+'</b>問のうち、<b class="num" id="rOk">0</b>問が定着。</div>'+
      '<div class="hair draw" style="animation-delay:1.6s"></div>'+
      '<div class="trio rv"><div><b class="num">'+R.ng+'</b><span>明日もう一度</span></div><div><b class="num">'+R.critOk+'<small>/'+R.crit.length+'</small></b><span>大きく遅れていた記憶</span></div><div><b class="num">'+(R.med!=null?R.med:'—')+'<small>日</small></b><span>次に会うまで</span></div></div>'+
      '<div class="rv" style="margin-top:24px"><div class="sec">科目ごとの定着</div><div class="rows">'+R.grp.map(([sid,b])=>'<div class="rw"><span>'+esc(subj(sid).name)+'</span><span class="tr"><i data-w="'+(b.ok/b.n*100).toFixed(1)+'"></i></span><span class="v num">'+b.ok+'/'+b.n+'</span></div>').join('')+'</div></div>'+
      '<div class="rv" style="margin-top:24px"><div class="sec">次に会う日（これから14日）</div><div class="cal">'+cal+'</div><div class="calx">'+calx+'</div>'+
        '<div class="calleg"><span><i style="background:var(--gold)"></i>定着（間隔が伸びた）</span><span><i style="background:var(--copper)"></i>もう一度</span></div></div>'+
    '</div></div>';
  const res=$('.res');
  // 演出：目盛りが元の灰で一周灯る → 正解の目盛りが順に金に変わり、金の弧が伸びる → 数字が数え上がる → グラフが伸びる
  lightTicks(res, 200, 30);
  $$('.tk',res).forEach(t=>t.setAttribute('class','tk stable'));
  let lit=0; const arc=$('.arc',res);
  ITEMS.forEach((it,k)=>{ const o=R.res[it.uid]; if(!o) return; later(()=>{ const tk=$('[data-u="'+it.uid+'"]',res); tk.setAttribute('class','tk '+o); if(o==='ok'){ lit++; arc.setAttribute('stroke-dasharray', f1(lit/R.n*100)+' 100'); } }, 1300+k*45); });
  arc.style.transition='stroke-dasharray .5s cubic-bezier(.16,1,.3,1)';
  later(()=>countUp($('#rP',res), R.pct, 1600), 1300);
  later(()=>countUp($('#rOk',res), R.ok, 1400), 1500);
  reveal(res, 400, 200);
  later(()=>$$('.rows .tr i',res).forEach((i,k)=>later(()=>i.style.width=i.dataset.w+'%', k*120)), 2200);
  later(()=>$$('.cal .d i',res).forEach((i,k)=>anim(i,[{transform:'scaleY(0)'},{transform:'scaleY(1)'}],{duration:900,delay:k*50})), 2500);
}

function clearLayers(){ clearTimers(); document.querySelectorAll('.ov,.hud,.whisper,.spark').forEach(e=>e.remove()); }
function setStage(s){ stage=s; $$('#stages button[data-s]').forEach(b=>b.classList.toggle('on',b.dataset.s===s));
  if(s==='brief') showBrief(); else if(s==='run') showRun(); else showRes(); }
$$('#stages button[data-s]').forEach(b=>b.onclick=()=>{ reset(); setStage(b.dataset.s); });
$('#replay').onclick=()=>{ if(stage==='run'){ reset(); } setStage(stage); };
setStage('brief');
</script>
</body>
</html>
