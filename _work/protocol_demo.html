<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>定着プロトコルの5案</title>
<!--
  SRS復習（2026-09-30 に「定着プロトコル」へ改名）の見せ方を、ward.js の「病棟回診」から作り直す案を5つ並べて
  見比べるページ。本物の関数は呼ばず、このページの中だけで再生する（何も保存しない）。
  2026-09-30 第2版：第1版の5案（暗い箱＋ネオン＋絵文字＋数字の箱3つ）は「おしゃれじゃない」と却下された。
    第1版は5案とも同じ骨組みの色違いだったので、第2版は骨組みから変えてある：
      1 朝刊（明朝の大きな数字と文章・罫線）／2 スイス（棒グラフのポスター）／3 余白（数字と一文だけ）
      4 計器（丸い目盛りの製品ラベル）／5 時間軸（遅れの日数と、次に会う日のカレンダー）
    共通の約束：アクセントは1色／絵文字・光彩・グラデーションを使わない／言葉は普通の日本語／
    フォントは端末に入っているものだけ（ヒラギノ・游・Helvetica。オフラインで崩れない）。
  どの案も ward.js と同じ3枚（開始前・解答中の画面下のボード・結果）で、材料も同じ
  （状態3段＝ward.js の severityOf、正解／誤答）。SRS の採点と出題順は変えない。
  ⚠️ 画面下のボードは表示だけ（pointer-events:none）／infinite のアニメなし／新しい localStorage キーなし。
  テストの対象ではない。
-->
<style>
  /* ════════ 見比べるための外枠（中身の意匠ではない） ════════ */
  :root{
    --h-paper:oklch(97% 0.004 250);--h-ink:oklch(22% 0.01 260);--h-sub:oklch(50% 0.01 260);--h-rule:oklch(88% 0.006 260);--h-on:oklch(22% 0.01 260);
    --sans:"Hiragino Sans","Hiragino Kaku Gothic ProN","Yu Gothic UI","Yu Gothic","YuGothic","Meiryo",system-ui,sans-serif;
    --serif:"Hiragino Mincho ProN","Yu Mincho","YuMincho","Noto Serif JP","HGS明朝E",serif;
    --grotesk:"Helvetica Neue",Helvetica,Arial,"Hiragino Sans","Yu Gothic",sans-serif;
    --ease-out:cubic-bezier(.16,1,.3,1);
  }
  *{box-sizing:border-box;}
  html,body{margin:0;overflow-x:clip;}
  body{min-height:100vh;padding:20px 16px 160px;background:var(--h-paper);color:var(--h-ink);font-family:var(--sans);}
  .harness{max-width:880px;margin:0 auto;}
  .harness h1{font-size:15px;font-weight:700;margin:0 0 4px;letter-spacing:.02em;}
  .harness p{font-size:12.5px;line-height:1.7;color:var(--h-sub);margin:0 0 16px;}
  .plans{display:flex;flex-wrap:wrap;gap:0;border-top:1px solid var(--h-rule);border-bottom:1px solid var(--h-rule);margin-bottom:12px;}
  .plans button{flex:1 1 160px;padding:12px 10px;border:0;border-right:1px solid var(--h-rule);background:none;color:var(--h-sub);font:inherit;text-align:left;cursor:pointer;}
  .plans button:last-child{border-right:0;}
  .plans button b{display:block;font-size:14px;color:var(--h-ink);}
  .plans button small{font-size:11.5px;line-height:1.5;}
  .plans button.on{background:var(--h-ink);color:oklch(85% 0.01 260);}
  .plans button.on b{color:var(--h-paper);}
  .stages{display:flex;gap:6px;margin-bottom:16px;}
  .stages button{padding:8px 14px;border-radius:99px;border:1px solid var(--h-rule);background:none;color:var(--h-ink);font:inherit;font-size:13px;cursor:pointer;white-space:nowrap;}
  .stages button.on{background:var(--h-on);border-color:var(--h-on);color:var(--h-paper);}
  .hint{font-size:12px;color:var(--h-sub);line-height:1.7;margin:8px 0;}
  .mockq{border:1px solid var(--h-rule);border-radius:12px;padding:14px 16px;background:oklch(99% 0.002 250);}
  .mockq .qn{font-size:12.5px;font-weight:700;color:var(--h-sub);margin-bottom:6px;}
  .mockq .qt{font-size:14px;line-height:1.8;}
  .mockq .ch{font-size:13.5px;padding:8px 10px;border:1px solid var(--h-rule);border-radius:8px;margin-top:6px;color:var(--h-sub);}
  .sim{display:flex;flex-wrap:wrap;gap:6px;margin:10px 0;}
  .sim button{flex:1 1 110px;padding:10px;border-radius:8px;border:1px solid var(--h-rule);background:oklch(99% 0.002 250);color:var(--h-ink);font:inherit;font-size:13px;font-weight:700;cursor:pointer;white-space:nowrap;}
  .sim .ok{border-color:oklch(60% 0.12 160);color:oklch(40% 0.1 160);}
  .sim .ng{border-color:oklch(62% 0.15 25);color:oklch(48% 0.15 25);}
  .sumwrap{border:1px solid var(--h-rule);border-radius:12px;padding:12px;background:oklch(99% 0.002 250);}
  .sumwrap .fake{font-size:12px;color:var(--h-sub);padding:8px 10px;border:1px dashed var(--h-rule);border-radius:8px;margin-bottom:12px;line-height:1.6;}

  /* ════════ 共通の骨組み ════════ */
  .ov{position:fixed;inset:0;z-index:9500;display:flex;align-items:center;justify-content:center;padding:16px;animation:fadeIn .2s var(--ease-out) both;}
  .ov .box{width:min(560px,100%);max-height:100%;overflow-y:auto;animation:rise .4s var(--ease-out) both;}
  .hud{position:fixed;left:50%;bottom:calc(10px + env(safe-area-inset-bottom));translate:-50% 0;z-index:8000;width:min(600px,calc(100% - 20px));
    pointer-events:none;transition:opacity .3s var(--ease-out),translate .45s var(--ease-out);}
  .hud.hide{opacity:0;translate:-50% 120%;}
  .pop{position:fixed;z-index:8001;pointer-events:none;white-space:nowrap;translate:-50% 0;animation:pop 1s var(--ease-out) forwards;}
  @keyframes pop{0%{opacity:0;transform:translateY(6px)}20%{opacity:1;transform:translateY(0)}70%{opacity:1}100%{opacity:0;transform:translateY(-14px)}}
  @keyframes fadeIn{from{opacity:0}to{opacity:1}}
  @keyframes rise{from{opacity:0;translate:0 10px}to{opacity:1;translate:0 0}}
  @media (prefers-reduced-motion:reduce){.ov,.ov .box,.pop,.hud{animation-duration:.01s!important;transition-duration:.01s!important;}}
  .num{font-variant-numeric:tabular-nums;}
  button:focus-visible{outline:2px solid currentColor;outline-offset:3px;}

  /* ════════ 1 朝刊 ════════ */
  .p1{--paper:oklch(96.5% 0.012 85);--paper-2:oklch(93% 0.014 85);--ink:oklch(21% 0.012 60);--muted:oklch(46% 0.012 70);--rule:oklch(78% 0.012 80);--accent:oklch(55% 0.18 33);}
  .p1.ov{background:oklch(21% 0.012 60 / .45);}
  .p1 .box{background:var(--paper);color:var(--ink);padding:22px 22px 18px;box-shadow:0 24px 60px oklch(15% 0.01 60 / .35);}
  .p1 .mast{display:flex;justify-content:space-between;align-items:baseline;gap:12px;padding-bottom:8px;border-bottom:3px double var(--ink);font-family:var(--serif);}
  .p1 .mast b{font-size:17px;letter-spacing:.2em;font-weight:700;white-space:nowrap;}
  .p1 .mast span{font-size:12px;color:var(--muted);white-space:nowrap;}
  .p1 .lead{display:grid;grid-template-columns:auto minmax(0,1fr);gap:18px;align-items:end;padding:18px 0 16px;border-bottom:1px solid var(--rule);}
  .p1 .big{font-family:var(--serif);font-size:88px;line-height:.82;font-weight:600;letter-spacing:-.04em;}
  .p1 .big small{font-size:18px;letter-spacing:0;margin-left:4px;font-weight:600;}
  .p1 .lead p{margin:0;font-family:var(--serif);font-size:15px;line-height:1.85;}
  .p1 .lead p em{font-style:normal;color:var(--accent);font-weight:700;}
  .p1 .idx{margin:10px 0 0;padding:0;list-style:none;}
  .p1 .idx li{display:grid;grid-template-columns:auto minmax(0,1fr) auto;align-items:center;gap:10px;padding:7px 0;border-bottom:1px solid var(--paper-2);font-size:13.5px;}
  .p1 .idx .ticks{display:flex;gap:3px;justify-content:flex-end;}
  .p1 .t{display:block;width:2px;height:12px;background:var(--rule);transition:background .3s,height .3s;}
  .p1 .t.crit{background:var(--accent);height:14px;}
  .p1 .t.warn{background:var(--ink);}
  .p1 .idx .n{font-family:var(--serif);font-size:15px;min-width:1.6em;text-align:right;}
  .p1 .foot{font-size:12px;color:var(--muted);line-height:1.7;margin:14px 0 0;}
  .p1 .btns{display:flex;align-items:center;gap:18px;margin-top:18px;}
  .p1 .back{background:none;border:0;padding:0;font:inherit;font-size:13px;color:var(--muted);text-decoration:underline;text-underline-offset:3px;cursor:pointer;white-space:nowrap;}
  .p1 .go{flex:1;padding:14px;border:0;background:var(--ink);color:var(--paper);font-family:var(--serif);font-size:16px;letter-spacing:.3em;cursor:pointer;white-space:nowrap;}
  .p1 .go:hover{background:var(--accent);}
  .p1.hud{background:var(--paper);color:var(--ink);border-top:2px solid var(--ink);padding:9px 14px 10px;box-shadow:0 10px 30px oklch(15% 0.01 60 / .25);}
  .p1.hud .row{display:flex;align-items:baseline;gap:12px;white-space:nowrap;}
  .p1.hud .ttl{font-family:var(--serif);font-size:12px;letter-spacing:.2em;font-weight:700;}
  .p1.hud .cnt{margin-left:auto;font-size:12px;color:var(--muted);overflow:hidden;text-overflow:ellipsis;}
  .p1.hud .cnt b{font-family:var(--serif);font-size:18px;color:var(--ink);font-weight:600;}
  .p1.hud .cnt .ng{color:var(--accent);}
  .p1.hud .ticks{display:flex;gap:3px;margin-top:6px;align-items:flex-end;height:14px;}
  .p1.hud .t{flex:1;max-width:6px;height:8px;}
  .p1.hud .t.now{height:14px;background:var(--ink);}
  .p1.hud .t.ok{background:var(--ink);height:12px;}
  .p1.hud .t.ng{background:var(--accent);height:12px;}
  .p1.pop{font-family:var(--serif);font-size:15px;font-weight:700;padding:4px 12px;background:var(--paper);border:1px solid currentColor;}
  .p1.pop.ok{color:var(--ink);}.p1.pop.ng{color:var(--accent);}
  .p1.res{background:var(--paper);color:var(--ink);padding:20px 20px 16px;}
  .p1.res .mast{margin-bottom:14px;}
  .p1.res h3{font-family:var(--serif);font-size:24px;line-height:1.5;font-weight:600;margin:0 0 8px;}
  .p1.res h3 .num{font-size:34px;}
  .p1.res .sub{font-family:var(--serif);font-size:14px;line-height:1.9;margin:0 0 14px;color:var(--muted);}
  .p1.res .sub em{font-style:normal;color:var(--accent);font-weight:700;}
  .p1.res table{width:100%;border-collapse:collapse;font-size:13px;}
  .p1.res th{font-weight:400;color:var(--muted);font-size:11.5px;text-align:right;padding:4px 0;border-bottom:1px solid var(--ink);}
  .p1.res th:first-child{text-align:left;}
  .p1.res td{padding:7px 0;border-bottom:1px solid var(--paper-2);text-align:right;}
  .p1.res td:first-child{text-align:left;}
  .p1.res td .num{font-family:var(--serif);font-size:15px;}
  .p1.res td.ng .num{color:var(--accent);}

  /* ════════ 2 スイス ════════ */
  .p2{--paper:oklch(97.5% 0.003 250);--ink:oklch(17% 0.008 260);--muted:oklch(48% 0.008 260);--rule:oklch(86% 0.004 260);--pend:oklch(80% 0.004 260);--accent:oklch(58% 0.22 27);}
  .p2.ov{background:oklch(17% 0.008 260 / .5);}
  .p2 .box{background:var(--paper);color:var(--ink);padding:0;font-family:var(--grotesk);}
  .p2 .hd{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:12px;padding:20px 20px 0;}
  .p2 .hd h3{margin:0;font-size:30px;line-height:1.1;font-weight:700;letter-spacing:-.01em;}
  .p2 .hd .sq{width:14px;height:14px;background:var(--accent);margin-top:8px;}
  .p2 .hd .d{grid-column:1/-1;font-size:12px;color:var(--muted);margin-top:-4px;}
  .p2 .fig{padding:22px 20px 8px;}
  .p2 .bars{display:flex;align-items:flex-end;gap:2px;height:96px;}
  .p2 .grp{display:flex;flex-direction:column;justify-content:flex-end;min-width:0;}
  .p2 .grp .b{display:flex;align-items:flex-end;gap:2px;height:80px;}
  .p2 .grp + .grp{margin-left:8px;}
  .p2 .bar{display:block;width:8px;background:var(--pend);transition:background .3s;}
  .p2 .bar.crit{background:var(--accent);}
  .p2 .bar.warn{background:var(--ink);}
  .p2 .bar.stable{background:var(--pend);}
  .p2 .grp .lb{font-size:11px;font-weight:700;margin-top:6px;white-space:nowrap;border-top:1px solid var(--ink);padding-top:4px;}
  .p2 .grp .lb span{font-weight:400;color:var(--muted);margin-left:3px;}
  .p2 .legend{display:flex;flex-wrap:wrap;gap:4px 14px;font-size:11px;color:var(--muted);padding:14px 20px 0;}
  .p2 .legend i{display:inline-block;width:8px;height:8px;margin-right:5px;}
  .p2 .stmt{padding:18px 20px 0;font-size:15px;font-weight:700;line-height:1.6;}
  .p2 .btns{display:grid;grid-template-columns:auto minmax(0,1fr);margin-top:20px;border-top:1px solid var(--ink);}
  .p2 .back{padding:16px 20px;border:0;border-right:1px solid var(--ink);background:none;font:inherit;font-size:13px;color:var(--ink);cursor:pointer;white-space:nowrap;}
  .p2 .go{padding:16px 20px;border:0;background:var(--ink);color:var(--paper);font:inherit;font-size:16px;font-weight:700;text-align:left;display:flex;justify-content:space-between;cursor:pointer;white-space:nowrap;}
  .p2 .go:hover{background:var(--accent);}
  .p2.hud{background:var(--paper);color:var(--ink);font-family:var(--grotesk);display:grid;grid-template-columns:auto minmax(0,1fr);gap:14px;align-items:end;padding:10px 14px;border:1px solid var(--ink);}
  .p2.hud .k{font-size:34px;font-weight:700;line-height:.9;letter-spacing:-.02em;white-space:nowrap;}
  .p2.hud .k small{font-size:13px;font-weight:400;color:var(--muted);letter-spacing:0;margin-left:2px;}
  .p2.hud .r .cnt{font-size:11px;color:var(--muted);text-align:right;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .p2.hud .r .cnt b{color:var(--ink);}
  .p2.hud .r .cnt .ng{color:var(--accent);}
  .p2.hud .bars{display:flex;align-items:flex-end;gap:2px;height:28px;margin-top:4px;}
  .p2.hud .bar{flex:1;width:auto;max-width:8px;}
  .p2.hud .bar.crit,.p2.hud .bar.warn,.p2.hud .bar.stable{background:var(--pend);}
  .p2.hud .bar.now{background:var(--muted);}
  .p2.hud .bar.ok{background:var(--ink);}
  .p2.hud .bar.ng{background:var(--accent);}
  .p2.pop{font-family:var(--grotesk);font-size:13px;font-weight:700;padding:5px 10px;color:var(--paper);}
  .p2.pop.ok{background:var(--ink);}.p2.pop.ng{background:var(--accent);}
  .p2.res{background:var(--paper);color:var(--ink);font-family:var(--grotesk);}
  .p2.res .top{display:grid;grid-template-columns:minmax(0,1fr) auto;align-items:end;gap:12px;padding:20px 20px 16px;border-bottom:1px solid var(--ink);}
  .p2.res .pct{font-size:84px;line-height:.85;font-weight:700;letter-spacing:-.04em;}
  .p2.res .pct small{font-size:28px;}
  .p2.res .top .lb{font-size:12px;color:var(--muted);margin-top:8px;}
  .p2.res .top .sq{width:14px;height:14px;background:var(--accent);align-self:start;}
  .p2.res .cols{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));border-bottom:1px solid var(--ink);}
  .p2.res .cols div{padding:12px 10px 12px 20px;border-right:1px solid var(--rule);min-width:0;}
  .p2.res .cols div:last-child{border-right:0;}
  .p2.res .cols b{display:block;font-size:26px;font-weight:700;line-height:1.1;}
  .p2.res .cols span{font-size:11px;color:var(--muted);}
  .p2.res .cols .ng b{color:var(--accent);}
  .p2.res .rows{padding:12px 20px 18px;}
  .p2.res .rw{display:grid;grid-template-columns:5.5em minmax(0,1fr) 3.5em;gap:10px;align-items:center;font-size:12.5px;padding:5px 0;}
  .p2.res .rw .tr{display:flex;height:10px;background:var(--rule);}
  .p2.res .rw .tr i{display:block;height:100%;background:var(--ink);}
  .p2.res .rw .v{text-align:right;}

  /* ════════ 3 余白 ════════ */
  .p3{--paper:oklch(18% 0.008 70);--ink:oklch(93% 0.012 85);--muted:oklch(66% 0.012 80);--rule:oklch(34% 0.01 75);--accent:oklch(80% 0.075 82);}
  .p3.ov{background:oklch(12% 0.006 70 / .7);}
  .p3 .box{background:var(--paper);color:var(--ink);padding:44px 28px 30px;text-align:center;}
  .p3 .eye{font-family:var(--grotesk);font-size:10px;letter-spacing:.42em;text-indent:.42em;color:var(--accent);}
  .p3 .big{font-family:var(--serif);font-weight:300;font-size:112px;line-height:1;margin:22px 0 4px;letter-spacing:-.02em;}
  .p3 .line1{font-family:var(--serif);font-size:16px;line-height:2;margin:0;}
  .p3 .hair{width:40px;height:1px;background:var(--accent);margin:26px auto;}
  .p3 .quiet{font-size:12.5px;line-height:2;color:var(--muted);margin:0;}
  .p3 .quiet b{color:var(--ink);font-weight:400;}
  .p3 .go{display:block;width:min(280px,100%);margin:34px auto 0;padding:14px;background:none;border:1px solid var(--accent);color:var(--accent);font-family:var(--serif);font-size:15px;letter-spacing:.5em;text-indent:.5em;cursor:pointer;white-space:nowrap;transition:background .25s var(--ease-out),color .25s var(--ease-out);}
  .p3 .go:hover{background:var(--accent);color:var(--paper);}
  .p3 .back{display:inline-block;margin-top:14px;background:none;border:0;padding:4px;font:inherit;font-size:12px;color:var(--muted);cursor:pointer;white-space:nowrap;}
  .p3.hud{color:var(--ink);padding:9px 16px 12px;background:oklch(18% 0.008 70 / .94);box-shadow:0 10px 30px oklch(10% 0.006 70 / .35);}
  .p3.hud .row{display:flex;justify-content:space-between;align-items:baseline;font-family:var(--serif);font-size:12px;color:var(--muted);text-shadow:0 1px 6px oklch(10% 0.006 70 / .9);}
  .p3.hud .row b{font-size:17px;font-weight:300;color:var(--ink);}
  .p3.hud .ln{position:relative;height:1px;margin-top:6px;background:oklch(60% 0.01 80 / .45);}
  .p3.hud .ln i{position:absolute;inset:0 auto 0 0;background:var(--accent);transition:width .6s var(--ease-out);}
  .p3.hud .ln em{position:absolute;top:-2px;width:5px;height:5px;border-radius:50%;background:var(--accent);translate:-50% 0;transition:left .6s var(--ease-out);}
  .p3.pop{font-family:var(--serif);font-size:14px;color:var(--accent);letter-spacing:.2em;text-shadow:0 1px 8px oklch(10% 0.006 70 / .9);}
  .p3.pop.ng{color:var(--muted);}
  .p3.res{background:var(--paper);color:var(--ink);padding:40px 24px 28px;text-align:center;}
  .p3.res .big{color:var(--accent);margin-top:18px;}
  .p3.res .trio{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));margin-top:6px;}
  .p3.res .trio div{padding:0 6px;}
  .p3.res .trio div + div{border-left:1px solid var(--rule);}
  .p3.res .trio b{display:block;font-family:var(--serif);font-weight:300;font-size:28px;}
  .p3.res .trio span{font-size:11px;color:var(--muted);line-height:1.6;display:block;}
  .p3.res .subj{margin-top:26px;font-size:12px;line-height:2.1;color:var(--muted);}
  .p3.res .subj b{color:var(--ink);font-weight:400;}

  /* ════════ 4 計器 ════════ */
  .p4{--paper:oklch(91% 0.006 90);--panel:oklch(96% 0.004 90);--ink:oklch(26% 0.006 90);--muted:oklch(52% 0.006 90);--rule:oklch(84% 0.006 90);--tick:oklch(76% 0.006 90);--accent:oklch(67% 0.18 48);--accent-deep:oklch(52% 0.15 45);}
  .p4.ov{background:oklch(26% 0.006 90 / .45);}
  .p4 .box{background:var(--paper);color:var(--ink);padding:18px;border-radius:22px;font-family:var(--grotesk);box-shadow:0 20px 50px oklch(20% 0.006 90 / .3);}
  .p4 .panel{background:var(--panel);border-radius:14px;padding:16px;box-shadow:inset 0 1px 0 oklch(99% 0.002 90),0 1px 2px oklch(40% 0.006 90 / .15);}
  .p4 .head{display:flex;justify-content:space-between;align-items:baseline;gap:10px;font-size:10.5px;letter-spacing:.14em;color:var(--muted);margin-bottom:10px;}
  .p4 .head b{font-size:15px;letter-spacing:.02em;color:var(--ink);white-space:nowrap;}
  .p4 .head span{white-space:nowrap;}
  .p4 .main{display:grid;grid-template-columns:minmax(0,170px) minmax(0,1fr);gap:18px;align-items:center;}
  .p4 .dial{position:relative;}
  .p4 .dial svg{display:block;width:100%;height:auto;}
  .p4 .dial .c{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;}

  .p4 .tk{stroke:var(--tick);stroke-width:2;stroke-linecap:round;transition:stroke .3s;}
  .p4 .tk.crit{stroke:var(--accent);}
  .p4 .tk.warn{stroke:var(--ink);}
  .p4 .spec{margin:0;display:grid;grid-template-columns:minmax(0,1fr) auto;font-size:12.5px;}
  .p4 .spec dt,.p4 .spec dd{padding:6px 0;border-bottom:1px solid var(--rule);margin:0;}
  .p4 .spec dt{color:var(--muted);}
  .p4 .spec dd{text-align:right;font-weight:700;}
  .p4 .spec .a{color:var(--accent-deep);}
  .p4 .subs{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:1px;background:var(--rule);margin-top:14px;border-radius:8px;overflow:hidden;}
  .p4 .subs div{background:var(--panel);padding:8px 10px;font-size:11.5px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .p4 .subs b{display:block;font-size:17px;color:var(--ink);font-weight:500;}
  .p4 .ctl{display:flex;align-items:center;gap:14px;margin-top:16px;}
  .p4 .go{width:64px;height:64px;flex-shrink:0;border-radius:50%;border:0;background:var(--accent);color:var(--panel);font-size:18px;cursor:pointer;
    box-shadow:0 3px 0 var(--accent-deep),0 6px 14px oklch(55% 0.15 45 / .35);transition:translate .1s,box-shadow .1s;}
  .p4 .go:active{translate:0 2px;box-shadow:0 1px 0 var(--accent-deep);}
  .p4 .ctl .lb{font-size:13px;font-weight:700;white-space:nowrap;}
  .p4 .ctl .lb small{display:block;font-weight:400;color:var(--muted);font-size:11.5px;margin-top:2px;}
  .p4 .back{margin-left:auto;background:none;border:1px solid var(--tick);border-radius:99px;padding:8px 14px;font:inherit;font-size:12px;color:var(--muted);cursor:pointer;white-space:nowrap;}
  .p4.hud{background:var(--panel);color:var(--ink);font-family:var(--grotesk);border-radius:16px;padding:8px 14px 8px 8px;display:flex;align-items:center;gap:12px;
    box-shadow:0 10px 26px oklch(20% 0.006 90 / .25),inset 0 1px 0 oklch(99% 0.002 90);}
  .p4.hud svg{width:52px;height:52px;flex-shrink:0;}
  .p4.hud .tk{stroke-width:2.4;}
  .p4.hud .tk.crit,.p4.hud .tk.warn,.p4.hud .tk.stable{stroke:var(--tick);}
  .p4.hud .tk.now{stroke:var(--muted);}
  .p4.hud .tk.ok{stroke:var(--ink);}
  .p4.hud .tk.ng{stroke:var(--accent);}
  .p4.hud .k{font-size:22px;font-weight:300;letter-spacing:-.01em;white-space:nowrap;}
  .p4.hud .k small{font-size:12px;color:var(--muted);}
  .p4.hud .cnt{margin-left:auto;font-size:11.5px;color:var(--muted);text-align:right;line-height:1.5;white-space:nowrap;}
  .p4.hud .cnt b{color:var(--ink);font-size:13px;}
  .p4.hud .cnt .ng{color:var(--accent-deep);}
  .p4.pop{font-family:var(--grotesk);font-size:12px;font-weight:700;letter-spacing:.08em;padding:5px 11px;border-radius:99px;background:var(--panel);box-shadow:0 4px 10px oklch(20% 0.006 90 / .2);}
  .p4.pop.ok{color:var(--ink);}.p4.pop.ng{color:var(--accent-deep);}
  .p4.res{background:var(--paper);color:var(--ink);font-family:var(--grotesk);padding:16px;border-radius:20px;}

  /* ════════ 5 時間軸 ════════ */
  .p5{--paper:oklch(98.5% 0.004 240);--paper-2:oklch(95.5% 0.008 240);--ink:oklch(23% 0.02 255);--muted:oklch(50% 0.015 255);--rule:oklch(89% 0.008 245);--dot:oklch(72% 0.02 250);--accent:oklch(50% 0.17 262);}
  .p5.ov{background:oklch(23% 0.02 255 / .4);}
  .p5 .box{background:var(--paper);color:var(--ink);padding:22px 20px 18px;border-radius:16px;box-shadow:0 20px 50px oklch(23% 0.02 255 / .25);}
  .p5 h3{margin:0;font-size:20px;font-weight:700;}
  .p5 .d{font-size:12px;color:var(--muted);margin-top:2px;}
  .p5 .chart{margin-top:18px;}
  .p5 .cap{display:flex;justify-content:space-between;font-size:11px;color:var(--muted);margin-bottom:6px;}
  .p5 .cols{display:grid;grid-template-columns:repeat(9,minmax(0,1fr));gap:4px;align-items:end;min-height:120px;border-bottom:1px solid var(--ink);padding-bottom:4px;}
  .p5 .col{display:flex;flex-direction:column-reverse;align-items:center;gap:3px;}
  .p5 .dt{width:9px;height:9px;border-radius:50%;background:var(--dot);transition:background .3s,scale .3s;}
  .p5 .dt.crit{background:var(--accent);}
  .p5 .axis{display:grid;grid-template-columns:repeat(9,minmax(0,1fr));gap:4px;font-size:10.5px;color:var(--muted);text-align:center;margin-top:4px;}
  .p5 .axis span:first-child{color:var(--ink);font-weight:700;}
  .p5 .note{font-size:13px;line-height:1.75;margin:16px 0 0;}
  .p5 .note b{color:var(--accent);}
  .p5 .subj{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:12px;color:var(--muted);margin-top:10px;}
  .p5 .subj b{color:var(--ink);font-weight:700;margin-left:3px;}
  .p5 .btns{display:flex;gap:10px;margin-top:18px;}
  .p5 .back{padding:12px 16px;border-radius:10px;border:1px solid var(--rule);background:none;font:inherit;font-size:13px;color:var(--muted);cursor:pointer;white-space:nowrap;}
  .p5 .go{flex:1;padding:12px;border-radius:10px;border:0;background:var(--accent);color:var(--paper);font:inherit;font-size:15px;font-weight:700;cursor:pointer;white-space:nowrap;}
  .p5.hud{background:var(--paper);color:var(--ink);border:1px solid var(--rule);border-radius:14px;padding:9px 14px 11px;box-shadow:0 10px 26px oklch(23% 0.02 255 / .18);}
  .p5.hud .row{display:flex;align-items:baseline;gap:10px;font-size:12px;white-space:nowrap;}
  .p5.hud .row .k{font-weight:700;font-size:14px;}
  .p5.hud .row .cnt{margin-left:auto;color:var(--muted);overflow:hidden;text-overflow:ellipsis;}
  .p5.hud .row .cnt b{color:var(--ink);}
  .p5.hud .dots{display:flex;flex-wrap:wrap;gap:4px;margin-top:7px;}
  .p5.hud .dt{width:8px;height:8px;background:var(--rule);}
  .p5.hud .dt.crit{background:var(--rule);box-shadow:inset 0 0 0 1.5px var(--accent);}
  .p5.hud .dt.now{scale:1.4;background:var(--dot);}
  .p5.hud .dt.ok{background:var(--accent);box-shadow:none;}
  .p5.hud .dt.ng{background:var(--ink);box-shadow:none;}
  .p5.pop{font-size:12.5px;font-weight:700;padding:5px 11px;border-radius:8px;background:var(--paper);border:1px solid var(--rule);box-shadow:0 4px 12px oklch(23% 0.02 255 / .15);}
  .p5.pop.ok{color:var(--accent);}.p5.pop.ng{color:var(--ink);}
  .p5.res{background:var(--paper);color:var(--ink);padding:20px 18px;border-radius:14px;}
  .p5.res h3 .num{color:var(--accent);}
  .p5.res .cal{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:4px;margin-top:10px;}
  .p5.res .day{border-radius:8px;background:var(--paper-2);padding:6px 3px 7px;text-align:center;min-height:62px;min-width:0;}
  .p5.res .day .dn{font-size:10.5px;color:var(--muted);white-space:nowrap;}
  .p5.res .day .dn.wk{color:var(--ink);font-weight:700;}
  .p5.res .day .dd{display:flex;flex-wrap:wrap;justify-content:center;gap:2px;margin-top:5px;}
  .p5.res .day .dd i{width:5px;height:5px;border-radius:50%;background:var(--accent);}
  .p5.res .day .dd i.ng{background:var(--ink);}
  .p5.res .day .c{font-size:11px;font-weight:700;margin-top:3px;}
  .p5.res .day.today{background:none;box-shadow:inset 0 0 0 1px var(--rule);}
  .p5.res .later{font-size:12px;color:var(--muted);margin-top:8px;text-align:right;}
  .p5.res .leg{display:flex;flex-wrap:wrap;gap:4px 14px;font-size:11px;color:var(--muted);margin-top:12px;}
  .p5.res .leg i{display:inline-block;width:7px;height:7px;border-radius:50%;margin-right:5px;background:var(--accent);}
  .p5.res .leg i.ng{background:var(--ink);}
</style>

<body>
<div class="harness">
  <h1>定着プロトコル — 見せ方の5案（第2版）</h1>
  <p>今の「病棟回診」を置き換える案です。どれも3枚（① 開始前の画面・② 解答中の画面下のボード・③ 結果画面）で、材料（遅れ具合の3段・正解／誤答）と SRS の採点・出題順は今と同じです。<br>
  案を選び、①〜③を切り替えてください。②では「正解」「誤答」でボードが動きます（ボードは表示だけで押せません）。</p>
  <div class="plans" id="plans"></div>
  <div class="stages" id="stages">
    <button data-s="brief">① 開始前</button><button data-s="run">② 解答中</button><button data-s="res">③ 結果</button>
  </div>
  <div id="stage"></div>
</div>

<script>
'use strict';
// ── 見本のデータ（決定論。本物の SRS は読まない） ─────────────────────
const SUBJ = [
  { id:'resp', name:'呼吸器' }, { id:'circ', name:'循環器' }, { id:'neur', name:'神経' },
  { id:'endo', name:'内分泌' }, { id:'dige', name:'消化器' }, { id:'hema', name:'血液' },
];
function hash(s){ let h=2166136261; for(let i=0;i<s.length;i++){ h^=s.charCodeAt(i); h=Math.imul(h,16777619);} return h>>>0; }
const ITEMS = (() => {
  const per = { resp:8, circ:7, neur:6, endo:4, dige:3, hema:2 };
  const out = [];
  SUBJ.forEach(s => { for (let i=0;i<per[s.id];i++){
    const uid = s.id+'_ch0'+(1+i%3)+'_q'+(11+i*7);
    const h = hash(uid);
    const sev = h%10<2 ? 'crit' : h%10<7 ? 'warn' : 'stable';
    // 遅れの日数（ward.js の severityOf と矛盾しない範囲で）
    const late = sev==='crit' ? 7+(h>>>4)%6 : sev==='warn' ? 1+(h>>>4)%6 : 0;
    out.push({ uid, sid:s.id, sev, late, h });
  }});
  return out.sort((a,b)=>b.late-a.late || a.h-b.h);   // 本物は _srsUrgency の降順
})();
const SEV = { crit:'大きく遅れ', warn:'遅れ', stable:'予定どおり' };
const OUT = { ok:'定着', ng:'もう一度' };
function autoOk(it){ return (it.h>>>8)%100 < (it.sev==='crit'?55:it.sev==='warn'?72:88); }
function nextDays(it){ return it.sev==='crit'?3:it.sev==='warn'?6+(it.h%3):9+(it.h%6); }
const subj = id => SUBJ.find(s=>s.id===id);
const esc = s => String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
function counts(){ const c={crit:0,warn:0,stable:0}; ITEMS.forEach(i=>c[i.sev]++); return c; }
function groups(){ const m=new Map(); ITEMS.forEach(i=>{ if(!m.has(i.sid)) m.set(i.sid,[]); m.get(i.sid).push(i); }); return [...m.entries()].map(([sid,pts])=>({sid,pts})).sort((a,b)=>b.pts.length-a.pts.length); }
const JD = () => new Date(Date.now()+9*3600000);
function dateStr(d){ d=d||JD(); return (d.getUTCMonth()+1)+'月'+d.getUTCDate()+'日（'+'日月火水木金土'[d.getUTCDay()]+'）'; }
const N = ITEMS.length;

// ── 状態 ───────────────────────────────────────────────────────────
let plan = '1', stage = 'brief', S;
function reset(){ S = { recs:[], i:0 }; }
reset();
const nowUid = () => S.i < N ? ITEMS[S.i].uid : null;
const outN = k => S.recs.filter(r=>r.o===k).length;

function report(){
  const recs = S.recs.length ? S.recs : ITEMS.map(it=>({ uid:it.uid, o:autoOk(it)?'ok':'ng' }));
  const res = {}; recs.forEach(r=>res[r.uid]=r.o);
  const done = ITEMS.filter(i=>res[i.uid]);
  const byG = new Map();
  done.forEach(i=>{ if(!byG.has(i.sid)) byG.set(i.sid,{ok:0,ng:0,n:0}); const b=byG.get(i.sid); b[res[i.uid]]++; b.n++; });
  const crit = done.filter(i=>i.sev==='crit'), critOk = crit.filter(i=>res[i.uid]==='ok').length;
  const nx = done.filter(i=>res[i.uid]==='ok').map(nextDays).sort((a,b)=>a-b);
  const cal = {}; done.forEach(i=>{ const d = res[i.uid]==='ok' ? nextDays(i) : 1; (cal[d]=cal[d]||{ok:0,ng:0})[res[i.uid]]++; });
  const ok = done.filter(i=>res[i.uid]==='ok').length;
  return { res, done, n:done.length, ok, ng:done.length-ok, pct:Math.round(ok/Math.max(1,done.length)*100),
    grp:[...byG.entries()].sort((a,b)=>b[1].n-a[1].n), crit, critOk, med: nx.length ? nx[Math.floor(nx.length/2)] : null, cal };
}

// 丸い目盛り（4 計器）。cls(it) がその目盛りの状態クラスを返す
function dialSvg(size, r1, r2crit, r2, cls){
  const c=size/2;
  return '<svg viewBox="0 0 '+size+' '+size+'">'+ITEMS.map((it,k)=>{ const a=(-90+k*360/N)*Math.PI/180; const R2 = it.sev==='crit'?r2crit:r2;
    return '<line class="tk '+cls(it)+'" data-b="tk '+it.sev+'" data-u="'+esc(it.uid)+'" x1="'+(c+r1*Math.cos(a)).toFixed(1)+'" y1="'+(c+r1*Math.sin(a)).toFixed(1)+'" x2="'+(c+R2*Math.cos(a)).toFixed(1)+'" y2="'+(c+R2*Math.sin(a)).toFixed(1)+'"/>'; }).join('')+'</svg>';
}

// ── 5案 ──────────────────────────────────────────────────────────
const PLANS = {
  '1': { cls:'p1', name:'1 朝刊', desc:'生成りの紙に明朝。大きな数字と一文で伝え、科目は罫線の索引に',
    brief(){ const c=counts();
      return '<div class="mast"><b>定着プロトコル</b><span>'+dateStr()+'</span></div>'+
        '<div class="lead"><div class="big num">'+N+'<small>問</small></div>'+
          '<p>忘れかけている記憶が '+N+'問あります。うち <em>'+c.crit+'問</em> は予定より大きく遅れています。遅れの大きい順に出します。</p></div>'+
        '<ul class="idx">'+groups().map(g=>'<li><span>'+esc(subj(g.sid).name)+'</span><span class="ticks">'+g.pts.map(p=>'<i class="t '+p.sev+'"></i>').join('')+'</span><span class="n num">'+g.pts.length+'</span></li>').join('')+'</ul>'+
        '<p class="foot">朱の線は大きく遅れている問題、黒の線は少し遅れている問題。正解すれば定着、間違えた問題は明日もう一度出ます。</p>'+
        '<div class="btns"><button class="back">あとで</button><button class="go">はじめる</button></div>'; },
    hud(){ return '<div class="row"><span class="ttl">定着プロトコル</span><span class="cnt"></span></div><div class="ticks">'+ITEMS.map(i=>'<i class="t" data-b="t '+i.sev+'" data-u="'+esc(i.uid)+'"></i>').join('')+'</div>'; },
    hudCnt(){ return '<b class="num">'+S.recs.length+'</b> / '+N+'　定着 '+outN('ok')+'　<span class="ng">もう一度 '+outN('ng')+'</span>'; },
    result(R){ return '<div class="mast"><b>定着プロトコル</b><span>'+dateStr()+'</span></div>'+
        '<h3><span class="num">'+R.n+'</span>問のうち <span class="num">'+R.ok+'</span>問が定着しました。</h3>'+
        '<p class="sub">'+(R.crit.length?'大きく遅れていた '+R.crit.length+'問のうち、取り戻したのは '+R.critOk+'問。':'')+
          (R.ng?'<em>'+R.ng+'問</em> は明日もう一度出ます。':'')+(R.med!=null?'定着した問題に次に会うのは、およそ '+R.med+'日後です。':'')+'</p>'+
        '<table><tr><th>科目</th><th>定着</th><th>もう一度</th></tr>'+
        R.grp.map(([sid,b])=>'<tr><td>'+esc(subj(sid).name)+'</td><td><span class="num">'+b.ok+'</span></td><td class="ng"><span class="num">'+b.ng+'</span></td></tr>').join('')+'</table>'; } },

  '2': { cls:'p2', name:'2 スイス', desc:'白地に黒の棒と赤い四角。問題1本ずつの棒グラフのポスター',
    brief(){ const c=counts();
      return '<div class="hd"><h3>定着<br>プロトコル</h3><div class="sq"></div><div class="d">'+dateStr()+' — '+N+'問</div></div>'+
        '<div class="fig"><div class="bars">'+groups().map(g=>'<div class="grp"><div class="b">'+g.pts.map(p=>'<i class="bar '+p.sev+'" style="height:'+(22+Math.min(12,p.late)*4.8)+'px"></i>').join('')+'</div><div class="lb">'+esc(subj(g.sid).name)+'<span>'+g.pts.length+'</span></div></div>').join('')+'</div></div>'+
        '<div class="legend"><span><i style="background:var(--accent)"></i>大きく遅れ '+c.crit+'</span><span><i style="background:var(--ink)"></i>遅れ '+c.warn+'</span><span><i style="background:var(--pend)"></i>予定どおり '+c.stable+'</span><span>棒の高さ＝遅れの日数</span></div>'+
        '<div class="stmt">遅れの大きい順に出題します。</div>'+
        '<div class="btns"><button class="back">あとで</button><button class="go"><span>開始</span><span>→</span></button></div>'; },
    hud(){ return '<div class="k"><span class="kk">0</span><small>/'+N+'</small></div><div class="r"><div class="cnt"></div><div class="bars">'+ITEMS.map(i=>'<i class="bar" data-b="bar '+i.sev+'" data-u="'+esc(i.uid)+'" style="height:'+(8+Math.min(12,i.late)*1.6)+'px"></i>').join('')+'</div></div>'; },
    hudCnt(){ return '定着 <b>'+outN('ok')+'</b>　<span class="ng">もう一度 '+outN('ng')+'</span>'; },
    hudExtra(h){ h.querySelector('.kk').textContent=S.recs.length; },
    cntSel:'.r .cnt',
    result(R){ return '<div class="top"><div><div class="pct num">'+R.pct+'<small>%</small></div><div class="lb">定着率（'+R.n+'問中 '+R.ok+'問）</div></div><div class="sq"></div></div>'+
        '<div class="cols"><div><b class="num">'+R.ok+'</b><span>定着</span></div><div class="ng"><b class="num">'+R.ng+'</b><span>もう一度</span></div><div><b class="num">'+(R.med!=null?R.med+'日':'—')+'</b><span>次に会うまで</span></div></div>'+
        '<div class="rows">'+R.grp.map(([sid,b])=>'<div class="rw"><span>'+esc(subj(sid).name)+'</span><span class="tr"><i style="width:'+(b.ok/b.n*100).toFixed(1)+'%"></i></span><span class="v num">'+b.ok+'/'+b.n+'</span></div>').join('')+'</div>'; } },

  '3': { cls:'p3', name:'3 余白', desc:'墨色に金の細線。大きな数字と一文とボタンだけ。何も足さない',
    brief(){ const c=counts();
      return '<div class="eye">RETENTION PROTOCOL</div>'+
        '<div class="big num">'+N+'</div>'+
        '<p class="line1">の記憶が、いま薄れかけています。</p>'+
        '<div class="hair"></div>'+
        '<p class="quiet">'+groups().map(g=>esc(subj(g.sid).name)+' <b class="num">'+g.pts.length+'</b>').join('　')+'<br>うち <b>'+c.crit+'</b> は、予定より大きく遅れています。</p>'+
        '<button class="go">はじめる</button><button class="back">あとで</button>'; },
    hud(){ return '<div class="row"><span class="cnt"></span><span class="rt"></span></div><div class="ln"><i></i><em></em></div>'; },
    hudCnt(){ return '<b class="num">'+S.recs.length+'</b>　/ '+N; },
    hudExtra(h){ const p=S.recs.length/N*100; h.querySelector('.ln i').style.width=p+'%'; h.querySelector('.ln em').style.left=p+'%';
      h.querySelector('.rt').textContent='定着 '+outN('ok')+'　もう一度 '+outN('ng'); },
    result(R){ return '<div class="eye">RETENTION PROTOCOL</div>'+
        '<div class="big num">'+R.ok+'</div>'+
        '<p class="line1">の記憶を、定着させました。</p>'+
        '<div class="hair"></div>'+
        '<div class="trio"><div><b class="num">'+R.ng+'</b><span>明日もう一度</span></div><div><b class="num">'+R.critOk+'<small style="font-size:14px">/'+R.crit.length+'</small></b><span>大きく遅れていた記憶</span></div><div><b class="num">'+(R.med!=null?R.med:'—')+'</b><span>次に会うまでの日数</span></div></div>'+
        '<p class="subj">'+R.grp.map(([sid,b])=>esc(subj(sid).name)+' <b class="num">'+b.ok+'/'+b.n+'</b>').join('　')+'</p>'; } },

  '4': { cls:'p4', name:'4 計器', desc:'明るい灰の筐体に橙のボタン。丸い目盛りと仕様表の製品ラベル',
    brief(){ const c=counts(); const g=groups();
      return '<div class="panel"><div class="head"><b>定着プロトコル</b><span>'+dateStr()+'</span></div>'+
        '<div class="main"><div class="dial">'+dialSvg(170,64,82,76,it=>it.sev)+'<div class="c"><b class="num">'+N+'</b><span>問</span></div></div>'+
        '<dl class="spec"><dt>科目</dt><dd class="num">'+g.length+'</dd><dt>大きく遅れ</dt><dd class="a num">'+c.crit+'</dd><dt>遅れ</dt><dd class="num">'+c.warn+'</dd><dt>予定どおり</dt><dd class="num">'+c.stable+'</dd></dl></div>'+
        '<div class="subs">'+g.map(x=>'<div><b class="num">'+x.pts.length+'</b>'+esc(subj(x.sid).name)+'</div>').join('')+'</div></div>'+
        '<div class="ctl"><button class="go" aria-label="開始">▶</button><div class="lb">開始<small>遅れの大きい順に出題</small></div><button class="back">あとで</button></div>'; },
    hud(){ return dialSvg(52,17,25,23,()=>'')+'<div class="k"><span class="kk num">0</span><small> / '+N+'</small></div><div class="cnt"></div>'; },
    hudCnt(){ return '定着 <b>'+outN('ok')+'</b><br><span class="ng">もう一度 '+outN('ng')+'</span>'; },
    hudExtra(h){ h.querySelector('.kk').textContent=S.recs.length; },
    result(R){ const res=R.res;
      return '<div class="panel"><div class="head"><b>結果</b><span>'+dateStr()+'</span></div>'+
        '<div class="main"><div class="dial">'+dialSvg(170,64,82,76,it=>res[it.uid]==='ok'?'warn':res[it.uid]==='ng'?'crit':'')+
          '<div class="c"><b class="num">'+R.pct+'<small style="font-size:16px">%</small></b><span>定着率</span></div></div>'+
        '<dl class="spec"><dt>定着</dt><dd class="num">'+R.ok+'</dd><dt>もう一度</dt><dd class="a num">'+R.ng+'</dd><dt>大きく遅れ→定着</dt><dd class="num">'+R.critOk+'/'+R.crit.length+'</dd><dt>次に会うまで</dt><dd class="num">'+(R.med!=null?R.med+'日':'—')+'</dd></dl></div>'+
        '<div class="subs">'+R.grp.map(([sid,b])=>'<div><b class="num">'+b.ok+'/'+b.n+'</b>'+esc(subj(sid).name)+'</div>').join('')+'</div></div>'; } },

  '5': { cls:'p5', name:'5 時間軸', desc:'白と藍。開始前は「何日遅れているか」、結果は「次に会う日」のカレンダー',
    brief(){ const cols=[]; for(let d=0;d<=8;d++) cols.push(ITEMS.filter(i=>d<8?i.late===d:i.late>=8));
      return '<h3>定着プロトコル</h3><div class="d">'+dateStr()+'　'+N+'問</div>'+
        '<div class="chart"><div class="cap"><span>● 1問</span><span>予定日から何日遅れているか</span></div>'+
        '<div class="cols">'+cols.map(c=>'<div class="col">'+c.map(i=>'<i class="dt '+i.sev+'"></i>').join('')+'</div>').join('')+'</div>'+
        '<div class="axis"><span>今日</span>'+[1,2,3,4,5,6,7].map(d=>'<span>'+d+'</span>').join('')+'<span>8+</span></div></div>'+
        '<p class="note">右にある問題ほど、忘れかけています。<b>右から順に</b>出題します。</p>'+
        '<div class="subj">'+groups().map(g=>'<span>'+esc(subj(g.sid).name)+'<b class="num">'+g.pts.length+'</b></span>').join('')+'</div>'+
        '<div class="btns"><button class="back">あとで</button><button class="go">開始</button></div>'; },
    hud(){ return '<div class="row"><span class="k">定着プロトコル</span><span class="cnt"></span></div><div class="dots">'+ITEMS.map(i=>'<i class="dt" data-b="dt '+i.sev+'" data-u="'+esc(i.uid)+'"></i>').join('')+'</div>'; },
    hudCnt(){ return '<b class="num">'+S.recs.length+'</b> / '+N+'　定着 <b>'+outN('ok')+'</b>　もう一度 <b>'+outN('ng')+'</b>'; },
    result(R){ const t=JD(); let cal=''; let later=0;
      Object.keys(R.cal).forEach(k=>{ if(+k>13) later+=R.cal[k].ok+R.cal[k].ng; });
      for(let d=0;d<14;d++){ const x=new Date(t.getTime()+d*86400000); const c=R.cal[d]||{ok:0,ng:0}; const wk=x.getUTCDay()===0||x.getUTCDay()===6;
        cal+='<div class="day'+(d===0?' today':'')+'"><div class="dn'+(wk?' wk':'')+'">'+(d===0?'今日':(x.getUTCMonth()+1)+'/'+x.getUTCDate())+'</div><div class="dd">'+
          '<i></i>'.repeat(c.ok)+'<i class="ng"></i>'.repeat(c.ng)+'</div>'+((c.ok+c.ng)?'<div class="c num">'+(c.ok+c.ng)+'</div>':'')+'</div>'; }
      return '<h3><span class="num">'+R.n+'</span>問のうち <span class="num">'+R.ok+'</span>問が定着</h3><div class="d">それぞれの問題に次に会う日</div>'+
        '<div class="cal">'+cal+'</div>'+(later?'<div class="later">14日以降 '+later+'問</div>':'')+
        '<div class="leg"><span><i></i>定着（間隔が伸びた）</span><span><i class="ng"></i>もう一度（明日）</span></div>'; } },
};

// ── 画面の組み立て ───────────────────────────────────────────────
const P = () => PLANS[plan];
const $stage = () => document.getElementById('stage');
function clearLayers(){ document.querySelectorAll('.ov,.hud,.pop').forEach(e=>e.remove()); }

function showBrief(){
  clearLayers();
  const p=P(), ov=document.createElement('div');
  ov.className='ov '+p.cls; ov.setAttribute('role','dialog'); ov.setAttribute('aria-modal','true');
  ov.innerHTML='<div class="box">'+p.brief()+'</div>';
  document.body.appendChild(ov);
  ov.querySelector('.go').onclick=()=>{ ov.remove(); setStage('run'); };
  ov.querySelector('.back').onclick=()=>ov.remove();
  ov.addEventListener('click',e=>{ if(e.target===ov) ov.remove(); });
  $stage().innerHTML='<p class="hint">開始前の画面は全画面で重なります。背景か「あとで」で閉じ、開始のボタンで②へ進みます。</p>';
}
function hudEl(){
  let h=document.getElementById('hud');
  if(!h){ const p=P(); h=document.createElement('div'); h.id='hud'; h.className='hud hide '+p.cls; h.setAttribute('role','status'); h.innerHTML=p.hud(); document.body.appendChild(h);
    requestAnimationFrame(()=>requestAnimationFrame(()=>h.classList.remove('hide'))); }
  return h;
}
function paint(){
  const p=P(), h=hudEl(), res={}, now=nowUid();
  S.recs.forEach(r=>res[r.uid]=r.o);
  h.querySelector(p.cntSel||'.cnt').innerHTML=p.hudCnt();
  h.querySelectorAll('[data-u]').forEach(el=>{ const [b,...rest]=el.dataset.b.split(' '); const u=el.dataset.u;
    el.setAttribute('class', b+' '+(res[u]||rest.join(' '))+(!res[u]&&u===now?' now':'')); });
  if(p.hudExtra) p.hudExtra(h);
}
function pop(o){
  const r=hudEl().getBoundingClientRect(), el=document.createElement('div');
  el.className='pop '+P().cls+' '+o; el.textContent=OUT[o];
  el.style.left=(r.left+r.width/2)+'px'; el.style.top=(r.top-36)+'px';
  document.body.appendChild(el); setTimeout(()=>el.remove(),1100);
}
function answer(ok){ if(S.i>=N) return; const it=ITEMS[S.i++]; const o=ok?'ok':'ng'; S.recs.push({uid:it.uid,o}); pop(o); paint(); renderRun(); }
function renderRun(){
  const it=ITEMS[S.i];
  $stage().innerHTML=(it?'<div class="mockq"><div class="qn">'+esc(subj(it.sid).name)+'　Q.'+it.uid.split('_q')[1]+'　（'+SEV[it.sev]+(it.late?'・'+it.late+'日':'')+'）</div><div class="qt">（問題文の見本）62歳の男性。……最も考えられるのはどれか。</div>'+
      ['a','b','c','d','e'].map(k=>'<div class="ch">'+k+'　選択肢</div>').join('')+'</div>'
      :'<div class="mockq"><div class="qt">全'+N+'問を解き終えました。③ 結果へ。</div></div>')+
    '<div class="sim"><button class="ok">正解させる</button><button class="ng">誤答させる</button><button class="auto">残りを自動で</button><button class="rst">最初から</button></div>'+
    '<p class="hint">画面下がボードです（表示だけ）。</p>';
  const st=$stage();
  st.querySelector('.ok').onclick=()=>answer(true);
  st.querySelector('.ng').onclick=()=>answer(false);
  st.querySelector('.auto').onclick=()=>{ const step=()=>{ if(S.i>=N||stage!=='run') return; answer(autoOk(ITEMS[S.i])); setTimeout(step,240); }; step(); };
  st.querySelector('.rst').onclick=()=>{ reset(); document.getElementById('hud')?.remove(); paint(); renderRun(); };
}
function showRun(){ clearLayers(); paint(); renderRun(); }
function showRes(){
  clearLayers(); const p=P(), R=report();
  $stage().innerHTML='<div class="sumwrap"><div class="fake">ここより上に、今の結果画面（正答率・所要時間など）が並びます。下のブロックが案ごとに差し替わる部分です。'+(S.recs.length?'':'②で解いていないので、見本の正誤で埋めています。')+'</div>'+
    '<div class="res '+p.cls+'">'+p.result(R)+'</div></div>';
}
function setStage(s){ stage=s; document.querySelectorAll('#stages button').forEach(b=>b.classList.toggle('on',b.dataset.s===s));
  if(s==='brief') showBrief(); else if(s==='run') showRun(); else showRes(); }
function setPlan(k){ plan=k; document.querySelectorAll('#plans button').forEach(b=>b.classList.toggle('on',b.dataset.k===k)); reset(); setStage(stage); }

document.getElementById('plans').innerHTML=Object.entries(PLANS).map(([k,p])=>'<button data-k="'+k+'"><b>'+esc(p.name)+'</b><small>'+esc(p.desc)+'</small></button>').join('');
document.querySelectorAll('#plans button').forEach(b=>b.onclick=()=>setPlan(b.dataset.k));
document.querySelectorAll('#stages button').forEach(b=>b.onclick=()=>setStage(b.dataset.s));
setPlan('1');
</script>
</body>
</html>
