<!--
  SRS復習の見せ方（ward.js「病棟回診」）の拡張案を見比べるデモ（第7版・2026-09-30）。
  経緯：第1〜6版で作り直しを試したが、最後に「やっぱ現行のやつが一番見やすい。現行を拡張する方針で」と決まった。
  このページは ward.js の CSS を**そのまま写して**現行の3画面（朝の申し送り・画面下の病棟ボード・結果画面の回診ブロック）を再現し、
  その上に拡張を1つずつ重ねて見比べる：
    A 動きを足す／B 円ゲージを足す／C 病棟ボードを大きく／D 結果にグラフを足す／E 名前と言葉を「定着プロトコル」に揃える
  「現行」と「全部入り」も選べる。拡張どうしは独立していて、組み合わせて採れる。
  ⚠️ ward.js の約束を守る：画面下のボードは表示だけ（pointer-events:none）／infinite のアニメなし／新しい localStorage キーなし／SRS の採点を変えない。
  本物の関数は呼ばない。何も保存しない。テストの対象ではない。
-->

  /* ════════ ここまで現行 ════════ */

  /* ══ A 動きを足す ══ */
  .x-anim #wardBrief .wb-go{position:relative;overflow:hidden;}
  .x-anim #wardBrief .wb-go::after{content:'';position:absolute;inset:0;background:linear-gradient(105deg,transparent 35%,rgba(255,255,255,.7) 50%,transparent 65%);translate:-110% 0;}

  .x-gauge #wardBrief .wb-sum .wb-k{display:flex;align-items:center;justify-content:space-between;padding:6px 10px;text-align:left;}
  .x-gauge #wardBrief .wb-sum .wb-k b{font-size:18px;order:2;}
  .wh-ring{width:40px;flex-shrink:0;}
  .x-gauge #wardHud{display:flex;align-items:center;gap:10px;}
  .x-gauge #wardHud .wh-main{flex:1;min-width:0;}
  .ewr-ring{position:relative;width:104px;flex-shrink:0;}
  .ewr-ring .c b{font-size:22px;color:#6EE7B7;font-variant-numeric:tabular-nums;}
  .x-gauge .exam-ward-res .ewr-top{display:flex;align-items:center;gap:12px;margin:8px 0 10px;}
  .x-gauge .exam-ward-res .ewr-top .ewr-sum{flex:1;flex-direction:column;margin:0;}
  .seg{fill:none;stroke-width:9;transition:stroke-dasharray .6s cubic-bezier(.16,1,.3,1);}

  /* ══ C 病棟ボードを大きく ══ */
  .x-board #wardHud .wh-beds{display:none;}
  .wh-wards{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:4px 12px;margin-top:7px;}
  .wh-ward{display:flex;align-items:center;gap:6px;font-size:10.5px;font-weight:800;min-width:0;padding:2px 4px;border-radius:6px;transition:background .3s;}
  .wh-ward .n{width:4.6em;flex-shrink:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;opacity:.8;}
  .wh-ward .bs{display:flex;gap:3px;flex-wrap:wrap;}

  .wh-ward.cur .n{opacity:1;color:#7ED6DF;}

  .ewr-ba .bar2 i{display:block;height:100%;}
  .ewr-ba .l{width:3.4em;flex-shrink:0;font-weight:800;opacity:.8;}
</style>

<body>
<div class="harness">
  <h1>病棟回診 — 現行を拡張する5案</h1>
  <p>今の ward.js の見た目をそのまま土台にして、足すものだけを変えた5案です。「現行」と見比べてください。案どうしは独立しているので、組み合わせて採れます（「全部入り」で全部重ねた姿も見られます）。</p>
  <div class="plans" id="plans"></div>
  <div class="desc" id="desc"></div>
  <div class="stages" id="stages">
    <button data-s="brief">① 朝の申し送り</button><button data-s="run">② 回診中（画面下）</button><button data-s="res">③ 結果</button><button class="replay" id="replay">↻ もう一度再生</button>
  </div>
  <div id="stage"></div>
</div>

<script>
'use strict';
// ── 見本のデータ（決定論。本物の SRS は読まない） ─────────────────────
const SUBJ = [
  { id:'resp', name:'呼吸器', icon:'🌬️', color:'#3B82F6' }, { id:'circ', name:'循環器', icon:'❤️', color:'#EF4444' },
  { id:'neur', name:'神経',   icon:'🧠', color:'#22C55E' }, { id:'endo', name:'内分泌', icon:'⚗️', color:'#00A5B5' },
  { id:'dige', name:'消化器', icon:'🌿', color:'#A855F7' }, { id:'hema', name:'血液',   icon:'🩸', color:'#DC2626' },
];
function hash(s){ let h=2166136261; for(let i=0;i<s.length;i++){ h^=s.charCodeAt(i); h=Math.imul(h,16777619);} return h>>>0; }
const ITEMS = (() => {
  const per = { resp:8, circ:7, neur:6, endo:4, dige:3, hema:2 };
  const out = [];
  SUBJ.forEach(s => { for (let i=0;i<per[s.id];i++){
    const uid = s.id+'_ch0'+(1+i%3)+'_q'+(11+i*7);
    const h = hash(uid);
    const sev = h%10<2 ? 'crit' : h%10<7 ? 'warn' : 'stable';
    out.push({ uid, sid:s.id, sev, h });
  }});
  return out.sort((a,b)=>({crit:0,warn:1,stable:2}[a.sev]-{crit:0,warn:1,stable:2}[b.sev]) || a.h-b.h);   // 本物は _srsUrgency の降順
})();
const N = ITEMS.length;
function autoOk(it){ return (it.h>>>8)%100 < (it.sev==='crit'?55:it.sev==='warn'?72:88); }
function nextDays(it){ return it.sev==='crit'?3:it.sev==='warn'?6+(it.h%3):9+(it.h%6); }
const subj = id => SUBJ.find(s=>s.id===id);
const esc = s => String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const $ = (s,r) => (r||document).querySelector(s);
const $$ = (s,r) => [...(r||document).querySelectorAll(s)];
function rooms(){ const m=new Map(); ITEMS.forEach(i=>{ if(!m.has(i.sid)) m.set(i.sid,[]); m.get(i.sid).push(i); }); return [...m.entries()].map(([sid,pts])=>({sid,pts})).sort((a,b)=>b.pts.length-a.pts.length); }
function counts(){ const c={crit:0,warn:0,stable:0}; ITEMS.forEach(i=>c[i.sev]++); return c; }

// ── 用語（E で差し替える） ───────────────────────────────────────────
const TERMS = {
  ward: { tag:'WARD ROUNDS', title:'🏥 朝の回診', crit:'重症', warn:'要注意', stable:'安定', unit:'名', pts:'入院患者', rooms:'病棟', ok:'退院', ng:'入院継続', ngS:'継続',
    go:'回診を始める ▶', hud:'🏥 回診中', seen:'診察', res:'🏥 本日の回診', byRoom:'病棟ごとの転帰', next:'次の外来', popOk:'🏠 退院', popNg:'🛏 入院継続',

// ── 演出の道具（時間の決まった一回きり） ────────────────────────────
let TIMERS=[];
const later=(fn,ms)=>{ const t=setTimeout(fn,ms); TIMERS.push(t); return t; };
function clearTimers(){ TIMERS.forEach(clearTimeout); TIMERS=[]; }
function anim(el,kf,opt){ try{ return el.animate(kf,Object.assign({fill:'both',easing:'cubic-bezier(.16,1,.3,1)'},opt)); }catch(e){ return null; } }
function countUp(el,to,dur,fmt){ if(!el) return; fmt=fmt||(v=>String(v)); const t0=performance.now(); let done=false;
  const fin=()=>{ if(done) return; done=true; el.textContent=fmt(to); anim(el,[{transform:'scale(1.25)'},{transform:'scale(1)'}],{duration:350}); };
  const step=now=>{ if(done) return; const p=Math.min(1,(now-t0)/dur); el.textContent=fmt(Math.round(to*(1-Math.pow(1-p,3)))); if(p<1) requestAnimationFrame(step); else fin(); };
  requestAnimationFrame(step); later(fin,dur+400); }
function burst(x,y,color,n){ for(let i=0;i<n;i++){ const p=document.createElement('i'); p.className='xpt'; p.style.background=color; p.style.boxShadow='0 0 6px '+color; document.body.appendChild(p);
  const a=Math.random()*Math.PI*2, d=18+Math.random()*26; anim(p,[{transform:'translate('+x+'px,'+y+'px)',opacity:1},{transform:'translate('+(x+Math.cos(a)*d)+'px,'+(y+Math.sin(a)*d)+'px) scale(0)',opacity:0}],{duration:600+Math.random()*300}); later(()=>p.remove(),1000); } }

// 円（ドーナツ・リング）：parts=[[値, 色], ...]、total を一周とする
function donut(parts, total, size, sw){ const r=(size-sw)/2, c=size/2; let off=0, s='<circle cx="'+c+'" cy="'+c+'" r="'+r+'" fill="none" stroke="rgba(255,255,255,.08)" stroke-width="'+sw+'"/>';
  parts.forEach(([v,col,cls])=>{ const p=total?v/total*100:0; s+='<circle class="seg '+(cls||'')+'" cx="'+c+'" cy="'+c+'" r="'+r+'" pathLength="100" stroke="'+col+'" stroke-width="'+sw+'" stroke-dasharray="'+p.toFixed(2)+' 100" stroke-dashoffset="'+(-off).toFixed(2)+'" transform="rotate(-90 '+c+' '+c+')"/>'; off+=p; });
  return '<svg viewBox="0 0 '+size+' '+size+'">'+s+'</svg>'; }

// ── ① 朝の申し送り（ward.js の briefing と同じ組み立て＋拡張） ─────────

      if(b.classList.contains('crit')) later(()=>anim(b,[{opacity:1},{opacity:.25},{opacity:1},{opacity:.25},{opacity:1}],{duration:900}),380); }, 300+k*32); });

  }
  $stage().innerHTML='<p class="hint">朝の申し送りは全画面で重なります。背景か「ハブへ」で閉じ、開始のボタンで②へ進みます。</p>';

    anim(R,[{opacity:0,transform:'translateY(12px)'},{opacity:1,transform:'none'}],{duration:500});
    $$('.ewr-k b',R).forEach(b=>{ const v=+b.textContent; b.textContent='0'; later(()=>countUp(b,v,900),300); });
    const bars=$$('.ewr-row .bar i, .ewr-sev .sb i, .ewr-ba i[data-w]',R); bars.forEach(i=>{ i.style.transition='width .9s cubic-bezier(.16,1,.3,1)'; i.style.width='0'; });
    later(()=>bars.forEach((i,k)=>later(()=>i.style.width=i.dataset.w, k*60)), 500);
    $$('.ewr-cal .d i',R).forEach((i,k)=>anim(i,[{transform:'scaleY(0)'},{transform:'scaleY(1)'}],{duration:700,delay:900+k*40}));
    $$('.ewr-note',R).forEach((n,k)=>anim(n,[{opacity:0,transform:'translateY(6px)'},{opacity:1,transform:'none'}],{duration:500,delay:1300+k*150}));
  }
}

function clearLayers(){ clearTimers(); document.querySelectorAll('#wardBrief,#wardHud,.wh-pop,.xpt').forEach(e=>e.remove()); }
function setStage(s){ stage=s; $$('#stages button[data-s]').forEach(b=>b.classList.toggle('on',b.dataset.s===s));
  if(s==='brief') showBrief(); else if(s==='run') showRun(); else showRes(); }
function setPlan(k){ plan=k; document.body.className=PLANS[k].flags.map(f=>'x-'+f).join(' ');
  $$('#plans button').forEach(b=>b.classList.toggle('on',b.dataset.k===k)); $('#desc').innerHTML=PLANS[k].text; reset(); setStage(stage); }

document.getElementById('plans').innerHTML=Object.entries(PLANS).map(([k,p])=>'<button data-k="'+k+'"><b>'+esc(p.name)+'</b><small>'+esc(p.desc)+'</small></button>').join('');
$$('#plans button').forEach(b=>b.onclick=()=>setPlan(b.dataset.k));
$$('#stages button[data-s]').forEach(b=>b.onclick=()=>{ reset(); setStage(b.dataset.s); });
$('#replay').onclick=()=>{ reset(); setStage(stage); };
setPlan('cur');
</script>
</body>
</html>
