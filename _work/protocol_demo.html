<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>定着プロトコルの5案</title>
<!--
  SRS復習（2026-09-30 に「定着プロトコル」へ改名）の見せ方を、ward.js の「病棟回診」から作り直すデモ（第4版）。
  本物の関数は呼ばず、このページの中だけで再生する（何も保存しない）。
  経緯：第1版（暗い箱＋ネオン）・第2版（紙・スイス等）は「微妙」、第3版（UIテーマ8種ごとの意匠）は
    「テーマごとに分けるのは見づらい。共通の1つでよい」と言われた。第3版の「1問＝1つの図が、解くたびに
    変わる」考え方は残し、UIテーマに関係なく同じ見た目の5案を作った：
      A 心電図モニター（1問＝1拍）／B DNA 二重らせん（1問＝1本の塩基対）／C 分割リング（1問＝1区画）
      D カードの束（1問＝1枚。定着ともう一度の山に分かれる）／E ニューロン網（1問＝1個。正解で発火）
  どの案も3枚（開始前・解答中の画面下のボード・結果）で、材料は ward.js と同じ（状態3段＝severityOf、正解／誤答）。
  パネルは不透明に近い暗色＝どの UIテーマの背景の上に置いても読める。SRS の採点と出題順は変えない。
  ⚠️ 画面下のボードは表示だけ（pointer-events:none）／infinite のアニメなし／新しい localStorage キーなし。
  テストの対象ではない。
-->
<style>
  :root{
    --sans:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Hiragino Kaku Gothic ProN","Yu Gothic UI","Yu Gothic",Meiryo,sans-serif;
    --mono:'SFMono-Regular',Menlo,Consolas,monospace;
    --ease-out:cubic-bezier(.16,1,.3,1);
    --panel-hi:#171C27;--panel-lo:#0D1017;--line:rgba(255,255,255,.1);--tx:#E9EDF4;--sub:#98A2B3;--chip:rgba(255,255,255,.045);
  }
  *{box-sizing:border-box;}
  html,body{margin:0;overflow-x:clip;}
  body{min-height:100vh;padding:18px 16px 170px;font-family:var(--sans);color:var(--tx);
    background:radial-gradient(ellipse 90% 60% at 50% -15%,rgba(121,40,202,.38),transparent 65%),radial-gradient(circle at 15% 70%,rgba(0,229,255,.16),transparent 55%),linear-gradient(180deg,#070913,#04050b);}
  .harness{max-width:880px;margin:0 auto;}
  .harness h1{font-size:15px;margin:0 0 4px;}
  .harness p{font-size:12.5px;line-height:1.7;color:var(--sub);margin:0 0 14px;}
  .plans{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:6px;margin-bottom:10px;}
  .plans button{padding:10px 12px;border-radius:12px;border:1px solid var(--line);background:rgba(255,255,255,.04);color:var(--tx);font:inherit;text-align:left;cursor:pointer;}
  .plans button b{display:block;font-size:13.5px;}
  .plans button small{display:block;font-size:11px;color:var(--sub);margin-top:2px;line-height:1.45;}
  .plans button.on{background:#E9EDF4;border-color:#E9EDF4;}
  .plans button.on b{color:#0B0E14;} .plans button.on small{color:#4A5363;}
  .stages{display:flex;gap:6px;margin-bottom:16px;}
  .stages button{padding:8px 13px;border-radius:99px;border:1px solid rgba(255,255,255,.2);background:rgba(255,255,255,.04);color:inherit;font:inherit;font-size:13px;cursor:pointer;white-space:nowrap;}
  .stages button.on{background:#E9EDF4;color:#0B0E14;border-color:#E9EDF4;}
  .hint{font-size:12px;color:var(--sub);line-height:1.7;margin:8px 0;}
  .mockq{border-radius:16px;padding:16px 18px;background:rgba(14,16,30,.78);border:1px solid rgba(255,255,255,.14);}
  .mockq .qn{display:inline-block;font-size:11px;font-weight:800;padding:2px 8px;border-radius:5px;margin-bottom:8px;border:1px solid rgba(255,255,255,.5);}
  .mockq .qt{font-size:14px;line-height:1.8;}
  .mockq .ch{font-size:13.5px;padding:9px 12px;border-radius:10px;margin-top:7px;background:rgba(255,255,255,.04);border:1px solid rgba(255,255,255,.12);}
  .sim{display:flex;flex-wrap:wrap;gap:6px;margin:10px 0;}
  .sim button{flex:1 1 110px;padding:10px;border-radius:10px;border:1px solid rgba(255,255,255,.22);background:rgba(255,255,255,.06);color:inherit;font:inherit;font-size:13px;font-weight:700;cursor:pointer;white-space:nowrap;}
  .sim .ok{border-color:#3DDC97}.sim .ng{border-color:#FF6B81}
  .sumwrap{border-radius:16px;padding:12px;background:rgba(10,12,22,.55);border:1px solid rgba(255,255,255,.12);}
  .sumwrap .fake{font-size:12px;color:var(--sub);padding:8px 10px;border:1px dashed rgba(255,255,255,.25);border-radius:10px;margin-bottom:12px;line-height:1.6;}

  /* ══ 共通のパネル（5案とも同じ骨組み。変わるのは中央の図とアクセント色だけ） ══ */
  .ov{position:fixed;inset:0;z-index:9500;display:flex;align-items:center;justify-content:center;padding:14px;background:rgba(3,4,10,.66);animation:fadeIn .25s var(--ease-out) both;}
  .box,.res,.hud{color:var(--tx);background:linear-gradient(180deg,var(--panel-hi),var(--panel-lo));border:1px solid var(--line);
    box-shadow:0 24px 60px rgba(0,0,0,.55),inset 0 1px 0 rgba(255,255,255,.07);}
  .box{position:relative;width:min(560px,100%);max-height:100%;overflow-y:auto;overflow-x:hidden;padding:22px 20px 18px;border-radius:22px;animation:rise .45s var(--ease-out) both;}
  .box::before,.res::before{content:'';position:absolute;left:22px;right:22px;top:0;height:1px;background:linear-gradient(90deg,transparent,var(--accent),transparent);opacity:.8;}
  .eye{font-size:10px;font-weight:800;letter-spacing:.32em;color:var(--accent);}
  .ttl{margin:4px 0 0;font-size:24px;font-weight:900;letter-spacing:.04em;}
  .dt{font-size:12px;color:var(--sub);margin-top:2px;}
  .head{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;}
  .count{text-align:right;line-height:1;white-space:nowrap;}
  .count b{font-size:52px;font-weight:800;letter-spacing:-.03em;font-variant-numeric:tabular-nums;}
  .count span{font-size:13px;margin-left:3px;color:var(--sub);}
  .sig{margin:14px -4px 4px;}
  .sig svg{display:block;width:100%;height:auto;overflow:visible;}
  .sev{display:flex;flex-wrap:wrap;justify-content:center;gap:4px 16px;font-size:12px;color:var(--sub);margin-top:4px;}
  .sev i{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:6px;vertical-align:1px;}
  .sev b{color:var(--tx);font-variant-numeric:tabular-nums;margin-left:4px;}
  .subs{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px;margin-top:14px;}
  .subs div{padding:7px 10px;border-radius:10px;font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;background:var(--chip);border:1px solid rgba(255,255,255,.07);}
  .subs b{float:right;font-variant-numeric:tabular-nums;}
  .how{font-size:12.5px;line-height:1.75;margin-top:12px;padding:10px 12px;border-radius:12px;color:#C9D1DE;background:var(--chip);border:1px solid rgba(255,255,255,.07);}
  .how b{color:var(--accent);font-weight:700;}
  .btns{display:flex;gap:10px;margin-top:16px;}
  .back{padding:12px 16px;border-radius:14px;font:inherit;font-size:13px;cursor:pointer;background:none;color:var(--sub);border:1px solid rgba(255,255,255,.16);white-space:nowrap;}
  .go{flex:1;padding:13px;border:0;border-radius:14px;font:inherit;font-size:15.5px;font-weight:900;letter-spacing:.12em;cursor:pointer;white-space:nowrap;color:#0A0D13;background:var(--accent);
    box-shadow:0 8px 24px color-mix(in srgb,var(--accent) 35%,transparent),inset 0 1px 0 rgba(255,255,255,.4);}
  .go:focus-visible,.back:focus-visible{outline:2px solid var(--accent);outline-offset:3px;}
  .hud{position:fixed;left:50%;bottom:calc(10px + env(safe-area-inset-bottom));translate:-50% 0;z-index:8000;width:min(600px,calc(100% - 20px));
    padding:9px 14px 10px;border-radius:16px;pointer-events:none;transition:opacity .3s var(--ease-out),translate .45s var(--ease-out);}
  .hud.hide{opacity:0;translate:-50% 130%;}
  .hud .row{display:flex;align-items:baseline;gap:10px;white-space:nowrap;}
  .hud .tag{font-size:10px;font-weight:900;letter-spacing:.22em;color:var(--accent);}
  .hud .cnt{margin-left:auto;font-size:12px;color:var(--sub);overflow:hidden;text-overflow:ellipsis;}
  .hud .cnt b{font-size:17px;color:var(--tx);font-variant-numeric:tabular-nums;}
  .hud .cnt .o{color:var(--accent);} .hud .cnt .x{color:var(--crit);}
  .hud .mini{margin-top:6px;}
  .hud .mini svg{display:block;width:100%;height:auto;}
  .pop{position:fixed;z-index:8001;pointer-events:none;white-space:nowrap;translate:-50% 0;font-size:13.5px;font-weight:900;padding:4px 12px;border-radius:99px;
    background:var(--panel-hi);border:1px solid currentColor;animation:pop 1s var(--ease-out) forwards;}
  .pop.ok{color:var(--accent);} .pop.ng{color:var(--crit);}
  .res{position:relative;overflow:hidden;padding:20px 18px 18px;border-radius:20px;}
  .res .hl{font-size:22px;font-weight:900;margin:6px 0 0;line-height:1.4;}
  .res .hl .num{font-size:30px;color:var(--accent);}
  .stats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:6px;margin-top:12px;}
  .stats div{padding:8px 6px;border-radius:12px;text-align:center;min-width:0;background:var(--chip);border:1px solid rgba(255,255,255,.07);}
  .stats b{display:block;font-size:20px;font-variant-numeric:tabular-nums;}
  .stats span{font-size:10.5px;color:var(--sub);display:block;line-height:1.4;}
  .bars{margin-top:12px;}
  .bars .rw{display:grid;grid-template-columns:5em minmax(0,1fr) 3.2em;gap:10px;align-items:center;font-size:12px;padding:4px 0;}
  .bars .tr{height:6px;border-radius:99px;overflow:hidden;background:rgba(255,255,255,.08);}
  .bars .tr i{display:block;height:100%;border-radius:99px;background:var(--accent);}
  .bars .v{text-align:right;font-variant-numeric:tabular-nums;color:var(--sub);}
  .num{font-variant-numeric:tabular-nums;}
  .n{transition:fill .35s,stroke .35s,opacity .35s,stroke-width .35s;}
  .lbl{fill:var(--sub);font-size:8.5px;font-family:var(--sans);}
  @keyframes pop{0%{opacity:0;transform:translateY(6px)}20%{opacity:1;transform:translateY(0)}70%{opacity:1}100%{opacity:0;transform:translateY(-16px)}}
  @keyframes fadeIn{from{opacity:0}to{opacity:1}}
  @keyframes rise{from{opacity:0;translate:0 12px}to{opacity:1;translate:0 0}}
  @media (prefers-reduced-motion:reduce){.ov,.box,.pop,.hud,.n{animation-duration:.01s!important;transition-duration:.01s!important;}}

  /* ══ A 心電図モニター ══ */
  .pA{--accent:#3DF2A0;--crit:#FF5D6C;}
  .pA .sig svg,.pA .mini svg{background:#070B0A;border-radius:10px;}
  .pA .n{fill:none;stroke-linejoin:round;stroke-linecap:round;}
  .pA .n.stable{stroke:rgba(61,242,160,.28);stroke-width:1.2;} .pA .n.warn{stroke:rgba(61,242,160,.6);stroke-width:1.3;} .pA .n.crit{stroke:var(--crit);stroke-width:1.4;}
  .pA .n.now{stroke:#fff;stroke-width:1.8;}
  .pA .n.ok{stroke:var(--accent);stroke-width:2;filter:drop-shadow(0 0 3px rgba(61,242,160,.8));} .pA .n.ng{stroke:var(--crit);stroke-width:1.6;stroke-dasharray:2 2;}
  .pA .grid{stroke:rgba(61,242,160,.08);stroke-width:.6;}
  .pA .mon{fill:rgba(61,242,160,.7);font-family:var(--mono);font-size:8px;letter-spacing:1px;}

  /* ══ B DNA 二重らせん ══ */
  .pB{--accent:#7AA2FF;--crit:#FF6B8B;}
  .pB .strand{fill:none;stroke-width:2.2;stroke-linecap:round;}
  .pB .n{stroke-linecap:round;}
  .pB .n.stable{stroke:rgba(255,255,255,.16);stroke-width:2.4;} .pB .n.warn{stroke:rgba(122,162,255,.45);stroke-width:2.4;} .pB .n.crit{stroke:var(--crit);stroke-width:2.6;}
  .pB .n.now{stroke:#fff;stroke-width:3.2;}
  .pB .n.ok{stroke:var(--accent);stroke-width:3.4;filter:drop-shadow(0 0 3px rgba(122,162,255,.8));} .pB .n.ng{stroke:var(--crit);stroke-width:1.6;opacity:.45;stroke-dasharray:3 3;}

  /* ══ C 分割リング ══ */
  .pC{--accent:#62E6FF;--crit:#FF8A5C;}
  .pC .n.stable{fill:#2B3342;} .pC .n.warn{fill:#56657C;} .pC .n.crit{fill:var(--crit);}
  .pC .n.now{fill:#fff;}
  .pC .n.ok{fill:var(--accent);filter:drop-shadow(0 0 4px rgba(98,230,255,.7));} .pC .n.ng{fill:var(--crit);opacity:.4;}
  .pC .cnum{fill:var(--tx);font-size:34px;font-weight:800;font-family:var(--sans);}
  .pC .csub{fill:var(--sub);font-size:9px;letter-spacing:2px;font-family:var(--sans);}

  /* ══ D カードの束 ══ */
  .pD{--accent:#F5C451;--crit:#FF6B6B;}
  .pD .n{stroke-width:1;}
  .pD .n.stable{fill:#1C2230;stroke:#3A4456;} .pD .n.warn{fill:#232B3B;stroke:#6B7A93;} .pD .n.crit{fill:#2A1E24;stroke:var(--crit);}
  .pD .n.now{fill:#2E3850;stroke:#fff;}
  .pD .n.ok{fill:#2A2414;stroke:var(--accent);} .pD .n.ng{fill:#2A1E24;stroke:var(--crit);}
  .pD .pile{fill:var(--sub);font-size:10px;font-family:var(--sans);text-anchor:middle;}
  .pD .pile b,.pD .pn{fill:var(--tx);font-size:18px;font-weight:800;}
  .pD .hud .piles{display:flex;align-items:center;gap:14px;margin-top:6px;font-size:12px;color:var(--sub);}
  .pD .stk{position:relative;width:22px;height:28px;flex-shrink:0;}
  .pD .stk i{position:absolute;inset:0;border-radius:4px;border:1px solid;background:#1C2230;}
  .pD .stk i:nth-child(2){translate:2px -2px;} .pD .stk i:nth-child(3){translate:4px -4px;}
  .pD .stk.deck i{border-color:#6B7A93;} .pD .stk.ok i{border-color:var(--accent);background:#2A2414;} .pD .stk.ng i{border-color:var(--crit);background:#2A1E24;}
  .pD .piles b{font-size:17px;color:var(--tx);font-variant-numeric:tabular-nums;margin-left:2px;}
  .pD .piles .sp{flex:1;}
  .pD .piles .o b{color:var(--accent);} .pD .piles .x b{color:var(--crit);}

  /* ══ E ニューロン網 ══ */
  .pE{--accent:#B18CFF;--crit:#FF7A90;}
  .pE .syn{stroke:rgba(177,140,255,.16);stroke-width:1;fill:none;}
  .pE .syn.on{stroke:var(--accent);stroke-width:1.6;opacity:.9;}
  .pE .n.stable{fill:#3A3550;} .pE .n.warn{fill:#7E6BB5;} .pE .n.crit{fill:var(--crit);}
  .pE .n.now{fill:#fff;}
  .pE .n.ok{fill:#E7DCFF;filter:drop-shadow(0 0 5px rgba(177,140,255,.95));} .pE .n.ng{fill:var(--crit);opacity:.4;}
</style>
</head>
<body>
<div class="harness">
  <h1>定着プロトコル — 5案（第4版・どの UIテーマでも同じ見た目）</h1>
  <p>どの案も「1問＝1つ」の図が中央にあり、解くたびにその図が変わります。案と画面を切り替えて見てください（② では「正解」「誤答」で画面下のボードが動きます）。</p>
  <div class="plans" id="plans"></div>
  <div class="stages" id="stages">
    <button data-s="brief">① 開始前</button><button data-s="run">② 解答中</button><button data-s="res">③ 結果</button>
  </div>
  <div id="stage"></div>
</div>

<script>
'use strict';
// ── 見本のデータ（決定論。本物の SRS は読まない） ─────────────────────
const SUBJ = [
  { id:'resp', name:'呼吸器' }, { id:'circ', name:'循環器' }, { id:'neur', name:'神経' },
  { id:'endo', name:'内分泌' }, { id:'dige', name:'消化器' }, { id:'hema', name:'血液' },
];
function hash(s){ let h=2166136261; for(let i=0;i<s.length;i++){ h^=s.charCodeAt(i); h=Math.imul(h,16777619);} return h>>>0; }
const ITEMS = (() => {
  const per = { resp:8, circ:7, neur:6, endo:4, dige:3, hema:2 };
  const out = [];
  SUBJ.forEach(s => { for (let i=0;i<per[s.id];i++){
    const uid = s.id+'_ch0'+(1+i%3)+'_q'+(11+i*7);
    const h = hash(uid);
    const sev = h%10<2 ? 'crit' : h%10<7 ? 'warn' : 'stable';
    const late = sev==='crit' ? 7+(h>>>4)%6 : sev==='warn' ? 1+(h>>>4)%6 : 0;
    out.push({ uid, sid:s.id, sev, late, h });
  }});
  return out.sort((a,b)=>b.late-a.late || a.h-b.h);   // 本物は _srsUrgency の降順
})();
const N = ITEMS.length;
const OUT = { ok:'定着', ng:'もう一度' };
function autoOk(it){ return (it.h>>>8)%100 < (it.sev==='crit'?55:it.sev==='warn'?72:88); }
function nextDays(it){ return it.sev==='crit'?3:it.sev==='warn'?6+(it.h%3):9+(it.h%6); }
const subj = id => SUBJ.find(s=>s.id===id);
const esc = s => String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const rnd = (it, salt) => (hash(it.uid+salt) % 1000) / 1000;
function counts(){ const c={crit:0,warn:0,stable:0}; ITEMS.forEach(i=>c[i.sev]++); return c; }
function groups(){ const m=new Map(); ITEMS.forEach(i=>{ if(!m.has(i.sid)) m.set(i.sid,[]); m.get(i.sid).push(i); }); return [...m.entries()].map(([sid,pts])=>({sid,pts})).sort((a,b)=>b.pts.length-a.pts.length); }
function dateStr(){ const d=new Date(Date.now()+9*3600000); return (d.getUTCMonth()+1)+'月'+d.getUTCDate()+'日（'+'日月火水木金土'[d.getUTCDay()]+'）'; }
const f1 = x => x.toFixed(1);
// 図の要素：data-u（どの問題か）と data-b（元の状態）。ボードの paint が同じ規則で塗り替える
const nd = (tag, it, st, attrs) => '<'+tag+' class="n '+st+'" data-b="n '+it.sev+'" data-u="'+esc(it.uid)+'" '+attrs+'/>';

// ── A 心電図：1問＝1拍 ───────────────────────────────────────────────
// 大きく遅れた問題は幅の広い乱れた拍（期外収縮の形）、それ以外は整った QRS
function beat(x, b, it, st, h){
  const k = h || 1;
  const d = it.sev==='crit' && st!=='ok'
    ? 'M'+f1(x)+' '+b+' L'+f1(x+4)+' '+b+' Q'+f1(x+8)+' '+f1(b-22*k)+' '+f1(x+11)+' '+f1(b+9*k)+' L'+f1(x+15)+' '+b+' L'+f1(x+20)+' '+b
    : 'M'+f1(x)+' '+b+' L'+f1(x+5)+' '+b+' Q'+f1(x+6)+' '+f1(b-3*k)+' '+f1(x+7)+' '+b+' L'+f1(x+9)+' '+f1(b+3*k)+' L'+f1(x+10.5)+' '+f1(b-24*k)+' L'+f1(x+12)+' '+f1(b+7*k)+' L'+f1(x+13.5)+' '+b+' Q'+f1(x+16)+' '+f1(b-5*k)+' '+f1(x+18)+' '+b+' L'+f1(x+20)+' '+b;
  return nd('path', it, st, 'd="'+d+'"');
}
function sigA(st){
  let s=''; for(let x=0;x<=320;x+=10) s+='<line class="grid" x1="'+x+'" x2="'+x+'" y1="0" y2="180"/>'; for(let y=0;y<=180;y+=10) s+='<line class="grid" x1="0" x2="320" y1="'+y+'" y2="'+y+'"/>';
  s+='<text class="mon" x="8" y="14">II　定着プロトコル</text><text class="mon" x="312" y="14" text-anchor="end">'+N+' BEATS</text>';
  ITEMS.forEach((it,k)=>{ const row=k<15?0:1; s+=beat(10+(k%15)*20, row?140:78, it, st(it)); });
  return s;
}
function miniA(){ let s=''; ITEMS.forEach((it,k)=>{ s+=beat(k*20, 26, it, it.sev, .8); }); return '<svg viewBox="0 -2 600 40">'+s+'</svg>'; }

// ── B DNA：1問＝1本の塩基対 ───────────────────────────────────────────
function helix(W, cy, A, per, st, rw){
  const y1=x=>cy+A*Math.sin(x/per), y2=x=>cy-A*Math.sin(x/per);
  let s1='', s2='';
  for(let x=0;x<=W;x+=4){ s1+=(x?'L':'M')+x+' '+f1(y1(x)); s2+=(x?'L':'M')+x+' '+f1(y2(x)); }
  let r='';
  ITEMS.forEach((it,k)=>{ const x=8+k*((W-16)/(N-1)); r+=nd('line', it, st(it), 'x1="'+f1(x)+'" y1="'+f1(y1(x))+'" x2="'+f1(x)+'" y2="'+f1(y2(x))+'"'); });
  return '<path class="strand" d="'+s1+'" stroke="#7AA2FF" stroke-opacity=".85" stroke-width="'+rw+'"/><path class="strand" d="'+s2+'" stroke="#B7C8FF" stroke-opacity=".45" stroke-width="'+rw+'"/>'+r;
}
const sigB = st => helix(320, 92, 52, 26, st, 2.2);
const miniB = () => '<svg viewBox="0 0 600 44">'+helix(600, 22, 16, 30, it=>it.sev, 1.6)+'</svg>';

// ── C 分割リング：1問＝1区画 ────────────────────────────────────────
function arcSeg(cx, cy, r0, r1, a0, a1){
  const p=(r,a)=>f1(cx+r*Math.cos(a))+' '+f1(cy+r*Math.sin(a));
  return 'M'+p(r1,a0)+' A'+r1+' '+r1+' 0 0 1 '+p(r1,a1)+' L'+p(r0,a1)+' A'+r0+' '+r0+' 0 0 0 '+p(r0,a0)+' Z';
}
function ring(cx, cy, r0, r1, st, gap){
  let s=''; ITEMS.forEach((it,k)=>{ const a0=-Math.PI/2+k/N*Math.PI*2+gap, a1=-Math.PI/2+(k+1)/N*Math.PI*2-gap; s+=nd('path', it, st(it), 'd="'+arcSeg(cx,cy,r0,r1,a0,a1)+'"'); }); return s;
}
function sigC(st, R){
  return ring(160, 90, 62, 82, st, .022)+
    '<text class="cnum" x="160" y="98" text-anchor="middle">'+(R ? R.pct+'%' : N)+'</text><text class="csub" x="160" y="116" text-anchor="middle">'+(R ? '定着率' : '問')+'</text>';
}
const miniC = () => '<svg viewBox="0 0 600 30"><g>'+ITEMS.map((it,k)=>nd('rect', it, it.sev, 'x="'+(k*20)+'" y="10" width="17" height="10" rx="3"')).join('')+'</g></svg>';

// ── D カードの束：1問＝1枚 ──────────────────────────────────────────
function card(it, st, x, y, rot){ return nd('rect', it, st, 'x="'+f1(x-13)+'" y="'+f1(y-18)+'" width="26" height="36" rx="4" transform="rotate('+f1(rot)+' '+f1(x)+' '+f1(y)+')"'); }
function sigD(st, R){
  if(!R){ // 扇形の手札
    let s=''; ITEMS.forEach((it,k)=>{ const a=(-42+k/(N-1)*84)*Math.PI/180; const x=160+178*Math.sin(a), y=212-178*Math.cos(a)+34; s+=card(it, st(it), x, y, a*180/Math.PI); });
    return s+'<text class="lbl" x="160" y="176" text-anchor="middle">左端から＝遅れの大きい順に配られます</text>';
  }
  // 結果：2つの山に分かれる
  let s='', io=0, ix=0;
  ITEMS.forEach(it=>{ const o=R.res[it.uid]; if(!o) return;
    if(o==='ok'){ s+=card(it, 'ok', 92+io*1.2, 86-io*2.2, (rnd(it,'r')-.5)*14); io++; }
    else { s+=card(it, 'ng', 232+ix*1.2, 86-ix*2.2, (rnd(it,'r')-.5)*14); ix++; } });
  return s+'<text class="pn" x="92" y="150" text-anchor="middle" fill="#F5C451">'+R.ok+'</text><text class="pile" x="92" y="166">定着</text>'+
    '<text class="pn" x="232" y="150" text-anchor="middle" fill="#FF6B6B">'+R.ng+'</text><text class="pile" x="232" y="166">もう一度（明日）</text>';
}

// ── E ニューロン網：1問＝1個 ──────────────────────────────────────────
const E_C=[[64,56],[164,44],[262,62],[86,132],[190,124],[276,140]];
function netPos(){ const pos={}; groups().forEach((g,gi)=>{ const [cx,cy]=E_C[gi]; g.pts.forEach(it=>{ const a=rnd(it,'a')*Math.PI*2, r=10+rnd(it,'r')*24; pos[it.uid]=[cx+r*Math.cos(a), cy+r*Math.sin(a)*.8]; }); }); return pos; }
function sigE(st, R){
  const pos=netPos(); let syn='', nodes='', lab='';
  const on=(a,b)=> R ? (R.res[a.uid]==='ok' && R.res[b.uid]==='ok') : false;
  const curve=(p,q)=>{ const mx=(p[0]+q[0])/2+(q[1]-p[1])*.18, my=(p[1]+q[1])/2-(q[0]-p[0])*.18; return 'M'+f1(p[0])+' '+f1(p[1])+' Q'+f1(mx)+' '+f1(my)+' '+f1(q[0])+' '+f1(q[1]); };
  groups().forEach((g,gi)=>{ const pts=g.pts;
    pts.forEach((it,i)=>{ if(i) syn+='<path class="syn'+(on(pts[i-1],it)?' on':'')+'" d="'+curve(pos[pts[i-1].uid],pos[it.uid])+'"/>'; if(i>1&&i%2===0) syn+='<path class="syn'+(on(pts[i-2],it)?' on':'')+'" d="'+curve(pos[pts[i-2].uid],pos[it.uid])+'"/>'; });
    if(gi<5){ const a=pts[0], b=groups()[gi+1].pts[0]; syn+='<path class="syn'+(on(a,b)?' on':'')+'" d="'+curve(pos[a.uid],pos[b.uid])+'"/>'; }
    const [cx,cy]=E_C[gi]; lab+='<text class="lbl" x="'+cx+'" y="'+(cy+(gi<3?-30:40))+'" text-anchor="middle">'+esc(subj(g.sid).name)+'</text>';
  });
  ITEMS.forEach(it=>{ const [x,y]=pos[it.uid]; nodes+=nd('circle', it, st(it), 'cx="'+f1(x)+'" cy="'+f1(y)+'" r="'+(R&&R.res[it.uid]==='ok'?5.2:4.2)+'"'); });
  return syn+nodes+lab;
}
function miniE(){ let s='', prev=null; ITEMS.forEach((it,k)=>{ const x=10+k*(580/(N-1)), y=16+(k%2?5:-5); if(prev) s+='<line class="syn" x1="'+f1(prev[0])+'" y1="'+f1(prev[1])+'" x2="'+f1(x)+'" y2="'+f1(y)+'"/>'; s+=nd('circle', it, it.sev, 'cx="'+f1(x)+'" cy="'+f1(y)+'" r="5"'); prev=[x,y]; }); return '<svg viewBox="0 0 600 32">'+s+'</svg>'; }

// ── 5案 ──────────────────────────────────────────────────────────
const PLANS = {
  A:{ cls:'pA', name:'A 心電図モニター', desc:'1問＝1拍。正解で整った波形、誤答は乱れた拍',
      eye:'RHYTHM STRIP', sev:['#FF5D6C','rgba(61,242,160,.6)','rgba(61,242,160,.28)'],
      how:'1拍が1問です。<b>赤い乱れた拍</b>は予定より大きく遅れている問題。正解すると整った波形に戻り、誤答は点線の拍として残ります（明日もう一度）。',
      sig:sigA, mini:miniA },
  B:{ cls:'pB', name:'B DNA 二重らせん', desc:'1問＝1本の塩基対。正解で結合し、誤答はほどける',
      eye:'DOUBLE HELIX', sev:['#FF6B8B','rgba(122,162,255,.55)','rgba(255,255,255,.25)'],
      how:'らせんの横棒1本が1問です。遅れの大きい順（左から）に解き、正解した対は<b>青く結合</b>、誤答はほどけて明日もう一度出ます。',
      sig:sigB, mini:miniB },
  C:{ cls:'pC', name:'C 分割リング', desc:'1問＝リングの1区画。解くほど輪が満ちる',
      eye:'RETENTION RING', sev:['#FF8A5C','#56657C','#2B3342'],
      how:'リングの1区画が1問です。12時の位置から時計回りに、遅れの大きい順に並んでいます。正解した区画が<b>光って</b>、輪が満ちていきます。',
      sig:sigC, mini:miniC },
  D:{ cls:'pD', name:'D カードの束', desc:'1問＝1枚。解いたカードが「定着」と「もう一度」の山に分かれる',
      eye:'TODAY\'S DECK', sev:['#FF6B6B','#6B7A93','#3A4456'],
      how:'手札の1枚が1問です。正解したカードは<b>定着の山</b>へ、誤答は「もう一度」の山へ（明日また配られます）。',
      sig:sigD },
  E:{ cls:'pE', name:'E ニューロン網', desc:'1問＝1個の神経細胞。正解で発火し、シナプスがつながる',
      eye:'NEURAL MAP', sev:['#FF7A90','#7E6BB5','#3A3550'],
      how:'点の1つ1つが1問で、科目ごとに束になっています。正解した細胞が<b>発火</b>し、発火した細胞どうしがシナプスでつながります。',
      sig:sigE, mini:miniE },
};

// ── 状態 ───────────────────────────────────────────────────────────
let plan='A', stage='brief', S;
function reset(){ S={ recs:[], i:0 }; }
reset();
const P = () => PLANS[plan];
const nowUid = () => S.i < N ? ITEMS[S.i].uid : null;
const outN = k => S.recs.filter(r=>r.o===k).length;
const $stage = () => document.getElementById('stage');

function report(){
  const recs = S.recs.length ? S.recs : ITEMS.map(it=>({ uid:it.uid, o:autoOk(it)?'ok':'ng' }));
  const res={}; recs.forEach(r=>res[r.uid]=r.o);
  const done=ITEMS.filter(i=>res[i.uid]);
  const byG=new Map(); done.forEach(i=>{ if(!byG.has(i.sid)) byG.set(i.sid,{ok:0,n:0}); const b=byG.get(i.sid); if(res[i.uid]==='ok') b.ok++; b.n++; });
  const crit=done.filter(i=>i.sev==='crit'), critOk=crit.filter(i=>res[i.uid]==='ok').length;
  const nx=done.filter(i=>res[i.uid]==='ok').map(nextDays).sort((a,b)=>a-b);
  const ok=done.filter(i=>res[i.uid]==='ok').length;
  return { res, n:done.length, ok, ng:done.length-ok, pct:Math.round(ok/Math.max(1,done.length)*100), grp:[...byG.entries()].sort((a,b)=>b[1].n-a[1].n), crit, critOk, med:nx.length?nx[Math.floor(nx.length/2)]:null };
}

// ── ① 開始前 ────────────────────────────────────────────────────────
function showBrief(){
  clearLayers();
  const p=P(), c=counts(), ov=document.createElement('div');
  ov.className='ov '+p.cls; ov.setAttribute('role','dialog'); ov.setAttribute('aria-modal','true');
  ov.innerHTML='<div class="box">'+
    '<div class="head"><div><div class="eye">'+p.eye+'</div><h3 class="ttl">定着プロトコル</h3><div class="dt">'+dateStr()+'</div></div>'+
      (plan==='C'?'':'<div class="count"><b>'+N+'</b><span>問</span></div>')+'</div>'+
    '<div class="sig"><svg viewBox="0 0 320 180">'+p.sig(it=>it.sev, null)+'</svg></div>'+
    '<div class="sev"><span><i style="background:'+p.sev[0]+'"></i>大きく遅れ<b>'+c.crit+'</b></span><span><i style="background:'+p.sev[1]+'"></i>遅れ<b>'+c.warn+'</b></span><span><i style="background:'+p.sev[2]+'"></i>予定どおり<b>'+c.stable+'</b></span></div>'+
    '<div class="subs">'+groups().map(g=>'<div>'+esc(subj(g.sid).name)+'<b>'+g.pts.length+'</b></div>').join('')+'</div>'+
    '<div class="how">'+p.how+'</div>'+
    '<div class="btns"><button class="back">あとで</button><button class="go">開始</button></div></div>';
  document.body.appendChild(ov);
  ov.querySelector('.go').onclick=()=>{ ov.remove(); setStage('run'); };
  ov.querySelector('.back').onclick=()=>ov.remove();
  ov.addEventListener('click',e=>{ if(e.target===ov) ov.remove(); });
  $stage().innerHTML='<p class="hint">開始前の画面は全画面で重なります。背景か「あとで」で閉じ、「開始」で②へ進みます。</p>';
}

// ── ② 解答中の画面下のボード ─────────────────────────────────────────
function hudEl(){
  let h=document.getElementById('hud');
  if(!h){ const p=P(); h=document.createElement('div'); h.id='hud'; h.className='hud hide '+p.cls; h.setAttribute('role','status');
    h.innerHTML = plan==='D'
      ? '<div class="row"><span class="tag">∞ 定着プロトコル</span><span class="cnt"></span></div><div class="piles"><span class="stk deck"><i></i><i></i><i></i></span><span>山札<b class="dk"></b></span><span class="sp"></span><span class="stk ok"><i></i><i></i><i></i></span><span class="o">定着<b class="ko"></b></span><span class="stk ng"><i></i><i></i><i></i></span><span class="x">もう一度<b class="kx"></b></span></div>'
      : '<div class="row"><span class="tag">∞ 定着プロトコル</span><span class="cnt"></span></div><div class="mini">'+p.mini()+'</div>';
    document.body.appendChild(h); requestAnimationFrame(()=>requestAnimationFrame(()=>h.classList.remove('hide'))); }
  return h;
}
function paint(){
  const h=hudEl(), res={}, now=nowUid(); S.recs.forEach(r=>res[r.uid]=r.o);
  h.querySelector('.cnt').innerHTML='<b>'+S.recs.length+'</b> / '+N+'　<span class="o">定着 '+outN('ok')+'</span>　<span class="x">もう一度 '+outN('ng')+'</span>';
  h.querySelectorAll('[data-u]').forEach(el=>{ const [b,...rest]=el.dataset.b.split(' '), u=el.dataset.u; el.setAttribute('class', b+' '+(res[u]||rest.join(' '))+(!res[u]&&u===now?' now':'')); });
  if(plan==='A'){ // 正解した拍は整った波形に描き直す
    h.querySelectorAll('path[data-u]').forEach(el=>{ const it=ITEMS.find(i=>i.uid===el.dataset.u); const k=ITEMS.indexOf(it); if(res[it.uid]==='ok'){ const t=document.createElement('div'); t.innerHTML='<svg>'+beat(k*20,26,it,'ok',.8)+'</svg>'; el.setAttribute('d', t.querySelector('path').getAttribute('d')); } });
  }
  if(plan==='D'){ h.querySelector('.dk').textContent=N-S.recs.length; h.querySelector('.ko').textContent=outN('ok'); h.querySelector('.kx').textContent=outN('ng'); }
}
function pop(o){
  const r=hudEl().getBoundingClientRect(), el=document.createElement('div');
  el.className='pop '+P().cls+' '+o; el.textContent=OUT[o];
  el.style.left=(r.left+r.width/2)+'px'; el.style.top=(r.top-38)+'px';
  document.body.appendChild(el); setTimeout(()=>el.remove(),1100);
}
function answer(ok){ if(S.i>=N) return; const it=ITEMS[S.i++], o=ok?'ok':'ng'; S.recs.push({uid:it.uid,o}); pop(o); paint(); renderRun(); }
function renderRun(){
  const it=ITEMS[S.i];
  $stage().innerHTML=(it?'<div class="mockq"><span class="qn">Q.'+it.uid.split('_q')[1]+'</span>　<span style="font-size:12px;opacity:.7">'+esc(subj(it.sid).name)+'</span><div class="qt">（問題文の見本）62歳の男性。……最も考えられるのはどれか。</div>'+
      ['a','b','c','d','e'].map(k=>'<div class="ch">'+k+'　選択肢</div>').join('')+'</div>'
      :'<div class="mockq"><div class="qt">全'+N+'問を解き終えました。③ 結果へ。</div></div>')+
    '<div class="sim"><button class="ok">正解させる</button><button class="ng">誤答させる</button><button class="auto">残りを自動で</button><button class="rst">最初から</button></div>'+
    '<p class="hint">画面下がボードです（表示だけで押せません）。</p>';
  const st=$stage();
  st.querySelector('.ok').onclick=()=>answer(true);
  st.querySelector('.ng').onclick=()=>answer(false);
  st.querySelector('.auto').onclick=()=>{ const step=()=>{ if(S.i>=N||stage!=='run') return; answer(autoOk(ITEMS[S.i])); setTimeout(step,240); }; step(); };
  st.querySelector('.rst').onclick=()=>{ reset(); document.getElementById('hud')?.remove(); paint(); renderRun(); };
}
function showRun(){ clearLayers(); paint(); renderRun(); }

// ── ③ 結果 ─────────────────────────────────────────────────────────
function showRes(){
  clearLayers(); const p=P(), R=report();
  const st = it => R.res[it.uid] || it.sev;
  $stage().innerHTML='<div class="sumwrap"><div class="fake">ここより上に今の結果画面（正答率・所要時間など）が並び、下のブロックが差し替わります。'+(S.recs.length?'':'②で解いていないので見本の正誤で埋めています。')+'</div>'+
    '<div class="res '+p.cls+'"><div class="eye">'+p.eye+' · 結果</div>'+
      '<div class="hl"><span class="num">'+R.n+'</span>問のうち <span class="num">'+R.ok+'</span>問が定着</div>'+
      '<div class="sig"><svg viewBox="0 0 320 180">'+p.sig(st, R)+'</svg></div>'+
      '<div class="stats"><div><b>'+R.pct+'%</b><span>定着率</span></div><div><b>'+R.ng+'</b><span>明日もう一度</span></div><div><b>'+R.critOk+'/'+R.crit.length+'</b><span>大きく遅れ→定着</span></div><div><b>'+(R.med!=null?R.med+'日':'—')+'</b><span>次に会うまで</span></div></div>'+
      '<div class="bars">'+R.grp.map(([sid,b])=>'<div class="rw"><span>'+esc(subj(sid).name)+'</span><span class="tr"><i style="width:'+(b.ok/b.n*100).toFixed(1)+'%"></i></span><span class="v">'+b.ok+'/'+b.n+'</span></div>').join('')+'</div>'+
    '</div></div>';
}

function clearLayers(){ document.querySelectorAll('.ov,.hud,.pop').forEach(e=>e.remove()); }
function setStage(s){ stage=s; document.querySelectorAll('#stages button').forEach(b=>b.classList.toggle('on',b.dataset.s===s));
  if(s==='brief') showBrief(); else if(s==='run') showRun(); else showRes(); }
function setPlan(k){ plan=k; document.querySelectorAll('#plans button').forEach(b=>b.classList.toggle('on',b.dataset.k===k)); reset(); setStage(stage); }

document.getElementById('plans').innerHTML=Object.entries(PLANS).map(([k,p])=>'<button data-k="'+k+'"><b>'+esc(p.name)+'</b><small>'+esc(p.desc)+'</small></button>').join('');
document.querySelectorAll('#plans button').forEach(b=>b.onclick=()=>setPlan(b.dataset.k));
document.querySelectorAll('#stages button').forEach(b=>b.onclick=()=>setStage(b.dataset.s));
setPlan('A');
</script>
</body>
