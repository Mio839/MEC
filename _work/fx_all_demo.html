<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>試験演出の一覧</title>
<!--
  試験モードの演出を1つずつ再生して、要る・要らないを決めるためのページ（2026-09-28）。
  右（下）の枠は本物の study.html（麻酔科）で、演出はその中の本物の関数を呼んで出す＝見た目・テーマ・CSS は実物と同じ。
  ⚠️ 枠の中では localStorage / sessionStorage への書き込みと GitHub への通信を止めてから試験を始める。
     演出を出すだけで、解答の記録・SRS・XP・中断データは1つも書かない（選択肢のタップも止めてある）。
  ⚠️ 本物の関数を名前で呼んでいるので、study_exam.js で関数名や引数を変えるとここのボタンが黙って壊れる
     （押すと下にエラーが出る）。テストの対象ではない。
  「削除候補」の印は、このページの localStorage（mec_fxdemo_marks_v1）にだけ保存する（同期しない）。
-->
<style>
  :root{--bg:#0E1420;--panel:#151D2C;--line:#2A3650;--tx:#E8EEF8;--sub:#93A3BD;--acc:#6EA8FF;--warn:#FF9B6B;--ok:#58D39A;}
  *{box-sizing:border-box;}
  html,body{height:100%;margin:0;background:var(--bg);color:var(--tx);font-family:-apple-system,'Hiragino Sans','Noto Sans JP',sans-serif;}
  .wrap{display:flex;height:100%;}
  .side{width:360px;flex:none;display:flex;flex-direction:column;border-right:1px solid var(--line);background:var(--panel);}
  .top{padding:6px 10px;border-bottom:1px solid var(--line);display:flex;flex-direction:column;gap:4px;}
  .top h1{font-size:12px;margin:0;color:var(--sub);font-weight:700;}
  .row{display:flex;gap:6px;align-items:center;flex-wrap:wrap;font-size:12.5px;}
  .top .row{font-size:11px;gap:4px 6px;}
  select,.tbtn{font-size:13px;padding:5px 8px;border-radius:8px;border:1px solid var(--line);background:#1D2738;color:var(--tx);}
  .top select,.top .tbtn{font-size:11px;padding:2px 5px;border-radius:6px;}
  .top label{white-space:nowrap;}
  .tbtn{cursor:pointer;font-weight:700;}
  #status{font-size:10.5px;color:var(--sub);min-height:1.2em;line-height:1.3;}
  /* タブ（上部と下部の削除候補の欄は全タブ共通） */
  .tabs{display:flex;border-bottom:1px solid var(--line);flex:none;}
  .tabs button{flex:1;min-width:0;padding:7px 2px 6px;border:0;border-bottom:2px solid transparent;background:none;color:var(--sub);
    font-size:12px;font-weight:700;cursor:pointer;line-height:1.25;}
  .tabs button.on{color:var(--tx);border-bottom-color:var(--acc);background:rgba(110,168,255,.07);}
  .tabs button i{display:block;font-style:normal;font-size:10px;font-weight:600;color:var(--warn);min-height:1.1em;}
  .pane[hidden]{display:none;}
  .pane > h2:first-child{margin-top:8px;}
  #status.err{color:var(--warn);}
  .list{flex:1;min-height:0;overflow-y:auto;padding:4px 10px 40px;-webkit-overflow-scrolling:touch;}
  h2{font-size:12.5px;color:var(--acc);margin:14px 2px 6px;letter-spacing:.04em;}
  .it{display:flex;gap:8px;align-items:flex-start;padding:7px 6px;border-radius:10px;}
  .it:hover{background:rgba(255,255,255,.03);}
  .it input{width:18px;height:18px;margin-top:5px;flex:none;accent-color:var(--warn);}
  .it button{flex:1;text-align:left;padding:8px 10px;border-radius:10px;border:1px solid var(--line);background:#1B2435;color:var(--tx);
    font-size:13px;font-weight:700;line-height:1.4;cursor:pointer;}
  .it button:active{background:#243049;}
  .it.marked button{border-color:var(--warn);opacity:.75;}
  .it small{display:block;font-weight:500;color:var(--sub);font-size:11px;margin-top:2px;}
  .tag{display:inline-block;font-size:10px;font-weight:700;padding:1px 6px;border-radius:6px;margin-right:4px;vertical-align:1px;}
  .tag.c{background:rgba(110,168,255,.18);color:#9CC2FF;}
  .tag.t{background:rgba(88,211,154,.16);color:#8CE3BA;}
  .tag.x{background:rgba(255,155,107,.18);color:#FFB895;}
  .foot{padding:10px 12px;border-top:1px solid var(--line);display:flex;gap:8px;align-items:center;flex-wrap:wrap;}
  .foot span{font-size:12px;color:var(--sub);}
  #bClear.armed{border-color:var(--warn);color:var(--warn);}
  /* コピーに失敗したときの受け皿。iOS がフォーカス時に自動ズームしないよう 16px 以上 */
  #copyBox{width:100%;height:120px;font-size:16px;border-radius:8px;border:1px solid var(--warn);background:#0B111B;color:var(--tx);padding:6px;}
  .tbtn.sm{font-size:12px;padding:4px 8px;}
  .stage{flex:1;position:relative;min-width:0;}
  iframe{position:absolute;inset:0;width:100%;height:100%;border:0;background:#000;}
  @media (max-width: 820px){
    .wrap{flex-direction:column-reverse;}
    .side{width:auto;height:48%;border-right:0;border-top:1px solid var(--line);}
    .stage{height:52%;flex:none;}
  }
</style>
</head>
<body>
<div class="wrap">
  <div class="side">
    <div class="top">
      <div class="row">
        <label>テーマ <select id="ui">
          <option value="aurora">aurora</option><option value="brass">brass</option><option value="cyber">cyber</option>
          <option value="liquid">liquid</option><option value="kintsugi">kintsugi</option><option value="celestial">celestial</option>
          <option value="abyss" selected>abyss</option><option value="frost">frost</option></select></label>
        <label>連続 <select id="streak">
          <option value="1">1</option><option value="2">2</option><option value="3">3</option><option value="5">5</option>
          <option value="7">7</option><option value="10">10</option><option value="14">14</option><option value="20">20</option></select></label>
        <button class="tbtn" id="bReset" title="カードを元に戻す">元に戻す</button>
        <button class="tbtn" id="bNext" title="次のカードへ">次へ</button>
        <button class="tbtn" id="bReload" title="枠を読み直す">再読込</button>
      </div>
      <div id="status">読み込み中…</div>
    </div>
    <div class="tabs" id="tabs"></div>
    <div class="list" id="list"></div>
    <div class="foot">
      <button class="tbtn" id="bCopy">削除候補をコピー</button>
      <button class="tbtn" id="bClear">削除候補をクリア</button>
      <span id="markCount">0件</span>
      <textarea id="copyBox" readonly hidden></textarea>
    </div>
  </div>
  <div class="stage"><iframe id="fr" src="../study.html?sid=anes"></iframe></div>
</div>
<script>
/* ── 演出の台帳。code は枠の中（study.html のグローバル）で実行する。
   使える名前: c＝いま画面にあるカード / ok＝正解の肢 / ng＝不正解の肢 / n＝連続正解 / t＝その段（_examTier(n)） ── */
const TAG = { c: '共通', t: 'テーマ別', x: '旧・study.html' };
/* 左側のタブ。台帳の各欄をどのタブに入れるかは placeOf が決める（「正解のたびに出る」はタグで テーマ別／共通 に分ける） */
const TABS = [['theme', 'テーマ固有'], ['common', '共通'], ['wrong', '誤答・その他'], ['begin', '開始・結果']];
const placeOf = (sec, tag) => sec === '正解のたびに出る' ? (tag === 't' ? 'theme' : 'common')
  : sec === '連続正解で出る' ? 'common' : sec === '始まりと終わり' ? 'begin' : 'wrong';
const FX = [
  ['正解のたびに出る', [
    ['c-all', 't', '正解1回ぶんを通しで', '下の演出がまとめて順に出る（_rfCorrectFx）。記録はしない。段が上がった瞬間かどうかは連続数（3/5/7/10/14/20 ちょうど）で自動で決まる', `_rfCorrectFx(c, ok, RF_ADVANCE_MS.one)`],
    ['c-legacy', 'x', 'タップした肢の旧演出', '毎回・肢の左端：画面全体の薄いフラッシュ＋3重の輪＋浮かぶ記号（✓◆など）＋粒2回＋肢の枠の波紋（study.html の mecFireCorrect・_spawnChoiceRipple）',
      `ok.classList.remove('exam-instant-correct'); void ok.offsetWidth; ok.classList.add('exam-instant-correct'); setTimeout(() => ok.classList.remove('exam-instant-correct'), 50)`],
    ['c-card', 't', 'カードの正解表示', '毎回：カードと正解の肢の色・発光（UIテーマの CSS）。3/5/10連続でカードの段が上がる', `_applyCardThemeComboFx(c, n)`],
    ['c-sweep', 'c', '正解の肢の縁を光が1周', '毎回・0.3秒（_rfSweep）', `_rfSweep(ok, RF_ADVANCE_MS.one - RF_FX_END_MARGIN)`],
    ['c-particles', 't', 'UIテーマの粒子', '毎回・肢の位置：照準・金継ぎ・氷晶・歯車など（_spawnStreakParticles）', `_spawnStreakParticles(Math.max(1, t), _rfCenter(ok), { el: ok, card: c, promoted: up })`],
    ['c-theme', 't', 'UIテーマ固有の正解演出', 'liquid・frost・celestial・brass だけ：肢の層は送る前に終わり、全画面の層は元の尺（2〜3秒）で重なる',
      `const u = _rfUi(), B = RF_ADVANCE_MS.one;
       if (u === 'liquid') _lqLiquidFx(ok, c, t, up, B); else if (u === 'frost') _frFrostFx(ok, c, t, up, B);
       else if (u === 'celestial') _clxCelestialFx(ok, c, t, up, B); else if (u === 'brass') _brsBrassFx(ok, c, t, up, B);
       else throw new Error('このUIテーマには固有の正解演出が無い（liquid / frost / celestial / brass で試す）')`],
  ]],
  ['連続正解で出る', [
    ['s-streak', 'c', '連続数の表示', '2連続〜・ヘッダーの下（_rfShowStreak）', `_rfShowStreak(Math.max(2, n), _examTier(Math.max(2, n)), false)`],
    ['s-streak-up', 'c', '連続数の表示（段が上がった瞬間）', '3/5/7/10/14/20連続に届いたとき', `_rfShowStreak(Math.max(3, n), _examTier(Math.max(3, n)), true)`],
  ]],
  ['条件つきの正解', [
    ['p-reach', 'c', '選び直して正解', '1回外してから正解：「2回目で正解」の印＋小さな輪（_rfReachFx）', `_rfSweep(ok); _rfReachFx(ok, 2, true)`],
  ]],
  ['間違えたとき', [
    ['w-out', 'c', '外した肢に × と選び直しの案内', '毎回：肢が揺れ、カードの色が一瞬抜ける（_rfWrongPick の見た目だけ）',
      `ng.classList.add('exam-out'); if (!ng.querySelector(':scope > .rf-x')) { const x = document.createElement('span'); x.className = 'rf-x'; x.textContent = '×'; ng.appendChild(x); x.animate([{ opacity: 0, scale: '.6' }, { opacity: 1, scale: '1' }], { duration: MO.d2, easing: MO.spring }); }
       c.classList.add('exam-retry'); c._rfTries = (c._rfTries || 0) + 1; _rfRetryNote(c, c._rfTries, false);
       ng.animate([{ translate: '0 0' }, { translate: '-3px 0' }, { translate: '2px 0' }, { translate: '0 0' }], { duration: MO.d2, easing: MO.out });
       c.animate([{ filter: 'saturate(1) brightness(1)' }, { filter: 'saturate(.6) brightness(.95)', offset: .3 }, { filter: 'saturate(1) brightness(1)' }], { duration: RF_DESAT_MS, easing: MO.out })`],
    ['w-repeat', 'c', '前にも同じ肢を選んだ', '以前と同じ誤答の肢を選んだとき（_triggerRepeatWrong）', `_triggerRepeatWrong(ng)`],
  ]],
  ['読んでいる間・次へ進むとき', [
    ['r-shimmer', 'c', '次のカードの肢が順に光る', '次のカードへ送った直後（_applyChoiceShimmer）', `_applyChoiceShimmer(c)`],
  ]],
  ['始まりと終わり', [
    ['b-count', 'c', '起動カウントダウン', '試験を始めたとき・3・2・1（起動音が鳴る）（_examCountdown）', `_examCountdown()`],
    ['b-shuffle', 'c', '選択肢の並べ替えを見せる', '1問目だけ・肢が元の位置から滑る（_revealShuffleFx）',
      `_revealShuffleFx([...c.querySelectorAll('.ch2')].map((el, i) => ({ el, dy: (i % 2 ? -1 : 1) * 48 })))`],
    ['b-resume', 'c', '続きから再開', '中断した試験を再開したとき（_playResumeIntroFx）', `_playResumeIntroFx()`],
    ['b-res100', 't', '結果画面（100%）', 'ランク刻印 PERFECT＋テーマの祝賀（showExamSummary）', `__D.summary(100)`],
    ['b-res85', 't', '結果画面（85%）', 'ランク A＋テーマの祝賀', `__D.summary(85)`],
    ['b-res70', 'c', '結果画面（70%）', 'ランク B＋小さな祝賀', `__D.summary(70)`],
    ['b-res40', 'c', '結果画面（40%）', 'ランク C＋輪2本', `__D.summary(40)`],
    ['b-srs', 'c', '復習を完走', 'SRS 復習・今日の誤答を最後まで解いたとき：🔔🎉 の雨と紙吹雪（_srsCompleteCelebration）', `_srsCompleteCelebration()`],
    ['b-close', 'c', '（結果画面を閉じる）', '', `_closeSummaryOverlayOnly()`],
  ]],
];

/* ── 枠の中の準備 ── */
const fr = document.getElementById('fr'), statusEl = document.getElementById('status');
const say = (m, err) => { statusEl.textContent = m; statusEl.classList.toggle('err', !!err); };
let W = null, ready = false;

const HELPER = `
window.__D = {
  card() {
    const t = _getExamTargetCard();
    if (t) return t;
    return examQueue.find(c => c.style.display !== 'none') || examQueue[0];
  },
  reset() {
    const c = this.card();
    ['fx-correct','combo-streak-3','combo-streak-5','combo-streak-10','exam-retry']
      .forEach(k => c.classList.remove(k));
    c.querySelectorAll('.ch2').forEach(ch => { ch.classList.remove('correct','exam-out','exam-selected','exam-instant-correct'); ch.removeAttribute('aria-disabled'); });
    c.querySelectorAll('.rf-x,.rf-retry,.rf-reach,.rf-sweep,.lq-layer,.fr-dust').forEach(e => e.remove());
    c._rfTries = 0;
    _rfHideStreak();
  },
  next() {
    const c = this.card(), i = examQueue.indexOf(c), nx = examQueue[i + 1];
    if (nx) { const hdr = document.querySelector('.st-hdr'); window.scrollTo({ top: nx.getBoundingClientRect().top + scrollY - (hdr ? hdr.offsetHeight + 12 : 12) }); }
  },
  summary(pct) {
    const total = 20, cor = Math.round(total * pct / 100);
    examAnswered = total; examCorrect = cor; examWrong = []; examByChapter = {};
    examBySubj = { anes: { correct: cor, total } }; _examActiveChPrefix = null;
    showExamSummary();
  }
};`;

/* ── UIテーマ固有の正解演出を部品に分ける（枠の中の関数を包む）──
   window.__P が Set のとき、その中にある部品だけを描く（null＝全部）。本物の study_exam.js は書き換えない。
   - brass・celestial：部品ごとの関数（_brsGearTrain・_clxNova・_clxGalaxy 等）を包み、外した部品は draw を空にする（火花・押し込みも止める）。
   - liquid：_lqSoapFilm（肢の膜）・_lqGlassWave・_lqChroma・_lqNeon・_lqCardJelly・_lqJellyDrops を空にし、_lqBlow（玉）は空の配列・
     _lqGiantBubble（大きな玉）は null を返させる。_lqJelly は肢の弾みだけを外せるよう包み直す。
   - frost：canvas に「どの層か」と「その時の __P」を貼っておき、描画の小関数（_frDrawFrost・_frDrawFlake・
     _frGlint・_frMelt）を種類で見分ける。霞は肢の層の fillRect（destination-out 以外）を止めて消す。
   - kintsugi・abyss・aurora・cyber：_spawnStreakParticles が呼ぶ MecFX の関数を包む。
   ⚠️ 見分け方は本物の引数（霜の不透明度 .7／.8、_frFlake を呼ぶ順番など）に寄りかかっている。
      study_exam.js の演出を作り直したら、ここも合わせて直すこと。 */
const PARTCTL = `
(() => {
  const on = (k, P) => !P || P.has(k);
  const wrap = (name, mk) => { const o = window[name]; if (typeof o === 'function') window[name] = mk(o); };
  // brass・celestial：部品の関数
  const part = (name, key) => wrap(name, o => function () {
    if (on(key, window.__P)) return o.apply(this, arguments);
    const p = o.apply(this, [...arguments].map(a => typeof a === 'function' ? () => {} : a));
    return Object.assign({}, p, { draw() {} });
  });
  [['_brsGearTrain', 'brs.gear'], ['_brsHallmark', 'brs.hall'], ['_brsFiligree', 'brs.fil'], ['_brsBigTrain', 'brs.bigtrain'],
   ['_brsMedallion', 'brs.medal'], ['_brsCornerCast', 'brs.corner'],
   ['_clxNova', 'clx.nova'], ['_clxGalaxy', 'clx.galaxy'], ['_clxTrails', 'clx.trails'], ['_clxZodiac', 'clx.zodiac'],
   ['_clxWeb', 'clx.web'], ['_clxGrid', 'clx.grid']].forEach(([n, k]) => part(n, k));
  // celestial：超新星／銀河の渦はセッションごとの抽選（_clxSessionPick）。部品で片方だけを選んだときはその側に寄せる。
  // 重ねる4つ（CLX_EXTRAS）は正解のたびの抽選なので、部品で選んだものだけから抽選させる（配列の中身を一時的に差し替える）
  wrap('_clxCelestialFx', o => function () {
    const P = window.__P;
    if (P && P.has('clx.nova') !== P.has('clx.galaxy')) _clxSessionPick = P.has('clx.galaxy') ? 'galaxy' : 'nova';
    const X = typeof CLX_EXTRAS !== 'undefined' ? CLX_EXTRAS : null, keep = X ? X.slice() : null;
    const sel = X && P ? keep.filter(k => P.has('clx.' + k)) : [];
    if (sel.length) X.splice(0, X.length, ...sel);
    try { return o.apply(this, arguments); } finally { if (X) X.splice(0, X.length, ...keep); }
  });
  // liquid
  wrap('_lqSoapFilm', o => function () { return on('lq.film', window.__P) ? o.apply(this, arguments) : undefined; });
  wrap('_lqBlow', o => function () { return on('lq.blow', window.__P) ? o.apply(this, arguments) : []; });
  wrap('_lqGiantBubble', o => function () { return on('lq.giant', window.__P) ? o.apply(this, arguments) : null; });
  wrap('_lqGlassWave', o => function () { return on('lq.glass', window.__P) ? o.apply(this, arguments) : undefined; });
  wrap('_lqChroma', o => function () { return on('lq.chroma', window.__P) ? o.apply(this, arguments) : undefined; });
  wrap('_lqNeon', o => function () { return on('lq.neon', window.__P) ? o.apply(this, arguments) : undefined; });
  wrap('_lqCardJelly', o => function () { return on('lq.cjelly', window.__P) ? o.apply(this, arguments) : undefined; });
  wrap('_lqJellyDrops', o => function () { return on('lq.jdrops', window.__P) ? o.apply(this, arguments) : undefined; });
  wrap('_lqJelly', o => function (el, card, tier, promoted) {   // 肢の弾みを外しても、カードの揺れと玉は部品の指定どおりに出す
    if (on('lq.jelly', window.__P)) return o.apply(this, arguments);
    if (!el || !card) return;
    const t = Math.max(1, tier), up = promoted && tier >= 2;
    _rfK = 1; if (t >= 3 || up) _lqCardJelly(card, up); _lqJellyDrops(el.getBoundingClientRect(), t, up);
  });
  // frost
  let inFrost = false, flakes = null, nFl2 = 0;
  wrap('_frFlakeSpots', o => function () { const r = o.apply(this, arguments); nFl2 = r.length; return r; });
  wrap('_frFlake', o => function (gens) { const f = o.apply(this, arguments); f.__g = gens; if (flakes) flakes.push(f); return f; });
  wrap('_frFrostFx', o => function (el, card, tier, promoted) {
    inFrost = true; flakes = []; nFl2 = 0;
    const fl = flakes, up = promoted && tier >= 2;
    try { return o.apply(this, arguments); }
    finally {
      // 作られる順番：六花（タップ位置）→ まわりの小さな結晶（段3〜）→ 六花の2個目以降（_frFlakeSpots）→ 大きな結晶（毎回）
      const T = Math.max(1, tier), nE = T >= 3 ? Math.min(8, (T - 1) * 2) : 0;
      fl.forEach((f, i) => { f.__k = i === 0 || (i > nE && i <= nE + nFl2) ? 'fr.flake' : i <= nE ? 'fr.extra' : 'fr.big'; });
      inFrost = false; flakes = null;
    }
  });
  wrap('_frRun', o => function (ctx, w, h, dur, draw) {
    if (!inFrost) return o.apply(this, arguments);
    const p = ctx.canvas.parentNode;
    const zone = p.classList.contains('fr-dust') ? 'dust' : p.classList.contains('fr-card') ? 'full' : 'choice';
    ctx.__fr = zone; ctx.__P = window.__P ? new Set(window.__P) : null;
    const fill = ctx.fillRect;
    return o.call(this, ctx, w, h, dur, (c, e) => {
      c.__e = e; c.__gi = 0;

    if (examEffectSet !== 'classic') document.body.classList.add('exam-effect-' + examEffectSet);`);
}

function waitFrame() {
  ready = false; say('枠を読み込んでいます…');
  let tries = 0;
  const tick = () => {
    tries++;
    try {
      const w = fr.contentWindow;
      const n = w.document.querySelectorAll('.qc[data-uid] .ch2.ok').length;
      if (w.MecUITheme && typeof w.startExam === 'function' && n > 10) { setTimeout(prepFrame, 400); return; }
    } catch (e) {}
    if (tries > 150) { say('枠の読み込みに失敗しました（http で開いていますか？）', true); return; }
    setTimeout(tick, 200);
  };
  tick();
}
fr.addEventListener('load', waitFrame);

/* o.parts：描く部品のキー（無ければ全部）／o.minT・o.needUp：その部品が出る段まで引き上げる */
function run(code, o) {
  o = o || {};
  if (!ready) { say('まだ準備中です', true); return; }
  const n = o.n || +document.getElementById('streak').value, up = !!o.needUp;
  try {
    const info = W.eval(`(() => { const n = ${n}, t = Math.max(_examTier(n), ${o.minT || 0}), up = ${up} || (${!!o.autoUp} && _examTier(n) > _examTier(n - 1)); examStreak = n;
      window.__P = ${o.parts ? 'new Set(' + JSON.stringify(o.parts) + ')' : 'null'};
      const c = __D.card(); if (!c) throw new Error('カードが見つからない');
      const ok = c.querySelector('.ch2.ok'), ng = c.querySelector('.ch2:not(.ok)');
      ${code}
      return '段 ' + t + (up ? '・段が上がった瞬間' : '');
    })()`);
    say((o.parts || o.autoUp ? '再生しました（' + (o.n ? '連続 ' + n + '・' : '') + info + '）' : '再生しました'));
  } catch (e) { say('エラー: ' + (e && e.message || e), true); }
}

/* ── ボタンと削除候補の印 ── */
const KEY = 'mec_fxdemo_marks_v1';
let marks = {};
try { marks = JSON.parse(localStorage.getItem(KEY) || '{}') || {}; } catch (e) {}
const saveMarks = () => { try { localStorage.setItem(KEY, JSON.stringify(marks)); } catch (e) {} updCount(); };
const updCount = () => {
  document.getElementById('markCount').textContent = Object.keys(marks).filter(k => marks[k]).length + '件';
  if (typeof updTabCounts === 'function' && tabBtns.theme) updTabCounts();
};

const list = document.getElementById('list'), tabsEl = document.getElementById('tabs');
const panes = {}, tabBtns = {};
TABS.forEach(([k, label]) => {
  const p = document.createElement('div'); p.className = 'pane'; p.dataset.tab = k; panes[k] = p; list.appendChild(p);
  const b = document.createElement('button'); b.type = 'button'; b.innerHTML = label + '<i></i>';
  b.onclick = () => showTab(k); tabBtns[k] = b; tabsEl.appendChild(b);
});
const TAB_KEY = 'mec_fxdemo_tab_v1';
function showTab(k) {
  if (!panes[k]) k = 'theme';
  Object.keys(panes).forEach(t => { panes[t].hidden = t !== k; tabBtns[t].classList.toggle('on', t === k); });
  list.scrollTop = 0;
  try { localStorage.setItem(TAB_KEY, k); } catch (e) {}
}
/* 各タブに付いている削除候補の印の数（部品は表示中のテーマの分） */
function updTabCounts() {
  Object.keys(panes).forEach(k => {
    const n = [...panes[k].querySelectorAll('.it input')].filter(cb => cb.checked).length;
    tabBtns[k].querySelector('i').textContent = n ? '印 ' + n : '';
  });
}
const secHead = {};
FX.forEach(([sec, items]) => {
  items.forEach(([id, tag, name, when, code]) => {
    const pane = panes[placeOf(sec, tag)];
    if (!secHead[sec + '|' + pane.dataset.tab]) {
      const h = document.createElement('h2'); h.textContent = sec; pane.appendChild(h); secHead[sec + '|' + pane.dataset.tab] = 1;
    }
    const row = document.createElement('div'); row.className = 'it' + (marks[id] ? ' marked' : '');
    const cb = document.createElement('input'); cb.type = 'checkbox'; cb.title = '削除候補'; cb.checked = !!marks[id];
    cb.onchange = () => { marks[id] = cb.checked; row.classList.toggle('marked', cb.checked); saveMarks(); };
    const b = document.createElement('button');
    b.innerHTML = '<span class="tag ' + tag + '">' + TAG[tag] + '</span>';
    b.appendChild(document.createTextNode(name));
    if (when) { const s = document.createElement('small'); s.textContent = when; b.appendChild(s); }
    b.onclick = () => run(code);
    row.dataset.name = sec + '／' + name + '（' + id + '）';
    row.append(cb, b); pane.appendChild(row);
    if (id === 'b-close') cb.remove();
  });
});
/* ── UIテーマ固有の正解演出を部品ごとに（テーマを切り替えると作り直す） ── */
let seqBtn = null, seqTimer = 0;   // 第5弾の「順に再生」
function stopSeq() { clearTimeout(seqTimer); if (seqBtn) seqBtn.textContent = seqBtn.dataset.label; seqBtn = null; }
const partsBox = document.createElement('div');
panes.theme.prepend(partsBox);
function renderParts() {
  const ui = document.getElementById('ui').value, P = PARTS[ui] || [];
  partsBox.innerHTML = '';
  if (ui === 'celestial') {   // 新案（第4弾・第3弾・第2弾）。本番の部品の上に並べる。段と「段が上がった瞬間」は上の連続数の設定どおり
    const n0 = document.createElement('div'); n0.style.cssText = 'font-size:11px;color:var(--sub);margin:8px 8px 0;line-height:1.5';
    n0.textContent = '新案は単独で再生する（本番の超新星／銀河の渦＋星の軌跡とは重ねない）。連続数を 3/5/7/10… にすると「段が上がった瞬間」の版。デモ専用で本番にはまだ入っていない。';
    partsBox.appendChild(n0);
    const h6 = document.createElement('h2'); h6.textContent = 'celestial 正解演出の新案 第6弾（全画面・③ 星の網は本番へ移した）'; partsBox.appendChild(h6);
    CLX_NEW6.forEach(([key, name, onOk, onStreak]) => {
      const row = document.createElement('div'); row.className = 'it';
      const b = document.createElement('button');
      b.innerHTML = '<span class="tag x" style="background:rgba(255,209,102,.2);color:#FFD166">全画面</span>';
      b.appendChild(document.createTextNode(name));
      const s1 = document.createElement('small'); s1.textContent = '正解時：' + onOk; b.appendChild(s1);
      const s2 = document.createElement('small'); s2.textContent = '連続正解時：' + onStreak; b.appendChild(s2);
      b.onclick = () => { stopSeq(); run(`__clxNew6('${key}', ok, c, t, up, RF_ADVANCE_MS.one)`, { autoUp: true }); };
      row.append(b); partsBox.appendChild(row);
    });
    const h5 = document.createElement('h2'); h5.textContent = 'celestial 正解演出の新案 第5弾（連続正解の見せ方を変えた5つ）'; partsBox.appendChild(h5);
    const n5 = document.createElement('div'); n5.style.cssText = 'font-size:11px;color:var(--sub);margin:0 8px 4px;line-height:1.5';
    n5.textContent = '「▶ 1→N を順に」は連続 1, 2, 3 … と1回ずつ自動で再生する（積み上がる・登っていく案で、連続正解がどう育つかを見る用）。もう一度押すか別のボタンを押すと止まる。';
    partsBox.appendChild(n5);
    CLX_NEW5.forEach(([key, name, onOk, onStreak, seqMax]) => {
      const row = document.createElement('div'); row.className = 'it'; row.style.flexDirection = 'column'; row.style.alignItems = 'stretch';
      const b = document.createElement('button');
      b.innerHTML = '<span class="tag x" style="background:rgba(255,209,102,.2);color:#FFD166">新案</span>';
      b.appendChild(document.createTextNode(name));
      const s1 = document.createElement('small'); s1.textContent = '正解時：' + onOk; b.appendChild(s1);
      const s2 = document.createElement('small'); s2.textContent = '連続正解時：' + onStreak; b.appendChild(s2);
      b.onclick = () => { stopSeq(); run(`__clxNew5('${key}', ok, c, t, up, RF_ADVANCE_MS.one)`, { autoUp: true }); };
      row.append(b);
      if (seqMax) {
        const sb = document.createElement('button'); sb.className = 'tbtn sm'; sb.style.cssText = 'flex:none;align-self:flex-start;margin-top:4px;text-align:center';
        sb.textContent = '▶ 1→' + seqMax + ' を順に';
        sb.onclick = () => {
          if (seqBtn === sb) { stopSeq(); return; }
          stopSeq(); seqBtn = sb; let i = 1;
          const step = () => {
            if (seqBtn !== sb) return;
            sb.textContent = '■ 止める（連続 ' + i + '）';
            run(`__clxNew5('${key}', ok, c, t, up, RF_ADVANCE_MS.one)`, { autoUp: true, n: i });
            if (++i > seqMax) { seqTimer = setTimeout(stopSeq, 2300); return; }
            seqTimer = setTimeout(step, 2300);
          };
          step();
        };
        sb.dataset.label = sb.textContent;
        row.append(sb);
      }
      partsBox.appendChild(row);
    });
    [['第4弾（T 天球の経緯線は本番へ移した）', CLX_NEW4, '__clxNew4'], ['第3弾（L 黄道十二宮の輪は本番へ移した）', CLX_NEW3, '__clxNew3'], ['第2弾（G 銀河の渦は本番へ移した）', CLX_NEW2, '__clxNew2']].forEach(([title, list, fn]) => {
      const h0 = document.createElement('h2'); h0.textContent = 'celestial 正解演出の新案 ' + title; partsBox.appendChild(h0);
      list.forEach(([key, name, desc]) => {
        const row = document.createElement('div'); row.className = 'it';
        const b = document.createElement('button');
        b.innerHTML = '<span class="tag x" style="background:rgba(255,209,102,.2);color:#FFD166">新案</span>';
        b.appendChild(document.createTextNode(name));
        const sm = document.createElement('small'); sm.textContent = desc; b.appendChild(sm);
        b.onclick = () => run(fn + `('${key}', ok, c, t, up, RF_ADVANCE_MS.one)`, { autoUp: true });
        row.append(b); partsBox.appendChild(row);
      });
    });
  }
  if (ui === 'abyss') {   // 新案。本番の部品（ソナー・輪）の上に並べる。段と「段が上がった瞬間」は上の連続数の設定どおり
    const n0 = document.createElement('div'); n0.style.cssText = 'font-size:11px;color:var(--sub);margin:8px 8px 0;line-height:1.5';
    n0.textContent = '今の「ソナー＋輪」を置き換える候補。新案は単独で再生する（本番のソナーとは重ねない）。連続数を 3/5/7/10… にすると「段が上がった瞬間」の版、5以上で段3〜の版。デモ専用で本番にはまだ入っていない。';
    partsBox.appendChild(n0);
    const ha = document.createElement('h2'); ha.textContent = 'abyss 正解演出の新案（5つ）'; partsBox.appendChild(ha);
    ABY_NEW.forEach(([key, name, onOk, onStreak]) => {
      const row = document.createElement('div'); row.className = 'it';
      const b = document.createElement('button');
      b.innerHTML = '<span class="tag x" style="background:rgba(0,255,163,.16);color:#64FFDA">新案</span>';
      b.appendChild(document.createTextNode(name));
      const s1 = document.createElement('small'); s1.textContent = '正解時：' + onOk; b.appendChild(s1);
      const s2 = document.createElement('small'); s2.textContent = '連続正解時：' + onStreak; b.appendChild(s2);
      b.onclick = () => { stopSeq(); run(`__abyNew('${key}', ok, c, t, up, RF_ADVANCE_MS.one)`, { autoUp: true }); };
      row.append(b); partsBox.appendChild(row);
    });
  }
  const h = document.createElement('h2'); h.textContent = 'UIテーマ固有の正解演出を部品ごとに（' + ui + '）'; partsBox.appendChild(h);
  const top = document.createElement('div'); top.className = 'row'; top.style.margin = '0 6px 4px';
  const all = document.createElement('button'); all.className = 'tbtn sm'; all.textContent = '全部を再生';
  all.onclick = () => run(THEME_FX_CODE);
  const rest = document.createElement('button'); rest.className = 'tbtn sm'; rest.textContent = '削除候補を外して再生';
  rest.title = '印を付けた部品を消したらどう見えるか';
  rest.onclick = () => {
    const keep = P.filter(p => !marks['part-' + p[0]]);
    if (!keep.length) { say('全部に削除候補の印が付いています', true); return; }
    run(THEME_FX_CODE, { parts: keep.map(p => p[0]), minT: Math.max(...keep.map(p => p[3])), needUp: keep.some(p => p[4]) });
  };
  top.append(all, rest); partsBox.appendChild(top);
  const note = document.createElement('div'); note.style.cssText = 'font-size:11px;color:var(--sub);margin:0 8px 4px;line-height:1.5';
  note.textContent = '部品のボタンはその部品だけを出す。段が足りない部品は、その部品が出る段まで上げて再生する（連続数の設定より優先）。';
  partsBox.appendChild(note);
  P.forEach(([key, name, desc, minT, needUp]) => {
    const id = 'part-' + key;
    const row = document.createElement('div'); row.className = 'it' + (marks[id] ? ' marked' : '');
    const cb = document.createElement('input'); cb.type = 'checkbox'; cb.title = '削除候補'; cb.checked = !!marks[id];
    cb.onchange = () => { marks[id] = cb.checked; row.classList.toggle('marked', cb.checked); saveMarks(); };
    const b = document.createElement('button');
    b.innerHTML = '<span class="tag t">部品</span>';
    b.appendChild(document.createTextNode(name));
    const s = document.createElement('small'); s.textContent = desc; b.appendChild(s);
    b.onclick = () => run(THEME_FX_CODE, { parts: [key], minT, needUp });
    row.dataset.name = 'UIテーマ固有の正解演出（' + ui + '）／' + name + '（' + key + '）';
    row.append(cb, b); partsBox.appendChild(row);
  });
}
renderParts();
let tab0 = 'theme'; try { tab0 = localStorage.getItem(TAB_KEY) || 'theme'; } catch (e) {}
showTab(tab0);
updCount();

document.getElementById('ui').onchange = () => { applyTheme(); renderParts(); updCount(); say('UIテーマを切り替えました（保存はしていません）'); };
document.getElementById('bReset').onclick = () => { if (ready) { try { W.eval('__D.reset()'); say('カードを元に戻しました'); } catch (e) { say('エラー: ' + e.message, true); } } };
document.getElementById('bNext').onclick = () => { if (ready) { W.eval('__D.reset(); __D.next()'); say('次のカードへ'); } };
document.getElementById('bReload').onclick = () => { ready = false; fr.contentWindow.location.reload(); };
document.getElementById('bCopy').onclick = async () => {
  const names = [...list.querySelectorAll('.it')].filter(r => r.querySelector('input') && r.querySelector('input').checked).map(r => '- ' + r.dataset.name);
  // 部品の一覧は表示中のテーマの分しか画面に無いので、ほかのテーマで付けた印は台帳から足す
  const curUi = document.getElementById('ui').value;
  Object.keys(PARTS).filter(ui => ui !== curUi).forEach(ui => PARTS[ui].forEach(([key, name]) => {
    if (marks['part-' + key]) names.push('- UIテーマ固有の正解演出（' + ui + '）／' + name + '（' + key + '）');
  }));
  if (!names.length) { say('削除候補がありません', true); return; }
  const text = '削除したい演出:\n' + names.join('\n');
  const box = document.getElementById('copyBox');
  box.hidden = true;
  // ① execCommand を先に（タップの処理の中で同期に走るので、http で開いたとき・枠にフォーカスがあるとき・iOS でも通る）
  // ② だめなら Clipboard API ③ それもだめなら全文を選択した欄を出す（旧 prompt() は1行欄で改行が消えていた）
  if (execCopy(text)) { say('コピーしました（' + names.length + '件）'); return; }
  try { await navigator.clipboard.writeText(text); say('コピーしました（' + names.length + '件）'); return; } catch (e) {}
  box.value = text; box.hidden = false; box.focus(); box.select(); box.setSelectionRange(0, text.length);
  say('自動でコピーできませんでした。下の欄を長押し／Ctrl+C でコピーしてください', true);
};
function execCopy(text) {
  const ta = document.createElement('textarea');
  ta.value = text; ta.setAttribute('readonly', '');
  ta.style.cssText = 'position:fixed;top:0;left:0;width:1px;height:1px;opacity:0;font-size:16px;';
  document.body.appendChild(ta);
  ta.focus(); ta.select(); ta.setSelectionRange(0, text.length);
  let ok = false;
  try { ok = document.execCommand('copy'); } catch (e) {}
  ta.remove();
  return ok;
}

/* クリアは2段階タップ（1回目で構え、3秒以内にもう1回で消す）。iOS の confirm() は使わない */
let clearTimer = 0;
const bClear = document.getElementById('bClear');
bClear.onclick = () => {
  if (!Object.keys(marks).some(k => marks[k])) { say('削除候補はありません'); return; }
  if (!bClear.classList.contains('armed')) {
    bClear.classList.add('armed'); bClear.textContent = 'もう一度押すとクリア';
    clearTimeout(clearTimer);
    clearTimer = setTimeout(() => { bClear.classList.remove('armed'); bClear.textContent = '削除候補をクリア'; }, 3000);
    return;
  }
  clearTimeout(clearTimer);
  bClear.classList.remove('armed'); bClear.textContent = '削除候補をクリア';
  const n = Object.keys(marks).filter(k => marks[k]).length;
  marks = {};
  list.querySelectorAll('.it').forEach(r => { r.classList.remove('marked'); const cb = r.querySelector('input'); if (cb) cb.checked = false; });
  document.getElementById('copyBox').hidden = true;
  saveMarks();
  say('削除候補をクリアしました（' + n + '件・ほかのテーマの部品の印も含む）');
};
</script>
