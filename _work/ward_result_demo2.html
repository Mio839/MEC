<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>定着プロトコル 結果画面 次の5案</title>
<!--
  定着プロトコル（ward.js）の結果画面の「次の5案」デモ（2026-10-01）。土台は ward.js に入れた E 案（現行の拡張）で、どの案もその上に足す形。
    1 前回と重ねる … 前回の定着率を点線の弧で先に描き、今回の弧が追い越す。差分と自己ベスト
    2 期限切れが減る … 期限切れの数が減る計器（開始時→終了時）・残りあと何回ぶん
    3 連続の鎖 … 直近7日の学習日の鎖が灯り、今日の丸が点火して連続日数が増える
    4 今日のハイライト … 最長の連続定着・いちばん遅れていた問題を取り戻した1問
    5 科目の点灯 … 科目の行が科目の色で灯る・全問定着に🏅・最高の科目に MVP
  数字は見本（前回・期限切れ・連続日数は架空）。本物の関数は呼ばない。何も保存しない。テストの対象ではない。
-->
<style>
  body{margin:0;min-height:100vh;padding:18px 16px 60px;color:#E8F6F8;font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Yu Gothic UI",sans-serif;
    background:radial-gradient(ellipse 95% 65% at 50% -18%,rgba(121,40,202,.5),transparent 68%),radial-gradient(circle at 15% 22%,rgba(0,229,255,.28),transparent 52%),linear-gradient(180deg,#050814,#03050c);}
  *{box-sizing:border-box;}
  html,body{overflow-x:clip;}
  .harness{max-width:520px;margin:0 auto;}
  .harness h1{font-size:15px;margin:0 0 4px;}
  .harness p{font-size:12.5px;line-height:1.7;opacity:.72;margin:0 0 12px;}
  .plans{display:grid;grid-template-columns:repeat(auto-fit,minmax(92px,1fr));gap:6px;margin-bottom:10px;}
  .plans button{padding:9px 10px;border-radius:12px;border:1px solid rgba(126,214,223,.28);background:rgba(18,48,58,.5);color:#E8F6F8;font:inherit;text-align:left;cursor:pointer;}
  .plans button b{display:block;font-size:13px;}
  .plans button small{display:block;font-size:10.5px;opacity:.7;margin-top:2px;line-height:1.4;}
  .plans button.on{background:#7ED6DF;color:#06201F;border-color:#7ED6DF;}
  .ctl{display:flex;flex-wrap:wrap;gap:8px 12px;align-items:center;margin-bottom:12px;}
  .ctl button{padding:9px 16px;border-radius:99px;border:0;background:#E8F6F8;color:#06201F;font:inherit;font-size:13px;font-weight:800;cursor:pointer;}
  .ctl label{font-size:13px;display:flex;align-items:center;gap:6px;cursor:pointer;}
  .ctl input{width:18px;height:18px;accent-color:#7ED6DF;}
  .ctl select{font:inherit;font-size:13px;padding:6px 8px;border-radius:8px;background:#0B1E25;color:#E8F6F8;border:1px solid rgba(126,214,223,.4);}
  .desc{font-size:12.5px;line-height:1.7;margin:0 0 10px;padding:9px 11px;border-radius:11px;background:rgba(126,214,223,.08);border:1px dashed rgba(126,214,223,.4);}
  .desc b{color:#7ED6DF;}
  /* 結果画面の箱（study.html の結果モーダルの見た目に寄せただけの台） */
  .mock{padding:16px 14px 14px;border-radius:18px;background:#0E1520;border:1px solid rgba(255,255,255,.12);box-shadow:0 20px 50px rgba(0,0,0,.6);}
  .mock .mh{text-align:center;font-size:12px;opacity:.6;margin-bottom:4px;}
  .mock .mp{text-align:center;font-size:34px;font-weight:900;margin-bottom:10px;}
  .mock .mb{height:38px;border-radius:12px;background:rgba(255,255,255,.06);margin-top:8px;}
  .pt{position:fixed;left:0;top:0;width:6px;height:6px;margin:-3px 0 0 -3px;border-radius:50%;pointer-events:none;z-index:50;}

  /* ── ここから ward.js の結果画面の CSS（写し） ── */
  .w-seg{fill:none;transition:stroke-dasharray .6s cubic-bezier(.16,1,.3,1),stroke-dashoffset .6s cubic-bezier(.16,1,.3,1);}
  .exam-ward-res{margin:4px 0 12px;padding:14px 14px 12px;border-radius:14px;text-align:left;
    background:linear-gradient(170deg,#12303A,#0B1E25 70%);border:1px solid rgba(126,214,223,.6);color:#E8F6F8;
    box-shadow:inset 0 0 0 3px rgba(6,16,20,.85),inset 0 0 0 4px rgba(126,214,223,.22);}
  .exam-ward-res .ewr-tag{font-size:10px;font-weight:900;letter-spacing:.3em;color:#7ED6DF;}
  .exam-ward-res .ewr-top{display:flex;align-items:center;gap:12px;margin:8px 0 10px;}
  .exam-ward-res .ewr-ring{position:relative;width:104px;flex-shrink:0;}
  .exam-ward-res .ewr-ring svg{display:block;width:100%;height:auto;overflow:visible;}
  .exam-ward-res .ewr-ring .c{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;line-height:1.05;}
  .exam-ward-res .ewr-ring .c b{font-size:22px;color:#6EE7B7;font-variant-numeric:tabular-nums;}
  .exam-ward-res .ewr-ring .c span{font-size:9.5px;font-weight:800;opacity:.7;}
  .exam-ward-res .ewr-sum{flex:1;display:flex;flex-direction:column;gap:6px;}
  .exam-ward-res .ewr-k{flex:1;text-align:center;padding:6px 4px;border-radius:10px;background:rgba(255,255,255,.05);}
  .exam-ward-res .ewr-k b{display:block;font-size:20px;font-variant-numeric:tabular-nums;}
  .exam-ward-res .ewr-k span{font-size:10.5px;font-weight:800;opacity:.75;}
  .exam-ward-res .ewr-k.d b{color:#6EE7B7}.exam-ward-res .ewr-k.s b{color:#FCA5A5}
  .exam-ward-res .ewr-h{font-size:11.5px;font-weight:900;margin:10px 0 5px;color:#BDEFF3;}
  .exam-ward-res .ewr-row{display:flex;align-items:center;gap:8px;font-size:12px;margin:3px 0;}
  .exam-ward-res .ewr-row .l{width:92px;flex-shrink:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-weight:800;}
  .exam-ward-res .ewr-row .bar{flex:1;height:8px;border-radius:99px;background:rgba(255,255,255,.08);overflow:hidden;display:flex;}
  .exam-ward-res .ewr-row .bar i,.exam-ward-res .ewr-ba .bar i,.exam-ward-res .ewr-sev .sb i{display:block;height:100%;transition:width .9s cubic-bezier(.16,1,.3,1);}
  .exam-ward-res .ewr-row .v{width:74px;flex-shrink:0;text-align:right;font-variant-numeric:tabular-nums;opacity:.85;}
  .exam-ward-res .ewr-sev{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px;}
  .exam-ward-res .ewr-sev > div{padding:6px 8px;border-radius:9px;background:rgba(255,255,255,.05);font-size:10.5px;font-weight:800;min-width:0;}
  .exam-ward-res .ewr-sev b{float:right;font-variant-numeric:tabular-nums;}

  .exam-ward-res .ewr-ba{display:flex;align-items:center;gap:8px;font-size:11.5px;margin-top:4px;}
  .exam-ward-res .ewr-ba .l{width:2.2em;flex-shrink:0;font-weight:800;opacity:.8;}
  .exam-ward-res .ewr-ba .bar{flex:1;height:10px;border-radius:99px;background:rgba(255,255,255,.08);display:flex;overflow:hidden;}
  .exam-ward-res .ewr-ba .v{flex-shrink:0;font-variant-numeric:tabular-nums;white-space:nowrap;}
  .exam-ward-res .ewr-cal{display:grid;grid-template-columns:repeat(14,minmax(0,1fr));gap:3px;align-items:end;height:64px;padding-bottom:2px;border-bottom:1px solid rgba(126,214,223,.3);}
  .exam-ward-res .ewr-cal .d{display:flex;flex-direction:column;justify-content:flex-end;align-items:center;height:100%;min-width:0;}
  .exam-ward-res .ewr-cal .d i{display:block;width:100%;max-width:12px;background:#34D399;transform-origin:bottom;}
  .exam-ward-res .ewr-cal .d i:first-of-type{border-radius:3px 3px 0 0;}
  .exam-ward-res .ewr-cal .d i.st{background:#F87171;}
  .exam-ward-res .ewr-cal .d em{font-style:normal;font-size:9.5px;font-weight:800;margin-bottom:2px;opacity:.85;}
  .exam-ward-res .ewr-calx{display:grid;grid-template-columns:repeat(14,minmax(0,1fr));gap:3px;margin-top:3px;font-size:9px;white-space:nowrap;letter-spacing:-.04em;text-align:center;opacity:.6;font-variant-numeric:tabular-nums;}
  .exam-ward-res .ewr-later{font-size:10.5px;opacity:.7;text-align:right;margin-top:4px;}
  .exam-ward-res .ewr-note{font-size:12px;line-height:1.6;margin-top:6px;padding:7px 9px;border-radius:9px;background:rgba(255,255,255,.05);}
  .exam-ward-res .ewr-note.alert{background:rgba(248,113,113,.14);border:1px solid rgba(248,113,113,.45);}
  /* ── 写しここまで ── */

  .exam-ward-res{position:relative;}

  /* A 開票：解いた順の床の列（HUD の床と同じ形） */
  .ewr-replay{display:flex;flex-wrap:wrap;gap:3px;margin:-2px 0 4px;padding:6px 7px;border-radius:9px;background:rgba(255,255,255,.04);}
  .ewr-replay i{width:9px;height:9px;border-radius:3px;background:rgba(255,255,255,.12);box-shadow:inset 0 0 0 1px rgba(255,255,255,.18);transition:background .25s ease,box-shadow .25s ease;}
  .ewr-replay i.crit{box-shadow:inset 0 0 0 1.5px #F87171}.ewr-replay i.warn{box-shadow:inset 0 0 0 1.5px #FBBF24}
  .ewr-replay i.discharge{background:#34D399;box-shadow:none}.ewr-replay i.stay{background:#F87171;box-shadow:none}
  .ewr-replay-h{display:flex;justify-content:space-between;font-size:10px;font-weight:800;opacity:.6;margin-top:2px;}

  /* B 判子 */
  .ewr-stamp{position:absolute;padding:3px 9px;border:2.5px solid var(--sc);border-radius:7px;color:var(--sc);font-weight:900;letter-spacing:.14em;rotate:-10deg;
    background:rgba(6,16,20,.72);text-shadow:0 0 7px color-mix(in srgb,var(--sc) 70%,transparent);box-shadow:0 0 12px color-mix(in srgb,var(--sc) 35%,transparent);pointer-events:none;white-space:nowrap;text-align:center;line-height:1.15;}
  .ewr-stamp.big{left:62px;top:84px;font-size:15px;}
  .ewr-stamp.big small{display:block;font-size:9.5px;letter-spacing:.06em;opacity:.9;}
  .ewr-stamp.mini{right:calc(100% + 6px);top:50%;translate:0 -50%;padding:0 4px;font-size:9px;letter-spacing:.06em;border-width:1.5px;border-radius:4px;rotate:-8deg;}
  .ewr-row .v{position:relative;}

  /* C 送り出し */
  .ewr-cal .d.land{filter:brightness(1.8);}
  .ewr-cal .d i{transition:height .22s cubic-bezier(.2,1.4,.5,1);}

  /* D 塗り替え：取り戻しのチップ */
  .ewr-chip{display:inline-block;margin-left:6px;padding:1px 8px;border-radius:99px;font-size:10.5px;font-weight:900;color:#06201F;background:#6EE7B7;}

  /* E 現行の拡張 */
  .ewr-head{position:absolute;inset:0;pointer-events:none;}
  .ewr-head i{position:absolute;left:50%;top:0;width:12px;height:12px;margin:-1px 0 0 -6px;border-radius:50%;background:#fff;box-shadow:0 0 8px #6EE7B7,0 0 16px #34D399;}
  .ewr-h.line{position:relative;}
  .ewr-h.line::after{content:"";position:absolute;left:0;right:0;bottom:-2px;height:1px;background:linear-gradient(90deg,#7ED6DF,transparent);transform-origin:left;scale:var(--hl,0) 1;transition:scale .7s cubic-bezier(.16,1,.3,1);}
  .glint{position:absolute;top:0;bottom:0;width:26px;pointer-events:none;background:linear-gradient(90deg,transparent,rgba(255,255,255,.75),transparent);mix-blend-mode:screen;}
  .exam-ward-res .bar{position:relative;}
  .ewr-frame{position:absolute;inset:-1px;width:calc(100% + 2px);height:calc(100% + 2px);pointer-events:none;overflow:visible;}
  .ewr-frame path{fill:none;stroke:#7ED6DF;stroke-width:2;filter:drop-shadow(0 0 5px #7ED6DF);}
  .ewr-done{position:absolute;right:12px;top:11px;font-size:10px;font-weight:900;letter-spacing:.28em;color:#6EE7B7;text-shadow:0 0 8px rgba(110,231,183,.7);}
  /* E（実装済み）の部品 */
  .ewr-head{position:absolute;inset:0;pointer-events:none;}
  .ewr-head i{position:absolute;left:50%;top:0;width:12px;height:12px;margin:-1px 0 0 -6px;border-radius:50%;background:#fff;box-shadow:0 0 8px #6EE7B7,0 0 16px #34D399;}
  .exam-ward-res .ewr-h{position:relative;}
  .exam-ward-res .ewr-h::after{content:"";position:absolute;left:0;right:0;bottom:-2px;height:1px;background:linear-gradient(90deg,#7ED6DF,transparent);transform-origin:left;scale:var(--hl,0) 1;transition:scale .7s cubic-bezier(.16,1,.3,1);}
  .exam-ward-res .bar{position:relative;}
  .glint{position:absolute;top:0;bottom:0;left:-30px;width:26px;pointer-events:none;background:linear-gradient(90deg,transparent,rgba(255,255,255,.75),transparent);mix-blend-mode:screen;}
  .ewr-frame{position:absolute;inset:-1px;width:calc(100% + 2px);height:calc(100% + 2px);pointer-events:none;overflow:visible;}
  .ewr-frame path{fill:none;stroke:#7ED6DF;stroke-width:2;filter:drop-shadow(0 0 5px #7ED6DF);}
  .ewr-done{position:absolute;right:12px;top:11px;font-size:10px;font-weight:900;letter-spacing:.28em;color:#6EE7B7;text-shadow:0 0 8px rgba(110,231,183,.7);}

  /* 1 前回と重ねる */
  .ewr-ring .ghost{fill:none;stroke:rgba(232,246,248,.55);stroke-dasharray:2 2.2;}
  .ewr-ring .ghost-tick{stroke:#E8F6F8;stroke-width:2;}
  .ewr-cmp{display:flex;align-items:center;gap:6px;flex-wrap:wrap;font-size:11.5px;font-weight:800;padding:6px 8px;border-radius:10px;background:rgba(255,255,255,.05);}
  .ewr-cmp .up{color:#6EE7B7}.ewr-cmp .dn{color:#FCA5A5}
  .ewr-best{display:inline-block;padding:1px 8px;border-radius:99px;font-size:10px;font-weight:900;letter-spacing:.12em;color:#06201F;background:linear-gradient(90deg,#FDE68A,#6EE7B7);}

  /* 2 期限切れが減る */
  .ewr-bl{margin:0 0 6px;padding:8px 10px;border-radius:10px;background:rgba(251,191,36,.08);border:1px solid rgba(251,191,36,.3);}
  .ewr-bl .t{display:flex;align-items:baseline;gap:8px;font-size:11px;font-weight:800;}
  .ewr-bl .t b{font-size:22px;font-variant-numeric:tabular-nums;color:#FCD34D;}
  .ewr-bl .t s{opacity:.55;font-size:13px;}
  .ewr-bl .t .dl{margin-left:auto;font-size:15px;font-weight:900;color:#6EE7B7;}
  .ewr-bl .m{position:relative;height:9px;border-radius:99px;background:rgba(255,255,255,.08);margin-top:6px;overflow:hidden;}
  .ewr-bl .m i{position:absolute;left:0;top:0;bottom:0;border-radius:99px;background:linear-gradient(90deg,#F59E0B,#FCD34D);transition:width 1.4s cubic-bezier(.6,0,.3,1);}
  .ewr-bl .m u{position:absolute;top:0;bottom:0;background:repeating-linear-gradient(45deg,rgba(110,231,183,.55) 0 4px,rgba(110,231,183,.2) 4px 8px);text-decoration:none;opacity:0;transition:opacity .5s ease;}
  .ewr-bl .f{font-size:10.5px;opacity:.7;margin-top:4px;}

  /* 3 連続の鎖 */
  .ewr-chain{display:flex;align-items:center;margin:0 0 6px;padding:8px 10px;border-radius:10px;background:rgba(255,255,255,.05);}
  .ewr-chain .lbl{font-size:11px;font-weight:900;margin-right:8px;white-space:nowrap;}
  .ewr-chain .lbl b{font-size:18px;color:#FDBA74;font-variant-numeric:tabular-nums;}
  .ewr-chain .days{flex:1;display:flex;align-items:center;min-width:0;}
  .ewr-chain .dy{display:flex;flex-direction:column;align-items:center;gap:2px;font-size:9px;opacity:.75;flex-shrink:0;}
  .ewr-chain .dy i{width:16px;height:16px;border-radius:50%;background:rgba(255,255,255,.1);box-shadow:inset 0 0 0 1px rgba(255,255,255,.2);display:flex;align-items:center;justify-content:center;font-style:normal;font-size:10px;}
  .ewr-chain .dy.on{opacity:1;}
  .ewr-chain .dy.on i{background:#FB923C;box-shadow:0 0 8px rgba(251,146,60,.7);}
  .ewr-chain .dy.today i{background:#FDE68A;box-shadow:0 0 12px #FDBA74;}
  .ewr-chain .ln{flex:1;height:2px;background:rgba(255,255,255,.12);margin:0 2px 12px;position:relative;overflow:hidden;min-width:4px;}
  .ewr-chain .ln::after{content:"";position:absolute;inset:0;background:#FB923C;transform-origin:left;scale:var(--lf,0) 1;transition:scale .25s ease;}

  /* 4 今日のハイライト */
  .ewr-hl{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin:0 0 6px;}
  .ewr-hl > div{position:relative;overflow:hidden;padding:8px 9px;border-radius:10px;background:rgba(255,255,255,.05);border:1px solid rgba(126,214,223,.25);min-width:0;}
  .ewr-hl .k{font-size:9.5px;font-weight:900;letter-spacing:.1em;color:#7ED6DF;}
  .ewr-hl .v{font-size:20px;font-weight:900;font-variant-numeric:tabular-nums;margin-top:2px;}
  .ewr-hl .v small{font-size:11px;opacity:.75;margin-left:2px;}

  .ewr-hl .run{display:flex;flex-wrap:wrap;gap:2px;margin-top:5px;}
  .ewr-hl .run i{width:7px;height:7px;border-radius:2px;background:#34D399;}
  .ewr-hl .spot{position:absolute;inset:0;pointer-events:none;background:linear-gradient(100deg,transparent 30%,rgba(255,255,255,.22) 50%,transparent 70%);opacity:0;}

  /* 5 科目の点灯 */
  .p5 .ewr-row{position:relative;border-radius:7px;padding:1px 4px;margin-left:-4px;margin-right:-4px;transition:background .5s ease,box-shadow .5s ease;}
  .p5 .ewr-row.lit{background:linear-gradient(90deg,color-mix(in srgb,var(--rc) 28%,transparent),transparent 75%);box-shadow:inset 3px 0 0 var(--rc);}
  .ewr-medal{position:absolute;right:-6px;top:50%;margin-top:-9px;font-size:13px;line-height:18px;}

  .ewr-mvp{position:absolute;left:2px;top:-12px;display:flex;align-items:center;gap:3px;font-size:9px;font-weight:900;letter-spacing:.12em;color:#FDE68A;white-space:nowrap;pointer-events:none;}
  .ewr-mvp b{font-size:12px;letter-spacing:0;}

<body>
<div class="harness">
  <h1>定着プロトコル — 結果画面 次の5案</h1>
  <p>土台は実装した E 案（リングの先端の光・見出しの下線・棒の光沢・枠が一周して COMPLETE）です。5案はその上に足す形で、組み合わせもできます。前回の定着率・期限切れの数・連続日数は見本の数字です。</p>
  <div class="plans" id="plans"></div>
  <div class="desc" id="desc"></div>
  <div class="ctl">
    <button id="replay">↻ もう一度再生</button>
    <select id="preset"><option value="good">好成績（定着 9割）</option><option value="mid" selected>ふつう（定着 7割）</option><option value="bad">苦戦（定着 5割弱）</option></select>
    <label><input type="checkbox" id="crit" checked>大きく遅れあり</label>
    <label><input type="checkbox" id="slow">スロー（×0.5）</label>
  </div>
  <div class="mock"><div class="mh">試験結果</div><div class="mp" id="mockPct">—</div><div id="stage"></div><div class="mb"></div><div class="mb"></div></div>
</div>
<script>
'use strict';
const C_OK = '#34D399', C_NG = '#F87171';
const SEV_LABEL = { crit: '大きく遅れ', warn: '遅れ', stable: '予定どおり' };
const SUBJ = { resp:{name:'呼吸器',icon:'🌬️'}, circ:{name:'循環器',icon:'❤️'}, neur:{name:'神経',icon:'🧠'}, endo:{name:'内分泌',icon:'⚗️'}, dige:{name:'消化器',icon:'🌿'}, hema:{name:'血液',icon:'🩸'} };

      const dot = d.querySelector('i');
      if (i === 6) { d.classList.add('on', 'today'); dot.textContent = '🔥';
        anim(dot, [{ transform: 'scale(.3)' }, { transform: 'scale(1.7)', offset: .5 }, { transform: 'scale(1)' }], { duration: 560, easing: 'cubic-bezier(.3,1.4,.5,1)' });
        const r = dot.getBoundingClientRect(); burst(r.left + 8, r.top + 8, '#FDBA74', 14);
        countUp(ch.querySelector('.lbl b'), st - 1, st, 500); return; }
      d.classList.add('on'); anim(dot, [{ transform: 'scale(.5)' }, { transform: 'scale(1)' }], { duration: 260 });
      if (lns[i] && dys[i + 1].dataset.on === '1') later(() => lns[i].style.setProperty('--lf', 1), 90);
    }, 700 + i * 170));
  },

  // 4 今日のハイライト
  4(D, recs) {
    const { R } = D; RUN.E(D);
    let run = 0, best = 0; recs.forEach(r => { run = r.ok ? run + 1 : 0; best = Math.max(best, run); });
    const pickR = recs.find(r => r.ok && r.sev === 'crit') || recs.find(r => r.ok);
    const late = pickR ? 9 + Math.round(hash(pickR.sid + 'late') * 40) : 0, qn = pickR ? 40 + Math.round(hash(pickR.sid + 'q') * 400) : 0;
    const hl = document.createElement('div'); hl.className = 'ewr-hl';
    hl.innerHTML = '<div><span class="spot"></span><div class="k">最長の連続定着</div><div class="v"><b>' + best + '</b><small>問</small></div><div class="run">' + '<i></i>'.repeat(best) + '</div></div>' +
      (pickR ? '<div><span class="spot"></span><div class="k">いちばん遅れを取り戻した</div><div class="v"><b>' + late + '</b><small>日遅れ</small></div><div class="s">' + SUBJ[pickR.sid].icon + ' ' + SUBJ[pickR.sid].name + ' Q.' + qn + ' → 次は ' + pickR.next + '日後</div></div>' : '');
    R.querySelector('.ewr-top').after(hl);
    [...hl.children].forEach((c, k) => {
      anim(c, [{ opacity: 0, transform: 'translateX(' + (k ? 24 : -24) + 'px)' }, { opacity: 1, transform: 'none' }], { duration: 500, delay: 1600 + k * 180 });
      const v = c.querySelector('.v b'), to = +v.textContent; v.textContent = '0'; later(() => countUp(v, 0, to, 700), 1700 + k * 180);
      anim(c.querySelector('.spot'), [{ opacity: 0, transform: 'translateX(-100%)' }, { opacity: 1, offset: .3 }, { opacity: 0, transform: 'translateX(100%)' }], { duration: 900, delay: 2500 + k * 450 });
      later(() => anim(c, [{ boxShadow: '0 0 0 0 rgba(126,214,223,0)' }, { boxShadow: '0 0 0 1px #7ED6DF, 0 0 16px rgba(126,214,223,.45)', offset: .4 }, { boxShadow: '0 0 0 0 rgba(126,214,223,0)' }], { duration: 900, fill: 'none' }), 2500 + k * 450);
    });
    [...hl.querySelectorAll('.run i')].forEach((i, k) => anim(i, [{ transform: 'scale(0)' }, { transform: 'scale(1.5)', offset: .6 }, { transform: 'scale(1)' }], { duration: 300, delay: 1800 + k * 45 }));
  },

  // 5 科目の点灯
  5(D) {
    const { R } = D; R.classList.add('p5'); RUN.E(D);
    const COL = { resp: '#4390EE', circ: '#E16E33', neur: '#619E37', endo: '#169E9F', dige: '#8A81EF', hema: '#E56574' };
    const byName = {}; Object.keys(COL).forEach(s => { byName[SUBJ[s].name] = s; });
    const rows = [...R.querySelectorAll('.ewr-row')];
    const rate = rows.map(r => { const m = r.querySelector('.v').textContent.match(/(\d+)\/(\d+)/); return +m[1] / +m[2]; });
    const top = rate.indexOf(Math.max(...rate));
    rows.forEach((row, k) => { const nm = row.querySelector('.l').textContent.split(' ').slice(1).join(' '); row.style.setProperty('--rc', COL[byName[nm]] || '#7ED6DF');
      later(() => { row.classList.add('lit'); anim(row.querySelector('.l'), [{ transform: 'translateX(-4px)' }, { transform: 'none' }], { duration: 300 });
        if (rate[k] === 1) { const m = document.createElement('span'); m.className = 'ewr-medal'; m.textContent = '🏅'; row.appendChild(m);
          anim(m, [{ opacity: 0, transform: 'scale(2.4) rotate(-30deg)' }, { opacity: 1, transform: 'scale(1)' }], { duration: 420, easing: 'cubic-bezier(.3,1.4,.5,1)' });
          const r = m.getBoundingClientRect(); burst(r.left + r.width / 2, r.top + r.height / 2, '#FDE68A', 8); } }, 1500 + k * 160); });
    later(() => { const row = rows[top]; if (!row) return; row.classList.add('mvp'); const t = document.createElement('span'); t.className = 'ewr-mvp'; t.innerHTML = '<b>👑</b>MVP'; row.appendChild(t);
      anim(t, [{ opacity: 0, transform: 'translateY(-10px) scale(1.6)' }, { opacity: 1, transform: 'none' }], { duration: 450, easing: 'cubic-bezier(.3,1.4,.5,1)' }); }, 1500 + rows.length * 160 + 200);
  },
};

function run() {
  document.querySelectorAll('.exam-ward-res').forEach(r => r.classList.remove('p5'));
  TIMERS.forEach(clearTimeout); TIMERS = []; document.querySelectorAll('.pt').forEach(p => p.remove());
  const recs = makeData(); const D = build(recs);
  requestAnimationFrame(() => RUN[plan](D, recs));
}
const box = document.getElementById('plans');
box.innerHTML = Object.entries(PLANS).map(([k, p]) => '<button data-k="' + k + '"><b>' + p.name + '</b><small>' + p.desc + '</small></button>').join('');
function pick(k) { plan = k; box.querySelectorAll('button').forEach(b => b.classList.toggle('on', b.dataset.k === k)); document.getElementById('desc').innerHTML = PLANS[k].text; run(); }
box.addEventListener('click', e => { const b = e.target.closest('button'); if (b) pick(b.dataset.k); });
document.getElementById('replay').onclick = run;
document.getElementById('preset').onchange = run;
document.getElementById('crit').onchange = run;
pick('1');
</script>
</body>
