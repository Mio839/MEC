<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Liquid ゲージの描き方比較</title>
<!--
  ハブのヒーローゲージ（index.html #gaugeBox）を UIテーマ Liquid 向けに作り直す案（2026-09-29・第5版）。
  採用は「A. ひとかけらずつ」（中央の丸い塊がフヨフヨ揺れ、一部が外へちぎれて泳ぎ、また戻る）。
  第4版の調整（ユーザー指示）：かけらは泳ぐ／分裂はゆっくり／ちぎれ始めるのは一度に1つ／見えるかけらは合計5つまで／
    塊を大きく／色は Liquid の配色（縁はネオンのマゼンタ→バイオレット、数字の下だけ深い藍、縁にシアンの照り返し）。
  第5版：「塊がいまいち滑らかに見えない」（ユーザー）ので、描き方を3つ並べて比べる。動き（シミュレーション）は3つとも同じ
    （同じ種・同じ時間で同じ Blob を動かしている）で、違うのは描き方だけ。
    ① WebGL  … GPU のシェーダで画面の画素ごとに場を計算する。勾配は解析的に出し、縁は勾配で1画素ぶんだけぼかす。
    ② 輪郭    … 粗い格子で場を計算し、等高線（f=1）を拾って曲線でつなぎ、canvas のベクター描画で塗る。
    ③ 今の版  … JavaScript で1画素ずつ計算して画像として貼る（第4版のまま）。
  各カードに描画1回あたりの時間、上部にページのコマ数を出す。「動かす版」で1つだけ描かせると、その版だけの重さが測れる。
  本物の index.js は呼ばず、このページの中だけで再生する（何も保存しない）。テストの対象ではない。
  ⚠️ 本番へ移すとき：本番の svg は transform: rotate(-90deg) を持つ。canvas は回さずに重ねる。
  ⚠️ 本番へ移すとき（① を選んだ場合）：WebGL が無い・文脈を失ったときは ③ に落とす。画面外・非表示では描かない。
-->
<style>
  :root{--tx:#F4ECFF;--sub:#B7A6D6;--line:rgba(255,0,127,.3);--gw:260px;}
  *{box-sizing:border-box;}
  html,body{margin:0;}
  body{min-height:100vh;padding:16px;color:var(--tx);font-family:-apple-system,'Hiragino Sans','Noto Sans JP',sans-serif;
    background:radial-gradient(ellipse 90% 60% at 20% -10%,rgba(255,0,127,.3) 0%,transparent 64%),
               radial-gradient(circle at 85% 30%,rgba(0,242,254,.18) 0%,transparent 55%),
               radial-gradient(circle at 30% 85%,rgba(121,40,202,.32) 0%,transparent 60%),
               linear-gradient(180deg,#0E0724 0%,#06030F 100%);background-attachment:fixed;}
  body.big{--gw:360px;}
  h1{font-size:17px;margin:0 0 4px;}
  p.note{font-size:12.5px;color:var(--sub);margin:0 0 12px;line-height:1.65;max-width:980px;}
  p.note b{color:#FFB3D6;}
  .ctl{position:sticky;top:0;z-index:20;display:flex;flex-wrap:wrap;gap:8px 12px;align-items:center;font-size:13px;margin:0 0 14px;
    padding:10px 12px;border:1px solid var(--line);border-radius:14px;background:rgba(16,8,34,.94);max-width:1300px;}
  .ctl label{white-space:nowrap;display:flex;align-items:center;gap:6px;}
  .ctl input[type=range]{width:min(320px,70vw);accent-color:#FF007F;}
  .ctl output{font-variant-numeric:tabular-nums;font-weight:800;color:#FF7AB8;min-width:3.5em;display:inline-block;}
  .ctl button{padding:7px 11px;border-radius:12px;border:1.5px solid var(--line);background:#1C0E36;color:var(--tx);
    font-weight:700;font-size:13px;cursor:pointer;}
  .ctl button:active{background:#321858;}
  .ctl button.hi{border-color:#FF007F;background:#34104A;}
  .ctl select{font-size:13px;padding:5px 8px;border-radius:10px;background:#1C0E36;color:var(--tx);border:1.5px solid var(--line);}
  .ctl .fps{font-variant-numeric:tabular-nums;color:#7EF3FF;font-weight:700;}
  input[type=checkbox]{width:18px;height:18px;accent-color:#FF007F;}
  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,380px),1fr));gap:14px;max-width:1300px;}
  .card{background:linear-gradient(160deg,rgba(70,20,90,.5),rgba(14,8,32,.9));border:1px solid var(--line);border-radius:20px;
    padding:14px 14px 16px;box-shadow:inset 0 1px 0 rgba(255,120,190,.16),0 10px 30px rgba(0,0,0,.35);}
  .card.paused{opacity:.45;}
  .card h2{font-size:15.5px;margin:0 0 2px;color:#FF7AB8;}
  .card .tag{font-size:12px;color:var(--sub);line-height:1.55;}
  .card .cnt{font-size:12px;color:#7EF3FF;font-variant-numeric:tabular-nums;margin-top:4px;}
  .stage{display:flex;justify-content:center;padding:14px 0 6px;}

  /* ── 本番のゲージの外形（index.css の .gauge / .gauge-mid と同じ組み方） ── */
  .gauge{position:relative;width:var(--gw);text-align:center;}
  .gauge-ring{position:relative;aspect-ratio:1;}
  .gauge-ring svg,.gauge-ring canvas{position:absolute;inset:0;width:100%;height:100%;display:block;overflow:visible;}
  .gauge-mid{position:absolute;inset:0;display:grid;grid-auto-flow:column;align-content:center;justify-content:center;align-items:baseline;
    font-size:calc(var(--gw)*.183);font-weight:800;letter-spacing:-.03em;color:#FFFFFF;font-variant-numeric:tabular-nums;line-height:1;
    text-shadow:0 0 10px rgba(10,2,26,.95),0 0 3px rgba(10,2,26,.95),0 1px 1px rgba(10,2,26,.9);pointer-events:none;}
  .gauge-mid.wide{font-size:calc(var(--gw)*.144);}
  .gauge-mid em{font-style:normal;font-size:.5em;color:#FFD0E8;margin-left:1px;}
  .gauge-cap{margin:8px 0 0;font-size:11px;font-weight:700;letter-spacing:.12em;color:#C9A8DA;}
  .gauge-goal{margin:2px 0 0;font-size:12px;font-weight:700;color:#C9A8DA;}
  .gauge-goal b{color:#FFFFFF;}

  /* ── 外周の弧（進捗を示すだけ） ── */
  .trk{fill:none;stroke:rgba(255,255,255,.08);stroke-width:3;}
  .val{fill:none;stroke:url(#gArc);stroke-width:3;stroke-linecap:round;filter:drop-shadow(0 0 2px rgba(255,0,127,.6));}
  .ovf{fill:none;stroke:#FFD166;stroke-width:2;stroke-linecap:round;filter:drop-shadow(0 0 2px rgba(255,209,102,.8));}
  .tick{stroke:rgba(255,255,255,.28);stroke-width:1;stroke-linecap:round;transition:stroke .6s;}
  .tick.on{stroke:#FF9ACB;}
  .soft{fill:url(#gSoft);transform-box:fill-box;transform-origin:center;animation:soft 2.6s cubic-bezier(.2,.7,.3,1) forwards;}
  @keyframes soft{0%{scale:.3;opacity:0;}25%{opacity:.9;}100%{scale:1.6;opacity:0;}}
</style>
</head>
<body>
<h1>🫧 Liquid のヒーローゲージ — 塊の描き方を比べる</h1>
<p class="note">
  採用した「ひとかけらずつ」を、<b>3つの描き方</b>で並べています。動きは3つとも<b>まったく同じ</b>で、違うのは塊の描き方だけです。
  <b>① WebGL</b>＝GPU で画面の画素ごとに直接描く／<b>② 輪郭を線で描く</b>＝塊の輪郭を曲線にして塗る／<b>③ 今の版</b>＝比較用。
  縁の滑らかさと、動きのなめらかさ（カクつき）を見比べてください。
  3つ同時に動かすと互いに重さを奪い合うので、動きのなめらかさは「動かす版」で1つだけにして見るのがおすすめです。カードの「描画」は1回描くのにかかった時間（16ms 以下なら60コマ/秒に間に合う）。
</p>
<div class="ctl">
  <label>達成率 <input type="range" id="rg" min="0" max="160" step="1" value="0"> <output id="out">0%</output></label>
  <button id="bSeq" class="hi">▶ 0→130% を順に</button>
  <button data-add="10">＋10%</button>
  <button data-add="-10">−10%</button>
  <button id="bBloom">90→100%（到達だけ）</button>
  <button data-set="130">130%（超過）</button>
  <button data-set="0">0%へ</button>
  <label>動かす版 <select id="selRun"><option value="all">3つとも</option><option value="0">① だけ</option><option value="1">② だけ</option><option value="2">③ だけ</option></select></label>
  <label><input type="checkbox" id="cbBig"> 大きく表示</label>
  <span class="fps" id="fps">— コマ/秒</span>
</div>
<div class="grid" id="grid"></div>

<script>
'use strict';
const NS = 'http://www.w3.org/2000/svg';
const TAU = Math.PI * 2;
const fx = (n) => +(+n).toFixed(2);
const clamp = (v, a, b) => v < a ? a : v > b ? b : v;
const lerp = (a, b, k) => a + (b - a) * k;
const lerp3 = (a, b, k) => [lerp(a[0], b[0], k), lerp(a[1], b[1], k), lerp(a[2], b[2], k)];
const ease = (k) => { k = clamp(k, 0, 1); return k < 0.5 ? 4 * k * k * k : 1 - Math.pow(-2 * k + 2, 3) / 2; };
const soft = (k) => { k = clamp(k, 0, 1); return k * k * (3 - 2 * k); };
const polar = (r, a) => [84 + r * Math.sin(a), 84 - r * Math.cos(a)];   // a はラジアン・0＝真上・時計回り
const wrap = (a) => ((a % TAU) + TAU) % TAU;
const rgba = (c, a) => `rgba(${c[0] | 0},${c[1] | 0},${c[2] | 0},${a})`;
function rng(seed) { let s = seed >>> 0; return () => { s = (s * 1664525 + 1013904223) >>> 0; return s / 4294967296; }; }
function dash(el, v) {
  v = clamp(v, 0, 100);
  el.setAttribute('stroke-dasharray', v.toFixed(2) + ' 100');
  el.style.visibility = v > 0.05 ? '' : 'hidden';
}
function spawn(parent, html, ms) {
  const g = document.createElementNS(NS, 'g'); g.innerHTML = html; parent.appendChild(g);
  setTimeout(() => g.remove(), ms); return g;
}
const GLOW = (x, y, size = 14, delay = 0) => `<circle class="soft" cx="${fx(x)}" cy="${fx(y)}" r="${size}" style="animation-delay:${delay}ms"/>`;
const ARC_R = 74;
const SVG_DEFS = `<defs>
    <linearGradient id="gArc" gradientUnits="userSpaceOnUse" x1="10" y1="10" x2="158" y2="158">
      <stop offset="0" stop-color="#00F2FE"/><stop offset=".5" stop-color="#B04CFF"/><stop offset="1" stop-color="#FF007F"/></linearGradient>
    <radialGradient id="gSoft"><stop offset="0" stop-color="#FFB6DA" stop-opacity=".8"/><stop offset=".5" stop-color="#FF007F" stop-opacity=".25"/><stop offset="1" stop-color="#FF007F" stop-opacity="0"/></radialGradient>
  </defs>`;
const TICKS = () => [0.25, 0.5, 0.75].map((k) => {
  const [x0, y0] = polar(67.5, k * TAU), [x1, y1] = polar(70.5, k * TAU);
  return `<line class="tick" data-m="${k * 100}" x1="${fx(x0)}" y1="${fx(y0)}" x2="${fx(x1)}" y2="${fx(y1)}"/>`;
}).join('');
const ARC = (r, cls) => `<circle class="${cls}" cx="84" cy="84" r="${r}" pathLength="100" transform="rotate(-90 84 84)"/>`;
const SVG_FG = () => `${SVG_DEFS}${TICKS()}${ARC(ARC_R, 'trk')}${ARC(ARC_R, 'val')}${ARC(80, 'ovf')}<g class="fxl"></g>`;

/* ══════════════════════ 配色（Liquid） ══════════════════════
   場の深さで色を決める：縁＝ネオンのマゼンタ → バイオレット。深い藍は塊の中心のまわり（数字の下）だけ。縁にシアンの照り返し。 */
const PAL = { edgeT: [255, 60, 175], edgeB: [255, 0, 127], mid: [121, 40, 202], core: [18, 8, 46], rim: [0, 242, 254], halo: [255, 0, 127] };
const PALG = { edgeT: [255, 226, 140], edgeB: [255, 196, 80], mid: [214, 140, 40], core: [52, 28, 8], rim: [255, 250, 220], halo: [255, 209, 102] };
function palette(gk) { const o = {}; for (const k in PAL) o[k] = lerp3(PAL[k], PALG[k], gk); return o; }
const LIGHT = (() => { const L = [-0.45, -0.65, 0.62], l = Math.hypot(...L), Ln = L.map((v) => v / l); const H = [Ln[0], Ln[1], Ln[2] + 1], h = Math.hypot(...H); return { L: Ln, H: H.map((v) => v / h) }; })();

/* ══════════════════════ ① WebGL ══════════════════════
   場 f = Σ (r²/d²)² と、その勾配を解析的に出す（差分で近似しない＝法線がなめらか）。
   縁までの距離 ≒ (f−1)/|∇f| を画素に直して、ちょうど1画素でぼかす。 */
const MAXB = 48;
const FRAG = `
precision highp float;
uniform vec2 uRes; uniform vec3 uB[${MAXB}]; uniform int uNB;
uniform vec3 uEdgeT, uEdgeB, uMid, uCore, uRim, uHalo, uL, uH; uniform float uHot; uniform vec2 uC;
void main() {
  float ppu = uRes.y / 168.0;
  vec2 p = vec2(gl_FragCoord.x, uRes.y - gl_FragCoord.y) / ppu;
  float rho = length(p - vec2(84.0));
  if (rho > 72.0) { gl_FragColor = vec4(0.0); return; }
  float f = 0.0; vec2 g = vec2(0.0);
  for (int k = 0; k < ${MAXB}; k++) {
    if (k >= uNB) break;
    vec2 d = p - uB[k].xy; float den = dot(d, d) + 0.4; float q = uB[k].z / den;
    f += q * q; g += -4.0 * q * q * d / den;
  }
  if (f < 0.4) { gl_FragColor = vec4(0.0); return; }
  float gl = length(g) + 1e-6;
  float body = clamp(0.5 + (f - 1.0) / gl * ppu, 0.0, 1.0);
  float halo = f < 1.0 ? pow((f - 0.4) / 0.6, 3.0) * (0.3 + uHot * 0.25) : 0.0;
  vec3 edge = mix(uEdgeT, uEdgeB, p.y / 168.0);
  vec3 haloC = min(uHalo * 1.1, vec3(1.0));
  float u = sqrt(sqrt(max(f, 1.0)));
  float tt = smoothstep(0.0, 1.0, (u - 1.0) / 0.9);
  float t = smoothstep(0.0, 1.0, (u - 1.0) / 0.45);
  float tilt = 1.0 - t * t * (3.0 - 2.0 * t);
  vec3 n = vec3(-g / gl * tilt, sqrt(max(0.0, 1.0 - tilt * tilt)));
  float diff = max(0.0, dot(n, uL));
  float sp = pow(max(0.0, dot(n, uH)), 30.0);
  float rim = tilt * tilt * tilt;
  float dc = smoothstep(0.0, 1.0, (36.0 - length(p - uC)) / 20.0) * 0.9;
  vec3 c = mix(mix(edge, uMid, tt), uCore, dc);
  float rimK = rim * 0.75 + pow(max(0.0, -n.x * 0.6 - n.y * 0.8), 2.0) * rim * 0.5;
  vec3 col = min(c * (0.62 + 0.5 * diff) + uRim * rimK * 0.55 + vec3(sp * 0.92), vec3(1.0));
  float mask = clamp((71.0 - rho) * ppu, 0.0, 1.0);
  float a = max(halo, body * 0.97) * mask;
  gl_FragColor = vec4(mix(haloC, col, body) * a, a);
}`;
class GLGoo {
  constructor(canvas) {
    this.cv = canvas; this.gold = 0; this.hot = 0; this.ok = false;
    const gl = this.gl = canvas.getContext('webgl', { premultipliedAlpha: true, antialias: false, alpha: true });
    if (!gl) return;
    const sh = (type, src) => { const s = gl.createShader(type); gl.shaderSource(s, src); gl.compileShader(s); if (!gl.getShaderParameter(s, gl.COMPILE_STATUS)) throw new Error(gl.getShaderInfoLog(s)); return s; };
    const pr = this.pr = gl.createProgram();
    gl.attachShader(pr, sh(gl.VERTEX_SHADER, 'attribute vec2 a; void main(){ gl_Position = vec4(a, 0.0, 1.0); }'));
    gl.attachShader(pr, sh(gl.FRAGMENT_SHADER, FRAG));
    gl.linkProgram(pr); gl.useProgram(pr);
    const buf = gl.createBuffer(); gl.bindBuffer(gl.ARRAY_BUFFER, buf);
    gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([-1, -1, 3, -1, -1, 3]), gl.STATIC_DRAW);
    const loc = gl.getAttribLocation(pr, 'a'); gl.enableVertexAttribArray(loc); gl.vertexAttribPointer(loc, 2, gl.FLOAT, false, 0, 0);
    this.u = {}; for (const n of ['uRes', 'uB', 'uNB', 'uEdgeT', 'uEdgeB', 'uMid', 'uCore', 'uRim', 'uHalo', 'uL', 'uH', 'uHot', 'uC']) this.u[n] = gl.getUniformLocation(pr, n);
    gl.uniform3fv(this.u.uL, LIGHT.L); gl.uniform3fv(this.u.uH, LIGHT.H);
    this.balls = new Float32Array(MAXB * 3);
    canvas.addEventListener('webglcontextlost', (e) => { e.preventDefault(); this.ok = false; });
    this.ok = true; this.resize();
  }
  resize() {
    const r = this.cv.getBoundingClientRect(), d = Math.min(2, window.devicePixelRatio || 1);
    this.cv.width = Math.max(1, Math.round(r.width * d)); this.cv.height = Math.max(1, Math.round(r.height * d));
    if (this.gl) this.gl.viewport(0, 0, this.cv.width, this.cv.height);
  }
  render(B, cx, cy) {
    if (!this.ok) return;
    const gl = this.gl, u = this.u, n = Math.min(MAXB, B.length / 3), P = palette(this.gold);
    this.balls.fill(0); this.balls.set(B.slice(0, n * 3));
    gl.uniform2f(u.uRes, this.cv.width, this.cv.height);
    gl.uniform3fv(u.uB, this.balls); gl.uniform1i(u.uNB, n);
    for (const [k, nm] of [['edgeT', 'uEdgeT'], ['edgeB', 'uEdgeB'], ['mid', 'uMid'], ['core', 'uCore'], ['rim', 'uRim'], ['halo', 'uHalo']]) gl.uniform3f(u[nm], P[k][0] / 255, P[k][1] / 255, P[k][2] / 255);
    gl.uniform1f(u.uHot, this.hot); gl.uniform2f(u.uC, cx, cy);
    gl.clearColor(0, 0, 0, 0); gl.clear(gl.COLOR_BUFFER_BIT);
    gl.drawArrays(gl.TRIANGLES, 0, 3);
  }
}

/* ══════════════════════ ② 輪郭を線で描く ══════════════════════
   1.5 単位の格子で場を計算し、マーチングスクエアで f=1 の等高線を拾う。点をつないで閉じた輪にし、
   Catmull-Rom の曲線でなめらかにして canvas のパスで塗る（どの大きさでも縁が鋭くなめらか）。
   塗りは塊の中心からの放射グラデーション（中心＝藍 → バイオレット → 縁＝マゼンタ）。縁の照り・光沢・にじみはパスで描き足す。 */
const CG = 1.5, CM = Math.round(168 / CG) + 1;
const MS = { 1: [[3, 2]], 2: [[2, 1]], 3: [[3, 1]], 4: [[0, 1]], 6: [[0, 2]], 7: [[3, 0]], 8: [[3, 0]], 9: [[0, 2]], 11: [[0, 1]], 12: [[3, 1]], 13: [[2, 1]], 14: [[3, 2]] };
class PathGoo {
  constructor(canvas) { this.cv = canvas; this.ctx = canvas.getContext('2d'); this.gold = 0; this.hot = 0; this.F = new Float32Array(CM * CM); this.resize(); }
  resize() {
    const r = this.cv.getBoundingClientRect(), d = Math.min(2, window.devicePixelRatio || 1);
    this.cv.width = Math.max(1, Math.round(r.width * d)); this.cv.height = Math.max(1, Math.round(r.height * d));
  }
  loops(B) {
    const F = this.F, nb = B.length;
    for (let j = 0; j < CM; j++) for (let i = 0; i < CM; i++) {
      const x = i * CG, y = j * CG; let v = 0;
      for (let k = 0; k < nb; k += 3) { const dx = x - B[k], dy = y - B[k + 1], q = B[k + 2] / (dx * dx + dy * dy + 0.4); v += q * q; }
      F[j * CM + i] = v;
    }
    const pt = new Map(), adj = new Map();
    const ep = (i, j, e) => {   // 辺の番号（上0・右1・下2・左3）→ 点の鍵と位置
      let a, b, key;
      if (e === 0) { a = [i, j]; b = [i + 1, j]; key = (j * CM + i) * 2; }
      else if (e === 2) { a = [i, j + 1]; b = [i + 1, j + 1]; key = ((j + 1) * CM + i) * 2; }
      else if (e === 3) { a = [i, j]; b = [i, j + 1]; key = (j * CM + i) * 2 + 1; }
      else { a = [i + 1, j]; b = [i + 1, j + 1]; key = (j * CM + i + 1) * 2 + 1; }
      if (!pt.has(key)) {
        const va = F[a[1] * CM + a[0]], vb = F[b[1] * CM + b[0]], k = clamp((1 - va) / (vb - va), 0, 1);
        pt.set(key, [lerp(a[0], b[0], k) * CG, lerp(a[1], b[1], k) * CG]);
      }
      return key;
    };
    const link = (p, q) => { (adj.get(p) || adj.set(p, []).get(p)).push(q); (adj.get(q) || adj.set(q, []).get(q)).push(p); };
    for (let j = 0; j < CM - 1; j++) for (let i = 0; i < CM - 1; i++) {
      const v0 = F[j * CM + i], v1 = F[j * CM + i + 1], v2 = F[(j + 1) * CM + i + 1], v3 = F[(j + 1) * CM + i];
      const c = (v0 >= 1 ? 8 : 0) | (v1 >= 1 ? 4 : 0) | (v2 >= 1 ? 2 : 0) | (v3 >= 1 ? 1 : 0);
      if (c === 0 || c === 15) continue;
      let segs = MS[c];

    c.strokeStyle = rgba(P.rim, 0.45); c.lineWidth = 2.6; c.stroke(path);
    c.strokeStyle = rgba(P.edgeT, 0.55); c.lineWidth = 1.2; c.stroke(path);

}

/* ══════════════════════ ③ 今の版（1画素ずつ JavaScript で計算） ══════════════════════ */
class CpuGoo {
  constructor(canvas) {
    this.cv = canvas; this.ctx = canvas.getContext('2d');
    this.N = 0; this.off = document.createElement('canvas'); this.octx = this.off.getContext('2d');
    this.gold = 0; this.hot = 0; this.resize();
  }
  resize() {
    const r = this.cv.getBoundingClientRect(), d = Math.min(2, window.devicePixelRatio || 1);
    this.cv.width = Math.max(1, Math.round(r.width * d)); this.cv.height = Math.max(1, Math.round(r.height * d));
    const N = clamp(this.cv.width, 180, 380);
    if (N === this.N) return;
    this.N = N; this.s = 168 / N;
    this.off.width = this.off.height = N; this.img = this.octx.createImageData(N, N);
    this.f = new Float32Array(N * N); this.mask = new Uint8Array(N * N);
    for (let py = 0; py < N; py++) for (let px = 0; px < N; px++)
      this.mask[py * N + px] = Math.hypot((px + 0.5) * this.s - 84, (py + 0.5) * this.s - 84) < 71 ? 1 : 0;
  }
  render(B, cx, cy) {
    const N = this.N, s = this.s, f = this.f, mask = this.mask, nb = B.length;
    for (let py = 0; py < N; py++) {
      const y = (py + 0.5) * s;
      for (let px = 0; px < N; px++) {
        const i = py * N + px;
        if (!mask[i]) { f[i] = 0; continue; }
        const x = (px + 0.5) * s; let v = 0;
        for (let k = 0; k < nb; k += 3) { const dx = x - B[k], dy = y - B[k + 1], q = B[k + 2] / (dx * dx + dy * dy + 0.4); v += q * q; }
        f[i] = v;
      }
    }
    const D = this.img.data, P = palette(this.gold), Lg = LIGHT.L, Hh = LIGHT.H, hot = this.hot;
    for (let py = 0; py < N; py++) {
      const edge = lerp3(P.edgeT, P.edgeB, py / (N - 1)), mid = P.mid, core = P.core, halo0 = P.halo, rimC = P.rim;
      for (let px = 0; px < N; px++) {
        const i = py * N + px, o = i * 4, v = f[i];
        if (v < 0.4) { D[o + 3] = 0; continue; }
        const halo = v < 1 ? Math.pow((v - 0.4) / 0.6, 3) * (0.3 + hot * 0.25) : 0;
        const gx = (px < N - 1 ? f[i + 1] : v) - (px > 0 ? f[i - 1] : v);
        const gy = (py < N - 1 ? f[i + N] : v) - (py > 0 ? f[i - N] : v);
        const g = Math.hypot(gx, gy) + 1e-6;
        const body = clamp(0.5 + (v - 1) / (g * 0.5), 0, 1);
        if (body <= 0) { D[o] = Math.min(255, halo0[0] * 1.1); D[o + 1] = Math.min(255, halo0[1] * 1.1); D[o + 2] = Math.min(255, halo0[2] * 1.1); D[o + 3] = halo * 255; continue; }
        const u4 = Math.sqrt(Math.sqrt(Math.max(v, 1))), t = soft((u4 - 1) / 0.45), tilt = 1 - t * t * (3 - 2 * t);
        const nx = -gx / g * tilt, ny = -gy / g * tilt, nz = Math.sqrt(Math.max(0, 1 - tilt * tilt));
        const diff = Math.max(0, nx * Lg[0] + ny * Lg[1] + nz * Lg[2]);
        const sp = Math.pow(Math.max(0, nx * Hh[0] + ny * Hh[1] + nz * Hh[2]), 30);
        const rim = Math.pow(tilt, 3);
        const tt = soft((u4 - 1) / 0.9);
        const dc = soft((36 - Math.hypot((px + 0.5) * s - cx, (py + 0.5) * s - cy)) / 20) * 0.9;
        const c = lerp3(lerp3(edge, mid, tt), core, dc);
        const sh = 0.62 + 0.5 * diff;
        const rimK = rim * 0.75 + Math.pow(Math.max(0, -nx * 0.6 - ny * 0.8), 2) * rim * 0.5;
        const cr = c[0] * sh + rimC[0] * rimK * 0.55 + sp * 235, cg = c[1] * sh + rimC[1] * rimK * 0.55 + sp * 235, cb = c[2] * sh + rimC[2] * rimK * 0.55 + sp * 235;
        D[o] = Math.min(255, lerp(halo0[0] * 1.1, cr, body)); D[o + 1] = Math.min(255, lerp(halo0[1] * 1.1, cg, body)); D[o + 2] = Math.min(255, lerp(halo0[2] * 1.1, cb, body));
        D[o + 3] = 255 * Math.max(halo, body * 0.97);
      }
    }
    this.octx.putImageData(this.img, 0, 0);
    const c = this.ctx; c.clearRect(0, 0, this.cv.width, this.cv.height);
    c.imageSmoothingEnabled = true; c.imageSmoothingQuality = 'high';
    c.drawImage(this.off, 0, 0, this.cv.width, this.cv.height);
  }
}

/* ══════════════════════ 設定 ══════════════════════ */
const CFG = {
  core0: 28, E: 41, wobD: 17, wobA: 5, wobR: 20,
  bud: 4.2, tOut: 5.6, tBack: 4.6, melt: 3.2, hold: [7, 12], rT: [6, 8], out: [54, 60],
  cap: (v) => Math.min(5, 1 + Math.floor(Math.min(100, v) / 25)),   // 見えるかけらは 0%で1つ → 25%ごとに1つ → 100%以上で5つ
  rate: (heat) => 0.08 + heat * 0.13
};

/* ══════════════════════ 中央の塊 ══════════════════════
   芯の球＋ゆっくり巡る5つの球＝輪郭がフヨフヨ変わる。塊の中心もゆっくり漂う。
   ちぎれる一部（lobe）は bud（縁がふくらむ）→ out（糸を引いて離れる）→ float（泳ぐ）→ back（戻る）→ melt（溶け込む）。 */
class Blob {
  constructor(seed, C) {
    const R = this.R = rng(seed);
    this.C = C; this.t = 0; this.E = C.E; this.core0 = C.core0; this.amp = 1;
    this.wob = Array.from({ length: 5 }, (_, i) => ({ a: i * TAU / 5 + R() * 0.5, om: (R() < 0.5 ? -1 : 1) * (0.05 + R() * 0.07), w: 0.3 + R() * 0.3, w2: 0.2 + R() * 0.25, ph: R() * 6 }));
    this.lobes = []; this.cx = 84; this.cy = 84;
  }
  P(r, a) { return [this.cx + r * Math.sin(a), this.cy - r * Math.cos(a)]; }
  add(o) {
    const R = this.R, C = this.C;

      dir: R() < 0.5 ? -1 : 1, spd: 0.13 + R() * 0.1, rmid: lerp(C.out[0], C.out[1], R()) }, o);
    l.a = l.a0; this.lobes.push(l); return l;
  }
  count() { return this.lobes.filter((l) => l.st !== 'gone' && l.st !== 'melt').length; }
  step(dt, heat) {
    this.t += dt; const t = this.t, C = this.C;
    this.cx = 84 + Math.sin(t * 0.23) * 1.4; this.cy = 84 + Math.cos(t * 0.29) * 1.2;
    this.amp = 1 + Math.min(1.25, heat) * 0.35;
    for (const l of this.lobes) {
      l.t += dt;
      const E = this.E, px = l.x, py = l.y;
      if (l.st === 'bud') {
        const k = ease(l.t / C.bud);
        [l.x, l.y] = this.P(E - 6 + l.rT * 0.95 * k, l.a0); l.r = l.rT * k;
        if (l.t >= C.bud) { l.st = 'out'; l.t = 0; l.sx = l.x; l.sy = l.y; [l.tx, l.ty] = this.P(l.rmid, l.a0 + l.dir * 0.25); l.tl = { x: l.x, y: l.y, r: l.rT * 0.84, on: 1 }; }
      } else if (l.st === 'out') {
        const k = ease(l.t / C.tOut);
        l.x = lerp(l.sx, l.tx, k); l.y = lerp(l.sy, l.ty, k);
        if (l.tl && l.tl.on) {
          const [ox, oy] = this.P(E - 3, l.a0);
          l.tl.x = lerp(ox, l.x, 0.42); l.tl.y = lerp(oy, l.y, 0.42); l.tl.r = l.rT * (0.84 - 0.34 * k);
          if (Math.hypot(l.x - l.tl.x, l.y - l.tl.y) > l.rT * 1.8) l.tl.on = 0;
        }
        if (l.t >= C.tOut) { l.st = 'float'; l.t = 0; l.a = Math.atan2(l.x - this.cx, this.cy - l.y); l.fr = Math.hypot(l.x - this.cx, l.y - this.cy); }
      } else if (l.st === 'float') {
        // 塊のまわりを曲がりくねって泳ぐ：回る速さも半径も、それぞれの揺れで変わり続ける
        const w = l.dir * (l.spd + 0.12 * Math.sin(l.t * 0.55 + l.s)) + 0.08 * Math.sin(l.t * 1.1 + l.s2);
        l.a += w * dt;
        const want = l.rmid + 4 * Math.sin(l.t * 0.6 + l.s) + 2 * Math.sin(l.t * 1.3 + l.s2);
        l.fr += (clamp(want, 52, 62) - l.fr) * Math.min(1, dt * 1.2);
        [l.x, l.y] = this.P(l.fr, l.a);
        if (l.t >= l.hold) { l.st = 'back'; l.t = 0; l.sx = l.x; l.sy = l.y; l.a1 = wrap(Math.atan2(l.x - this.cx, this.cy - l.y) + l.dir * 0.2); }
      } else if (l.st === 'back') {

        l.x = lerp(l.sx, ex, k); l.y = lerp(l.sy, ey, k);
        if (l.t >= C.tBack) { l.st = 'melt'; l.t = 0; l.sx = l.x; l.sy = l.y; }
      } else if (l.st === 'melt') {
        const k = soft(l.t / C.melt), [ex, ey] = this.P(E - 8, l.a1);
        l.x = lerp(l.sx, ex, k); l.y = lerp(l.sy, ey, k); l.r = l.rT * (1 - k);
        l.bulge = l.rT * 0.8 * Math.sin(Math.PI * k);

  }
  sources(S) {

      if (l.st !== 'gone' && l.r > 0.2) S.push(l.x, l.y, l.r * l.r);
      if (l.trail && l.st !== 'gone' && l.trail.r > 0.2) S.push(l.trail.x, l.trail.y, l.trail.r * l.trail.r);
      if (l.tl) S.push(l.tl.x, l.tl.y, l.tl.r * l.tl.r);
      if (l.bulge > 0.2 && l.st === 'melt') { const [bx, by] = this.P(this.E - 3, l.a1); S.push(bx, by, l.bulge * l.bulge); }
    }
  }
  heads() {   // ② の光沢を置く場所（塊とかけらの頭）
    const h = [[this.cx, this.cy, this.E * 0.95]];
    for (const l of this.lobes) if (l.st !== 'gone' && l.r > 1.5) h.push([l.x, l.y, l.r]);
    return h;
  }
}

/* ══════════════════════ ゲージ（A. ひとかけらずつ） ══════════════════════ */
function makeGauge(key, name, tag, Rend) {
  return {
    key, name, tag, Rend,
    init() { this.blob = new Blob(11, CFG); this.cd = 0.8; this.queue = []; this.ms = 0; },
    // ちぎれ始めるのは一度に1つだけ（ふくらむ〜糸が切れるまでの間は次を出さない）
    tearing() { return this.blob.lobes.some((l) => l.st === 'bud' || l.st === 'out'); },
    lobe(a0, o = {}) { if (this.blob.count() >= this.cap() || this.tearing()) return false; this.blob.add(Object.assign({ a0 }, o)); return true; },
    cap() { return CFG.cap(this.v); },
    tick(dt, draw) {
      const tgt = this.v > 100 ? 1.25 : 0.15 + 0.85 * Math.min(1, this.v / 100);
      this.heat += (tgt - this.heat) * Math.min(1, dt * 0.8);
      this.goo.gold += ((this.v > 100 ? 1 : 0) - this.goo.gold) * Math.min(1, dt * 0.9);
      this.goo.hot = Math.min(1, this.heat);
      const R = this.blob.R;
      if (this.queue.length) {   // 段・到達のかけらは、前のかけらが離れ終わってから順に出す
        const q = this.queue[0];
        if (this.blob.count() >= this.cap()) this.queue.length = 0;
        else if (this.lobe(q.a0, q.o)) { this.queue.shift(); if (q.glow) spawn(this.fxl, q.glow, 2800); }
      } else {
        this.cd -= dt * CFG.rate(this.heat);
        if (this.cd <= 0) { this.lobe(R() * TAU); this.cd = 1 + R() * 1.4; }
      }
      this.blob.step(dt, this.heat);
      if (draw) {
        const t0 = performance.now();
        const S = []; this.blob.sources(S); this.goo.render(S, this.blob.cx, this.blob.cy, this.blob.heads());
        if (this.goo.gl) this.goo.gl.finish();   // GPU の仕事も時間に含める
        this.ms = this.ms * 0.9 + (performance.now() - t0) * 0.1;
      }
      const n = this.blob.count();
      this.cntEl.textContent = `見えているかけら ${n} ／ 上限 ${this.cap()}　・　描画 ${draw ? this.ms.toFixed(1) + ' ms' : '停止中'}`;
    },
    stage(m) { const a = m / 100 * TAU; this.queue.push({ a0: a, o: { rT: CFG.rT[1] + 1.5, hold: 6 }, glow: GLOW(...polar(58, a)) }); },
    bloom() { spawn(this.fxl, GLOW(84, 84, 46, 400), 3000); this.queue = [0, 0.25, 0.5, 0.75].map((q) => ({ a0: q * TAU, o: { hold: 9 } })); }
  };
}
const GAUGES = [
  makeGauge('①', 'WebGL（GPU で画素ごとに描く）', 'GPU のシェーダが画面の画素ごとに直接計算する。縁は場の勾配から1画素ぶんだけぼかす。拡大しないので縁が最も滑らかで、GPU なので iPad でも速い見込み', GLGoo),
  makeGauge('②', '輪郭を線で描く', '塊の輪郭を曲線にして canvas のベクター描画で塗る。縁はどの大きさでも鋭く滑らかで、計算も軽い。立体感は塗りと照りの重ね塗りで出すので①より平板', PathGoo),
  makeGauge('③', '今の版（比較用）', 'JavaScript で1画素ずつ計算して画像として貼る。画素数が多いと重い', CpuGoo)

let cur = 0, raf = 0;

    g.root.querySelectorAll('.tick').forEach((n) => n.classList.toggle('on', b >= +n.dataset.m));
    g.pct.textContent = shown; g.mid.classList.toggle('wide', shown >= 100);
    g.n.textContent = Math.round(v * 40 / 100);
    if (v > prev) {
      [25, 50, 75].forEach((m) => { if (prev < m && v >= m) g.stage(m); });
      if (prev < 100 && v >= 100) g.bloom();
    }
  });
  rg.value = shown; out.textContent = shown + '%';
}
function go(to, dur = 1000) {
  cancelAnimationFrame(raf);
  to = clamp(to, 0, 160);
  const from = cur, t0 = performance.now();
  const step = (now) => {
    const k = Math.min(1, (now - t0) / dur), e = 1 - Math.pow(1 - k, 3);
    apply(from + (to - from) * e);
    if (k < 1) raf = requestAnimationFrame(step);
  };
  raf = requestAnimationFrame(step);
}
let seqT = [];
function stopSeq() { seqT.forEach(clearTimeout); seqT = []; }
function seq(list) {
  stopSeq(); let t = 0;
  list.forEach(([v, wait, dur]) => { seqT.push(setTimeout(() => go(v, dur), t)); t += wait; });
}
rg.addEventListener('input', () => { stopSeq(); go(+rg.value, 500); });
document.querySelectorAll('[data-add]').forEach((b) => b.addEventListener('click', () => { stopSeq(); go(Math.round(cur) + +b.dataset.add); }));
document.querySelectorAll('[data-set]').forEach((b) => b.addEventListener('click', () => { stopSeq(); go(+b.dataset.set, +b.dataset.set === 0 ? 700 : 1400); }));
document.getElementById('bSeq').addEventListener('click', () => {
  seq([[0, 900, 600], [18, 4000, 1000], [30, 6000, 1000], [45, 4000, 1000], [55, 6000, 1000], [70, 4000, 1000], [80, 6000, 1000], [92, 4000, 1000], [100, 10000, 1000], [130, 0, 1600]]);
});
document.getElementById('bBloom').addEventListener('click', () => { seq([[90, 1200, 700], [100, 0, 1000]]); });
document.getElementById('cbBig').addEventListener('change', (e) => { document.body.classList.toggle('big', e.target.checked); GAUGES.forEach((g) => g.goo.resize()); });
window.addEventListener('resize', () => GAUGES.forEach((g) => g.goo.resize()));
let run = 'all';
document.getElementById('selRun').addEventListener('change', (e) => {
  run = e.target.value;
  GAUGES.forEach((g, i) => g.card.classList.toggle('paused', run !== 'all' && +run !== i));
});

// 常時の動き（非表示タブでは rAF が来ない＝そのまま止まる）。動きは3つとも同じ dt で進める
let last = performance.now(), fAcc = 0, fN = 0;
const fpsEl = document.getElementById('fps');
function loop(now) {
  const raw = (now - last) / 1000, dt = Math.min(0.05, raw); last = now;
  fAcc += raw; fN++;
  if (fAcc >= 0.5) { fpsEl.textContent = Math.round(fN / fAcc) + ' コマ/秒'; fAcc = 0; fN = 0; }
  GAUGES.forEach((g, i) => g.tick(dt, run === 'all' || +run === i));
  requestAnimationFrame(loop);
}
requestAnimationFrame(loop);
// ?v=70&ff=8 はその達成率にして 8 秒ぶん時間を先送りする（ヘッドレスでの検査用）
const qs = new URLSearchParams(location.search), qv = +qs.get('v'), qff = +qs.get('ff');
if (qv && qff) { cur = qv; apply(qv); for (let i = 0; i < qff * 60; i++) GAUGES.forEach((g) => g.tick(1 / 60, i === qff * 60 - 1)); }
else if (qv) go(qv, 1500);
</script>
