<!DOCTYPE html>
<html lang="ja" class="ui-aurora">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>待機列の最下段 10案</title>
<!--
  ハブ「プロトコル待機列」の最下段「今日の復習の減り方」（index.js _srsVizHtml の burnHtml）の差し替え案を見比べるデモ（2026-10-01）。
  経緯：減り方の階段は「解いた数だけ1ずつ減る」ので必ず一定の傾きになり、本日消化のリングと同じことしか言っていない＝無意味、と言われた。
  A＝今日の復習の結果（間隔が伸びた／明日に戻った）5案、B＝段階ごとの問題数（学習中・若い・育ち中・定着）5案。
  カードは現行（2026-10-01・14日の予定は B 案「今日を切り離す」）を再現し、最下段だけを差し替える。本物のテーマCSSを読む。
  数字はすべて架空。本物の関数は呼ばない。何も保存しない。テストの対象ではない。
-->
<link rel="stylesheet" href="../vars.css">
<link rel="stylesheet" id="cssUi" href="../theme_css/ui_theme.aurora.css">
<link rel="stylesheet" id="cssHub" href="../theme_css/index.aurora.css">
<script src="../mindmap_data/index.js"></script>
<style>
  body{min-height:100vh;}
  .harness{max-width:680px;margin:0 auto;padding:16px 16px 6px;color:var(--t1,#eee);font-size:13px;}
  .harness h1{font-size:15px;margin:0 0 4px;}
  .harness p.lead{font-size:12px;line-height:1.7;opacity:.75;margin:0 0 10px;}
  .grp{font-size:11px;font-weight:800;opacity:.8;margin:8px 0 4px;}
  .plans{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px;}
  .plans button{padding:8px 9px;border-radius:10px;border:1px solid rgba(255,255,255,.2);background:rgba(0,0,0,.28);color:inherit;font:inherit;text-align:left;cursor:pointer;}
  .plans button b{display:block;font-size:12.5px;}
  .plans button small{display:block;font-size:10px;opacity:.7;margin-top:2px;line-height:1.35;}
  .plans button.on{background:rgba(255,255,255,.9);color:#111;}
  .row{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin:10px 0 8px;font-size:12px;}
  .row select{font:inherit;padding:4px 6px;border-radius:6px;}
  .desc{font-size:12px;line-height:1.75;padding:9px 11px;border-radius:10px;background:rgba(0,0,0,.3);border:1px solid rgba(255,255,255,.14);}
  .desc b{color:var(--or,#f97316);}
  .desc .warn{display:block;margin-top:4px;color:#fca5a5;}
  .stage{max-width:680px;margin:12px auto 60px;padding:0 16px;}
  .hero-say.srs-card{max-width:none;margin-top:0;}
  .srs-viz-x{grid-column:1/-1;}
  @media (max-width:560px){ .srs-viz-x{order:5;} .plans{grid-template-columns:repeat(2,minmax(0,1fr));} }

  /* 共通の部品 */
  .q-num{font-feature-settings:"tnum";}
  .q-ok{color:#4ade80;} .q-ng{color:#f87171;}
  .q-txt{font-size:10.5px;color:rgba(var(--glass-rgb),.88);line-height:1.6;font-feature-settings:"tnum";}
  .q-txt b{color:rgba(var(--glass-rgb),1);font-weight:800;font-size:11.5px;}

  /* A1 2色の帯 */
  .a1-bar{display:flex;height:14px;border-radius:3px;overflow:hidden;background:rgba(var(--glass-rgb),.1);}
  .a1-bar i{display:block;height:100%;}
  .a1-legs{display:flex;justify-content:space-between;gap:10px;margin-top:5px;flex-wrap:wrap;}
  .a1-leg{font-size:10.5px;color:rgba(var(--glass-rgb),.88);white-space:nowrap;font-feature-settings:"tnum";}
  .a1-leg b{font-size:13px;font-weight:800;}
  .a1-leg small{opacity:.8;margin-left:4px;}

  /* A2 行き先の棒 */
  .a2{display:flex;flex-direction:column;gap:4px;}
  .a2-r{display:grid;grid-template-columns:4em minmax(0,1fr) 5.6em;gap:6px;align-items:center;font-size:10.5px;color:rgba(var(--glass-rgb),.9);white-space:nowrap;font-feature-settings:"tnum";}
  .a2-t{display:flex;height:10px;border-radius:2px;background:rgba(var(--glass-rgb),.08);overflow:hidden;}
  .a2-t i{display:block;height:100%;}
  .a2-r b{text-align:right;font-weight:800;color:rgba(var(--glass-rgb),1);}

  /* A3 稼いだ日数 */
  .a3{display:flex;align-items:center;gap:14px;}
  .a3-big{font-size:28px;font-weight:800;line-height:1;color:#4ade80;font-feature-settings:"tnum";text-shadow:0 1px 3px rgba(0,0,0,.6);white-space:nowrap;}
  .a3-big small{font-size:12px;margin-left:2px;}

  /* A4 散布図 */
  .a4{display:flex;gap:10px;align-items:stretch;}
  .a4 svg{flex:0 0 auto;width:210px;height:120px;display:block;}
  .a4 .ax{stroke:rgba(var(--glass-rgb),.3);stroke-width:1;}
  .a4 .diag{stroke:rgba(var(--glass-rgb),.4);stroke-width:1;stroke-dasharray:3 3;}
  .a4 text{font-size:8px;fill:rgba(var(--glass-rgb),.75);}

  /* A5 科目別 */
  .a5{display:flex;flex-direction:column;gap:4px;}
  .a5-r{display:grid;grid-template-columns:5.6em minmax(0,1fr) 4.6em;gap:6px;align-items:center;font-size:10.5px;color:rgba(var(--glass-rgb),.9);white-space:nowrap;font-feature-settings:"tnum";}
  .a5-t{display:flex;height:9px;border-radius:2px;overflow:hidden;background:rgba(var(--glass-rgb),.08);}
  .a5-t i{display:block;height:100%;}
  .a5-r b{text-align:right;font-weight:800;color:rgba(var(--glass-rgb),1);}

  /* B 段階の色 */
  :root{--st0:#f97316;--st1:#facc15;--st2:#38bdf8;--st3:#a78bfa;}

  /* B1 積み上げ帯 */
  .b1-bar{display:flex;height:16px;border-radius:3px;overflow:hidden;}
  .b1-bar i{display:block;height:100%;}
  .b1-legs{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:6px;margin-top:5px;}
  .b1-leg{font-size:10px;color:rgba(var(--glass-rgb),.85);font-feature-settings:"tnum";white-space:nowrap;}
  .b1-leg i{display:inline-block;width:8px;height:8px;border-radius:2px;margin-right:3px;vertical-align:-1px;}
  .b1-leg b{display:block;font-size:13px;font-weight:800;color:rgba(var(--glass-rgb),1);}
  .dl{font-size:10px;font-weight:800;margin-left:3px;}
  .dl.up{color:#4ade80;} .dl.dn{color:#f87171;} .dl.z{color:rgba(var(--glass-rgb),.55);}

  /* B2 パイプライン */
  .b2{display:flex;align-items:stretch;gap:4px;}
  .b2-box{flex:1;min-width:0;border-radius:4px;padding:5px 4px;text-align:center;border:1px solid rgba(var(--glass-rgb),.14);background:rgba(var(--glass-rgb),.05);}
  .b2-box .l{font-size:10px;font-weight:700;white-space:nowrap;}
  .b2-box b{display:block;font-size:17px;font-weight:800;line-height:1.2;color:rgba(var(--glass-rgb),1);font-feature-settings:"tnum";}
  .b2-box .dl{display:block;margin:0;}
  .b2-ar{align-self:center;font-size:12px;color:rgba(var(--glass-rgb),.55);}

  /* B3 縦棒＋残像 */
  .b3{display:flex;gap:10px;height:96px;}
  .b3-c{flex:1;display:flex;flex-direction:column;min-width:0;}
  .b3-n{text-align:center;font-size:11px;font-weight:800;color:rgba(var(--glass-rgb),1);font-feature-settings:"tnum";white-space:nowrap;}
  .b3-s{flex:1;position:relative;border-bottom:1px solid rgba(var(--glass-rgb),.25);}
  .b3-s i{position:absolute;left:18%;right:18%;bottom:0;border-radius:2px 2px 0 0;}
  .b3-s i.ghost{left:10%;right:10%;background:transparent!important;border:0;border-top:2px dashed rgba(255,255,255,.9);border-radius:0;z-index:1;}
  .b3-l{text-align:center;font-size:10px;color:rgba(var(--glass-rgb),.85);white-space:nowrap;margin-top:2px;}

  /* B4 定着率メーター */
  .b4-top{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap;font-feature-settings:"tnum";}
  .b4-top .big{font-size:24px;font-weight:800;color:var(--st3);line-height:1;}
  .b4-top .of{font-size:11px;color:rgba(var(--glass-rgb),.8);}
  .b4-meter{height:12px;border-radius:3px;background:rgba(var(--glass-rgb),.1);overflow:hidden;margin:6px 0 4px;display:flex;}
  .b4-meter i{display:block;height:100%;}

  /* B5 科目×段階 */
  .b5{display:flex;flex-direction:column;gap:4px;}
  .b5-r{display:grid;grid-template-columns:5.6em minmax(0,1fr) 3.6em;gap:6px;align-items:center;font-size:10.5px;color:rgba(var(--glass-rgb),.9);white-space:nowrap;font-feature-settings:"tnum";}
  .b5-t{display:flex;height:9px;border-radius:2px;overflow:hidden;}
  .b5-t i{display:block;height:100%;}
  .b5-r b{text-align:right;font-weight:800;color:var(--st3);}
  .b-leg{display:flex;gap:9px;flex-wrap:wrap;font-size:10px;color:rgba(var(--glass-rgb),.85);margin-top:4px;}
  .b-leg i{display:inline-block;width:8px;height:8px;border-radius:2px;margin-right:3px;vertical-align:-1px;}

  /* 現行の減り方 */
  .bn-svg{display:block;width:100%;height:56px;}
</style>
</head>
<body>
<div class="harness">
  <h1>待機列の最下段：A 5案・B 5案</h1>
  <p class="lead">カードは今のハブと同じもの（テーマCSSも本物）で、いちばん下の段「今日の復習の減り方」だけを差し替えています。数字は架空で、今日 SRS 復習を182問解いた日を想定しています（正解141・誤答41）。</p>
  <div class="grp">比較用</div>
  <div class="plans" id="plans0"></div>
  <div class="grp">A　今日の復習の結果（間隔が伸びた／明日に戻った）</div>
  <div class="plans" id="plansA"></div>
  <div class="grp">B　段階ごとの問題数（学習中 → 若い → 育ち中 → 定着）</div>
  <div class="plans" id="plansB"></div>
  <div class="row">テーマ <select id="theme"></select></div>
  <div class="desc" id="desc"></div>
</div>
<div class="stage" id="stage"></div>

<script>
// ── 架空のデータ ─────────────────────────────────────────────
const D = {
  done: 182, goal: 200, newToday: 24, newCap: 72, due: 273, session: 50, maxLate: 9,
  pills: { high: 31, mid: 186, today: 56 },
  fc: [273, 115, 88, 41, 52, 132, 30, 77, 95, 60, 45, 18, 29, 70], late: 217,
  subj: [['hema',38],['circ',36],['endo',31],['obg',29],['resp',27],['neur',25],['dige',22],['kansen',20],['peds',18],['psy',15],['uro',12]],
};
// 今日解いた SRS 問題の結果（A 系）。正解141問の「次の間隔」（日）と、正解した時点の「前の間隔」。
// 決定論の擬似乱数で作る（開くたびに形が変わらないように）。
let seed = 7; const rnd = () => (seed = (seed * 16807) % 2147483647) / 2147483647;
const OKS = [];
[[12, 1, 1], [58, 2, 6], [49, 7, 20], [22, 21, 60]].forEach(([n, lo, hi]) => {
  for (let i = 0; i < n; i++) {
    const nx = Math.round(lo + rnd() * (hi - lo));
    OKS.push({ next: nx, prev: Math.max(1, Math.round(nx / (1.6 + rnd() * 1.0))) });
  }
});
const NGS = Array.from({ length: 41 }, () => ({ prev: Math.max(1, Math.round(Math.pow(rnd(), 1.6) * 40)) }));
const OK = OKS.length, NG = NGS.length;
const sumDays = OKS.reduce((a, x) => a + x.next, 0);
const avgNext = Math.round(sumDays / OK);
const A5 = [['circ', 38, 8], ['resp', 21, 12], ['hema', 30, 4], ['endo', 25, 6], ['neur', 15, 5]];
const A5REST = [12, 6];
// 段階ごとの問題数（B 系）。prev＝前回ハブを見たとき（mec_hub_since_v1 に足す想定）。
const ST = [
  { k: '学習中', c: 'var(--st0)', n: 612, prev: 636, note: 'reps<3' },
  { k: '若い', c: 'var(--st1)', n: 880, prev: 874, note: '間隔<7日' },
  { k: '育ち中', c: 'var(--st2)', n: 1104, prev: 1092, note: '間隔<21日' },
  { k: '定着', c: 'var(--st3)', n: 1530, prev: 1512, note: 'トロフィーと同じ' },
];
const ST_TOTAL = ST.reduce((a, s) => a + s.n, 0);
const MD_TODAY = 18;   // 札の md が今日の数（定着だけは前回の値なしで正確に出せる）
const B5 = [['circ', [70, 98, 140, 262]], ['hema', [52, 80, 118, 196]], ['endo', [61, 92, 104, 170]], ['resp', [66, 101, 120, 158]], ['neur', [58, 77, 96, 140]]];

const SUBJ = {}; (window.MM_SUBJECTS || []).forEach(s => SUBJ[s.sid] = s);
const sName = sid => sid === 'kakumon' ? '国試過去問' : (SUBJ[sid] ? SUBJ[sid].label : sid);
const sColor = sid => SUBJ[sid] ? SUBJ[sid].color : '#8a8fa3';
const n = v => v.toLocaleString('ja-JP');
const dl = (a, b) => { const d = a - b; return '<span class="dl ' + (d > 0 ? 'up' : d < 0 ? 'dn' : 'z') + '">' + (d > 0 ? '+' + d : d < 0 ? '−' + (-d) : '±0') + '</span>'; };
const G = D.goal;
const TODAY = new Date('2026-10-01T00:00:00+09:00');
const dt = off => new Date(TODAY.getTime() + off * 86400000);

// ── いまのカード（index.js の出力と同じ組み立て・最下段だけ差し替え）──
function card(bottom) {
  const p = D.pills;
  const R = 2 * Math.PI * 40, ratio = Math.min(1, D.done / G);
  const rows = D.subj.slice(0, 5).map(([s, v]) => '<div class="sv-sr"><span class="sv-sn">' + sName(s) + '</span><span class="sv-track"><i style="width:' + (v / D.subj[0][1] * 100) + '%;background:' + sColor(s) + '"></i></span><b>' + v + '</b></div>').join('') +
    '<div class="sv-sr is-rest"><span class="sv-sn">ほか' + (D.subj.length - 5) + '科目</span><span></span><b>' + D.subj.slice(5).reduce((a, x) => a + x[1], 0) + '</b></div>';
  const fut = D.fc.slice(1), top = Math.max(...fut);
  let mx = 0, mn = 0; fut.forEach((v, i) => { if (v > fut[mx]) mx = i; if (v < fut[mn]) mn = i; });
  const cols = fut.map((v, i) => '<div class="fb-col"><span class="fb-n">' + (i === 0 || i === mx || i === mn ? v : '') + '</span><div class="fb-slot"><span class="fb-bar' + (i === mx ? ' is-peak' : '') + '" style="height:' + (v / top * 100) + '%"></span></div>' +
    '<span class="fb-lbl">' + (i % 2 === 0 ? dt(i + 1).getDate() : '') + '</span></div>').join('');
  return '<div class="hero-say srs-card"><span class="srs-deco" aria-hidden="true"></span>' +
    '<div class="srs-card-hdr"><div class="srs-card-title-grp"><span class="srs-card-ttl"><span class="srs-ttl-ic">♾️</span>プロトコル待機列</span>' +
      '<span class="srs-tag srs-tag-cross">科目横断</span><span class="srs-tag srs-tag-risk">忘却リスク順</span></div>' +
      '<div class="srs-card-counts"><div class="srs-card-today">本日消化 <b>' + D.done + '</b><span class="srs-goal">/ ' + G + '</span>問</div>' +
      '<div class="srs-card-new">新規 <b>' + D.newToday + '</b><span class="srs-goal">/ ' + D.newCap + '</span>問</div></div></div>' +
    '<div class="srs-card-stat">' +
      '<div class="srs-stat-cell"><span class="srs-stat-lbl">復習待ち</span><span class="srs-stat-val"><b>' + D.due + '</b><small>問</small></span></div>' +
      '<span class="srs-stat-sep">➔</span><div class="srs-stat-cell highlight"><span class="srs-stat-lbl">今回の出題</span><span class="srs-stat-val"><b>優先 ' + D.session + '</b><small>問</small></span></div>' +
      '<span class="srs-stat-sep srs-stat-extra">➔</span><div class="srs-stat-cell srs-stat-extra"><span class="srs-stat-lbl">終わると残り</span><span class="srs-stat-val"><b>' + (D.due - D.session) + '</b><small>問</small></span></div>' +
      '<span class="srs-stat-divider srs-stat-extra"></span><div class="srs-stat-cell srs-stat-extra"><span class="srs-stat-lbl">目標まで</span><span class="srs-stat-val"><small>あと</small><b>' + (G - D.done) + '</b><small>問</small></span></div>' +
      '<div class="srs-stat-cell srs-stat-extra srs-stat-late is-bad"><span class="srs-stat-lbl">最大の遅れ</span><span class="srs-stat-val"><b>' + D.maxLate + '</b><small>日</small></span></div>' +
      '<span class="srs-stat-divider"></span><div class="srs-stat-cell srs-risk-cell"><span class="srs-stat-lbl">忘却リスク内訳</span><div class="srs-risk-pills">' +
      '<span class="srs-risk-pill risk-high"><span class="srs-pi">🔥</span> 超危険 <b>' + p.high + '</b></span>' +
      '<span class="srs-risk-pill risk-mid"><span class="srs-pi">⚠️</span> 期限切れ <b>' + p.mid + '</b></span>' +
      '<span class="srs-risk-pill risk-due"><span class="srs-pi">📅</span> 本日 <b>' + p.today + '</b></span></div></div></div>' +
    '<div class="srs-risk-bar"><span class="rb-high" style="flex:' + p.high + '"></span><span class="rb-mid" style="flex:' + p.mid + '"></span><span class="rb-due" style="flex:' + p.today + '"></span></div>' +
    '<div class="srs-viz">' +
      '<div class="srs-viz-ring"><span class="vr-box"><svg viewBox="0 0 92 92"><circle class="vr-track" cx="46" cy="46" r="40"></circle><circle class="vr-fill" cx="46" cy="46" r="40" stroke-dasharray="' + R + '" stroke-dashoffset="' + (R * (1 - ratio)) + '"></circle></svg>' +
        '<span class="vr-mid"><b>' + D.done + '</b><small>/ ' + G + '問</small></span></span><span class="srs-viz-cap">本日消化 <b>' + Math.round(ratio * 100) + '%</b></span></div>' +
      '<div class="srs-viz-fc srs-viz-pane"><div class="srs-viz-hd"><span class="srs-viz-t">今後14日の予定</span></div>' +
        '<div class="fb-wrap"><div class="fb-today"><span class="fbt-l">今日</span><b>' + D.fc[0] + '</b><small>期限切れ ' + D.late + '</small></div><div class="fb-chart">' + cols + '</div></div></div>' +
      '<div class="srs-viz-sb srs-viz-pane"><div class="srs-viz-hd"><span class="srs-viz-t">科目別の復習待ち</span><span class="srs-viz-note"><b>' + D.subj.length + '</b>科目</span></div>' + rows + '</div>' +
      bottom +
    '</div></div>';
}
const pane = (title, note, body) => '<div class="srs-viz-x srs-viz-pane"><div class="srs-viz-hd"><span class="srs-viz-t">' + title + '</span>' + (note ? '<span class="srs-viz-note">' + note + '</span>' : '') + '</div>' + body + '</div>';

// ── 現行：減り方の階段 ──
function now() {
  const start = D.due + D.done, W = 300, H = 56, P = 3;
  const lo = Math.max(0, Math.min(D.due, start - G) - 18), span = start - lo;
  const y = v => P + (1 - (v - lo) / span) * (H - 2 * P);
  // 3回のセッションで解いた想定（時刻の間隔だけが違う）
  const t = []; [[0, 50], [80, 50], [190, 82]].forEach(([at, k]) => { for (let i = 0; i < k; i++) t.push(at + i * 0.6); });
  const t1 = 260, x = m => P + m / t1 * (W - 2 * P);
  let d = 'M' + x(0) + ',' + y(start);
  t.forEach((m, i) => { d += ' H' + x(m).toFixed(1) + ' V' + y(start - i - 1).toFixed(1); });
  d += ' H' + x(t1);
  const gy = y(start - G);
  const svg = '<svg class="bn-svg" viewBox="0 0 300 56" preserveAspectRatio="none"><path d="' + d + ' V53 H3 Z" fill="rgba(56,189,248,.16)"></path>' +
    '<line x1="3" x2="297" y1="' + gy + '" y2="' + gy + '" stroke="rgba(255,255,255,.55)" stroke-dasharray="4 3" vector-effect="non-scaling-stroke"></line>' +
    '<path d="' + d + '" fill="none" stroke="#38bdf8" stroke-width="2" vector-effect="non-scaling-stroke"></path></svg>';
  return pane('今日の復習の減り方', 'はじめ <b>' + start + '</b> → いま <b>' + D.due + '</b>（−' + D.done + '）', svg +
    '<div class="bn-axis"><span>08:12</span><span class="bn-goal-l">┄ 目標ライン（' + G + '問）</span><span>いま 12:32</span></div>');
}

// ── A1 2色の帯＋行き先の一言 ──
function a1() {
  const tot = OK + NG;
  return pane('今日の復習の結果', '<b>' + tot + '</b>問',
    '<div class="a1-bar"><i style="width:' + (OK / tot * 100) + '%;background:linear-gradient(180deg,#4ade80,#16a34a)"></i><i style="width:' + (NG / tot * 100) + '%;background:linear-gradient(180deg,#f87171,#dc2626)"></i></div>' +
    '<div class="a1-legs"><span class="a1-leg">✅ 間隔が伸びた <b class="q-ok">' + OK + '</b><small>→ 次は平均 ' + avgNext + '日後</small></span>' +
    '<span class="a1-leg">❌ 明日に戻った <b class="q-ng">' + NG + '</b><small>→ 明日の予定に +' + NG + '</small></span></div>');
}

// ── A2 行き先の棒 ──
function a2() {
  const B = [['明日', x => x <= 1], ['2〜6日', x => x >= 2 && x <= 6], ['7〜20日', x => x >= 7 && x <= 20], ['21日〜', x => x >= 21]];
  const cnt = B.map(([, f]) => OKS.filter(o => f(o.next)).length);
  const ng = [NG, 0, 0, 0];
  const top = Math.max(...cnt.map((c, i) => c + ng[i]));
  const rows = B.map(([l], i) => '<div class="a2-r"><span>' + l + '</span><span class="a2-t">' +
    (ng[i] ? '<i style="width:' + (ng[i] / top * 100) + '%;background:#ef4444"></i>' : '') +
    '<i style="width:' + (cnt[i] / top * 100) + '%;background:#22c55e"></i></span>' +
    '<b>' + (ng[i] ? '<span class="q-ng">' + ng[i] + '</span>＋' : '') + cnt[i] + '問</b></div>').join('');
  return pane('今日解いた問題が次に出る日', '<span class="q-ng">■</span> 誤答 <span class="q-ok">■</span> 正解', '<div class="a2">' + rows + '</div>');
}

// ── A3 稼いだ日数 ──
function a3() {
  return pane('今日の復習で稼いだ日数', '',
    '<div class="a3"><div class="a3-big">+' + n(sumDays) + '<small>日</small></div>' +
    '<div class="q-txt">間隔が伸びた <b class="q-ok">' + OK + '</b>問の「次に会うまでの日数」の合計<br>' +
    '❌ <b class="q-ng">' + NG + '</b>問は明日へ（稼ぎ 0日）</div></div>');
}

// ── A4 前の間隔 → 次の間隔 ──
function a4() {
  const W = 210, H = 120, L = 22, B = 16, mx = 60;
  const sx = v => L + Math.log(1 + v) / Math.log(1 + mx) * (W - L - 4);
  const sy = v => H - B - Math.log(1 + v) / Math.log(1 + mx) * (H - B - 4);
  let s = '<line class="ax" x1="' + L + '" x2="' + (W - 4) + '" y1="' + (H - B) + '" y2="' + (H - B) + '"/><line class="ax" x1="' + L + '" x2="' + L + '" y1="4" y2="' + (H - B) + '"/>' +
    '<line class="diag" x1="' + sx(0) + '" y1="' + sy(0) + '" x2="' + sx(mx) + '" y2="' + sy(mx) + '"/>';
  [1, 7, 21, 60].forEach(v => { s += '<text x="' + sx(v) + '" y="' + (H - 4) + '" text-anchor="middle">' + v + '</text><text x="' + (L - 3) + '" y="' + (sy(v) + 3) + '" text-anchor="end">' + v + '</text>'; });
  OKS.forEach(o => { s += '<circle cx="' + (sx(o.prev) + (rnd() - .5) * 3).toFixed(1) + '" cy="' + (sy(o.next) + (rnd() - .5) * 3).toFixed(1) + '" r="2" fill="#4ade80" fill-opacity=".75"/>'; });
  NGS.forEach(o => { s += '<circle cx="' + (sx(o.prev) + (rnd() - .5) * 3).toFixed(1) + '" cy="' + (sy(1) + (rnd() - .5) * 3).toFixed(1) + '" r="2" fill="#f87171" fill-opacity=".85"/>'; });
  const far = NGS.filter(o => o.prev >= 7).length;
  return pane('前の間隔 → 次の間隔', '横＝前・縦＝次（日）',
    '<div class="a4"><svg viewBox="0 0 ' + W + ' ' + H + '">' + s + '</svg>' +
    '<div class="q-txt">点線より上＝間隔が伸びた<br>下の床（1日）＝明日に戻った<br><br>❌ のうち前の間隔が<b>7日以上</b>だったもの <b class="q-ng">' + far + '</b>問<br><span style="opacity:.75">＝せっかく育っていたのに落とした</span></div></div>');
}

// ── A5 科目別の結果 ──
function a5() {
  const top = Math.max(...A5.map(r => r[1] + r[2]));
  const rows = A5.map(([sid, ok, ng]) => '<div class="a5-r"><span>' + sName(sid) + '</span><span class="a5-t">' +
    '<i style="width:' + (ok / top * 100) + '%;background:' + sColor(sid) + '"></i><i style="width:' + (ng / top * 100) + '%;background:repeating-linear-gradient(-45deg,#ef4444 0 3px,#7f1d1d 3px 6px)"></i></span>' +
    '<b><span class="q-ok">' + ok + '</span> / <span class="q-ng">' + ng + '</span></b></div>').join('') +
    '<div class="a5-r" style="opacity:.75"><span>ほか6科目</span><span></span><b><span class="q-ok">' + A5REST[0] + '</span> / <span class="q-ng">' + A5REST[1] + '</span></b></div>';
  return pane('科目別の今日の結果', '<span class="q-ok">伸びた</span> / <span class="q-ng">明日へ</span>', '<div class="a5">' + rows + '</div>');
}

// ── B1 4段階の積み上げ帯 ──
function b1() {
  return pane('定着までの道のり', '全 <b>' + n(ST_TOTAL) + '</b>問',
    '<div class="b1-bar">' + ST.map(s => '<i style="width:' + (s.n / ST_TOTAL * 100) + '%;background:' + s.c + '"></i>').join('') + '</div>' +
    '<div class="b1-legs">' + ST.map((s, i) => '<span class="b1-leg"><i style="background:' + s.c + '"></i>' + s.k + '<b>' + n(s.n) + (i === 3 ? '<span class="dl up">今日 +' + MD_TODAY + '</span>' : '') + '</b></span>').join('') + '</div>');
}

// ── B2 パイプライン ──
function b2() {
  const boxes = ST.map(s => '<div class="b2-box" style="border-color:' + s.c + '"><span class="l" style="color:' + s.c + '">' + s.k + '</span><b>' + n(s.n) + '</b>' + dl(s.n, s.prev) + '</div>');
  return pane('定着までの道のり', '前回ハブを見てから',
    '<div class="b2">' + boxes.join('<span class="b2-ar">➜</span>') + '</div>');
}

// ── B3 縦棒＋前回の残像 ──
function b3() {
  const top = Math.max(...ST.map(s => Math.max(s.n, s.prev)));
  const cols = ST.map(s => '<div class="b3-c"><span class="b3-n">' + n(s.n) + dl(s.n, s.prev) + '</span><div class="b3-s">' +
    '<i style="height:' + (s.n / top * 100) + '%;background:' + s.c + '"></i>' +
    '<i class="ghost" style="height:' + (s.prev / top * 100) + '%"></i></div><span class="b3-l">' + s.k + '</span></div>').join('');
  return pane('定着までの道のり', '点線＝前回ハブを見たとき', '<div class="b3">' + cols + '</div>');
}

// ── B4 定着率のメーター ──
function b4() {
  const m = ST[3];
  return pane('定着率', '',
    '<div class="b4-top"><span class="big">' + Math.round(m.n / ST_TOTAL * 100) + '%</span><span class="of">定着 <b>' + n(m.n) + '</b> / ' + n(ST_TOTAL) + '問</span><span class="dl up">今日 +' + MD_TODAY + '</span></div>' +
    '<div class="b4-meter"><i style="width:' + (m.n / ST_TOTAL * 100) + '%;background:linear-gradient(90deg,#8b5cf6,#a78bfa)"></i></div>' +
    '<div class="q-txt">残りの内訳：学習中 <b>' + n(ST[0].n) + '</b>・若い <b>' + n(ST[1].n) + '</b>・育ち中 <b>' + n(ST[2].n) + '</b></div>');
}

// ── B5 科目×段階 ──
function b5() {
  const rows = B5.map(([sid, a]) => {
    const t = a.reduce((x, y) => x + y, 0);
    return '<div class="b5-r"><span>' + sName(sid) + '</span><span class="b5-t">' + a.map((v, i) => '<i style="width:' + (v / t * 100) + '%;background:' + ST[i].c + '"></i>').join('') + '</span><b>' + Math.round(a[3] / t * 100) + '%</b></div>';
  }).join('');
  return pane('科目別の定着までの道のり', '右＝定着率',
    '<div class="b5">' + rows + '</div><div class="b-leg">' + ST.map(s => '<span><i style="background:' + s.c + '"></i>' + s.k + '</span>').join('') + '</div>');
}

const PLANS = [
  { g: 0, id: 'now', name: '現行', sub: '今日の復習の減り方', fn: now, desc: 'いまハブに出ている形。解いた数だけ1ずつ減るので傾きは必ず一定で、本日消化のリングと同じことしか言っていない。比較用。' },
  { g: 0, id: 'AB', name: 'A1＋B2', sub: 'おすすめの組み合わせ', fn: () => a1() + b2(), desc: '<b>A1（今日の手応え）</b>と<b>B2（積み上がり）</b>を上下に並べた形。役割が重ならない。縦は2段ぶん増える。' },
  { g: 'A', id: 'A1', name: 'A1 2色の帯', sub: '伸びた／明日へ＋一言', fn: a1, desc: '今日 SRS で解いた問題を<b>間隔が伸びた（緑）</b>と<b>明日に戻った（赤）</b>の2色の帯にする。言いたいのは「明日の予定に +41」＝<b>今日の誤答が明日の負担になる</b>こと。<br>材料：今日の解答ログ（mode=s）の uid → SRS の札の reps・interval。新しい保存なし。' },
  { g: 'A', id: 'A2', name: 'A2 行き先の棒', sub: '次に出る日を4つに分ける', fn: a2, desc: '今日解いた問題が<b>次にいつ出るか</b>を4つの棒に分ける。誤答は全部「明日」に入るので赤の長さで A1 と同じことが読め、正解した問題が<b>どこまで遠くへ行ったか</b>も見える。<br>材料は A1 と同じ。' },
  { g: 'A', id: 'A3', name: 'A3 稼いだ日数', sub: '次の間隔の合計を1つの数字に', fn: a3, desc: '間隔が伸びた問題の「次に会うまでの日数」を<b>合計した1つの数字</b>にする。ゲームの得点のような見せ方。<span class="warn">⚠️ 数字の意味が抽象的（「1,284日」が何を意味するかは説明を読まないと分からない）。</span>' },
  { g: 'A', id: 'A4', name: 'A4 散布図', sub: '前の間隔 → 次の間隔', fn: a4, desc: '横＝前の間隔・縦＝次の間隔で点を打つ。<b>育っていた問題を落としたか</b>（右下の赤）が見える。<span class="warn">⚠️ 前の間隔は SRS の札にも解答ログにも残っていない＝解答ログに1項目足す（同期データの形が変わる）必要がある。非推奨。</span>' },
  { g: 'A', id: 'A5', name: 'A5 科目別', sub: '科目色の横棒×伸びた／明日へ', fn: a5, desc: '上の「科目別の復習待ち」と同じ形で、<b>今日どの科目で崩れたか</b>を見せる。<span class="warn">⚠️ 試験の結果画面（定着プロトコル）の科目別と内容が少しかぶる。</span>' },
  { g: 'B', id: 'B1', name: 'B1 積み上げ帯', sub: '4段階を1本の帯に', fn: b1, desc: 'SRS の全問題を<b>学習中・若い・育ち中・定着</b>の4段階に分けた1本の帯。1行で収まる。増減は定着の「今日 +N」だけ（札の md で正確に出せる）＝<b>新しい保存なし</b>。' },
  { g: 'B', id: 'B2', name: 'B2 パイプライン', sub: '数字の箱を矢印でつなぐ', fn: b2, desc: '4段階を<b>矢印でつないだ数字の箱</b>にして、前回ハブを見てからの増減を添える。「流れている」感じが一番伝わる。<br>材料：前回の値 mec_hub_since_v1（UIローカル・離れる瞬間に書く）に4つの数を足す。同期データは変えない。' },
  { g: 'B', id: 'B3', name: 'B3 縦棒＋残像', sub: '前回の高さを点線で重ねる', fn: b3, desc: '4段階を縦棒にして、<b>前回の高さを点線の残像</b>で重ねる。待機列の演出 D（棒の縮んだぶんの残像）と表現がそろう。材料は B2 と同じ。<span class="warn">⚠️ 縦が一番伸びる。⚠️ 1日の増減（±20前後）は段階の総数（千単位）に比べて小さく、残像の差がほとんど見えない。</span>' },
  { g: 'B', id: 'B4', name: 'B4 定着率メーター', sub: '主役を定着率1つに', fn: b4, desc: '主役を<b>定着率（％）1つ</b>に絞り、残りは文字の内訳に。トロフィー棚（定着コレクション）と話がつながる。増減は定着の「今日 +N」だけ＝<b>新しい保存なし</b>。' },
  { g: 'B', id: 'B5', name: 'B5 科目×段階', sub: '科目ごとに帯を1本ずつ', fn: b5, desc: '上位5科目について B1 の帯を1本ずつ並べ、右に定着率。<b>どの科目の定着が遅れているか</b>が分かる。<span class="warn">⚠️ 情報量が多く縦も伸びる（待機列は「スクロールしないと収まらない」と言われた経緯あり）。</span>' },
];

const THEMES = ['aurora', 'brass', 'cyber', 'liquid', 'kintsugi', 'celestial', 'abyss', 'frost'];
function show(id) {
  const p = PLANS.find(x => x.id === id);
  seed = 11;
  document.getElementById('stage').innerHTML = card(p.fn());
  document.getElementById('desc').innerHTML = p.desc;
  document.querySelectorAll('.plans button').forEach(b => b.classList.toggle('on', b.dataset.id === id));
}
function setTheme(t) {
  THEMES.forEach(x => document.documentElement.classList.remove('ui-' + x));
  document.documentElement.classList.add('ui-' + t);
  document.getElementById('cssUi').href = '../theme_css/ui_theme.' + t + '.css';
  document.getElementById('cssHub').href = '../theme_css/index.' + t + '.css';
  document.getElementById('theme').value = t;
}
const btn = p => '<button data-id="' + p.id + '"><b>' + p.name + '</b><small>' + p.sub + '</small></button>';
document.getElementById('plans0').innerHTML = PLANS.filter(p => p.g === 0).map(btn).join('');
document.getElementById('plansA').innerHTML = PLANS.filter(p => p.g === 'A').map(btn).join('');
document.getElementById('plansB').innerHTML = PLANS.filter(p => p.g === 'B').map(btn).join('');
document.querySelectorAll('.plans').forEach(el => el.addEventListener('click', e => { const b = e.target.closest('button'); if (b) show(b.dataset.id); }));
const sel = document.getElementById('theme');
sel.innerHTML = THEMES.map(t => '<option>' + t + '</option>').join('');
let t0 = 'aurora'; try { const s = localStorage.getItem('mec_ui_theme_v1'); if (THEMES.includes(s)) t0 = s; } catch (e) {}
setTheme(t0);
sel.addEventListener('change', () => setTheme(sel.value));
const q0 = new URLSearchParams(location.search).get('p');
show(PLANS.some(p => p.id === q0) ? q0 : 'now');
</script>
</body>
