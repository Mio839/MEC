<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>定着プロトコル 結果画面の演出 5案</title>
<!--
  定着プロトコル（ward.js）の結果画面 .exam-ward-res の「演出を強める」5案を見比べるデモ（2026-10-01）。
  ⚠️ 枠・配色・並び（リング→科目別→遅れ具合→前後→14日の棒→所見）は変えない＝現行の CSS をそのまま写してある。
     変えるのは「出てくる順番と動き」と、結果のあとに残る印だけ。どの案も時間の決まった一回きり（infinite なし）。
    A 開票   … 解いた順に床を1つずつ開け、リングと数字がそれに合わせて進む（床の列は記録として残る）
    B 判子   … 定着率に応じた評価の判子をリングに押す。全問定着の科目・取り戻した遅れにも小さな判子
    C 送り出し … 解いた問題が粒になってリングから「次に会う日」の棒へ飛び、着地するたびに棒が積み上がる
    D 塗り替え … リングを一度ぜんぶ赤（もう一度）で塗り、定着が上から塗り替える。前→後の棒も同じ塗り替え
    E 現行の拡張 … 今の順番のまま、リングの先端の光・棒の先の光沢・見出しの線・最後に枠が一周して COMPLETE
  本物の関数は呼ばない。何も保存しない。テストの対象ではない。
-->
<style>
  body{margin:0;min-height:100vh;padding:18px 16px 60px;color:#E8F6F8;font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Yu Gothic UI",sans-serif;
    background:radial-gradient(ellipse 95% 65% at 50% -18%,rgba(121,40,202,.5),transparent 68%),radial-gradient(circle at 15% 22%,rgba(0,229,255,.28),transparent 52%),linear-gradient(180deg,#050814,#03050c);}
  *{box-sizing:border-box;}
  html,body{overflow-x:clip;}
  .harness{max-width:520px;margin:0 auto;}
  .harness h1{font-size:15px;margin:0 0 4px;}
  .harness p{font-size:12.5px;line-height:1.7;opacity:.72;margin:0 0 12px;}
  .plans{display:grid;grid-template-columns:repeat(auto-fit,minmax(92px,1fr));gap:6px;margin-bottom:10px;}
  .plans button{padding:9px 10px;border-radius:12px;border:1px solid rgba(126,214,223,.28);background:rgba(18,48,58,.5);color:#E8F6F8;font:inherit;text-align:left;cursor:pointer;}
  .plans button b{display:block;font-size:13px;}
  .plans button small{display:block;font-size:10.5px;opacity:.7;margin-top:2px;line-height:1.4;}
  .plans button.on{background:#7ED6DF;color:#06201F;border-color:#7ED6DF;}
  .ctl{display:flex;flex-wrap:wrap;gap:8px 12px;align-items:center;margin-bottom:12px;}
  .ctl button{padding:9px 16px;border-radius:99px;border:0;background:#E8F6F8;color:#06201F;font:inherit;font-size:13px;font-weight:800;cursor:pointer;}
  .ctl label{font-size:13px;display:flex;align-items:center;gap:6px;cursor:pointer;}
  .ctl input{width:18px;height:18px;accent-color:#7ED6DF;}
  .ctl select{font:inherit;font-size:13px;padding:6px 8px;border-radius:8px;background:#0B1E25;color:#E8F6F8;border:1px solid rgba(126,214,223,.4);}
  .desc{font-size:12.5px;line-height:1.7;margin:0 0 10px;padding:9px 11px;border-radius:11px;background:rgba(126,214,223,.08);border:1px dashed rgba(126,214,223,.4);}
  .desc b{color:#7ED6DF;}
  /* 結果画面の箱（study.html の結果モーダルの見た目に寄せただけの台） */
  .mock{padding:16px 14px 14px;border-radius:18px;background:#0E1520;border:1px solid rgba(255,255,255,.12);box-shadow:0 20px 50px rgba(0,0,0,.6);}
  .mock .mh{text-align:center;font-size:12px;opacity:.6;margin-bottom:4px;}
  .mock .mp{text-align:center;font-size:34px;font-weight:900;margin-bottom:10px;}
  .mock .mb{height:38px;border-radius:12px;background:rgba(255,255,255,.06);margin-top:8px;}
  .pt{position:fixed;left:0;top:0;width:6px;height:6px;margin:-3px 0 0 -3px;border-radius:50%;pointer-events:none;z-index:50;}

  /* ── ここから ward.js の結果画面の CSS（写し） ── */
  .w-seg{fill:none;transition:stroke-dasharray .6s cubic-bezier(.16,1,.3,1),stroke-dashoffset .6s cubic-bezier(.16,1,.3,1);}
  .exam-ward-res{margin:4px 0 12px;padding:14px 14px 12px;border-radius:14px;text-align:left;
    background:linear-gradient(170deg,#12303A,#0B1E25 70%);border:1px solid rgba(126,214,223,.6);color:#E8F6F8;
    box-shadow:inset 0 0 0 3px rgba(6,16,20,.85),inset 0 0 0 4px rgba(126,214,223,.22);}
  .exam-ward-res .ewr-tag{font-size:10px;font-weight:900;letter-spacing:.3em;color:#7ED6DF;}
  .exam-ward-res .ewr-top{display:flex;align-items:center;gap:12px;margin:8px 0 10px;}
  .exam-ward-res .ewr-ring{position:relative;width:104px;flex-shrink:0;}
  .exam-ward-res .ewr-ring svg{display:block;width:100%;height:auto;overflow:visible;}
  .exam-ward-res .ewr-ring .c{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;line-height:1.05;}
  .exam-ward-res .ewr-ring .c b{font-size:22px;color:#6EE7B7;font-variant-numeric:tabular-nums;}
  .exam-ward-res .ewr-ring .c span{font-size:9.5px;font-weight:800;opacity:.7;}
  .exam-ward-res .ewr-sum{flex:1;display:flex;flex-direction:column;gap:6px;}
  .exam-ward-res .ewr-k{flex:1;text-align:center;padding:6px 4px;border-radius:10px;background:rgba(255,255,255,.05);}
  .exam-ward-res .ewr-k b{display:block;font-size:20px;font-variant-numeric:tabular-nums;}
  .exam-ward-res .ewr-k span{font-size:10.5px;font-weight:800;opacity:.75;}
  .exam-ward-res .ewr-k.d b{color:#6EE7B7}.exam-ward-res .ewr-k.s b{color:#FCA5A5}
  .exam-ward-res .ewr-h{font-size:11.5px;font-weight:900;margin:10px 0 5px;color:#BDEFF3;}
  .exam-ward-res .ewr-row{display:flex;align-items:center;gap:8px;font-size:12px;margin:3px 0;}
  .exam-ward-res .ewr-row .l{width:92px;flex-shrink:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-weight:800;}
  .exam-ward-res .ewr-row .bar{flex:1;height:8px;border-radius:99px;background:rgba(255,255,255,.08);overflow:hidden;display:flex;}
  .exam-ward-res .ewr-row .bar i,.exam-ward-res .ewr-ba .bar i,.exam-ward-res .ewr-sev .sb i{display:block;height:100%;transition:width .9s cubic-bezier(.16,1,.3,1);}
  .exam-ward-res .ewr-row .v{width:74px;flex-shrink:0;text-align:right;font-variant-numeric:tabular-nums;opacity:.85;}
  .exam-ward-res .ewr-sev{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px;}
  .exam-ward-res .ewr-sev > div{padding:6px 8px;border-radius:9px;background:rgba(255,255,255,.05);font-size:10.5px;font-weight:800;min-width:0;}
  .exam-ward-res .ewr-sev b{float:right;font-variant-numeric:tabular-nums;}
  .exam-ward-res .ewr-sev .sb{height:5px;border-radius:99px;background:rgba(255,255,255,.1);margin-top:5px;overflow:hidden;}
  .exam-ward-res .ewr-sev .sb i{background:#34D399;border-radius:99px;}
  .exam-ward-res .ewr-ba{display:flex;align-items:center;gap:8px;font-size:11.5px;margin-top:4px;}
  .exam-ward-res .ewr-ba .l{width:2.2em;flex-shrink:0;font-weight:800;opacity:.8;}
  .exam-ward-res .ewr-ba .bar{flex:1;height:10px;border-radius:99px;background:rgba(255,255,255,.08);display:flex;overflow:hidden;}
  .exam-ward-res .ewr-ba .v{flex-shrink:0;font-variant-numeric:tabular-nums;white-space:nowrap;}
  .exam-ward-res .ewr-cal{display:grid;grid-template-columns:repeat(14,minmax(0,1fr));gap:3px;align-items:end;height:64px;padding-bottom:2px;border-bottom:1px solid rgba(126,214,223,.3);}
  .exam-ward-res .ewr-cal .d{display:flex;flex-direction:column;justify-content:flex-end;align-items:center;height:100%;min-width:0;}
  .exam-ward-res .ewr-cal .d i{display:block;width:100%;max-width:12px;background:#34D399;transform-origin:bottom;}
  .exam-ward-res .ewr-cal .d i:first-of-type{border-radius:3px 3px 0 0;}
  .exam-ward-res .ewr-cal .d i.st{background:#F87171;}
  .exam-ward-res .ewr-cal .d em{font-style:normal;font-size:9.5px;font-weight:800;margin-bottom:2px;opacity:.85;}
  .exam-ward-res .ewr-calx{display:grid;grid-template-columns:repeat(14,minmax(0,1fr));gap:3px;margin-top:3px;font-size:9px;white-space:nowrap;letter-spacing:-.04em;text-align:center;opacity:.6;font-variant-numeric:tabular-nums;}
  .exam-ward-res .ewr-later{font-size:10.5px;opacity:.7;text-align:right;margin-top:4px;}
  .exam-ward-res .ewr-note{font-size:12px;line-height:1.6;margin-top:6px;padding:7px 9px;border-radius:9px;background:rgba(255,255,255,.05);}
  .exam-ward-res .ewr-note.alert{background:rgba(248,113,113,.14);border:1px solid rgba(248,113,113,.45);}
  /* ── 写しここまで ── */

  .exam-ward-res{position:relative;}

  /* A 開票：解いた順の床の列（HUD の床と同じ形） */
  .ewr-replay{display:flex;flex-wrap:wrap;gap:3px;margin:-2px 0 4px;padding:6px 7px;border-radius:9px;background:rgba(255,255,255,.04);}
  .ewr-replay i{width:9px;height:9px;border-radius:3px;background:rgba(255,255,255,.12);box-shadow:inset 0 0 0 1px rgba(255,255,255,.18);transition:background .25s ease,box-shadow .25s ease;}
  .ewr-replay i.crit{box-shadow:inset 0 0 0 1.5px #F87171}.ewr-replay i.warn{box-shadow:inset 0 0 0 1.5px #FBBF24}
  .ewr-replay i.discharge{background:#34D399;box-shadow:none}.ewr-replay i.stay{background:#F87171;box-shadow:none}
  .ewr-replay-h{display:flex;justify-content:space-between;font-size:10px;font-weight:800;opacity:.6;margin-top:2px;}

  /* B 判子 */
  .ewr-stamp{position:absolute;padding:3px 9px;border:2.5px solid var(--sc);border-radius:7px;color:var(--sc);font-weight:900;letter-spacing:.14em;rotate:-10deg;
    background:rgba(6,16,20,.72);text-shadow:0 0 7px color-mix(in srgb,var(--sc) 70%,transparent);box-shadow:0 0 12px color-mix(in srgb,var(--sc) 35%,transparent);pointer-events:none;white-space:nowrap;text-align:center;line-height:1.15;}
  .ewr-stamp.big{left:62px;top:84px;font-size:15px;}
  .ewr-stamp.big small{display:block;font-size:9.5px;letter-spacing:.06em;opacity:.9;}
  .ewr-stamp.mini{right:calc(100% + 6px);top:50%;translate:0 -50%;padding:0 4px;font-size:9px;letter-spacing:.06em;border-width:1.5px;border-radius:4px;rotate:-8deg;}
  .ewr-row .v{position:relative;}

  /* C 送り出し */
  .ewr-cal .d.land{filter:brightness(1.8);}
  .ewr-cal .d i{transition:height .22s cubic-bezier(.2,1.4,.5,1);}

  /* D 塗り替え：取り戻しのチップ */
  .ewr-chip{display:inline-block;margin-left:6px;padding:1px 8px;border-radius:99px;font-size:10.5px;font-weight:900;color:#06201F;background:#6EE7B7;}

  /* E 現行の拡張 */
  .ewr-head{position:absolute;inset:0;pointer-events:none;}
  .ewr-head i{position:absolute;left:50%;top:0;width:12px;height:12px;margin:-1px 0 0 -6px;border-radius:50%;background:#fff;box-shadow:0 0 8px #6EE7B7,0 0 16px #34D399;}
  .ewr-h.line{position:relative;}
  .ewr-h.line::after{content:"";position:absolute;left:0;right:0;bottom:-2px;height:1px;background:linear-gradient(90deg,#7ED6DF,transparent);transform-origin:left;scale:var(--hl,0) 1;transition:scale .7s cubic-bezier(.16,1,.3,1);}
  .glint{position:absolute;top:0;bottom:0;width:26px;pointer-events:none;background:linear-gradient(90deg,transparent,rgba(255,255,255,.75),transparent);mix-blend-mode:screen;}
  .exam-ward-res .bar{position:relative;}
  .ewr-frame{position:absolute;inset:-1px;width:calc(100% + 2px);height:calc(100% + 2px);pointer-events:none;overflow:visible;}
  .ewr-frame path{fill:none;stroke:#7ED6DF;stroke-width:2;filter:drop-shadow(0 0 5px #7ED6DF);}
  .ewr-done{position:absolute;right:12px;top:11px;font-size:10px;font-weight:900;letter-spacing:.28em;color:#6EE7B7;text-shadow:0 0 8px rgba(110,231,183,.7);}
</style>
</head>
<body>
<div class="harness">
  <h1>定着プロトコル — 結果画面の演出を強める5案</h1>
  <p>枠・配色・並びは今のままで、「出てくる順番と動き」と「あとに残る印」だけを変えています。成績と「大きく遅れ」の有無を切り替えて見比べられます。</p>
  <div class="plans" id="plans"></div>
  <div class="desc" id="desc"></div>
  <div class="ctl">
    <button id="replay">↻ もう一度再生</button>
    <select id="preset"><option value="good">好成績（定着 9割）</option><option value="mid" selected>ふつう（定着 7割）</option><option value="bad">苦戦（定着 5割弱）</option></select>
    <label><input type="checkbox" id="crit" checked>大きく遅れあり</label>
    <label><input type="checkbox" id="slow">スロー（×0.5）</label>
  </div>
  <div class="mock"><div class="mh">試験結果</div><div class="mp" id="mockPct">—</div><div id="stage"></div><div class="mb"></div><div class="mb"></div></div>
</div>
<script>
'use strict';
const C_OK = '#34D399', C_NG = '#F87171';
const SEV_LABEL = { crit: '大きく遅れ', warn: '遅れ', stable: '予定どおり' };
const SUBJ = { resp:{name:'呼吸器',icon:'🌬️'}, circ:{name:'循環器',icon:'❤️'}, neur:{name:'神経',icon:'🧠'}, endo:{name:'内分泌',icon:'⚗️'}, dige:{name:'消化器',icon:'🌿'}, hema:{name:'血液',icon:'🩸'} };
const PLANS = {
  A:{ name:'A 開票', desc:'解いた順に床を開ける', text:'結果の先頭に<b>解いた順の床の列</b>を出し、1つずつ<b>緑（定着）／赤（もう一度）に開けて</b>いきます。リングと「定着／もう一度」の数字が床に合わせて1問ずつ進み、開け終わってから下の段が順に浮かびます。床の列は<b>今回の記録として残ります</b>（HUD の帯を結果へ持ち帰る形）。' },
  B:{ name:'B 判子', desc:'評価の判子を押す', text:'今の動きのあと、定着率に応じた<b>評価の判子</b>（9割以上 EXCELLENT／7割 SOLID／5割 KEEP GOING／それ未満 RETRY）をリングに押し付け、粒が散ります。<b>全問定着の科目</b>と、<b>大きく遅れを全部取り戻したとき</b>にも小さな判子。申し送りの READY の判子と対になります。' },
  C:{ name:'C 送り出し', desc:'次に会う日へ飛ばす', text:'リングが伸びたあと、解いた問題が<b>粒になってリングから飛び出し、「次に会う日」の棒へ着地</b>します。着地するたびにその日の棒が積み上がり、数字が増えます（15日以降の分は右下へ）。<b>今日解いた問題がいつ戻ってくるか</b>を動きで見せます。' },
  D:{ name:'D 塗り替え', desc:'赤を緑が塗り替える', text:'リングを一度<b>ぜんぶ赤（もう一度）で塗り</b>、上から<b>緑（定着）が塗り替えて</b>いきます。「もう一度」の数字は全問から減り、「定着」は 0 から増えます。「大きく遅れていた問題」の後の棒も赤から緑へ塗り替わり、<b>「取り戻した N問」</b>のチップが出ます。' },
  E:{ name:'E 現行の拡張', desc:'今の順番＋光と仕上げ', text:'今の順番（リング→数字→棒→14日→所見）はそのままで、<b>リングの先端に光る玉</b>、<b>棒の先を走る光沢</b>、<b>見出しの下線が順に引かれる</b>、14日の棒が弾んで立ち、最後に<b>枠を光が一周して「COMPLETE」</b>が残ります。' },
};
let plan = 'A', TIMERS = [];
const SPD = () => document.getElementById('slow').checked ? 2 : 1;
const later = (f, ms) => { const t = setTimeout(f, ms * SPD()); TIMERS.push(t); return t; };
function anim(el, kf, opt) { if (!el) return null; opt = Object.assign({ fill: 'both', easing: 'cubic-bezier(.16,1,.3,1)' }, opt); opt.duration *= SPD(); if (opt.delay) opt.delay *= SPD(); return el.animate(kf, opt); }
function burst(x, y, c, n) { for (let i = 0; i < n; i++) { const p = document.createElement('i'); p.className = 'pt'; p.style.background = c; p.style.boxShadow = '0 0 6px ' + c; document.body.appendChild(p);
  const a = Math.random() * Math.PI * 2, d = 18 + Math.random() * 30; anim(p, [{ transform: 'translate(' + x + 'px,' + y + 'px)', opacity: 1 }, { transform: 'translate(' + (x + Math.cos(a) * d) + 'px,' + (y + Math.sin(a) * d) + 'px) scale(0)', opacity: 0 }], { duration: 700 }); setTimeout(() => p.remove(), 1600); } }
function countUp(el, from, to, dur, fmt) {
  if (!el) return; fmt = fmt || (v => String(v)); const t0 = performance.now(); let done = false; dur *= SPD();
  const fin = () => { if (done) return; done = true; el.textContent = fmt(to); anim(el, [{ transform: 'scale(1.25)' }, { transform: 'scale(1)' }], { duration: 350 }); };
  const step = now => { if (done) return; const p = Math.min(1, (now - t0) / dur); el.textContent = fmt(Math.round(from + (to - from) * (1 - Math.pow(1 - p, 3)))); if (p < 1) requestAnimationFrame(step); else fin(); };
  requestAnimationFrame(step); TIMERS.push(setTimeout(fin, dur + 400));
}
function donut(parts, total, size, sw) {
  const r = (size - sw) / 2, c = size / 2; let off = 0;
  let s = '<circle cx="' + c + '" cy="' + c + '" r="' + r + '" fill="none" stroke="rgba(255,255,255,.08)" stroke-width="' + sw + '"/>';
  parts.forEach(([v, col, cls]) => { const p = total ? v / total * 100 : 0;
    s += '<circle class="w-seg ' + (cls || '') + '" cx="' + c + '" cy="' + c + '" r="' + r + '" pathLength="100" stroke="' + col + '" stroke-width="' + sw + '" stroke-dasharray="' + p.toFixed(2) + ' 100" stroke-dashoffset="' + (-off).toFixed(2) + '" transform="rotate(-90 ' + c + ' ' + c + ')"/>'; off += p; });
  return '<svg viewBox="0 0 ' + size + ' ' + size + '" aria-hidden="true">' + s + '</svg>';
}
function setRing(R, d, s, n) {   // HUD の _paint と同じ塗り方
  const [rd, rs] = R.querySelectorAll('.ewr-ring .w-seg'); const pd = d / n * 100, ps = s / n * 100;
  rd.setAttribute('stroke-dasharray', pd.toFixed(2) + ' 100'); rs.setAttribute('stroke-dasharray', ps.toFixed(2) + ' 100'); rs.setAttribute('stroke-dashoffset', (-pd).toFixed(2));
}

// ── 見本のデータ（決定論） ─────────────────────────────────────────
function hash(s) { let h = 2166136261; for (const ch of s) { h ^= ch.charCodeAt(0); h = Math.imul(h, 16777619); } h ^= h >>> 15; h = Math.imul(h, 2246822507); h ^= h >>> 13; h = Math.imul(h, 3266489909); h ^= h >>> 16; return (h >>> 0) / 4294967296; }
function makeData() {
  const preset = document.getElementById('preset').value, withCrit = document.getElementById('crit').checked;
  const okRate = { good: .9, mid: .72, bad: .46 }[preset];
  const plan = [['resp', 12], ['circ', 10], ['neur', 8], ['endo', 6], ['dige', 5], ['hema', 3]];
  const recs = []; let k = 0;
  plan.forEach(([sid, n]) => { for (let i = 0; i < n; i++, k++) {
    const h = hash(preset + sid + i), h2 = hash(sid + i + 'sev');
    const sev = withCrit ? (h2 < .28 ? 'crit' : h2 < .6 ? 'warn' : 'stable') : (h2 < .4 ? 'warn' : 'stable');
    let ok = h < okRate * (sev === 'crit' ? .85 : 1.05);
    if (preset === 'good' && sid === 'hema') ok = true;   // 全問定着の科目を1つ置く
    const next = ok ? Math.round(3 + hash(sid + i + 'n') * 18) : 1;
    recs.push({ sid, sev, ok, next, ord: hash('o' + k) });
  } });
  recs.sort((a, b) => a.ord - b.ord);   // 解いた順は遅れの大きい順に近いが、見本なので混ぜる
  recs.sort((a, b) => ({ crit: 0, warn: 1, stable: 2 }[a.sev] - { crit: 0, warn: 1, stable: 2 }[b.sev]));
  return recs;
}

// ── 結果画面（ward.js decorateSummary と同じ組み立て） ──────────────────
function build(recs) {
  const n = recs.length, dc = recs.filter(r => r.ok).length, st = n - dc, pct = Math.round(dc / n * 100);
  const byRoom = new Map(); recs.forEach(r => { if (!byRoom.has(r.sid)) byRoom.set(r.sid, { d: 0, s: 0, n: 0 }); const b = byRoom.get(r.sid); b[r.ok ? 'd' : 's']++; b.n++; });
  const rooms = [...byRoom.entries()].sort((a, b) => b[1].n - a[1].n);
  const roomHtml = rooms.map(([sid, b]) => { const s = SUBJ[sid], w = v => (v / b.n * 100).toFixed(1) + '%';
    return '<div class="ewr-row" data-full="' + (b.d === b.n ? 1 : 0) + '"><span class="l">' + s.icon + ' ' + s.name + '</span><span class="bar"><i data-w="' + w(b.d) + '" style="background:' + C_OK + '"></i><i data-w="' + w(b.s) + '" style="background:' + C_NG + '"></i></span><span class="v">定着 ' + b.d + '/' + b.n + '</span></div>'; }).join('');
  const sevHtml = ['crit', 'warn', 'stable'].map(sv => { const g = recs.filter(r => r.sev === sv), k = g.filter(r => r.ok).length;
    return '<div>' + SEV_LABEL[sv] + '<b data-v="' + k + '" data-n="' + g.length + '">' + k + '/' + g.length + '</b><div class="sb"><i data-w="' + (g.length ? k / g.length * 100 : 0).toFixed(1) + '%"></i></div></div>'; }).join('');
  const crit = recs.filter(r => r.sev === 'crit'), critOut = crit.filter(r => r.ok).length, cw = v => (crit.length ? v / crit.length * 100 : 0).toFixed(1) + '%';
  const critHtml = crit.length ? '<div class="ewr-crit"><div class="ewr-h">大きく遅れていた問題（前→後）</div>' +
    '<div class="ewr-ba"><span class="l">前</span><span class="bar"><i data-w="100%" style="background:' + C_NG + '"></i></span><span class="v">' + crit.length + '問</span></div>' +
    '<div class="ewr-ba after"><span class="l">後</span><span class="bar"><i data-w="' + cw(critOut) + '" style="background:' + C_OK + '"></i><i data-w="' + cw(crit.length - critOut) + '" style="background:' + C_NG + '"></i></span><span class="v">定着 ' + critOut + '</span></div></div>' : '';
  const cal = {}; let later14 = 0;
  recs.forEach(r => { if (r.next > 14) { later14++; return; } (cal[r.next] = cal[r.next] || { d: 0, s: 0 })[r.ok ? 'd' : 's']++; });
  let mx = 1; for (let d = 1; d <= 14; d++) if (cal[d]) mx = Math.max(mx, cal[d].d + cal[d].s);
  const base = Date.parse('2026-10-01T00:00:00Z'); let cb = '', cx = '';
  for (let d = 1; d <= 14; d++) { const c = cal[d] || { d: 0, s: 0 };
    cb += '<div class="d" data-day="' + d + '" data-n="' + ((c.d + c.s) || '') + '"><em>' + ((c.d + c.s) || '') + '</em><i class="st" data-h="' + Math.round(c.s / mx * 44) + '" style="height:' + Math.round(c.s / mx * 44) + 'px"></i><i data-h="' + Math.round(c.d / mx * 44) + '" style="height:' + Math.round(c.d / mx * 44) + 'px"></i></div>';
    cx += '<span>' + (d === 1 ? '明日' : new Date(base + d * 86400000).getUTCDate()) + '</span>'; }
  const next = recs.filter(r => r.ok).map(r => r.next).sort((a, b) => a - b), med = next.length ? next[Math.floor(next.length / 2)] : null;
  let notes = '';
  if (crit.length) notes += '<div class="ewr-note' + (critOut < crit.length ? ' alert' : '') + '">🚨 大きく遅れていた ' + crit.length + '問のうち <b>' + critOut + '問が定着</b>' + (critOut < crit.length ? '。残る ' + (crit.length - critOut) + '問は明日また出ます。' : '。遅れを取り戻しました。') + '</div>';
  if (med != null) notes += '<div class="ewr-note">📅 定着した ' + next.length + '問に次に会うのは 中央値 <b>' + med + '日後</b>。</div>';
  document.getElementById('mockPct').textContent = pct + '%';
  const html = '<div class="exam-ward-res"><div class="ewr-tag">♾️ 本日のプロトコル</div>' +
    '<div class="ewr-top"><div class="ewr-ring">' + donut([[dc, C_OK], [st, C_NG]], n, 104, 10) + '<div class="c"><b>' + pct + '%</b><span>定着率</span></div></div>' +
      '<div class="ewr-sum"><div class="ewr-k d"><b>' + dc + '</b><span>定着</span></div><div class="ewr-k s"><b>' + st + '</b><span>もう一度</span></div></div></div>' +
    '<div class="ewr-sec"><div class="ewr-h">科目ごとの定着</div>' + roomHtml + '</div>' +
    '<div class="ewr-sec"><div class="ewr-h">遅れ具合ごとの定着率</div><div class="ewr-sev">' + sevHtml + '</div></div>' +
    (critHtml ? '<div class="ewr-sec">' + critHtml + '</div>' : '') +
    '<div class="ewr-sec"><div class="ewr-h">次に会う日（これから14日）</div><div class="ewr-cal">' + cb + '</div><div class="ewr-calx">' + cx + '</div>' +
    (later14 ? '<div class="ewr-later">15日以降 <b data-n="' + later14 + '">' + later14 + '</b>問</div>' : '') + '</div>' +
    notes + '</div>';
  const st0 = document.getElementById('stage'); st0.innerHTML = html;
  return { R: st0.firstElementChild, n, dc, st, pct, crit: crit.length, critOut, mx };
}

// ── 現行の演出（ward.js と同じ） ─────────────────────────────────────
function growSegs(R, start, gap) { [...R.querySelectorAll('.w-seg')].forEach((s, i) => { const d = s.getAttribute('stroke-dasharray'); s.setAttribute('stroke-dasharray', '0 100'); later(() => s.setAttribute('stroke-dasharray', d), start + i * gap); }); }
function base(R, opt) {
  opt = opt || {};
  if (!opt.noRing) growSegs(R, 300, 400);
  if (!opt.noCount) [...R.querySelectorAll('.ewr-k b')].forEach(b => { const v = +b.textContent; b.textContent = '0'; later(() => countUp(b, 0, v, 900), 300); });
  const bars = [...R.querySelectorAll('i[data-w]')].filter(i => !(opt.skipBars && opt.skipBars(i)));
  bars.forEach(i => { i.style.width = '0'; });
  later(() => bars.forEach(i => { i.style.width = i.dataset.w; }), opt.barsAt || 500);
  if (!opt.noCal) [...R.querySelectorAll('.ewr-cal .d i')].forEach((i, k) => anim(i, [{ transform: 'scaleY(0)' }, { transform: 'scaleY(1)' }], { duration: 700, delay: (opt.calAt || 900) + k * 40 }));
  [...R.querySelectorAll('.ewr-note')].forEach((el, k) => anim(el, [{ opacity: 0, transform: 'translateY(6px)' }, { opacity: 1, transform: 'none' }], { duration: 500, delay: (opt.notesAt || 1300) + k * 150 }));
  TIMERS.push(setTimeout(() => bars.forEach(i => { i.style.width = i.dataset.w; }), 2600 * SPD() + (opt.barsAt || 0) * SPD()));
}

const RUN = {
  // A 開票
  A(D, recs) {
    const { R, n } = D;
    const strip = document.createElement('div');
    strip.innerHTML = '<div class="ewr-replay">' + recs.map(r => '<i class="' + r.sev + '"></i>').join('') + '</div><div class="ewr-replay-h"><span>1問目</span><span>解いた順</span><span>' + n + '問目</span></div>';
    R.querySelector('.ewr-top').after(strip);
    const beds = [...strip.querySelectorAll('.ewr-replay i')];
    setRing(R, 0, 0, n);
    const cb = R.querySelector('.ewr-ring .c b'), kd = R.querySelector('.ewr-k.d b'), ks = R.querySelector('.ewr-k.s b');
    cb.textContent = '0%'; kd.textContent = '0'; ks.textContent = '0';
    const rest = [...R.querySelectorAll('.ewr-sec,.ewr-note')];
    rest.forEach(el => { el.style.opacity = '0'; });
    const per = Math.min(55, 1800 / n); let d = 0, s = 0;
    anim(strip, [{ opacity: 0, transform: 'translateY(6px)' }, { opacity: 1, transform: 'none' }], { duration: 400, delay: 100 });
    recs.forEach((r, k) => later(() => {
      r.ok ? d++ : s++;
      beds[k].className = r.ok ? 'discharge' : 'stay';
      anim(beds[k], [{ transform: 'scale(2.2)' }, { transform: 'scale(1)' }], { duration: 380, fill: 'none' });
      setRing(R, d, s, n);
      cb.textContent = Math.round(d / n * 100) + '%'; kd.textContent = d; ks.textContent = s;
      if (r.ok && k % 3 === 0) { const b = beds[k].getBoundingClientRect(); burst(b.left + 4, b.top + 4, '#6EE7B7', 3); }
    }, 500 + k * per));
    const end = 500 + n * per + 200;
    later(() => { anim(cb, [{ transform: 'scale(1.35)' }, { transform: 'scale(1)' }], { duration: 450 }); const rr = R.querySelector('.ewr-ring').getBoundingClientRect(); burst(rr.left + rr.width / 2, rr.top + rr.height / 2, '#6EE7B7', 14); }, end);
    // 下の段を順に浮かべ、棒を伸ばす
    const bars = [...R.querySelectorAll('i[data-w]')]; bars.forEach(i => { i.style.width = '0'; });
    rest.forEach((el, k) => later(() => { el.style.opacity = ''; anim(el, [{ opacity: 0, transform: 'translateY(8px)' }, { opacity: 1, transform: 'none' }], { duration: 450 });
      el.querySelectorAll('i[data-w]').forEach(i => later(() => { i.style.width = i.dataset.w; }, 120));
      el.querySelectorAll('.ewr-cal .d i').forEach((i, j) => anim(i, [{ transform: 'scaleY(0)' }, { transform: 'scaleY(1)' }], { duration: 600, delay: 150 + j * 35 })); }, end + 300 + k * 260));
    TIMERS.push(setTimeout(() => { rest.forEach(el => { el.style.opacity = ''; el.getAnimations().forEach(a => a.finish()); }); bars.forEach(i => { i.style.width = i.dataset.w; }); }, (end + 3000) * SPD()));
  },

  // B 判子
  B(D) {
    const { R, pct } = D; base(R);
    const g = pct >= 90 ? ['EXCELLENT', '見事に定着', '#6EE7B7'] : pct >= 70 ? ['SOLID', 'しっかり定着', '#7ED6DF'] : pct >= 50 ? ['KEEP GOING', '明日で取り返す', '#FBBF24'] : ['RETRY', '明日もう一度', '#FCA5A5'];
    const stamp = (el, cls, html, c, delay, big) => later(() => {
      const s = document.createElement('span'); s.className = 'ewr-stamp ' + cls; s.style.setProperty('--sc', c); s.innerHTML = html; el.appendChild(s);
      anim(s, [{ opacity: 0, transform: 'scale(' + (big ? 3.2 : 2.6) + ')' }, { opacity: 1, transform: 'scale(.9)', offset: .6 }, { opacity: 1, transform: 'scale(1)' }], { duration: big ? 480 : 380, easing: 'cubic-bezier(.3,1.4,.5,1)' });
      later(() => { const r = s.getBoundingClientRect(); burst(r.left + r.width / 2, r.top + r.height / 2, c, big ? 16 : 6);
        if (big) anim(R, [{ transform: 'translate(0,0)' }, { transform: 'translate(-2px,2px)' }, { transform: 'translate(2px,-1px)' }, { transform: 'translate(0,0)' }], { duration: 220, fill: 'none' }); }, big ? 280 : 220);
    }, delay);
    stamp(R, 'big', g[0] + '<small>' + g[1] + '</small>', g[2], 1500, true);
    [...R.querySelectorAll('.ewr-row[data-full="1"] .v')].forEach((v, k) => stamp(v, 'mini', '全定着', '#6EE7B7', 2200 + k * 160));
    if (D.crit && D.critOut === D.crit) stamp(R.querySelector('.ewr-ba.after .v'), 'mini', '取り戻し', '#6EE7B7', 2500);
  },

  // C 送り出し
  C(D, recs) {
    const { R, mx } = D;
    base(R, { noCal: true, notesAt: 3600 });
    const cols = {}; [...R.querySelectorAll('.ewr-cal .d')].forEach(c => { cols[c.dataset.day] = c; const [st, ok] = c.querySelectorAll('i'); st.style.height = '0px'; ok.style.height = '0px'; c.querySelector('em').textContent = ''; });
    const cnt = {}; const lt = R.querySelector('.ewr-later b'); let ltN = 0; if (lt) lt.textContent = '0';
    const per = Math.min(45, 1700 / recs.length);
    recs.forEach((r, k) => later(() => {
      const ring = R.querySelector('.ewr-ring').getBoundingClientRect(), x0 = ring.left + ring.width / 2, y0 = ring.top + ring.height / 2;
      const tgt = r.next > 14 ? lt : cols[r.next]; if (!tgt) return;
      const tr = tgt.getBoundingClientRect(), x1 = tr.left + tr.width / 2, y1 = r.next > 14 ? tr.top + tr.height / 2 : tr.bottom - 6;
      const p = document.createElement('i'); p.className = 'pt'; const c = r.ok ? '#6EE7B7' : '#FCA5A5'; p.style.background = c; p.style.boxShadow = '0 0 8px ' + c; document.body.appendChild(p);
      const mx2 = (x0 + x1) / 2 + (x1 > x0 ? 30 : -30), my = Math.min(y0, y1) - 40;
      const a = anim(p, [{ transform: 'translate(' + x0 + 'px,' + y0 + 'px) scale(.6)' }, { transform: 'translate(' + mx2 + 'px,' + my + 'px) scale(1.3)', offset: .45 }, { transform: 'translate(' + x1 + 'px,' + y1 + 'px) scale(.8)' }], { duration: 820, easing: 'cubic-bezier(.45,0,.4,1)', fill: 'none' });
      const land = () => { p.remove(); if (r.next > 14) { lt.textContent = ++ltN; anim(lt, [{ transform: 'scale(1.6)' }, { transform: 'scale(1)' }], { duration: 300 }); return; }
        const c2 = cnt[r.next] = cnt[r.next] || { d: 0, s: 0 }; c2[r.ok ? 'd' : 's']++;
        const [st, ok] = tgt.querySelectorAll('i'); st.style.height = Math.round(c2.s / mx * 44) + 'px'; ok.style.height = Math.round(c2.d / mx * 44) + 'px';
        tgt.querySelector('em').textContent = c2.d + c2.s; tgt.classList.add('land'); setTimeout(() => tgt.classList.remove('land'), 180); };
      if (a) a.onfinish = land; else land();
    }, 1300 + k * per));
    TIMERS.push(setTimeout(() => { document.querySelectorAll('.pt').forEach(p => p.remove()); [...R.querySelectorAll('.ewr-cal .d')].forEach(c => { c.querySelectorAll('i').forEach(i => { i.style.height = i.dataset.h + 'px'; }); c.querySelector('em').textContent = c.dataset.n || ''; }); if (lt) lt.textContent = lt.dataset.n; }, (1300 + recs.length * per + 2500) * SPD()));
  },

  // D 塗り替え
  D(D) {
    const { R, n, dc, st, pct } = D;
    base(R, { noRing: true, noCount: true, skipBars: i => !!i.closest('.ewr-ba.after'), notesAt: 3000 });
    const [rd, rs] = R.querySelectorAll('.ewr-ring .w-seg');
    rd.setAttribute('stroke-dasharray', '0 100'); rs.setAttribute('stroke-dasharray', '0 100'); rs.setAttribute('stroke-dashoffset', '0');
    const cb = R.querySelector('.ewr-ring .c b'), kd = R.querySelector('.ewr-k.d b'), ks = R.querySelector('.ewr-k.s b');
    cb.textContent = '0%'; kd.textContent = '0'; ks.textContent = '0';
    later(() => { rs.setAttribute('stroke-dasharray', '100 100'); countUp(ks, 0, n, 500); }, 250);
    later(() => { rs.style.transition = rd.style.transition = 'stroke-dasharray 1.4s cubic-bezier(.6,0,.3,1),stroke-dashoffset 1.4s cubic-bezier(.6,0,.3,1)'; setRing(R, dc, st, n);
      countUp(kd, 0, dc, 1400); countUp(ks, n, st, 1400); countUp(cb, 0, pct, 1400, v => v + '%'); }, 1000);
    later(() => { const rr = R.querySelector('.ewr-ring').getBoundingClientRect(); burst(rr.left + rr.width / 2, rr.top + 6, '#6EE7B7', 12); }, 2400);
    const after = R.querySelector('.ewr-ba.after');
    if (after) {
      const [g, r] = after.querySelectorAll('i');
      g.style.width = '0'; r.style.width = '0';
      later(() => { r.style.width = '100%'; }, 900);
      later(() => { g.style.transition = r.style.transition = 'width 1.1s cubic-bezier(.6,0,.3,1)'; g.style.width = g.dataset.w; r.style.width = r.dataset.w; }, 2000);
      later(() => { anim(R.querySelector('.ewr-crit'), [{ boxShadow: '0 0 0 0 rgba(110,231,183,0)' }, { boxShadow: '0 0 0 2px rgba(110,231,183,.55), 0 0 18px rgba(110,231,183,.35)', offset: .4 }, { boxShadow: '0 0 0 0 rgba(110,231,183,0)' }], { duration: 1100, fill: 'none' });
        if (D.critOut) { const chip = document.createElement('span'); chip.className = 'ewr-chip'; chip.textContent = '取り戻した ' + D.critOut + '問'; after.parentElement.querySelector('.ewr-h').appendChild(chip);
          anim(chip, [{ opacity: 0, transform: 'scale(.4)' }, { opacity: 1, transform: 'scale(1.15)', offset: .6 }, { opacity: 1, transform: 'scale(1)' }], { duration: 420 }); } }, 3100);
      TIMERS.push(setTimeout(() => { g.style.width = g.dataset.w; r.style.width = r.dataset.w; }, 5000 * SPD()));
    }
    [...R.querySelectorAll('.ewr-sev b')].forEach(b => { const v = +b.dataset.v, nn = b.dataset.n; b.textContent = '0/' + nn; later(() => countUp(b, 0, v, 900, x => x + '/' + nn), 1200); });
  },

  // E 現行の拡張
  E(D) {
    const { R, pct } = D;
    base(R, { calAt: 1000 });
    // リングの先端の光る玉
    const ring = R.querySelector('.ewr-ring'), head = document.createElement('div'); head.className = 'ewr-head'; head.innerHTML = '<i></i>'; ring.appendChild(head);
    anim(head, [{ transform: 'rotate(0deg)', opacity: 0 }, { opacity: 1, offset: .1 }, { transform: 'rotate(' + (pct * 3.6) + 'deg)', opacity: 1, offset: .85 }, { transform: 'rotate(' + (pct * 3.6) + 'deg)', opacity: 0 }], { duration: 1000, delay: 300, easing: 'cubic-bezier(.16,1,.3,1)' });
    // 見出しの下線を順に引く
    [...R.querySelectorAll('.ewr-h')].forEach((h, k) => { h.classList.add('line'); later(() => h.style.setProperty('--hl', '1'), 450 + k * 220); });
    // 棒の先を走る光沢
    later(() => [...R.querySelectorAll('.bar')].forEach((bar, k) => { const gl = document.createElement('span'); gl.className = 'glint'; bar.appendChild(gl);
      anim(gl, [{ left: '-30px' }, { left: 'calc(100% + 4px)' }], { duration: 900, delay: k * 70, easing: 'cubic-bezier(.5,0,.3,1)' }); }), 1400);
    // 14日の棒の数字が弾む
    [...R.querySelectorAll('.ewr-cal .d em')].forEach((em, k) => anim(em, [{ opacity: 0, transform: 'translateY(6px) scale(.5)' }, { opacity: 1, transform: 'translateY(-3px) scale(1.2)', offset: .6 }, { opacity: 1, transform: 'none' }], { duration: 420, delay: 1350 + k * 40 }));
    // 最後に枠が一周して COMPLETE
    later(() => {
      const W = R.offsetWidth + 2, H = R.offsetHeight + 2, r = 14, x0 = W / 2;
      const d = 'M' + x0 + ' 1 H' + (W - r) + ' Q' + (W - 1) + ' 1 ' + (W - 1) + ' ' + r + ' V' + (H - r) + ' Q' + (W - 1) + ' ' + (H - 1) + ' ' + (W - r) + ' ' + (H - 1) + ' H' + r + ' Q1 ' + (H - 1) + ' 1 ' + (H - r) + ' V' + r + ' Q1 1 ' + r + ' 1 Z';
      const ns = 'http://www.w3.org/2000/svg', svg = document.createElementNS(ns, 'svg'); svg.setAttribute('class', 'ewr-frame'); svg.setAttribute('viewBox', '0 0 ' + W + ' ' + H); svg.innerHTML = '<path pathLength="1" d="' + d + '"/>'; R.appendChild(svg);
      const p = svg.querySelector('path'); p.style.strokeDasharray = '1';
      anim(p, [{ strokeDashoffset: 1, opacity: 1 }, { strokeDashoffset: 0, opacity: 1, offset: .75 }, { strokeDashoffset: 0, opacity: .35 }], { duration: 1300, easing: 'cubic-bezier(.5,0,.3,1)' });
      const tag = document.createElement('span'); tag.className = 'ewr-done'; tag.textContent = 'COMPLETE'; R.appendChild(tag);
      anim(tag, [{ opacity: 0, letterSpacing: '.8em' }, { opacity: 1, letterSpacing: '.28em' }], { duration: 700, delay: 950 });
    }, 2200);
  },
};

function run() {
  TIMERS.forEach(clearTimeout); TIMERS = []; document.querySelectorAll('.pt').forEach(p => p.remove());
  const recs = makeData(); const D = build(recs);
  requestAnimationFrame(() => RUN[plan](D, recs));
}
const box = document.getElementById('plans');
box.innerHTML = Object.entries(PLANS).map(([k, p]) => '<button data-k="' + k + '"><b>' + p.name + '</b><small>' + p.desc + '</small></button>').join('');
function pick(k) { plan = k; box.querySelectorAll('button').forEach(b => b.classList.toggle('on', b.dataset.k === k)); document.getElementById('desc').innerHTML = PLANS[k].text; run(); }
box.addEventListener('click', e => { const b = e.target.closest('button'); if (b) pick(b.dataset.k); });
document.getElementById('replay').onclick = run;
document.getElementById('preset').onchange = run;
document.getElementById('crit').onchange = run;
pick('A');
</script>
