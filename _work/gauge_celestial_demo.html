<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Celestial ゲージの5案</title>
<!--
  ハブのヒーローゲージ（index.html #gaugeBox）を UIテーマ Celestial 向けに作り直す案を5つ並べて見比べるページ（2026-09-29）。
  手本は Frost のゲージ（中央から氷が育つ・25/50/75%で霜の枝がパキッ・100%で開花・100%超で回る・稜線を光が走る）。
  5案とも同じ「動きの型」をそろえてある：
    常時 … ゆっくり動き続けるもの（止まった絵にしない）
    進むとき … 形そのものが進捗を表す（弧が伸びるだけにしない）
    25・50・75% … 段を越えた瞬間の一度きりの演出
    100% … 到達の演出
    100%超 … 超えている間だけの常時演出＋2周目の金
  本物の index.js は呼ばず、このページの中だけで再生する（何も保存しない）。テストの対象ではない。
  ⚠️ 本番へ移すとき：本番の svg は transform: rotate(-90deg) を持つので、案の中身は <g transform="rotate(90 84 84)"> で包むこと
     （このページの svg は回していない＝上が 0%）。「現行」だけは本番と同じ向きで描くために rotate(-90) で包んである。
  ⚠️ 本番へ移すとき：rAF で数字を動かしているのはこのページの都合。本番は CSS の transition で動かし、段の演出は
     Frost の _frostProgressFx と同じ「届く時刻の見積もり」で出す（非表示タブでは rAF が来ない）。
  ⚠️ 移動・回転・拡大は独立プロパティ（rotate / scale / translate）で書いてある（transform は既存アニメに黙って殺される）。
-->
<style>
  :root{--tx:#EDE7FF;--sub:#A9A0CC;--line:rgba(255,209,102,.28);--gold:#FFD166;--gw:208px;}
  *{box-sizing:border-box;}
  html,body{margin:0;}
  body{min-height:100vh;padding:16px;color:var(--tx);font-family:-apple-system,'Hiragino Sans','Noto Sans JP',sans-serif;
    background:radial-gradient(ellipse 95% 65% at 50% -15%,rgba(138,43,226,.55) 0%,transparent 68%),
               radial-gradient(circle at 82% 24%,rgba(72,202,228,.3) 0%,transparent 56%),
               radial-gradient(circle at 16% 76%,rgba(255,209,102,.25) 0%,transparent 62%),
               linear-gradient(180deg,#0A0818 0%,#05040D 100%);background-attachment:fixed;}
  body.big{--gw:320px;}
  h1{font-size:17px;margin:0 0 4px;}
  p.note{font-size:12.5px;color:var(--sub);margin:0 0 12px;line-height:1.65;max-width:980px;}
  .ctl{position:sticky;top:0;z-index:20;display:flex;flex-wrap:wrap;gap:8px 12px;align-items:center;font-size:13px;margin:0 0 14px;
    padding:10px 12px;border:1px solid var(--line);border-radius:12px;background:rgba(14,10,32,.94);max-width:1300px;}
  .ctl label{white-space:nowrap;display:flex;align-items:center;gap:6px;}
  .ctl input[type=range]{width:min(320px,70vw);accent-color:#FFD166;}
  .ctl output{font-variant-numeric:tabular-nums;font-weight:800;color:#FFD166;min-width:3.5em;display:inline-block;}
  .ctl button{padding:7px 11px;border-radius:10px;border:1.5px solid var(--line);background:#1A1336;color:var(--tx);
    font-weight:700;font-size:13px;cursor:pointer;}
  .ctl button:active{background:#2A1E55;}
  .ctl button.hi{border-color:#FFD166;background:#2A1D52;}
  input[type=checkbox]{width:18px;height:18px;accent-color:#FFD166;}
  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,330px),1fr));gap:14px;max-width:1300px;}
  .card{background:linear-gradient(160deg,rgba(46,28,96,.55),rgba(14,10,34,.88));border:1px solid var(--line);border-radius:18px;
    padding:14px 14px 16px;box-shadow:inset 0 1px 0 rgba(255,209,102,.16),0 10px 30px rgba(0,0,0,.35);}
  .card.cur{border-style:dashed;opacity:.92;}
  .card h2{font-size:15.5px;margin:0 0 2px;color:#FFD166;}
  .card .tag{font-size:12px;color:var(--sub);line-height:1.5;}
  .stage{display:flex;justify-content:center;padding:14px 0 6px;}
  dl.how{font-size:12px;line-height:1.6;margin:8px 0 0;display:grid;grid-template-columns:auto 1fr;gap:4px 10px;}
  dl.how dt{color:#FFD166;font-weight:700;white-space:nowrap;}
  dl.how dd{margin:0;color:#DCD4F5;}

  /* ── 本番のゲージの外形（index.css の .gauge / .gauge-mid と同じ組み方） ── */
  .gauge{position:relative;width:var(--gw);text-align:center;}
  .gauge-ring{position:relative;}
  .gauge-ring svg{display:block;width:100%;height:auto;overflow:visible;}
  .gauge-mid{position:absolute;inset:0;display:grid;grid-auto-flow:column;align-content:center;justify-content:center;align-items:baseline;
    font-size:calc(var(--gw)*.183);font-weight:800;letter-spacing:-.03em;color:#F6F0FF;font-variant-numeric:tabular-nums;line-height:1;
    text-shadow:0 0 8px rgba(8,4,24,.95),0 0 2px rgba(8,4,24,.9);pointer-events:none;}
  .gauge-mid.wide{font-size:calc(var(--gw)*.144);}
  .gauge-mid em{font-style:normal;font-size:.5em;color:#C9BFEA;margin-left:1px;}
  .gauge-cap{margin:8px 0 0;font-size:11px;font-weight:700;letter-spacing:.12em;color:#B9AEDD;}
  .gauge-goal{margin:2px 0 0;font-size:12px;font-weight:700;color:#B9AEDD;}
  .gauge-goal b{color:#F6F0FF;}

  @keyframes spin{to{rotate:360deg;}}
  @keyframes tw{from{opacity:.12;}to{opacity:.9;}}

  /* ════════ A. 満ちる月 ════════ */
  .a-band{fill:none;stroke:rgba(217,210,255,.07);stroke-width:9;}
  .a-rim{fill:none;stroke:rgba(255,209,102,.5);stroke-width:.8;}
  .a-stars circle,.b-stars circle,.d-bgs circle,.e-stars circle,.c-stars circle{fill:#EDE7FF;animation:tw 3s ease-in-out infinite alternate;}
  .a-trk{fill:none;stroke:rgba(217,210,255,.22);stroke-width:1;stroke-dasharray:1 3;}
  .a-arc{fill:none;stroke:url(#aArc);stroke-linecap:round;}
  .a-arc-soft{stroke-width:7;opacity:.2;}
  .a-arc-core{stroke-width:2.2;}
  .a-ovf{fill:none;stroke:#FFD166;stroke-width:2.4;stroke-linecap:round;}
  .a-shim{fill:none;stroke:#FFFFFF;stroke-width:3.2;stroke-linecap:round;stroke-dasharray:3 97;animation:aShim 4.6s linear infinite;}
  @keyframes aShim{to{stroke-dashoffset:-100;}}
  .a-ic{opacity:.3;transition:opacity .5s;transform-box:fill-box;transform-origin:center;}
  .a-ic .a-ic-d{fill:#1A1535;stroke:rgba(230,225,255,.5);stroke-width:.5;}
  .a-ic .a-ic-l{fill:#CFC8EE;}
  .a-ic.on{opacity:1;}
  .a-ic.on .a-ic-l{fill:#FFF3C4;}
  .a-ic.on .a-ic-d{stroke:rgba(255,230,160,.8);}
  .a-ic.a-flare{animation:aFlare 1.2s cubic-bezier(.2,.9,.3,1);}
  @keyframes aFlare{0%{scale:1;}22%{scale:2.2;}100%{scale:1;}}
  .a-rip{fill:none;stroke:#FFF3C4;stroke-width:.8;transform-box:fill-box;transform-origin:center;animation:aRip 1.1s ease-out forwards;}
  @keyframes aRip{from{scale:1;opacity:.95;}to{scale:4.2;opacity:0;}}
  .a-mk{transform-origin:84px 84px;}
  .a-glow{transform-box:fill-box;transform-origin:center;animation:aGlow 3.4s ease-in-out infinite alternate;}
  @keyframes aGlow{from{opacity:.5;scale:.9;}to{opacity:1;scale:1.12;}}
  .a-mk.a-mk-bloom .a-glow{animation:aGlowBloom 1.6s cubic-bezier(.16,1,.3,1);}
  @keyframes aGlowBloom{0%{scale:1;opacity:1;}25%{scale:2.6;opacity:1;}100%{scale:1;opacity:.8;}}
  .a-moon-d{fill:#161230;stroke:rgba(255,245,210,.4);stroke-width:.5;}
  .a-moon-l{fill:#FFF6D6;}
  .a-lbl{font-size:8px;font-weight:800;letter-spacing:.2em;fill:#FFE7A3;opacity:0;}
  .a-lbl.on{animation:lbl 2.1s ease forwards;}
  @keyframes lbl{0%{opacity:0;translate:0 3px;}15%{opacity:1;translate:0 0;}75%{opacity:1;}100%{opacity:0;}}
  .a-halo{opacity:0;scale:.8;transform-origin:84px 84px;transition:opacity 1.1s ease,scale 1.3s cubic-bezier(.16,1,.3,1);}
  .a-halo.on{opacity:1;scale:1;}
  .a-halo-rot{transform-origin:84px 84px;}
  .gauge[data-over] .a-halo-rot{animation:spin 40s linear infinite;}
  .a-halo .h1{fill:none;stroke:rgba(255,186,150,.5);stroke-width:1.1;}
  .a-halo .h2{fill:none;stroke:rgba(150,200,255,.4);stroke-width:2.2;}
  .a-halo .h3{fill:none;stroke:rgba(255,255,255,.07);stroke-width:8;}
  .a-pd{opacity:0;transition:opacity 1s;}
  .a-pd ellipse{fill:rgba(255,246,214,.55);} .a-pd circle{fill:#FFFFFF;}
  .gauge[data-over] .a-pd{opacity:1;animation:tw 1.8s ease-in-out infinite alternate;}
  .a-flash{fill:#FFF8E0;animation:flash 1.1s ease-out forwards;}
  @keyframes flash{from{opacity:.42;}to{opacity:0;}}
  .ray{stroke:#FFFFFF;stroke-width:1.1;stroke-linecap:round;stroke-dasharray:.35 1.4;stroke-dashoffset:.35;
    animation:rayRun 1.3s cubic-bezier(.16,1,.3,1) forwards;}
  @keyframes rayRun{from{stroke-dashoffset:.35;opacity:1;}70%{opacity:1;}to{stroke-dashoffset:-.75;opacity:0;}}

  /* ════════ B. 皆既日食 ════════ */
  .b-sky{fill:#3B4F8E;}
  .b-cw{transform-origin:84px 84px;}
  .b-cp{transform-origin:84px 84px;}
  .b-cp.b-bloom{animation:bBloom 1.9s cubic-bezier(.16,1,.3,1);}
  @keyframes bBloom{0%{scale:1;}22%{scale:1.16;}100%{scale:1;}}
  .b-cor{transform-origin:84px 84px;animation:spin 120s linear infinite;}
  .gauge[data-over] .b-cor{animation-duration:45s;}
  .b-st{fill:url(#bCorona);transform-origin:84px 84px;animation:bSt 4s ease-in-out infinite alternate;}
  .gauge[data-over] .b-st{fill:url(#bCoronaGold);}
  @keyframes bSt{from{scale:.9;opacity:.75;}to{scale:1.08;opacity:1;}}
  .b-chromo{fill:none;stroke:#FF6FA8;stroke-width:.9;opacity:.7;}
  .b-prom{fill:none;stroke:#FF7BB0;stroke-width:1.5;stroke-linecap:round;animation:tw 2.6s ease-in-out infinite alternate;}
  .b-moon{fill:#04030A;}
  .b-bd{fill:rgba(255,255,255,.1);transition:fill .3s;}
  .b-bd.on{fill:#FFF3D0;}
  .b-bd.hd{fill:#FFFFFF;}
  .b-bd.gd{fill:#FFD166;}
  .b-hd{fill:url(#bBead);transform-box:fill-box;transform-origin:center;animation:bHd 1.4s ease-in-out infinite alternate;}
  @keyframes bHd{from{scale:.8;opacity:.6;}to{scale:1.25;opacity:1;}}
  .b-erupt{fill:none;stroke:#FF7BB0;stroke-width:1.7;stroke-linecap:round;transform-origin:84px 53px;animation:bErupt 1.6s ease-out forwards;}
  .b-erupt.w{stroke:#FFE0EC;stroke-width:.7;}
  @keyframes bErupt{0%{scale:.2;opacity:0;}20%{opacity:1;}100%{scale:1.7;opacity:0;}}
  .b-rip{fill:none;stroke:#FFB3D1;stroke-width:.8;transform-origin:84px 84px;animation:bRip 1.2s ease-out forwards;}
  @keyframes bRip{from{scale:1;opacity:.9;}to{scale:1.3;opacity:0;}}
  .b-dia{transform-origin:84px 53px;animation:bDia 2.4s cubic-bezier(.16,1,.3,1) forwards;}
  .b-dia path{stroke:#FFFFFF;stroke-width:.9;stroke-linecap:round;}
  @keyframes bDia{0%{scale:0;opacity:0;}12%{scale:1.3;opacity:1;}45%{scale:1;opacity:1;}100%{scale:.9;opacity:0;}}

  /* ════════ C. 太陽系儀 ════════ */
  .c-frame{fill:none;stroke:url(#cGold);stroke-width:1.4;}
  .c-ticks{fill:none;stroke:rgba(255,209,102,.55);stroke-width:.7;stroke-linecap:round;}
  .c-ticks-rot{transform-origin:84px 84px;}
  .gauge[data-over] .c-ticks-rot{animation:spin 90s linear infinite;}
  .c-parc{fill:none;stroke:#FFD166;stroke-width:1.4;stroke-linecap:round;opacity:.85;}
  .c-povf{fill:none;stroke:#FFF6D6;stroke-width:1.4;stroke-linecap:round;}
  .c-ptr{transform-origin:84px 84px;}
  .c-ptr polygon{fill:#FFD166;}
  .c-orb-bg{fill:none;stroke:rgba(190,180,255,.18);stroke-width:.6;stroke-dasharray:.8 2.4;}
  .c-orb{fill:none;stroke:#9EDBFF;stroke-width:.9;stroke-linecap:round;opacity:.75;transition:opacity .4s;}
  .c-orb.done{stroke:#FFE7A3;opacity:.55;}
  .c-orb.c-flash{animation:cFlash 1.1s ease-out;}
  @keyframes cFlash{0%{stroke-width:3.2;opacity:1;stroke:#FFFFFF;}100%{stroke-width:.9;opacity:.55;}}
  .c-pen{fill:#FFFFFF;}
  .c-pen-g{fill:url(#cPen);}
  .c-pl{transform-origin:84px 84px;opacity:0;transition:opacity .3s;}
  .c-pl.on{opacity:1;animation:cOrbit var(--T) linear infinite;}
  @keyframes cOrbit{to{rotate:360deg;}}
  .c-pop{transform-box:fill-box;transform-origin:center;}
  .c-pl.on .c-pop{animation:cPop .9s cubic-bezier(.2,1.6,.4,1) both;}
  @keyframes cPop{from{scale:0;}to{scale:1;}}
  .c-lm{transform-origin:84px 31px;animation:spin 2.6s linear infinite;}
  .c-sun{transform-box:fill-box;transform-origin:center;animation:cSun 3.2s ease-in-out infinite alternate;}
  @keyframes cSun{from{opacity:.55;scale:.92;}to{opacity:.95;scale:1.08;}}
  .c-rip{fill:none;stroke:#FFE7A3;stroke-width:.8;transform-origin:84px 84px;animation:cRip 1.2s ease-out forwards;}
  @keyframes cRip{from{scale:1;opacity:.9;}to{scale:1.18;opacity:0;}}
  .c-beam{stroke:#FFF6D6;stroke-width:1.6;stroke-linecap:round;stroke-dasharray:1;stroke-dashoffset:1;animation:cBeam 2s ease-out forwards;}
  @keyframes cBeam{0%{stroke-dashoffset:1;opacity:1;}35%{stroke-dashoffset:0;opacity:1;}100%{stroke-dashoffset:0;opacity:0;}}
  .c-comet{opacity:0;transition:opacity .8s;}
  .gauge[data-over] .c-comet{opacity:1;}

  /* ════════ D. 天の川と夏の大三角 ════════ */
  .d-band0{fill:none;stroke:rgba(190,180,255,.07);stroke-width:15;}
  .d-lit{opacity:.9;}
  .d-lit.d-surge{animation:dSurge 1.8s ease-out;}
  @keyframes dSurge{0%{opacity:.9;}20%{opacity:1;scale:1.03;}100%{opacity:.9;scale:1;}}
  .d-lit{transform-origin:84px 84px;}
  .d-neb{fill:none;stroke:url(#dNeb);stroke-width:14;opacity:.32;}
  .d-neb2{fill:none;stroke:#FFFFFF;stroke-width:3.5;opacity:.12;}
  .d-rift{fill:none;stroke:rgba(4,2,14,.62);stroke-width:1.8;stroke-dasharray:10 4 18 6 5 11 3 8;}
  .d-f{fill:none;stroke:#F4F0FF;stroke-linecap:round;}
  .d-bs circle{fill:#FFFFFF;animation:tw 1.8s ease-in-out infinite alternate;}
  .d-tip{transform-origin:84px 84px;}
  .d-tip path{fill:#FFFFFF;}
  .d-tip circle{fill:url(#dStarGlow);}
  .d-tri{fill:transparent;stroke:rgba(255,215,130,.6);stroke-width:.8;stroke-linejoin:round;
    stroke-dasharray:1;stroke-dashoffset:1;transition:stroke-dashoffset 1.3s cubic-bezier(.3,.7,.3,1),fill .8s;}
  .d-tri.on{stroke-dashoffset:0;fill:rgba(255,209,102,.05);}
  .d-st{opacity:.25;scale:.6;transform-box:fill-box;transform-origin:center;transition:opacity .5s,scale .5s;}
  .d-st.on{opacity:1;scale:1;}
  .d-st.on .d-st-x{animation:tw 2.2s ease-in-out infinite alternate;}
  .d-st.d-ign{animation:dIgn 1.4s cubic-bezier(.2,.9,.3,1);}
  @keyframes dIgn{0%{scale:.6;}25%{scale:2.3;}100%{scale:1;}}
  .d-st-x{stroke:#FFFFFF;stroke-width:.7;stroke-linecap:round;}
  .d-st-c{fill:#FFFFFF;}
  .d-lb{font-size:6.6px;font-weight:800;letter-spacing:.12em;fill:#FFE7A3;opacity:0;}
  .d-lb.on{animation:lbl 2.2s ease forwards;}
  .d-rip{fill:none;stroke:#DCEBFF;stroke-width:.8;transform-box:fill-box;transform-origin:center;animation:aRip 1.2s ease-out forwards;}
  .d-ovf{fill:none;stroke:#FFD166;stroke-width:1.3;stroke-linecap:round;}
  .d-rot{transform-origin:84px 84px;}
  .gauge[data-over] .d-rot{animation:spin 80s linear infinite;}
  .d-met{stroke:#FFFFFF;stroke-width:1;stroke-linecap:round;stroke-dasharray:.3 1.4;stroke-dashoffset:.3;animation:rayRun 1.1s ease-out forwards;}

  /* ════════ E. ほうき星の旅 ════════ */
  .e-sun{transform-box:fill-box;transform-origin:center;animation:cSun 3s ease-in-out infinite alternate;}
  .e-sun.e-flare{animation:eFlare 1.7s cubic-bezier(.16,1,.3,1);}
  @keyframes eFlare{0%{scale:1;opacity:.9;}25%{scale:1.9;opacity:1;}100%{scale:1;opacity:.8;}}
  .e-soft{fill:none;stroke:url(#eDust);stroke-width:3;opacity:.2;}
  .e-dot{fill:none;stroke:#FFE9B0;stroke-linecap:round;}
  .e-ovf{fill:none;stroke:#FFD166;stroke-width:1.3;stroke-linecap:round;}
  .e-mk{fill:rgba(255,209,102,.35);transform-box:fill-box;transform-origin:center;transition:fill .4s;}
  .e-mk.on{fill:#FFD166;}
  .e-mk.e-hit{animation:aFlare 1.2s cubic-bezier(.2,.9,.3,1);}
  .e-orbit{transform-origin:84px 84px;}
  .e-spin{transform-origin:84px 84px;}
  .gauge[data-over] .e-spin{animation:spin 28s linear infinite;}
  .e-dtail{fill:url(#eDTail);animation:eTail 2.2s ease-in-out infinite alternate;}
  .e-itail{fill:url(#eITail);animation:eTail 1.3s ease-in-out infinite alternate-reverse;}
  @keyframes eTail{from{opacity:.7;}to{opacity:1;}}
  .e-tails{transform-origin:84px 26px;}
  .e-tails.e-long{animation:eLong 2.2s cubic-bezier(.16,1,.3,1);}
  @keyframes eLong{0%{scale:1;}25%{scale:1.45;}100%{scale:1;}}
  .e-coma{fill:url(#eComa);transform-box:fill-box;transform-origin:center;animation:cSun 1.6s ease-in-out infinite alternate;}
  .e-coma.e-peri{animation:eFlare 2s cubic-bezier(.16,1,.3,1);}
  .e-nuc{fill:#FFFFFF;}
  .e-shed circle{fill:#FFF3D0;animation:eShed 1.8s linear infinite;}
  @keyframes eShed{from{translate:0 0;opacity:.9;}to{translate:-15px 3.5px;opacity:0;}}
  .e-met{stroke:#FFF3D0;stroke-width:.9;stroke-linecap:round;stroke-dasharray:.3 1.4;stroke-dashoffset:.3;animation:rayRun 1s ease-out forwards;}
  .e-rip{fill:none;stroke:#FFE7A3;stroke-width:.8;transform-box:fill-box;transform-origin:center;animation:aRip 1.3s ease-out forwards;}
</style>
</head>
<body>
<h1>🌌 Celestial のヒーローゲージ 5案</h1>
<p class="note">
  ハブ上部の「今日の目標」ゲージを、Frost のように<b>動きのあるゲージ</b>へ作り直す案です。
  5案とも Frost と同じ型（<b>常時の動き</b>／<b>進むほど形が育つ</b>／<b>25・50・75%の瞬間</b>／<b>100%の到達</b>／<b>100%超の常時演出と2周目の金</b>）をそろえてあります。
  スライダーや「0→130%を順に」で動かして比べてください。段と100%の演出は<b>数字が上がったときだけ</b>出ます（本番と同じ）。
  いちばん左は比較用の<b>現行</b>です。
</p>
<div class="ctl">
  <label>達成率 <input type="range" id="rg" min="0" max="160" step="1" value="0"> <output id="out">0%</output></label>
  <button id="bSeq" class="hi">▶ 0→130% を順に</button>
  <button data-add="10">＋10%</button>
  <button data-add="5">＋5%（2問）</button>
  <button data-add="-10">−10%</button>
  <button id="bBloom">90→100%（到達だけ）</button>
  <button data-set="130">130%（超過）</button>
  <button data-set="0">0%へ</button>
  <label><input type="checkbox" id="cbBig"> 大きく表示</label>
</div>
<div class="grid" id="grid"></div>

<!-- 現行の Celestial ゲージ（index.html から写したもの・生成時に差し込む） -->
<script type="text/plain" id="curTpl">
              <g class="theme-gauge-celestial" id="gaugeCelestialCore">
                <defs>
                  <!-- 真鍮ゴールド・メタリックグラデーション -->
                  <linearGradient id="celAstroGoldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
                    <stop offset="0%" stop-color="#FFFDF0"></stop>
                    <stop offset="25%" stop-color="#FFE082"></stop>
                    <stop offset="60%" stop-color="#FFD166"></stop>
                    <stop offset="85%" stop-color="#D4AF37"></stop>
                    <stop offset="100%" stop-color="#996515"></stop>
                  </linearGradient>
                  <!-- 蒼光エーテルシアン・グラデーション（黄道進捗アーク用） -->
                  <linearGradient id="celEtherEclipticGrad" x1="0%" y1="0%" x2="100%" y2="100%">
                    <stop offset="0%" stop-color="#FFFDF0"></stop>

<script>
'use strict';
const NS = 'http://www.w3.org/2000/svg';
const rad = (d) => d * Math.PI / 180;
const P = (r, d) => [84 + r * Math.sin(rad(d)), 84 - r * Math.cos(rad(d))];   // 0°＝真上・時計回り
const fx = (n) => +(+n).toFixed(2);
const pt = (r, d) => { const [x, y] = P(r, d); return fx(x) + ',' + fx(y); };
function rng(seed) { let s = seed >>> 0; return () => { s = (s * 1664525 + 1013904223) >>> 0; return s / 4294967296; }; }

    h += `<circle cx="${fx(x)}" cy="${fx(y)}" r="${(0.3 + R() * 0.7).toFixed(2)}" style="animation-delay:${(-R() * 4).toFixed(2)}s;animation-duration:${(2.2 + R() * 2.8).toFixed(2)}s"/>`;

    this.tri.classList.toggle('on', b >= 100);
    const over = v > 100;
    if (over !== this.over) { this.over = over; this.anims.forEach((a) => a.updatePlaybackRate(over ? 1.9 : 1)); }
  },
  stage(m) {
    const i = this.stars.findIndex((s) => s.m === m), [x, y] = P(64, m * 3.6);
    once(this.st[i], 'd-ign', 1400); once(this.lb[i], 'on', 2200);
    spawn(this.fxl, `<circle class="d-rip" cx="${fx(x)}" cy="${fx(y)}" r="5"/>`, 1300);
  },
  bloom() {
    once(this.lit, 'd-surge', 1800);
    this.st.forEach((n) => once(n, 'd-ign', 1400));
    spawn(this.fxl, `<line class="d-met" pathLength="1" x1="30" y1="22" x2="74" y2="46"/>`, 1200);
  }
};

/* ══════════════════════ E. ほうき星の旅 ══════════════════════ */
const E = {
  key: 'E', name: 'ほうき星の旅', tag: '太陽のまわりを一周するほうき星 — 尾が伸び、通ったあとに星屑の道が残る',
  how: [['常時', 'ほうき星の頭からかけらがこぼれ続け、尾（金の塵の尾・青のイオンの尾）が揺らめく。通った道の星屑がまたたく'],
        ['進むとき', 'ほうき星が上から時計回りに進み、後ろに星屑の道（＝進捗）が伸びる。進むほど尾が長くなる'],
        ['25・50・75%', '外周の道標が灯り、ほうき星の位置から流星群が四方へ走る'],
        ['100%', 'ほうき星が一周して戻り、頭がひときわ輝いて尾が大きく伸び、中央の太陽がフレアを放つ'],
        ['100%超', 'ほうき星が止まらずに周回し続ける（1周28秒）。星屑の道の外に金の2周目']],
  svg() {
    let mk = '';
    [0, 25, 50, 75].forEach((m) => { const [x, y] = P(67.5, m * 3.6); mk += `<polygon class="e-mk" points="${fx(x)},${fx(y - 2.6)} ${fx(x + 1.8)},${fx(y)} ${fx(x)},${fx(y + 2.6)} ${fx(x - 1.8)},${fx(y)}" transform="rotate(${m * 3.6} ${fx(x)} ${fx(y)})"/>`; });
    const dots = [[57, .7, 3.4], [59, .9, 4.6]]
      .map(([r, w, g]) => `<circle class="e-dot" cx="84" cy="84" r="${r}" stroke-width="${w}" stroke-dasharray=".01 ${g}" data-g="${g}"/>`).join('');
    let shed = '';
    for (let i = 0; i < 5; i++) shed += `<circle cx="84" cy="${(26 + (i % 2 ? .6 : -.5)).toFixed(1)}" r="${(0.55 - i * 0.05).toFixed(2)}" style="animation-delay:${(-i * 0.36).toFixed(2)}s"/>`;
    return `<defs>
      <radialGradient id="ePlate" cx="50%" cy="50%" r="55%"><stop offset="0" stop-color="#1A1240"/><stop offset=".7" stop-color="#0C0826"/><stop offset="1" stop-color="#050312"/></radialGradient>
      <radialGradient id="eSunG"><stop offset="0" stop-color="#FFF4C8" stop-opacity=".8"/><stop offset=".35" stop-color="#FFC857" stop-opacity=".3"/><stop offset="1" stop-color="#FF9A3C" stop-opacity="0"/></radialGradient>
      <linearGradient id="eDust" gradientUnits="userSpaceOnUse" x1="20" y1="20" x2="148" y2="148"><stop offset="0" stop-color="#FFE7A3"/><stop offset="1" stop-color="#C9A7FF"/></linearGradient>
      <radialGradient id="eDTail" gradientUnits="userSpaceOnUse" cx="84" cy="26" r="50"><stop offset="0" stop-color="#FFF8E0" stop-opacity="1"/><stop offset=".4" stop-color="#FFD98A" stop-opacity=".62"/><stop offset="1" stop-color="#FFB347" stop-opacity="0"/></radialGradient>
      <linearGradient id="eITail" gradientUnits="userSpaceOnUse" x1="84" y1="26" x2="84" y2="4"><stop offset="0" stop-color="#BFF1FF" stop-opacity=".95"/><stop offset="1" stop-color="#6FC7FF" stop-opacity="0"/></linearGradient>
      <radialGradient id="eComa"><stop offset="0" stop-color="#FFFFFF" stop-opacity="1"/><stop offset=".35" stop-color="#DDF6FF" stop-opacity=".55"/><stop offset="1" stop-color="#9EDBFF" stop-opacity="0"/></radialGradient>
      ${MASK('eMask', 58, 12)}
    </defs>
    <circle cx="84" cy="84" r="74" fill="url(#ePlate)"/>
    ${starField(20, 13, 12, 72, 'e-stars')}
    <circle cx="84" cy="84" r="58" fill="none" stroke="rgba(200,190,255,.12)" stroke-width=".6" stroke-dasharray="1 3"/>
    <g mask="url(#eMask)"><circle class="e-soft" cx="84" cy="84" r="58"/><g transform="rotate(-90 84 84)">${dots}</g></g>
    ${ARC(71.5, 'e-ovf')}
    ${mk}
    <circle class="e-sun" cx="84" cy="84" r="22" fill="url(#eSunG)"/>
    <circle cx="84" cy="84" r="4.4" fill="#FFE9A8" opacity=".85"/>
    <g class="e-orbit"><g class="e-spin">
      <g class="e-tails"><path class="e-dtail"/><path class="e-itail"/></g>
      <g class="e-shed">${shed}</g>
      <circle class="e-coma" cx="84" cy="26" r="6"/><circle class="e-nuc" cx="84" cy="26" r="1.5"/>
    </g></g>
    <g class="fxl"></g>`;
  },
  init(s) {
    this.mask = s.querySelector('#eMask .mk'); this.ovf = s.querySelector('.e-ovf'); this.orbit = s.querySelector('.e-orbit');
    this.dt = s.querySelector('.e-dtail'); this.it = s.querySelector('.e-itail'); this.tails = s.querySelector('.e-tails');
    this.coma = s.querySelector('.e-coma'); this.sun = s.querySelector('.e-sun'); this.mks = [...s.querySelectorAll('.e-mk')]; this.fxl = s.querySelector('.fxl');
    [...s.querySelectorAll('.e-dot')].forEach((c, i) => flow(c, +c.dataset.g, 9000 + i * 2600, 1));   // 塵は置いていかれる＝反時計回りへ漂う
  },
  // 尾は「頭が真上にいる」ローカル座標で作り、群ごと回す
  tail(b) {
    const Ld = 14 + b * 0.5, n = 14; const out = [], inn = [];
    for (let j = 0; j <= n; j++) {
      const t = j / n, a = -t * Ld, w = 1.4 + 6 * t, rc = 58 + 11 * Math.pow(t, 1.3);   // 塵の尾は外へ反る＝星屑の道から離して読めるように
      out.push(pt(rc + w, a)); inn.unshift(pt(rc - w * 0.55, a));
    }
    this.dt.setAttribute('d', 'M ' + out.join(' L ') + ' L ' + inn.join(' L ') + ' Z');
    const Li = 6 + b * 0.13;
    this.it.setAttribute('d', `M 83.1,26 L 84.9,26 L 84.5,${fx(26 - Li)} L 83.5,${fx(26 - Li)} Z`);
  },
  frame(b, v) {
    dash(this.mask, b); dash(this.ovf, v - 100);
    this.orbit.style.rotate = (b * 3.6) + 'deg';
    this.tail(b);
    this.mks.forEach((n, i) => n.classList.toggle('on', b >= i * 25 && b > 0));
  },
  stage(m) {
    const [x, y] = P(58, m * 3.6);
    once(this.mks[m / 25], 'e-hit', 1200);
    let h = '';
    for (let i = 0; i < 7; i++) {
      const a = rad(m * 3.6 + i * 51 + 10), s = Math.sin(a), c = -Math.cos(a);
      h += `<line class="e-met" pathLength="1" style="animation-delay:${i * 60}ms" x1="${fx(x + 4 * s)}" y1="${fx(y + 4 * c)}" x2="${fx(x + 22 * s)}" y2="${fx(y + 22 * c)}"/>`;
    }
    spawn(this.fxl, h + `<circle class="e-rip" cx="${fx(x)}" cy="${fx(y)}" r="5"/>`, 1500);
  },
  bloom() {
    once(this.coma, 'e-peri', 2000); once(this.tails, 'e-long', 2200); once(this.sun, 'e-flare', 1700);
    once(this.mks[0], 'e-hit', 1200);
    spawn(this.fxl, `<circle class="e-rip" cx="84" cy="26" r="7"/>` + rays(84, 84, 26, 40, 12, 'ray', 15), 1500);
  }
};

/* ══════════════════════ 再生器 ══════════════════════ */
const GAUGES = [CUR, A, B, C, D, E];
const grid = document.getElementById('grid');
function tier(v) { return v <= 0 ? 0 : v < 25 ? 1 : v < 50 ? 2 : v < 75 ? 3 : v < 100 ? 4 : v < 150 ? 5 : 6; }
GAUGES.forEach((g) => {
  const c = document.createElement('section');
  c.className = 'card' + (g.cur ? ' cur' : '');
  c.innerHTML = `<h2>${g.key === '現行' ? '現行' : g.key + '.'} ${g.name}</h2><div class="tag">${g.tag}</div>
    <div class="stage"><div class="gauge" data-tier="0"><div class="gauge-ring"><svg viewBox="0 0 168 168" aria-hidden="true">${g.svg()}</svg>
    <span class="gauge-mid"><span class="pct">0</span><em>%</em></span></div>
    <p class="gauge-cap">今日の目標</p><p class="gauge-goal"><b class="n">0</b> / 40問</p></div></div>
    <dl class="how">${g.how.map(([a, b]) => `<dt>${a}</dt><dd>${b}</dd>`).join('')}</dl>`;
  grid.appendChild(c);
  g.el = c.querySelector('.gauge'); g.mid = c.querySelector('.gauge-mid'); g.pct = c.querySelector('.pct'); g.n = c.querySelector('.n');
  g.init(c.querySelector('svg'));
  g.frame(0, 0);
});

let cur = 0, raf = 0;
const rg = document.getElementById('rg'), out = document.getElementById('out');
function apply(v) {
  const prev = cur; cur = v;
  const b = Math.min(100, v), t = String(tier(v)), shown = Math.round(v);
  GAUGES.forEach((g) => {
    g.el.dataset.tier = t;
    g.el.toggleAttribute('data-over', v > 100);
    g.frame(b, v);
    g.pct.textContent = shown; g.mid.classList.toggle('wide', shown >= 100);
    g.n.textContent = Math.round(v * 40 / 100);
    if (v > prev) {
      [25, 50, 75].forEach((m) => { if (prev < m && v >= m && g.stage) g.stage(m); });
      if (prev < 100 && v >= 100 && g.bloom) g.bloom();
    }
  });
  rg.value = shown; out.textContent = shown + '%';
}
// 本番の弧と同じくらいの尺（約1秒・ease-out）で数字を動かす
function go(to, dur = 1000) {
  cancelAnimationFrame(raf);
  to = Math.max(0, Math.min(160, to));
  const from = cur, t0 = performance.now();
  const step = (now) => {
    const k = Math.min(1, (now - t0) / dur), e = 1 - Math.pow(1 - k, 3);
    apply(from + (to - from) * e);
    if (k < 1) raf = requestAnimationFrame(step);
  };
  raf = requestAnimationFrame(step);
}
let seqT = [];
function stopSeq() { seqT.forEach(clearTimeout); seqT = []; }
function seq(list) {
  stopSeq(); let t = 0;
  list.forEach(([v, wait, dur]) => { seqT.push(setTimeout(() => go(v, dur), t)); t += wait; });
}
rg.addEventListener('input', () => { stopSeq(); go(+rg.value, 500); });
document.querySelectorAll('[data-add]').forEach((b) => b.addEventListener('click', () => { stopSeq(); go(Math.round(cur) + +b.dataset.add); }));
document.querySelectorAll('[data-set]').forEach((b) => b.addEventListener('click', () => { stopSeq(); go(+b.dataset.set, +b.dataset.set === 0 ? 700 : 1400); }));
document.getElementById('bSeq').addEventListener('click', () => {
  seq([[0, 900, 600], [18, 1500, 1000], [30, 2200, 1000], [45, 1500, 1000], [55, 2200, 1000], [70, 1500, 1000], [80, 2400, 1000], [92, 1600, 1000], [100, 3600, 1000], [130, 0, 1600]]);
});
document.getElementById('bBloom').addEventListener('click', () => { seq([[90, 1200, 700], [100, 0, 1000]]); });
document.getElementById('cbBig').addEventListener('change', (e) => document.body.classList.toggle('big', e.target.checked));
</script>
