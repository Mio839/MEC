<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ストレージ計測 (Step 0)</title>
<!--
  IndexedDB 化の判断材料を実機で取るための診断ページ（一時的なもの）。
  「1解答あたり localStorage に何ms掛かっているか」を測るためだけに置いてある。
  ⚠️ 実データは1バイトも変更しない（JSON.parse → stringify の往復結果が
     元の文字列と完全一致したときだけ、同じ内容を同じキーへ書き戻す）。
  判断が済んだら消してよい。sw.js の SHELL には入れていない＝オフラインでは開けない。
-->
<style>
  :root{--bg:#0f1216;--fg:#e6ebf2;--dim:#93a1b4;--line:#242c36;--card:#161b22;
        --or:#FFB830;--gr:#3FBF6F;--rd:#E5484D}
  *{box-sizing:border-box}
  body{margin:0;padding:16px 14px 60px;background:var(--bg);color:var(--fg);
       font:14px/1.6 -apple-system,BlinkMacSystemFont,"Hiragino Sans","Noto Sans JP",sans-serif}
  h1{font-size:18px;margin:0 0 4px}
  .lead{color:var(--dim);font-size:12px;margin:0 0 18px}
  h2{font-size:14px;margin:26px 0 8px;padding-bottom:6px;border-bottom:1px solid var(--line)}
  .sub{color:var(--dim);font-size:11px;margin:-4px 0 10px}
  .card{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:12px;margin-bottom:12px}
  .scroll{overflow-x:auto;-webkit-overflow-scrolling:touch}
  table{border-collapse:collapse;width:100%;min-width:520px;font-size:12px}
  th,td{padding:5px 8px;text-align:right;white-space:nowrap;border-bottom:1px solid var(--line)}
  th{color:var(--dim);font-weight:600;font-size:11px}
  td:first-child,th:first-child{text-align:left}
  tfoot td{font-weight:700;border-bottom:none;border-top:2px solid var(--line)}
  .num{font-variant-numeric:tabular-nums;font-family:ui-monospace,SFMono-Regular,Menlo,monospace}
  button{font:inherit;font-weight:700;padding:11px 18px;border-radius:9px;border:1px solid var(--line);
         background:#1e2530;color:var(--fg);cursor:pointer;margin:0 8px 8px 0}
  button.go{background:var(--or);color:#221800;border-color:var(--or)}
  button:disabled{opacity:.45}
  .kv{display:flex;justify-content:space-between;gap:12px;padding:4px 0;border-bottom:1px solid var(--line)}
  .kv:last-child{border-bottom:none}
  .kv span:first-child{color:var(--dim)}
  .ok{color:var(--gr)}.warn{color:var(--or)}.bad{color:var(--rd)}.dim{color:var(--dim)}
  .verdict{font-size:15px;font-weight:700;padding:12px;border-radius:9px;margin-top:10px;line-height:1.5}
  .verdict.ok{background:rgba(63,191,111,.12);border:1px solid rgba(63,191,111,.4)}
  .verdict.warn{background:rgba(255,184,48,.12);border:1px solid rgba(255,184,48,.4)}
  .verdict.bad{background:rgba(229,72,77,.12);border:1px solid rgba(229,72,77,.4)}
  .note{font-size:11px;color:var(--dim);margin-top:8px;line-height:1.65}
</style>
</head>
<body>

<h1>📊 ストレージ計測 (Step 0)</h1>
<p class="lead">IndexedDB 化の判断材料。<b>この端末で</b>1解答あたりの localStorage 書き込みに
何ms掛かっているかを測る。<br>※ 実データは1バイトも変更しない（同じ内容を書き戻すだけ）。</p>

<h2>A. 現在の使用量</h2>
<div class="card scroll"><table id="tblUse"></table></div>
<div class="card" id="quotaBox"></div>

<h2>B. 1解答あたりの書き込みコスト</h2>
<p class="sub">試験モードで1問解答したときに実際に走る書き込みを、現在の実データで再現して測る。</p>
<button class="go" id="btnRun">計測する（約2秒）</button>
<button id="btnCopy" disabled>結果をコピー</button>
<div id="resultBox"></div>

<script>
(function () {
  'use strict';

  // ── 1解答（試験モード）で実際に走る書き込み ────────────────────────
  // コードを追って確定させたもの。ops: p=JSON.parse / s=JSON.stringify / w=setItem
  // full=true は「毎回オブジェクト全体を書き直している」もの＝Step A の削減対象。
  var WRITE_SET = [
    { key:'done_v2',         ops:'psw', src:'study_exam.js _markExamDone', full:true  },
    { key:'myrate_v1',       ops:'sw',  src:'study_exam.js _recordMyRate', full:true  },
    { key:'mec_attempts_v1', ops:'psw', src:'attempts.js log() read+write', full:true  },
    { key:'mec_srs_v1',      ops:'sw',  src:'study.html _saveSRS',         full:true  },
    { key:'mec_choice_v1',   ops:'sw',  src:'study.html (誤答時)',          full:true  },
    { key:'activity_v1',     ops:'psw', src:'progress.js logActivity',     full:false },
    { key:'mec_missions_v1', ops:'sw',  src:'gamify.js _bumpMission',      full:false },
    { key:'mec_gamify_v1',   ops:'sw',  src:'gamify.js bestStreak',        full:false }
  ];

  var ITER = 15;
  var FRAME_MS = 16.7;

  function kb(chars) { return (chars * 2 / 1024).toFixed(1); }  // quota は UTF-16 コード単位
  function ms(n) { return n.toFixed(2); }
  function median(a) { var b = a.slice().sort(function (x, y) { return x - y; }); return b[b.length >> 1]; }

  // ── A. 使用量 ──────────────────────────────────────────────────
  var usageRows = [], totalChars = 0;

  function scanUsage() {
    usageRows = []; totalChars = 0;
    for (var i = 0; i < localStorage.length; i++) {
      var k = localStorage.key(i);
      var v = localStorage.getItem(k) || '';
      totalChars += k.length + v.length;
      usageRows.push({ key: k, chars: v.length });
    }
    usageRows.sort(function (a, b) { return b.chars - a.chars; });
  }

  function renderUsage() {
    var h = '<thead><tr><th>キー</th><th>文字数</th><th>UTF-16</th><th>割合</th></tr></thead><tbody>';
    usageRows.forEach(function (r) {
      var pct = totalChars ? (r.chars / totalChars * 100) : 0;
      h += '<tr><td>' + r.key + '</td>'
         + '<td class="num">' + r.chars.toLocaleString() + '</td>'
         + '<td class="num">' + kb(r.chars) + ' KB</td>'
         + '<td class="num' + (pct >= 20 ? ' warn' : '') + '">' + pct.toFixed(1) + '%</td></tr>';
    });
    h += '</tbody><tfoot><tr><td>合計</td>'
       + '<td class="num">' + totalChars.toLocaleString() + '</td>'
       + '<td class="num">' + kb(totalChars) + ' KB</td><td class="num">100%</td></tr></tfoot>';
    document.getElementById('tblUse').innerHTML = h;
  }

  function pctOf5MB() { return totalChars * 2 / (5 * 1024 * 1024) * 100; }
  function kvRow(k, v) { return '<div class="kv"><span>' + k + '</span><span>' + v + '</span></div>'; }

  function renderQuota() {
    var box = document.getElementById('quotaBox');
    var p = pctOf5MB();
    var cls = p > 70 ? 'bad' : (p > 40 ? 'warn' : 'ok');
    var h = kvRow('localStorage 5MB 上限に対して', '<b class="' + cls + '">' + p.toFixed(1) + '%</b>');

    var qh = { n: 0 };
    try { qh = JSON.parse(localStorage.getItem('mec_quota_hits_v1') || '{"n":0}'); } catch (e) {}
    h += kvRow('QuotaExceeded の発火回数',
      qh.n ? '<b class="bad">' + qh.n + ' 回</b>（最後: ' + (qh.last || '?') + '）'
           : '<b class="ok">0 回</b>');
    box.innerHTML = h + '<div class="note">読み込み中…</div>';

    var tail = '<div class="note">⚠️ 発火回数は計測を入れた 2026-09-01 以降のぶんだけ。'
             + 'それ以前に発火していたかの記録は残っていない。</div>';

    var jobs = [];
    if (navigator.storage && navigator.storage.estimate) {
      jobs.push(navigator.storage.estimate().then(function (e) {
        return kvRow('storage.estimate() usage', '<span class="num">' + ((e.usage || 0) / 1024).toFixed(1) + ' KB</span>')
             + kvRow('storage.estimate() quota', '<span class="num">' + ((e.quota || 0) / 1048576).toFixed(0) + ' MB</span>');
      }).catch(function () { return kvRow('storage.estimate()', '<span class="dim">取得失敗</span>'); }));
    } else {
      jobs.push(Promise.resolve(kvRow('storage.estimate()', '<span class="dim">未対応</span>')));
    }
    if (navigator.storage && navigator.storage.persisted) {
      jobs.push(navigator.storage.persisted().then(function (per) {
        return kvRow('永続化 persisted()', per ? '<b class="ok">true（消されにくい）</b>' : '<b class="warn">false</b>');
      }).catch(function () { return kvRow('永続化 persisted()', '<span class="dim">取得失敗</span>'); }));
    } else {
      jobs.push(Promise.resolve(kvRow('永続化 persisted()', '<span class="dim">未対応（Safari は概ねここ）</span>')));
    }

    Promise.all(jobs).then(function (parts) { box.innerHTML = h + parts.join('') + tail; });
  }

  // ── B. 書き込みコストの計測 ────────────────────────────────────
  var lastReport = '';

  function measure() {
    var rows = [], grandTotal = 0, grandChars = 0, fullTotal = 0;

    WRITE_SET.forEach(function (spec) {
      var raw = localStorage.getItem(spec.key);
      var obj;
      if (raw === null) { rows.push({ spec: spec, missing: true }); return; }
      try { obj = JSON.parse(raw); } catch (e) { rows.push({ spec: spec, missing: true }); return; }

      // 書き戻しても内容が1バイトも変わらないと確認できたときだけ setItem を測る
      var safeWrite = (JSON.stringify(obj) === raw);

      var pT = [], sT = [], wT = [];
      for (var i = 0; i <= ITER; i++) {           // i=0 はウォームアップ
        var t0, t1;
        if (spec.ops.indexOf('p') >= 0) {
          t0 = performance.now(); JSON.parse(raw); t1 = performance.now();
          if (i) pT.push(t1 - t0);
        }
        t0 = performance.now(); var s = JSON.stringify(obj); t1 = performance.now();
        if (i) sT.push(t1 - t0);
        if (safeWrite) {
          t0 = performance.now();
          try { localStorage.setItem(spec.key, s); } catch (e) {}
          t1 = performance.now();
          if (i) wT.push(t1 - t0);
        }
      }

      var p = pT.length ? median(pT) : 0;
      var s2 = median(sT);
      var w = wT.length ? median(wT) : null;
      var tot = p + s2 + (w || 0);
      grandTotal += tot; grandChars += raw.length;
      if (spec.full) fullTotal += tot;

      rows.push({ spec: spec, missing: false, chars: raw.length, p: p, s: s2, w: w, tot: tot, safeWrite: safeWrite });
    });

    return { rows: rows, total: grandTotal, chars: grandChars, fullTotal: fullTotal };
  }

  function renderResult(r) {
    var h = '<div class="card scroll"><table><thead><tr><th>キー</th><th>サイズ</th>'
          + '<th>parse</th><th>stringify</th><th>setItem</th><th>合計</th></tr></thead><tbody>';

    r.rows.forEach(function (x) {
      if (x.missing) {
        h += '<tr><td>' + x.spec.key + '</td><td colspan="5" class="dim">未使用（このキーはまだ無い）</td></tr>';
        return;
      }
      h += '<tr><td>' + x.spec.key + (x.spec.full ? ' <span class="warn">●</span>' : '') + '</td>'
         + '<td class="num">' + kb(x.chars) + ' KB</td>'
         + '<td class="num">' + (x.spec.ops.indexOf('p') >= 0 ? ms(x.p) : '<span class="dim">–</span>') + '</td>'
         + '<td class="num">' + ms(x.s) + '</td>'
         + '<td class="num">' + (x.w === null ? '<span class="dim">skip</span>' : ms(x.w)) + '</td>'
         + '<td class="num"><b>' + ms(x.tot) + '</b></td></tr>';
    });

    h += '</tbody><tfoot><tr><td>1解答あたり</td><td class="num">' + kb(r.chars) + ' KB</td>'
       + '<td colspan="3"></td><td class="num"><b>' + ms(r.total) + ' ms</b></td></tr></tfoot></table></div>';

    var pct = r.total / FRAME_MS * 100;
    var cls = r.total >= FRAME_MS ? 'bad' : (r.total >= FRAME_MS / 2 ? 'warn' : 'ok');
    var word = r.total >= FRAME_MS ? '1コマを丸ごと食う＝カクつきの実犯人'
             : (r.total >= FRAME_MS / 2 ? '1コマの半分以上。演出と重なると落ちる'
             : '1コマに対して十分小さい＝カクつきの主因は別にある');

    h += '<div class="verdict ' + cls + '">1解答 = <b>' + ms(r.total) + ' ms</b>'
       + '（60fps の1コマ 16.7ms の <b>' + pct.toFixed(0) + '%</b>）<br>' + word + '</div>';

    h += '<div class="card" style="margin-top:12px">'
       + kvRow('うち「●＝毎回まるごと書き直している」ぶん', '<b class="warn">' + ms(r.fullTotal) + ' ms</b>')
       + kvRow('Step A（差分化・デバウンス）後の見込み', '<b class="ok">' + ms(r.total - r.fullTotal) + ' ms</b>')
       + '<div class="note">Step A は localStorage のまま毎解答のフル書き換えをやめる案。'
       + 'この見込み値が十分小さいなら、IndexedDB へ移らなくてもカクつきは解消する。</div></div>';

    document.getElementById('resultBox').innerHTML = h;

    var t = ['# MEC ストレージ計測 (Step 0)',
             'UA: ' + navigator.userAgent,
             '日時: ' + new Date().toISOString(), '',
             '## A. 使用量',
             '合計 ' + totalChars.toLocaleString() + ' 文字 / ' + kb(totalChars) + ' KB（5MB の ' + pctOf5MB().toFixed(1) + '%）'];
    usageRows.slice(0, 12).forEach(function (u) { t.push('  ' + u.key + '  ' + kb(u.chars) + ' KB'); });
    t.push('', '## B. 1解答あたり');
    r.rows.forEach(function (x) {
      if (x.missing) { t.push('  ' + x.spec.key + '  (未使用)'); return; }
      t.push('  ' + x.spec.key + '  ' + kb(x.chars) + 'KB  p=' + ms(x.p) + ' s=' + ms(x.s)
           + ' w=' + (x.w === null ? 'skip' : ms(x.w)) + '  計 ' + ms(x.tot) + 'ms');
    });
    t.push('  --------',
           '  合計 ' + ms(r.total) + ' ms / ' + kb(r.chars) + ' KB  (16.7ms の ' + pct.toFixed(0) + '%)',
           '  うちフル書き換え ' + ms(r.fullTotal) + ' ms → Step A 後の見込み ' + ms(r.total - r.fullTotal) + ' ms');
    lastReport = t.join('\n');
    document.getElementById('btnCopy').disabled = false;
  }

  document.getElementById('btnRun').addEventListener('click', function () {
    var b = this;
    b.disabled = true; b.textContent = '計測中…';
    document.getElementById('resultBox').innerHTML = '';
    setTimeout(function () {
      try {
        var r = measure();
        scanUsage(); renderUsage();
        renderResult(r);
      } catch (e) {
        document.getElementById('resultBox').innerHTML =
          '<div class="verdict bad">計測に失敗: ' + (e && e.message ? e.message : e) + '</div>';
      }
      b.disabled = false; b.textContent = 'もう一度計測する';
    }, 60);
  });

  document.getElementById('btnCopy').addEventListener('click', function () {
    var b = this, old = b.textContent;
    var done = function () { b.textContent = 'コピーしました'; setTimeout(function () { b.textContent = old; }, 1600); };
    var fallback = function () {
      var ta = document.createElement('textarea');
      ta.value = lastReport;
      ta.style.cssText = 'position:fixed;left:4%;top:4%;width:92%;height:60vh;z-index:9999;font-size:12px';
      document.body.appendChild(ta);
      ta.focus(); ta.select();
      b.textContent = '↑ 手動でコピーしてください';
    };
    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(lastReport).then(done, fallback);
    } else { fallback(); }
  });

  scanUsage();
  renderUsage();
  renderQuota();
})();
</script>
</body>
</html>
