const RELATIONS=[
  {from:'d04a',to:'d04e',label:'SLE→APS',color:'#EF9A9A', explain:'SLEの20〜30%に抗リン脂質抗体症候群（APS）合併。抗CL抗体・ループスアンチコアグラント・抗β2GPI抗体→動静脈血栓症・習慣流産（2回以上）・血小板減少。DOAC非推奨（PT-INR管理困難）→ワルファリン（INR 2〜3）が基本。妊娠合併APSはヘパリン＋低用量アスピリン。'},
  {from:'d04a',to:'d04d',label:'SLE+SS合併',color:'#CE93D8', explain:'SLEとシェーグレン症候群（SS）は高率に合併（SLE患者の約20%にSS）。抗SS-A（Ro）抗体はSLEでも高陽性率。合併例ではドライアイ・ドライマウスに加え外分泌腺以外の病変（間質性肺炎・末梢神経炎）も重複し得る。MALT型B細胞リンパ腫リスクがさらに上昇。'},
  {from:'d04b',to:'d05a',label:'SSc+ANCA',color:'#80CBC4', explain:'強皮症（SSc）にMPO-ANCA（p-ANCA）が陽性となることがある（SSc-ANCA重複：間質性肺炎合併例に多い）。ANCA関連血管炎（MPA）との合併・移行評価が必要。Scl-70（抗トポイソメラーゼI）陽性びまん型SScでは肺線維症（UIPパターン）がANCAとは独立した主要合併症。'},
  {from:'d04c',to:'d04d',label:'PM/DM+SS',color:'#F48FB1', explain:'多発性筋炎/皮膚筋炎（PM/DM）とシェーグレン症候群（SS）はともに自己免疫性外分泌腺・筋疾患として合併しうる。PM/DM＋SS合併例では間質性肺炎リスクがさらに上昇。抗Jo-1（抗ARS）抗体と抗SS-A抗体の共陽性例では抗合成酵素症候群＋SS合併として管理。'},
  {from:'d03a',to:'d04a',label:'RA→SLE移行',color:'#9FA8DA', explain:'RA（関節リウマチ）とSLEはともにANA陽性・多関節炎を呈し、重複症候群（RA-SLE）となることがある。鑑別：RAは抗CCP抗体陽性・関節破壊（侵食）・RF陽性、SLEは抗dsDNA/抗Sm陽性・非侵食性関節炎・補体↓・全身臓器病変。MTXはSLE活動性悪化の可能性あり。'},
  {from:'d05a',to:'d05c',label:'血管炎鑑別',color:'#A5D6A7', explain:'ANCA関連血管炎（GPA：c-ANCA/PR3・MPA：p-ANCA/MPO）と結節性多発動脈炎（PAN）の鑑別。GPA/MPA：ANCA陽性・微小血管炎・腎炎（半月体形成性GN）・肺病変。PAN：ANCA陰性・中動脈病変・腎梗塞（GNなし）・神経炎・HBV関連（30〜40%）。血管造影で腎・腸間膜動脈瘤（PAN特徴）。'},
  {from:'d02e',to:'d02a',label:'アナフィラキシー',color:'#FFCC80', explain:'アナフィラキシー（全身性I型アレルギー：皮膚＋呼吸器or循環器）はアレルギー性喘息の延長線上にある重篤病態。喘息発作はアナフィラキシーの呼吸器症状型として出現しうる。第一選択：アドレナリン0.3 mg筋注（大腿外側）が絶対優先——抗ヒスタミン・ステロイドは遅効性で代替不可。'},
  {from:'d01c',to:'d03b',label:'HLA-B27',color:'#90CAF9', explain:'HLA-B27は脊椎関節炎（SpA）の共通遺伝的リスク因子。強直性脊椎炎（AS：HLA-B27陽性90%）・乾癬性関節炎・反応性関節炎・IBD関連関節炎がSpAに含まれる。仙腸関節炎（X線or MRI）＋腰背部痛（安静で悪化・運動で改善）がSpAの特徴的所見。抗TNF-αが有効。'},
  {from:'d01c',to:'d05d',label:'HLA-B51',color:'#80DEEA', explain:'HLA-B51はベーチェット病（BD）の遺伝的危険因子（日本人陽性率50〜60%）。主症状：口腔アフタ（必発）・外陰部潰瘍・眼症状（ぶどう膜炎→失明リスク）・皮膚症状（結節性紅斑・毛包炎様皮疹）。針反応（Pathergy test）陽性が血管過反応性を示す。眼BD→シクロスポリン・抗TNF-α。'},
  {from:'d04d',to:'d05e',label:'SS+IgG4',color:'#B2EBF2', explain:'シェーグレン症候群（SS）とIgG4関連疾患（IgG4-RD）はともに涙腺・唾液腺に病変を来す（ミクリッツ病はIgG4-RDの一形態）。鑑別：IgG4-RDは血清IgG4>135 mg/dL・ステロイド著効・多臓器病変（膵・胆管・腎・後腹膜）・IgE↑。SSは抗SS-A/B抗体陽性・MALT型リンパ腫リスク。'},
];

const DIS_POS={};const DIS_CHIDX={};
CHAPTERS.forEach((ch,ci)=>{ch.diseases.forEach(dis=>{DIS_CHIDX[dis.id]=ci;});});
const DIS_OBJ={};CHAPTERS.forEach(ch=>ch.diseases.forEach(dis=>{DIS_OBJ[dis.id]=dis;}));

function deg(a){return a*Math.PI/180;}
function chPos(chIdx){const a=deg(CHAPTERS[chIdx].angle);return{x:CX+R1*Math.cos(a),y:CY+R1*Math.sin(a)};}
function disPos(chIdx,dIdx,total){const chAngle=CHAPTERS[chIdx].angle;const fanDeg=Math.min(28,8+6*total);const start=chAngle-fanDeg/2;const a=deg(start+(dIdx+0.5)*fanDeg/total);return{x:CX+R2*Math.cos(a),y:CY+R2*Math.sin(a)};}
function anchor(x){if(x<CX-20)return'end';if(x>CX+20)return'start';return'middle';}

const svgEl=document.getElementById('svg');const W=1600,H=1380;
svgEl.setAttribute('width',W);svgEl.setAttribute('height',H);svgEl.setAttribute('viewBox',`0 0 ${W} ${H}`);
function svgNS(tag,attrs){const el=document.createElementNS('http://www.w3.org/2000/svg',tag);Object.entries(attrs).forEach(([k,v])=>el.setAttribute(k,v));return el;}

function ltn(hex,p){const r=parseInt(hex.slice(1,3),16),g=parseInt(hex.slice(3,5),16),b=parseInt(hex.slice(5,7),16);return'#'+[r,g,b].map(v=>Math.round(v+(255-v)*p).toString(16).padStart(2,'0')).join('');}
function addGradients(){const defs=svgEl.querySelector('defs');CHAPTERS.forEach(ch=>{const grad=svgNS('radialGradient',{id:'grad_'+ch.id,cx:'38%',cy:'35%',r:'62%'});grad.append(svgNS('stop',{offset:'0%','stop-color':ltn(ch.color,0.45)}),svgNS('stop',{offset:'100%','stop-color':ch.color}));defs.append(grad);});}
function createDefs(){
  const defs=svgNS('defs',{});const rg=svgNS('radialGradient',{id:'rootGrad',cx:'50%',cy:'50%',r:'50%'});
  rg.append(svgNS('stop',{offset:'0%','stop-color':'#80CBC4'}),svgNS('stop',{offset:'100%','stop-color':'#00695C'}));
  const f=svgNS('filter',{id:'glow',x:'-50%',y:'-50%',width:'200%',height:'200%'});const blur=svgNS('feGaussianBlur',{stdDeviation:'4',result:'colored'});const merge=svgNS('feMerge',{});merge.append(svgNS('feMergeNode',{in:'colored'}),svgNS('feMergeNode',{in:'SourceGraphic'}));f.append(blur,merge);
  const f2=svgNS('filter',{id:'glow2',x:'-50%',y:'-50%',width:'200%',height:'200%'});const blur2=svgNS('feGaussianBlur',{stdDeviation:'2.5',result:'colored2'});const merge2=svgNS('feMerge',{});merge2.append(svgNS('feMergeNode',{in:'colored2'}),svgNS('feMergeNode',{in:'SourceGraphic'}));f2.append(blur2,merge2);
  defs.append(rg,f,f2);svgEl.prepend(defs);
}

const layerEdgesCh=svgNS('g',{id:'ech'});const layerEdgesDis=svgNS('g',{id:'edis'});const layerRelations=svgNS('g',{id:'nrel'});const layerNodesDis=svgNS('g',{id:'ndis'});const layerNodesCh=svgNS('g',{id:'nch'});const layerRoot=svgNS('g',{id:'nroot'});
svgEl.append(layerEdgesCh,layerEdgesDis,layerRelations,layerNodesDis,layerNodesCh,layerRoot);
createDefs();addGradients();
const activeChapters=new Set();const disEdges={};const disNodes={};const orbitRings={};

function drawRoot(){
  const g=svgNS('g',{transform:`translate(${CX},${CY})`});
  const ring=svgNS('circle',{r:'68',fill:'none',stroke:'rgba(0,137,123,0.25)','stroke-width':'12'});ring.style.animation='pulse 2.5s ease-in-out infinite';
  const ring2=svgNS('circle',{r:'52',fill:'none',stroke:'rgba(0,137,123,0.18)','stroke-width':'8'});ring2.style.animation='pulse 2.5s ease-in-out infinite 0.8s';
  const circ=svgNS('circle',{r:'42',fill:'url(#rootGrad)',filter:'url(#glow)'});
  const txt1=svgNS('text',{x:'0',y:'-4','text-anchor':'middle','font-size':'22','font-weight':'900',fill:'#fff','font-family':'Noto Sans JP,sans-serif'});txt1.textContent='🛡️';
  const txt2=svgNS('text',{x:'0',y:'14','text-anchor':'middle','font-size':'10','font-weight':'900',fill:'#fff','font-family':'Noto Sans JP,sans-serif'});txt2.textContent='免アレ膠';
  g.append(ring,ring2,circ,txt1,txt2);layerRoot.append(g);
}

function drawChapters(){
  CHAPTERS.forEach((ch,ci)=>{
    const p=chPos(ci);const ep1={x:CX+44*Math.cos(deg(ch.angle)),y:CY+44*Math.sin(deg(ch.angle))};
    const path=svgNS('path',{d:`M ${ep1.x} ${ep1.y} Q ${(ep1.x+p.x)/2} ${(ep1.y+p.y)/2} ${p.x} ${p.y}`,fill:'none',stroke:ch.color,'stroke-width':'2.5',opacity:'0.55'});layerEdgesCh.append(path);
    const g=svgNS('g',{transform:`translate(${p.x},${p.y})`,style:'cursor:pointer'});g.dataset.ci=ci;
    const outerRing=svgNS('circle',{r:'37',fill:'none',stroke:ch.color,'stroke-width':'2',opacity:'0.4'});
    const circ=svgNS('circle',{r:'31',fill:'url(#grad_'+ch.id+')',stroke:'#fff','stroke-width':'1.5',filter:'url(#glow2)'});circ.style.transition='r 0.2s';
    function splitLabel(lbl){if(lbl.length<=5)return[lbl];const parts=lbl.split(/[・\/]/);if(parts.length>=2)return[parts.slice(0,Math.ceil(parts.length/2)).join('・'),parts.slice(Math.ceil(parts.length/2)).join('・')];const mid=Math.ceil(lbl.length/2);return[lbl.slice(0,mid),lbl.slice(mid)];}
    const lines=splitLabel(ch.label);const lineH=12;const totalH=lines.length*lineH;
    lines.forEach((line,li)=>{const t=svgNS('text',{x:'0',y:String(li*lineH-totalH/2+lineH*0.8),'text-anchor':'middle','font-size':'9','font-weight':'700',fill:'#fff','font-family':'Noto Sans JP,sans-serif'});t.textContent=line;g.append(t);});
    g.prepend(circ,outerRing);
    g.addEventListener('click',(e)=>{e.stopPropagation();toggleChapter(ci);});g.addEventListener('touchstart',(e)=>{e.stopPropagation();if(e.touches.length===1){dragging=true;lastX=e.touches[0].clientX;lastY=e.touches[0].clientY;}},{passive:true});
    g.addEventListener('mouseenter',()=>{circ.setAttribute('r','34');});g.addEventListener('mouseleave',()=>{circ.setAttribute('r',activeChapters.has(ci)?'34':'31');});
    layerNodesCh.append(g);
  });
}

function drawDiseases(){
  const defs=svgEl.querySelector('defs');
  CHAPTERS.forEach((ch,ci)=>{
    const cp=chPos(ci);disEdges[ci]=[];disNodes[ci]=[];
    ch.diseases.forEach((dis,di)=>{
      const dp=disPos(ci,di,ch.diseases.length);DIS_POS[dis.id]=dp;
      const chColor=ch.color;const nodeR=32;
      const edge=svgNS('path',{d:`M ${cp.x} ${cp.y} Q ${(cp.x+dp.x)/2} ${(cp.y+dp.y)/2} ${dp.x} ${dp.y}`,fill:'none',stroke:chColor,'stroke-width':'1.5',opacity:'0'});edge.style.transition='opacity 0.35s';layerEdgesDis.append(edge);disEdges[ci].push(edge);
      const g=svgNS('g',{transform:`translate(${dp.x},${dp.y})`,style:'cursor:pointer',opacity:'0'});g.style.transition='opacity 0.35s';g.dataset.ci=ci;g.dataset.di=di;
      const circ=svgNS('circle',{r:String(nodeR),fill:'url(#grad_'+ch.id+')',stroke:'rgba(255,255,255,0.35)','stroke-width':'1'});circ.style.transition='r 0.15s';
      function getAbbr(label){const m=label.match(/^([A-Za-z0-9\-]+)/);if(m&&m[1].length>=2&&m[1].length<=6)return m[1];return label.replace(/（.+?）/g,'').slice(0,4);}
      const ct=svgNS('text',{x:'0',y:'5','text-anchor':'middle','font-size':'10','font-weight':'900',fill:'#fff','font-family':'Noto Sans JP,sans-serif','pointer-events':'none'});ct.textContent=getAbbr(dis.label);g.append(circ,ct);
      const dx=dp.x-CX,dy=dp.y-CY,len=Math.hypot(dx,dy)||1,nx=dx/len,ny=dy/len;const lx=nx*(nodeR+20),ly=ny*(nodeR+20);
      function getExtLabel(label){const noParens=label.replace(/（.+?）/g,'').replace(/\/.+/,'').trim();return noParens.length>8?noParens.slice(0,7)+'…':noParens;}
      const lt=svgNS('text',{x:String(lx),y:String(ly+4),'text-anchor':anchor(dp.x),'font-size':'12','font-weight':'700',fill:'rgba(255,255,255,0.9)','font-family':'Noto Sans JP,sans-serif','pointer-events':'none'});lt.textContent=getExtLabel(dis.label);g.append(lt);
      g.addEventListener('click',(e)=>{e.stopPropagation();showPanel(ci,di);});g.addEventListener('touchstart',(e)=>{e.stopPropagation();if(e.touches.length===1){dragging=true;lastX=e.touches[0].clientX;lastY=e.touches[0].clientY;}},{passive:true});
      g.addEventListener('mouseenter',()=>{const c=g.querySelector('circle');if(c)c.setAttribute('r',String(nodeR+4));});g.addEventListener('mouseleave',()=>{const c=g.querySelector('circle');if(c)c.setAttribute('r',String(nodeR));});
      layerNodesDis.append(g);disNodes[ci].push(g);
    });
  });
}

function drawRelations(){
  RELATIONS.forEach(rel=>{
    const fp=DIS_POS[rel.from],tp=DIS_POS[rel.to];if(!fp||!tp)return;
    const mx=(fp.x+tp.x)/2,my=(fp.y+tp.y)/2;const isSameCh=DIS_CHIDX[rel.from]===DIS_CHIDX[rel.to];
    let cpx,cpy;if(isSameCh){const outX=mx-CX,outY=my-CY,outLen=Math.hypot(outX,outY)||1;cpx=mx+(outX/outLen)*130;cpy=my+(outY/outLen)*130;}else{cpx=mx+(CX-mx)*0.35;cpy=my+(CY-my)*0.35;}
    const path=svgNS('path',{d:`M ${fp.x} ${fp.y} Q ${cpx} ${cpy} ${tp.x} ${tp.y}`,fill:'none',stroke:rel.color,'stroke-width':'1.5','stroke-dasharray':'5 4',opacity:'0'});path.style.transition='opacity 0.4s';layerRelations.append(path);rel._path=path;const hit=svgNS('path',{d:`M ${fp.x} ${fp.y} Q ${cpx} ${cpy} ${tp.x} ${tp.y}`,fill:'none',stroke:'transparent','stroke-width':'15',cursor:'pointer'});hit.addEventListener('click',e=>{e.stopPropagation();showRelPanel(rel);});hit.addEventListener('touchstart',e=>{e.stopPropagation();showRelPanel(rel);},{passive:true});layerRelations.append(hit);rel._hit=hit;
    if(!isSameCh){
      const lx=0.25*fp.x+0.5*cpx+0.25*tp.x,ly=0.25*fp.y+0.5*cpy+0.25*tp.y-7;const labelW=rel.label.length*7+10;
      const bg=svgNS('rect',{x:String(lx-labelW/2),y:String(ly-10),width:String(labelW),height:'14',fill:'#06101f',rx:'4',opacity:'0'});bg.style.transition='opacity 0.4s';
      const lt=svgNS('text',{x:String(lx),y:String(ly),'text-anchor':'middle','font-size':'9','font-weight':'700',fill:rel.color,'font-family':'Noto Sans JP,sans-serif',opacity:'0','pointer-events':'none'});lt.style.transition='opacity 0.4s';lt.textContent=rel.label;
      layerRelations.append(bg,lt);rel._bg=bg;rel._label=lt;bg.style.cursor='pointer';bg.addEventListener('click',e=>{e.stopPropagation();showRelPanel(rel);});
    }
  });
}

function updateRelations(){RELATIONS.forEach(rel=>{if(!rel._path)return;const vis=activeChapters.has(DIS_CHIDX[rel.from])&&activeChapters.has(DIS_CHIDX[rel.to]);if(vis){rel._path.style.opacity='0.75';rel._path.style.strokeDasharray='6 4';rel._path.style.animation='flow 1.1s linear infinite';}else{rel._path.style.opacity='0';rel._path.style.animation='';}if(rel._bg)rel._bg.style.opacity=vis?'0.92':'0';if(rel._label)rel._label.style.opacity=vis?'1':'0';});}

function shockwave(cx,cy,color){const g=svgNS('g',{transform:`translate(${cx.toFixed(1)},${cy.toFixed(1)})`,'pointer-events':'none'});const ring=svgNS('circle',{cx:'0',cy:'0',r:'36',fill:'none',stroke:color,'stroke-width':'3',opacity:'0.9'});ring.style.transformBox='fill-box';ring.style.transformOrigin='center';ring.style.animation='sw 0.65s ease-out forwards';g.append(ring);layerNodesCh.append(g);setTimeout(()=>g.remove(),700);}
function toggleChapter(ci){
  const chG=layerNodesCh.children[ci];const circ=chG?chG.querySelector('circle'):null;
  if(activeChapters.has(ci)){activeChapters.delete(ci);disNodes[ci].forEach(n=>{n.style.opacity='0';n.style.pointerEvents='none';});disEdges[ci].forEach(e=>{e.style.opacity='0';});if(circ){circ.setAttribute('r','31');circ.setAttribute('filter','url(#glow2)');}if(orbitRings[ci]){orbitRings[ci].remove();delete orbitRings[ci];}
  }else{activeChapters.add(ci);disNodes[ci].forEach(n=>{n.style.opacity='1';n.style.pointerEvents='';});disEdges[ci].forEach(e=>{e.style.opacity='0.5';});if(circ){circ.setAttribute('r','34');circ.setAttribute('filter','url(#glow)');}const p=chPos(ci);panTo(p.x,p.y);
  shockwave(p.x,p.y,CHAPTERS[ci].color);
  const orb=svgNS('circle',{cx:p.x.toFixed(1),cy:p.y.toFixed(1),r:'56',fill:'none',stroke:CHAPTERS[ci].color,'stroke-width':'1.5','stroke-dasharray':'4 12','stroke-dashoffset':'0',opacity:'0.4','pointer-events':'none'});
  orb.style.animation='orbitSpin 5s linear infinite';
  layerNodesCh.append(orb);
  orbitRings[ci]=orb;}
  updateRelations();
}
function panTo(px,py,duration=480){const ww=wrap.offsetWidth,wh=wrap.offsetHeight;const targetTx=ww/2-px*scale,targetTy=wh/2-py*scale;const startTx=tx,startTy=ty,startTime=performance.now();function step(now){const prog=Math.min((now-startTime)/duration,1);const ease=1-Math.pow(1-prog,3);tx=startTx+(targetTx-startTx)*ease;ty=startTy+(targetTy-startTy)*ease;clampAndApply();if(prog<1)requestAnimationFrame(step);}requestAnimationFrame(step);}
function showPanel(ci,di){const ch=CHAPTERS[ci],dis=ch.diseases[di];document.getElementById('panelCh').textContent='📌 '+ch.label;document.getElementById('panelCh').style.background=ch.color;document.getElementById('panelCh').style.color='#fff';document.getElementById('panelTitle').textContent=dis.label;const ul=document.getElementById('panelKeys');ul.innerHTML='';dis.keys.forEach(k=>{const li=document.createElement('li');li.textContent=k;ul.append(li);});const imgWrap=document.getElementById('panelImgs');imgWrap.innerHTML='';if(dis.imgs&&dis.imgs.length>0){dis.imgs.forEach(src=>{const im=document.createElement('img');im.src=src;im.alt=dis.label;im.addEventListener('click',()=>openLightbox(src));imgWrap.append(im);});}document.getElementById('panelLink').href=ch.link;let _sl=document.getElementById('panelStudyDynLink');if(!_sl){_sl=document.createElement('a');_sl.id='panelStudyDynLink';_sl.className='panel-study-link';_sl.textContent='📝 問題を解く →';document.getElementById('panel').appendChild(_sl);}_sl.href='../study.html?sid=imma';document.getElementById('panel').classList.add('show');}
function showRelPanel(rel){const fd=DIS_OBJ[rel.from],td=DIS_OBJ[rel.to];const pCh=document.getElementById('panelCh');pCh.textContent='⇔ '+(rel.label||'関連');pCh.style.background=rel.color||'#888';pCh.style.color='#fff';document.getElementById('panelTitle').textContent=(fd?fd.label:rel.from)+' ⇔ '+(td?td.label:rel.to);const ul=document.getElementById('panelKeys');ul.innerHTML='';if(rel.explain){const li=document.createElement('li');li.textContent=rel.explain;ul.append(li);}document.getElementById('panelImgs').innerHTML='';const ci=DIS_CHIDX[rel.from];const lnk=document.getElementById('panelLink');lnk.href=(ci!==undefined?CHAPTERS[ci].link:'#');lnk.style.display='';document.getElementById('panel').classList.add('show');}
function hidePanel(){document.getElementById('panel').classList.remove('show');}
function openLightbox(src){document.getElementById('lbImg').src=src;document.getElementById('lb').classList.add('open');}
document.getElementById('lb').addEventListener('click',()=>document.getElementById('lb').classList.remove('open'));
document.getElementById('panelClose').addEventListener('click',hidePanel);
svgEl.addEventListener('click',()=>hidePanel());
const wrap=document.getElementById('wrap'),inner=document.getElementById('inner');
let tx=0,ty=0,scale=1,dragging=false,lastX=0,lastY=0,lastDist=0;
function clampAndApply(){scale=Math.max(0.4,Math.min(2.5,scale));inner.style.transform=`translate(${tx}px,${ty}px) scale(${scale})`;}
window.addEventListener('load',()=>{const ww=wrap.offsetWidth,wh=wrap.offsetHeight;tx=(ww-W*scale)/2;ty=(wh-H*scale)/2;clampAndApply();});
wrap.addEventListener('mousedown',e=>{dragging=true;lastX=e.clientX;lastY=e.clientY;e.preventDefault();});
window.addEventListener('mousemove',e=>{if(!dragging)return;tx+=e.clientX-lastX;ty+=e.clientY-lastY;lastX=e.clientX;lastY=e.clientY;clampAndApply();});
window.addEventListener('mouseup',()=>{dragging=false;});
wrap.addEventListener('wheel',e=>{e.preventDefault();const f=e.deltaY>0?0.9:1.1;const r=wrap.getBoundingClientRect();const mx=e.clientX-r.left,my=e.clientY-r.top;tx=mx-(mx-tx)*f;ty=my-(my-ty)*f;scale*=f;clampAndApply();},{passive:false});
wrap.addEventListener('touchstart',e=>{if(e.touches.length===1){dragging=true;lastX=e.touches[0].clientX;lastY=e.touches[0].clientY;}else if(e.touches.length===2){dragging=false;lastDist=Math.hypot(e.touches[0].clientX-e.touches[1].clientX,e.touches[0].clientY-e.touches[1].clientY);}e.preventDefault();},{passive:false});
wrap.addEventListener('touchmove',e=>{if(e.touches.length===1&&dragging){tx+=e.touches[0].clientX-lastX;ty+=e.touches[0].clientY-lastY;lastX=e.touches[0].clientX;lastY=e.touches[0].clientY;clampAndApply();}else if(e.touches.length===2){const d=Math.hypot(e.touches[0].clientX-e.touches[1].clientX,e.touches[0].clientY-e.touches[1].clientY);const f=d/lastDist;lastDist=d;const r=wrap.getBoundingClientRect();const mx=(e.touches[0].clientX+e.touches[1].clientX)/2-r.left,my=(e.touches[0].clientY+e.touches[1].clientY)/2-r.top;tx=mx-(mx-tx)*f;ty=my-(my-ty)*f;scale*=f;clampAndApply();}e.preventDefault();},{passive:false});
wrap.addEventListener('touchend',()=>{dragging=false;});

drawRoot();drawChapters();drawDiseases();drawRelations();

const style=document.createElement('style');
style.textContent='@keyframes pulse{0%,100%{opacity:0.5;transform:scale(1);}50%{opacity:0.12;transform:scale(1.2);}}@keyframes flow{from{stroke-dashoffset:0;}to{stroke-dashoffset:-40;}}@keyframes sw{to{transform:scale(3.5);opacity:0;}}@keyframes orbitSpin{to{stroke-dashoffset:-16;}}';
document.head.append(style);
document.getElementById('btnAll').addEventListener('click',()=>{CHAPTERS.forEach((_,ci)=>{if(!activeChapters.has(ci))toggleChapter(ci);});});
document.getElementById('btnNone').addEventListener('click',()=>{[...activeChapters].forEach(ci=>toggleChapter(ci));});
</script>
